<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>鳩特數理｜教室 iPad 註冊</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: "Segoe UI", "Microsoft JhengHei", sans-serif; background: #f4f7f6; color: #334155; }
    .nav { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 20px; background: rgba(30, 41, 59, .96); color: #fff; }
    .nav h1 { margin: 0; font-size: 1.15rem; }
    .nav a { color: #38bdf8; border: 1px solid #38bdf8; border-radius: 22px; padding: 6px 14px; text-decoration: none; font-weight: 700; }
    main { max-width: 560px; margin: 24px auto; padding: 0 16px; }
    .card { background: #fff; border: 1px solid #dbe4ee; border-radius: 14px; padding: 22px; box-shadow: 0 6px 20px rgba(30, 41, 59, .08); }
    h2 { margin: 0 0 8px; color: #2563a8; font-size: 1.2rem; }
    p { line-height: 1.75; margin: 8px 0; }
    label { display: block; margin: 16px 0 6px; font-weight: 700; color: #2563a8; }
    input { width: 100%; font: inherit; font-size: 1.1rem; padding: 10px 12px; border: 2px solid #dbe4ee; border-radius: 10px; }
    input:focus { outline: none; border-color: #38bdf8; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
    button { font: inherit; font-weight: 700; min-height: 46px; padding: 8px 16px; border-radius: 10px; cursor: pointer; }
    .primary { background: #4a90e2; color: #fff; border: 0; flex: 1; }
    .ghost { background: #fff; color: #b42318; border: 1px solid #f3b4ae; }
    .status { margin-top: 18px; padding: 12px 14px; border-radius: 10px; background: #eef6fc; line-height: 1.7; }
    .status.ok { background: #e7f6ec; color: #236b3c; }
    .status.bad { background: #fdecea; color: #b42318; }
    .note { font-size: .9rem; color: #64748b; }
  </style>
</head>
<body>
  <header class="nav"><h1>📋 教室 iPad 註冊</h1><a href="../index.html">回首頁</a></header>
  <main>
    <section class="card">
      <h2>把這台 iPad 加入教室監控</h2>
      <p>註冊後，這台 iPad 在練習頁、測驗頁的作答狀況（做哪一頁、每一步對錯、測驗分數）會即時出現在老師的監控頁。實驗類教具不記錄，也不會記錄學生姓名。</p>
      <p class="note">只有註冊過的裝置會送出資料；學生在家用自己的手機或平板時，什麼都不會送。</p>
      <label for="room">教室代碼</label>
      <input id="room" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="由監控頁產生，20 個以上的英數字">
      <label for="name">這台 iPad 的名稱</label>
      <input id="name" maxlength="20" autocomplete="off" placeholder="例如：iPad Air 2">
      <div class="row">
        <button type="button" class="primary" id="save">註冊這台 iPad</button>
        <button type="button" class="ghost" id="remove">解除註冊</button>
      </div>
      <div class="status" id="status" role="status">尚未註冊。</div>
    </section>
  </main>
  <script src="../battle_log.js"></script>
  <script>
    (function () {
      'use strict';
      const $ = id => document.getElementById(id);
      const KEY = JutorLog.classroom.ROOM_KEY;
      const randomId = n => { const a = new Uint8Array(n), c = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789'; crypto.getRandomValues(a); return Array.from(a, x => c[x % c.length]).join(''); };
      function current() { try { return JSON.parse(localStorage.getItem(KEY)); } catch (_) { return null; } }
      function show(text, kind) { $('status').textContent = text; $('status').className = `status ${kind || ''}`; }
      function refresh() {
        const r = JutorLog.classroom.room();
        if (r) { $('room').value = r.room; $('name').value = r.name; show(`這台 iPad 已註冊為「${r.name}」。`, 'ok'); }
      }
      /* 監控頁給的連結：setup.html#room=代碼&name=名稱 */
      const hash = new URLSearchParams(location.hash.slice(1));
      refresh();
      if (hash.get('room')) $('room').value = hash.get('room');
      if (hash.get('name')) $('name').value = hash.get('name');
      $('save').addEventListener('click', () => {
        const room = $('room').value.trim(), name = $('name').value.trim();
        if (!/^[A-Za-z0-9]{20,40}$/.test(room)) { show('教室代碼要是 20～40 個英文字母或數字，請從監控頁複製。', 'bad'); return; }
        if (!name) { show('請幫這台 iPad 取個名字。', 'bad'); return; }
        const old = current(), id = old && old.room === room && old.id ? old.id : randomId(16);
        localStorage.setItem(KEY, JSON.stringify({ room, name: name.slice(0, 20), id }));
        history.replaceState(null, '', location.pathname);
        show('連線測試中…');
        JutorLog.classroom.live().then(ok => {
          if (ok) show(`註冊完成！這台 iPad 叫「${name}」，監控頁上應該已經看得到它了。`, 'ok');
          else show('已存在這台 iPad 上，但連不上資料庫。請確認網路，或請老師檢查資料庫規則是否已加入「classroom」。', 'bad');
        });
      });
      $('remove').addEventListener('click', () => {
        if (!current()) { show('這台 iPad 本來就沒有註冊。'); return; }
        if (!confirm('確定解除註冊？之後這台 iPad 的作答不會再送到監控頁。')) return;
        localStorage.removeItem(KEY); $('room').value = ''; $('name').value = ''; show('已解除註冊。');
      });
    })();
  </script>
</body>
</html>
