<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="高二指對數互動教具：分別調整正常與反常底數，同時比較四條曲線，探索交點與反函數對稱。">
<title>指對數交點實驗室（高二）｜鳩特老師</title>
<link rel="stylesheet" href="../science_lab.css">
<link rel="stylesheet" href="exp_log_explorer.css?v=dual-base-4">
<script defer src="exp_log_core.js?v=dual-base-4"></script>
<script defer src="exp_log_explorer.js?v=dual-base-4"></script>
</head>
<body class="exp-log-lab">
<header><a href="../../index.html?category=senior">← 教材首頁</a><h1>指對數交點實驗室</h1><span class="badge">高二數學</span></header>
<main class="shell">
<div class="toolbar"><div><div class="eyebrow">鳩特老師 · 互動數學教室</div><p class="muted">拖動底數，看看曲線如何相遇。</p></div><button id="reset" type="button">重設</button></div>
<div class="explorer-grid">
<section class="panel graph-panel" aria-label="函數圖形與交點">
<div class="plot-wrap">
<svg id="plot" role="group" aria-labelledby="plot-title plot-description">
<title id="plot-title">指數與對數函數圖形</title>
<desc id="plot-description">橫縱軸等比例。粗點表示已顯示曲線彼此的交點，點選或用 Tab 鍵選取後按 Enter 可讀取座標。</desc>
<defs><clipPath id="plot-clip"><rect id="clip-rect"></rect></clipPath></defs>
<g id="grid-layer" aria-hidden="true"></g><g id="axis-layer" aria-hidden="true"></g>
<g id="symmetry-layer" aria-hidden="true"></g><g id="curve-layer" clip-path="url(#plot-clip)" aria-hidden="true"></g>
<g id="point-layer"></g><g id="label-layer" aria-hidden="true"></g>
</svg>
<button id="symmetry-toggle" type="button" aria-pressed="false">顯示對稱軸</button>
</div>
<div class="view-controls" role="group" aria-label="圖形視野">
<button id="zoom-in" type="button" aria-label="放大圖形">＋</button><button id="zoom-out" type="button" aria-label="縮小圖形">−</button>
<button id="pan-toggle" type="button" aria-pressed="false">拖曳平移</button><button id="home-view" type="button">預設視野</button><button id="fit-points" type="button">看全部交點</button>
</div>
<div class="graph-reading" aria-live="polite" aria-atomic="true"><span id="point-reading">點選粗點，讀取交點座標。</span><span id="offscreen-note" hidden>有交點在畫面外</span></div>
</section>
<aside class="panel controls-panel" aria-label="底數與曲線顯示設定">
<div class="controls-heading"><h2>調整底數</h2><span class="muted small">兩組可以同時開啟</span></div>
<div class="base-columns">
<fieldset class="base-column normal-column">
<legend><span>正常底數</span><small>底 &gt; 1</small></legend>
<div class="base-value"><label for="normal-base">底數 a</label><output id="normal-output" for="normal-base">2.0</output></div>
<input id="normal-base" type="range" min="1.1" max="5" step="0.1" value="2" aria-describedby="normal-range">
<div class="range-label" id="normal-range"><span>1.1</span><span>5.0</span></div>
<div class="curve-options">
<label class="check-row"><input id="normal-exp" type="checkbox" checked><span><i class="curve-key normal-exp-key" aria-hidden="true"></i>顯示指數函數</span></label>
<label class="check-row"><input id="normal-log" type="checkbox" checked><span><i class="curve-key normal-log-key" aria-hidden="true"></i>顯示對數函數</span></label>
</div>
<label class="check-row critical-choice"><input id="critical-mode" type="checkbox"><span>顯示恰交一點 <span class="math-nowrap">(e, e)</span></span></label>
<p id="critical-note" class="critical-note" hidden>精確底數 <span class="math-nowrap">a = e<sup>1/e</sup></span><br>取消勾選可恢復原底數。</p>
</fieldset>
<fieldset class="base-column fractional-column">
<legend><span>反常底數</span><small>0 &lt; 底 &lt; 1</small></legend>
<div class="base-value"><label for="fractional-base">底數 b</label><output id="fractional-output" for="fractional-base">0.50</output></div>
<input id="fractional-base" type="range" min="0.10" max="0.95" step="0.05" value="0.50" aria-describedby="fractional-range">
<div class="range-label" id="fractional-range"><span>0.10</span><span>0.95</span></div>
<div class="curve-options">
<label class="check-row"><input id="fractional-exp" type="checkbox"><span><i class="curve-key fractional-exp-key" aria-hidden="true"></i>顯示指數函數</span></label>
<label class="check-row"><input id="fractional-log" type="checkbox"><span><i class="curve-key fractional-log-key" aria-hidden="true"></i>顯示對數函數</span></label>
</div>
</fieldset>
</div>
<div class="operation-hint"><p>粗點是曲線的交點。試著一次只開兩條，再加入另外兩條。</p><p class="muted small">開啟「拖曳平移」後可移動畫面；用 ＋／− 或「看全部交點」調整視野。</p></div>
</aside>
</div>
</main>
</body>
</html>
