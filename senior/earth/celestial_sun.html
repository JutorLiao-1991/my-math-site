<body class="science-layout teaching-lab sun-lab"><header><a href="../../index.html">← 教材首頁</a><h1>天球與太陽軌跡</h1><span class="badge">高一地球科學</span></header><main class="shell"><div class="toolbar"><div><div class="eyebrow">鳩特老師 · 互動教室</div><p class="muted">改變緯度與季節，同步觀察天球、高度角、日出日落與竿影。</p></div></div><div class="grid lab-grid"><section class="panel lab-main-panel"><h2>天球、地平面與太陽日行軌跡</h2><div id="formula" class="formula"></div><div id="diagram" class="diagram main-diagram"></div><div id="readings" class="readings"></div><h3>同一日的高度角變化</h3><div id="altitude-graph" class="diagram"></div><h3>從上方看竿影</h3><div id="shadow" class="diagram square-diagram"></div></section><aside class="lab-sidebar"><div class="lab-sidebar-content"><section class="panel lab-operation-panel"><h2>操作與觀察</h2><div id="controls"></div></section><section class="panel"><div class="row"><h2>觀察與發現</h2><button id="reveal" aria-expanded="false" aria-controls="findings">揭示性質</button></div><p id="prompt"></p><div id="findings" hidden></div></section><details class="panel"><summary>觀念自修題</summary><div id="study-panel"></div></details><section class="panel"><h2>模型說明</h2><p>地球視為球體；以所在地緯度、太陽赤緯與時角計算東、北、天頂方向分量。理想二分二至使用 0°、±23.44°；自訂日期使用 NOAA 的平年赤緯近似式。</p><p>使用真太陽時，不換算鐘錶時間；忽略地形遮蔽、大氣折射與太陽視直徑。白晝長度是幾何值。<a href="https://gml.noaa.gov/grad/solcalc/solareqns.PDF" target="_blank" rel="noopener">參考：NOAA 太陽位置公式</a></p></section></div></aside></div></main></body></html>
