<body class="science-layout teaching-lab"><header><a href="../../index.html">← 教材首頁</a><h1>酸鹼滴定與 pH</h1><span class="badge">高三化學</span></header><main class="shell"><div class="toolbar"><div><div class="eyebrow">鳩特老師 · 互動教室</div><p class="muted">逐滴加入 NaOH，觀察滴定曲線、當量點與指示劑。</p></div></div><nav class="tabs" aria-label="探索主題"><button data-topic="strong" aria-pressed="true">強酸 HCl</button><button data-topic="weak" aria-pressed="false">弱酸 CH₃COOH</button></nav><div class="grid lab-grid"><section class="panel lab-main-panel"><h2>由滴定量觀察酸鹼變化</h2><div id="formula" class="formula"></div><div id="apparatus" class="diagram main-diagram"></div><div id="readings" class="readings" aria-live="polite"></div><div id="diagram" class="diagram main-diagram"></div></section><aside class="lab-sidebar"><div class="lab-sidebar-content"><section class="panel lab-operation-panel"><h2>操作與觀察</h2><div id="controls"></div></section><section class="panel"><div class="row"><h2>觀察與發現</h2><button id="reveal" aria-expanded="false" aria-controls="findings">揭示性質</button></div><p id="prompt"></p><div id="findings" hidden></div></section><details class="panel"><summary>觀念自修題</summary><div id="study-panel"></div></details><section class="panel"><h2>模型說明</h2><p>以 25°C、水的離子積 10⁻¹⁴ 與醋酸 Kₐ=1.8×10⁻⁵ 計算，假設體積可相加、活度等於濃度。pH 同時滿足質量守恆、電中性與酸解離平衡，涵蓋當量前後。</p><p>顏色是指示劑變色範圍的示意，不是實際調色配方。每滴固定為 0.05 mL。<a href="https://openstax.org/books/chemistry-2e/pages/14-7-acid-base-titrations" target="_blank" rel="noopener">參考：OpenStax 酸鹼滴定</a></p></section></div></aside></div></main></body></html>
