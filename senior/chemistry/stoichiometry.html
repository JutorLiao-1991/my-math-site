<body class="science-layout teaching-lab"><header><a href="../../index.html">← 教材首頁</a><h1>化學計量與限量試劑</h1><span class="badge">高中化學</span></header><main class="shell"><div class="toolbar"><div><div class="eyebrow">鳩特老師 · 互動教室</div><p class="muted">先預測誰先用完，再觀察粒子、莫耳數與質量的變化。</p></div></div><div class="grid lab-grid"><section class="panel lab-main-panel"><h2 id="scene-title">反應前</h2><div id="formula" class="formula"></div><div id="readings" class="readings"></div><div id="inventory"></div><div id="particles"></div></section><aside class="lab-sidebar"><div class="lab-sidebar-content"><section class="panel lab-operation-panel"><h2>操作與觀察</h2><label for="reaction">選擇反應</label><select id="reaction"></select><label for="unit">輸入單位（切換後重設初量）</label><select id="unit"><option value="particles">離散粒子數</option><option value="mol">莫耳數 mol</option><option value="mass">質量 g</option></select><div id="quantities"></div><div class="control"><label for="progress">反應進度</label><input id="progress" type="range" min="0" max="1" step="1" value="0"><output id="progress-out">0%</output></div><div class="actions"><button id="finish" class="primary">反應完成</button><button id="reset">回到反應前</button><button id="stoich-ratio">恰按係數比例</button></div></section><section class="panel"><div class="row"><h2>觀察與發現</h2><button id="reveal" aria-expanded="false" aria-controls="findings">揭示性質</button></div><p id="prompt"></p><div id="findings" hidden></div></section><details class="panel"><summary>觀念自修題</summary><div id="study-panel"></div></details><section class="panel"><h2>模型說明</h2><p>粒子模式以整組反應為單位；莫耳／質量模式可連續反應。原子量採 H=1、C=12、N=14、O=16、Ca=40、Cl=35.5。</p><p><a href="equation_balance.html">← 複習反應式平衡</a></p></section></div></aside></div></main></body></html>
