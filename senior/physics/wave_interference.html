<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>水波與光波：干涉與繞射｜鳩特老師</title><link rel="stylesheet" href="../science_lab.css"><link rel="stylesheet" href="wave_interference.css?v=trough-arc-gaps-1"><script defer src="../science_lab.js"></script><script defer src="wave_core.js?v=trough-arc-gaps-1"></script><script defer src="wave_interference.js?v=trough-arc-gaps-1"></script></head><body><header><a href="../../index.html?category=senior">← 教材首頁</a><h1>水波與光波：干涉與繞射</h1><span class="badge">高一物理</span></header><main class="shell" style="padding-bottom:50px"><div class="toolbar"><div><div class="eyebrow">鳩特老師 · 互動物理教室</div><p class="muted">先預測，再操作，最後解釋你看到的圖樣。</p></div><div class="row" aria-label="模式"><button id="free-mode" aria-pressed="true">自由操作</button><button id="study-mode" aria-pressed="false">自修模式</button></div></div><nav class="tabs" aria-label="主題"><button data-topic="water-int" aria-pressed="true">水波干涉</button><button data-topic="water-diff" aria-pressed="false">水波繞射</button><button data-topic="light-int" aria-pressed="false">光波干涉</button><button data-topic="light-diff" aria-pressed="false">光波繞射</button></nav><div class="grid"><section class="panel"><h2 id="scene-title"></h2><p id="scene-caption" class="muted"></p><canvas id="wave" width="720" height="420" role="img" aria-label="波動模擬圖"></canvas><div id="legend" class="legend wave-legend"></div><div class="wave-control-group" id="observation-controls" role="group" aria-label="觀測位置" hidden><span class="wave-control-label">觀測位置</span><div class="actions"><button id="probe-antinode" aria-pressed="false">觀察波腹</button><button id="probe-node" aria-pressed="false">觀察波節</button><span id="probe-selection" class="muted"></span></div></div><div class="wave-control-group" id="time-controls" role="group" aria-label="時間控制"><span class="wave-control-label">時間控制</span><div class="actions"><button id="pause">暫停</button><button id="quarter">前進 ¼ 週期</button><button id="half-period">前進 ½ 週期</button><button id="reset-time">重設時間</button><select id="speed" aria-label="播放速度"><option value="1">正常速度</option><option value="0.25">慢放 ¼ 倍</option></select></div></div><div id="probe"></div><div id="controls"></div><p id="model-note" class="note"></p><details><summary>對照講義的觀察重點</summary><div id="takeaways"></div></details></section><aside><section class="panel" id="study-panel" hidden></section><section class="panel" id="free-panel"><h2>先試著回答</h2><div id="tasks"></div><p class="note">自修模式包含波峰／波谷判讀、平衡位置與振幅、條紋方向、薄膜干涉、DVD 與聲波應用。</p></section><section class="panel"><h2>教學模型說明</h2><p class="muted">水波干涉採同頻、同相、等振幅的兩個點波源，略去振幅隨距離衰減。水波繞射以狹縫內次波源疊加呈現趨勢，顏色經正規化。光屏顯示時間平均亮度；動畫波前為慢速示意。</p><p class="muted">光紋採遠場、小角度模型。基本雙狹縫略去單縫包絡，可選擇加入有限縫寬比較；單狹縫中央亮帶約為旁側兩倍寬。參考 <a href="https://openstax.org/books/university-physics-volume-3/pages/4-1-single-slit-diffraction" target="_blank" rel="noopener">OpenStax 單狹縫繞射</a>、<a href="https://openstax.org/books/university-physics-volume-3/pages/4-3-double-slit-diffraction" target="_blank" rel="noopener">雙狹縫繞射</a>。</p></section></aside></div></main></body></html>
