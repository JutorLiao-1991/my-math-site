<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高中物理：多元素光譜實驗室 (高精度版)</title>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent: #64b5f6;
            --danger: #ef5350;
            --btn-bg: #333;
            --electron-color: #fff;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
            user-select: none;
        }

        h1 { margin-bottom: 5px; font-weight: 300; }
        .subtitle { color: #888; font-size: 0.9rem; margin-bottom: 20px; }

        /* === 控制區 === */
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            background: var(--panel-bg);
            padding: 15px 30px;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 10px;
            border-right: 1px solid #444;
        }
        .control-group:last-child { border-right: none; }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 25px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            background: var(--btn-bg);
            color: #aaa;
            border: 1px solid #444;
        }

        button:hover { background: #444; color: white; }
        button.active { background: var(--accent); color: #000; font-weight: bold; border-color: var(--accent); }
        
        select {
            padding: 8px 15px;
            border-radius: 20px;
            background: #222;
            color: white;
            border: 1px solid #555;
            font-size: 1rem;
            cursor: pointer;
        }
        select:disabled { opacity: 0.5; cursor: not-allowed; }

        .hidden-btn { opacity: 0; pointer-events: none; transform: scale(0.8); }
        .reveal-btn { opacity: 1; pointer-events: auto; transform: scale(1); }

        /* === 實驗宏觀場景 === */
        .macro-stage {
            width: 800px; height: 180px; position: relative;
            background: #000; border: 1px solid #333; border-radius: 12px;
            margin-bottom: 10px; overflow: hidden; display: flex; align-items: center;
        }

        .comp { position: absolute; text-align: center; transition: opacity 1s; z-index: 2; }
        .comp span { font-size: 2rem; display: block; }
        .comp label { font-size: 0.8rem; color: #888; white-space: nowrap;}

        #source { left: 30px; }
        #gas { left: 250px; opacity: 0; transition: opacity 1.5s ease; }
        #prism { left: 500px; }

        .cloud {
            width: 120px; height: 80px;
            background: radial-gradient(circle, rgba(100,181,246,0.4) 0%, rgba(0,0,0,0) 70%);
            filter: blur(10px); border-radius: 50%;
            animation: float 4s infinite ease-in-out;
        }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

        .beam {
            position: absolute; height: 6px; top: 50%; margin-top: -3px;
            background: white; z-index: 1; transition: opacity 1s, background 1s;
            box-shadow: 0 0 8px rgba(255,255,255,0.6);
        }

        /* === 光譜與勾選區 === */
        .spectrum-wrapper { width: 800px; position: relative; margin-bottom: 20px; }
        canvas#spectrumCanvas { width: 100%; height: 100px; display: block; border: 1px solid #444; border-radius: 8px; background: #000; }
        .checkbox-container { width: 100%; height: 40px; position: relative; margin-top: 5px; }
        
        .line-control {
            position: absolute; transform: translateX(-50%); text-align: center;
            opacity: 0; transition: opacity 0.5s; cursor: pointer;
        }
        .line-control input { width: 16px; height: 16px; cursor: pointer; }
        .line-control label { display: block; font-size: 0.7rem; color: #888; margin-top: 2px; }

        /* === 微觀能階動畫 === */
        .micro-stage {
            width: 800px; height: 300px; /* 增加高度以容納更多能階 */
            background: #181818;
            border: 1px dashed #444; border-radius: 12px;
            position: relative; overflow: hidden; display: flex; justify-content: center; align-items: center;
        }
        .level-diagram { width: 400px; height: 260px; position: relative; margin-top: 20px; }
        .level { position: absolute; width: 100%; height: 1px; background: #444; left: 0; transition: bottom 0.5s; }
        .level-text { position: absolute; right: -80px; top: -8px; font-size: 0.75rem; color: #666; width: 70px; text-align: left;}

        .electron {
            width: 14px; height: 14px; background: var(--electron-color);
            border-radius: 50%; position: absolute; left: 50%; margin-left: -7px;
            bottom: 20px; /* 初始位置 */
            box-shadow: 0 0 10px white; z-index: 10;
            transition: bottom 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .photon {
            position: absolute; width: 20px; height: 20px; border-radius: 50%;
            top: 0; left: 0; opacity: 0; pointer-events: none;
            box-shadow: 0 0 15px currentColor; background: currentColor;
        }

        @keyframes absorb-photon {
            0% { transform: translate(-250px, 0); opacity: 1; }
            45% { transform: translate(0, 0); opacity: 1; }
            50% { opacity: 0; } 100% { opacity: 0; }
        }
        @keyframes emit-photon {
            0% { opacity: 0; transform: translate(0, 0); }
            50% { opacity: 1; transform: translate(0, 0); }
            100% { transform: translate(250px, 0); opacity: 0; }
        }

        .instruction { position: absolute; top: 15px; left: 20px; color: var(--accent); font-size: 0.95rem; font-weight: bold; }
        .element-badge { position: absolute; top: 15px; right: 20px; background: #333; padding: 5px 10px; border-radius: 10px; font-size: 0.8rem; color: #aaa; }

    </style>
</head>
<body>

    <h1>多元光譜實驗室</h1>
    <div class="subtitle">切換不同氣體，觀察其獨特的光譜指紋與能階躍遷</div>

    <div class="controls">
        <div class="control-group">
            <button id="btn-continuous" class="active">1. 連續光譜</button>
            <button id="btn-absorption">2. 吸收光譜</button>
            <button id="btn-emission" class="hidden-btn">3. 發射光譜</button>
        </div>
        
        <div class="control-group">
            <label for="gasSelect">氣體種類：</label>
            <select id="gasSelect" disabled>
                <option value="H">氫氣 (H)</option>
                <option value="He">氦氣 (He)</option>
                <option value="Na">鈉蒸氣 (Na)</option>
                <option value="Hg">汞蒸氣 (Hg)</option>
                <option value="Ne">氖氣 (Ne)</option>
            </select>
        </div>
    </div>

    <div class="macro-stage">
        <div id="source" class="comp"><span>💡</span><label>高溫光源</label></div>
        <div id="beam1" class="beam" style="left: 60px; width: 200px;"></div>
        
        <div id="gas" class="comp">
            <div class="cloud"></div>
            <label id="gasLabel">氫氣 (冷)</label>
        </div>

        <div id="beam2" class="beam" style="left: 360px; width: 140px;"></div>
        <div id="prism" class="comp"><span>📐</span><label>分光器</label></div>
        <div id="beam3" class="beam" style="left: 540px; width: 200px; background: linear-gradient(to right, red, violet);"></div>
    </div>

    <div class="spectrum-wrapper">
        <canvas id="spectrumCanvas" width="800" height="100"></canvas>
        <div id="checkboxContainer" class="checkbox-container"></div>
    </div>

    <div class="micro-stage">
        <div class="instruction" id="microText">請選擇實驗模式...</div>
        <div class="element-badge" id="elementDisplay">目前元素：氫</div>
        <div class="level-diagram" id="levelContainer">
            <div class="electron" id="electron"></div>
            <div id="photonContainer" style="position: absolute; left: 50%; bottom: 20px; width: 0; height: 0;"></div>
        </div>
    </div>

    <script>
        // === 資料庫：元素特徵譜線 (nm) ===
        const elementsData = {
            'H': {
                name: '氫 (H)',
                lines: [656.3, 486.1, 434.0, 410.2], // 紅, 青, 藍, 紫
                color: 'rgba(100,181,246,0.4)'
            },
            'He': {
                name: '氦 (He)',
                lines: [667.8, 587.6, 501.6, 471.3, 447.1], // 紅, 黃, 綠, 藍, 深藍
                color: 'rgba(255,200,100,0.4)'
            },
            'Na': {
                name: '鈉 (Na)',
                lines: [589.0], // 雙黃線
                color: 'rgba(255,215,0,0.6)'
            },
            'Hg': {
                name: '汞 (Hg)',
                lines: [579.1, 546.1, 435.8, 404.7], // 黃, 綠, 藍, 紫
                color: 'rgba(0,255,255,0.4)'
            },
            'Ne': {
                name: '氖 (Ne)',
                lines: [640.2, 614.3, 585.2, 540.1], // 紅橘色系
                color: 'rgba(255,50,50,0.5)'
            }
        };

        // === 視覺能階設定 (擴充為 8 層) ===
        // 確保 紫光(高能量) 和 藍光(次高能量) 有不同的落點
        // Level 0: 基態
        // Level 1-7: 激發態 (高度 px)
        const levelHeights = [
            20,   // Level 0: Ground (Base)
            70,   // Level 1: Red
            110,  // Level 2: Orange/Yellow
            145,  // Level 3: Green
            175,  // Level 4: Cyan
            200,  // Level 5: Blue (434nm)
            220,  // Level 6: Violet (410nm)
            240   // Level 7: UV/Deep Violet
        ]; 

        // === 狀態變數 ===
        const state = {
            mode: 'continuous',
            targetMode: 'continuous',
            fadeProgress: 0,
            element: 'H',
            mappedLines: []
        };

        // === DOM ===
        const canvas = document.getElementById('spectrumCanvas');
        const ctx = canvas.getContext('2d');
        const btnCont = document.getElementById('btn-continuous');
        const btnAbs = document.getElementById('btn-absorption');
        const btnEmit = document.getElementById('btn-emission');
        const gasSelect = document.getElementById('gasSelect');
        const sourceElem = document.getElementById('source');
        const gasElem = document.getElementById('gas');
        const gasLabel = document.getElementById('gasLabel');
        const cloud = document.querySelector('.cloud');
        const beam1 = document.getElementById('beam1');
        const beam2 = document.getElementById('beam2');
        const beam3 = document.getElementById('beam3');
        const checkContainer = document.getElementById('checkboxContainer');
        const electron = document.getElementById('electron');
        const photonCont = document.getElementById('photonContainer');
        const microText = document.getElementById('microText');
        const levelContainer = document.getElementById('levelContainer');
        const elementDisplay = document.getElementById('elementDisplay');

        // === 初始化 ===
        function init() {
            updateElementData();
            animate();
        }

        // === 資料處理：將波長映射到更精細的能階 ===
        function updateElementData() {
            const data = elementsData[state.element];
            const lines = data.lines;
            
            state.mappedLines = lines.map(wl => {
                // 更精細的映射邏輯
                let jumpIdx;
                if (wl >= 620) jumpIdx = 1;      // 紅
                else if (wl >= 570) jumpIdx = 2; // 黃/橘
                else if (wl >= 520) jumpIdx = 3; // 綠
                else if (wl >= 480) jumpIdx = 4; // 青
                else if (wl >= 440) jumpIdx = 5; // 藍 (修正：434nm 會落在這)
                else if (wl >= 415) jumpIdx = 6; // 藍紫
                else jumpIdx = 7;                // 紫/深紫 (修正：410nm 會落在這)

                return {
                    wl: wl,
                    color: wlToColor(wl),
                    targetLevelIdx: jumpIdx
                };
            });

            // UI 更新
            gasLabel.innerText = data.name + (state.mode === 'absorption' ? " (冷)" : " (熱)");
            elementDisplay.innerText = "目前元素：" + data.name;
            cloud.style.background = `radial-gradient(circle, ${data.color} 0%, rgba(0,0,0,0) 70%)`;
            
            drawLevelBackgrounds();
        }

        function drawLevelBackgrounds() {
            const oldLevels = document.querySelectorAll('.level');
            oldLevels.forEach(el => el.remove());

            createLevelDiv(0, "基態"); // 畫基態

            // 畫激發態背景線
            for(let i=1; i<levelHeights.length; i++) {
                // 只畫出有被使用到的能階線會比較乾淨？
                // 為了視覺一致性，我們畫出所有線，但讓未使用的淡一點
                createLevelDiv(i, `n ≈ ${i+1}`);
            }
        }

        function createLevelDiv(idx, labelText) {
            const div = document.createElement('div');
            div.className = 'level';
            div.style.bottom = levelHeights[idx] + 'px';
            if (idx === 0) {
                div.style.borderTop = "2px solid white";
                div.style.height = "0"; 
            } else {
                div.style.borderTop = "1px solid #444";
            }

            // 只有當目前的元素真的有跳到這一層時，才高亮顯示文字(選擇性優化)
            const text = document.createElement('span');
            text.className = 'level-text';
            text.innerText = labelText;
            div.appendChild(text);
            levelContainer.appendChild(div);
        }

        // === 動畫循環 ===
        function animate() {
            if (state.mode !== state.targetMode) {
                state.fadeProgress += 0.02;
                if (state.fadeProgress >= 1) {
                    state.fadeProgress = 0;
                    state.mode = state.targetMode;
                    updateUIForModeComplete();
                }
            } else {
                state.fadeProgress = 0;
            }
            drawSpectrum();
            requestAnimationFrame(animate);
        }

        function updateUIForModeComplete() {
            updateCheckboxes(); 
            const name = elementsData[state.element].name;
            if(state.mode === 'absorption') gasLabel.innerText = name + " (冷)";
            if(state.mode === 'emission') gasLabel.innerText = name + " (熱)";
        }

        // === 繪圖 ===
        function drawSpectrum() {
            const w = canvas.width; const h = canvas.height;
            const minW = 380; const maxW = 750;
            ctx.clearRect(0, 0, w, h);

            let rainbowAlpha = 1;
            if (state.mode === 'emission' && state.targetMode === 'emission') rainbowAlpha = 0;
            if (state.mode === 'absorption' && state.targetMode === 'emission') rainbowAlpha = 1 - state.fadeProgress;
            if (state.mode === 'emission' && state.targetMode === 'absorption') rainbowAlpha = state.fadeProgress;
            
            if (rainbowAlpha > 0) {
                const grad = ctx.createLinearGradient(0, 0, w, 0);
                for (let i = 0; i <= 20; i++) {
                    let pct = i / 20;
                    let wl = maxW - pct * (maxW - minW);
                    grad.addColorStop(pct, wlToColor(wl));
                }
                ctx.globalAlpha = rainbowAlpha;
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, w, h);
            }

            let lineType = 'none';
            let lineAlpha = 0;

            if (state.mode === 'continuous' && state.targetMode === 'absorption') {
                lineType = 'dark'; lineAlpha = state.fadeProgress;
            } else if (state.mode === 'absorption' && state.targetMode === 'absorption') {
                lineType = 'dark'; lineAlpha = 1;
            } else if (state.mode === 'absorption' && state.targetMode === 'emission') {
                lineType = 'bright'; lineAlpha = state.fadeProgress;
            } else if (state.mode === 'emission') {
                lineType = 'bright'; lineAlpha = 1;
            }

            if (lineType !== 'none') {
                ctx.globalAlpha = lineAlpha;
                state.mappedLines.forEach(line => {
                    const x = ((maxW - line.wl) / (maxW - minW)) * w;
                    if (lineType === 'dark') {
                        ctx.fillStyle = 'rgba(0,0,0,0.8)';
                        ctx.fillRect(x - 1.5, 0, 3, h);
                    } else {
                        ctx.strokeStyle = line.color;
                        ctx.lineWidth = 3;
                        ctx.shadowBlur = 10;
                        ctx.shadowColor = line.color;
                        ctx.beginPath();
                        ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
                        ctx.shadowBlur = 0;
                    }
                });
            }
            ctx.globalAlpha = 1;
        }

        // === UI 更新 ===
        function updateScene(target) {
            state.targetMode = target;
            [btnCont, btnAbs, btnEmit].forEach(b => b.classList.remove('active'));
            if(target === 'continuous') btnCont.classList.add('active');
            if(target === 'absorption') btnAbs.classList.add('active');
            if(target === 'emission') btnEmit.classList.add('active');

            gasSelect.disabled = (target === 'continuous');

            if (target === 'continuous') {
                sourceElem.style.opacity = 1;
                gasElem.style.opacity = 0;
                beam1.style.opacity = 1;
                beam2.style.background = 'white';
                beam3.style.opacity = 1;
                microText.innerText = "連續光譜：包含所有波長的光，無特徵譜線。";
            } else if (target === 'absorption') {
                sourceElem.style.opacity = 1;
                gasElem.style.opacity = 1;
                beam1.style.opacity = 1;
                beam2.style.background = 'white'; 
                btnEmit.classList.remove('hidden-btn'); btnEmit.classList.add('reveal-btn');
                microText.innerText = `[${elementsData[state.element].name}] 吸收特定能量光子，電子從基態躍遷。`;
            } else if (target === 'emission') {
                sourceElem.style.opacity = 0.2;
                gasElem.style.opacity = 1;
                beam1.style.opacity = 0;
                beam2.style.background = 'linear-gradient(90deg, #f0f, #0ff)';
                microText.innerText = `[${elementsData[state.element].name}] 電子從激發態落回基態，釋出特定光子。`;
            }

            checkContainer.innerHTML = '';
            resetMicroView();
            updateElementData();
        }

        function updateCheckboxes() {
            if (state.mode === 'continuous') return;
            const w = canvas.width;
            const minW = 380, maxW = 750;
            checkContainer.innerHTML = '';

            state.mappedLines.forEach((line, index) => {
                const x = ((maxW - line.wl) / (maxW - minW)) * w;
                const wrapper = document.createElement('div');
                wrapper.className = 'line-control';
                wrapper.style.left = x + 'px';
                wrapper.style.opacity = 1; 

                const input = document.createElement('input');
                input.type = 'radio'; input.name = 'spectralLine'; input.id = 'line-'+index;
                input.onclick = () => triggerTransition(line);

                const label = document.createElement('label');
                label.htmlFor = 'line-'+index;
                label.innerText = state.mode === 'absorption' ? '吸收' : '發射';

                wrapper.appendChild(input); wrapper.appendChild(label);
                checkContainer.appendChild(wrapper);
            });
        }

        // === 微觀動畫 ===
        function resetMicroView() {
            electron.style.transition = 'none';
            electron.style.bottom = levelHeights[0] + 'px';
            photonCont.innerHTML = '';
        }

        function triggerTransition(lineData) {
            photonCont.innerHTML = '';
            electron.style.transition = 'bottom 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275)';

            const startH = levelHeights[0];
            const endH = levelHeights[lineData.targetLevelIdx];

            if (state.mode === 'absorption') {
                electron.style.transition = 'none'; electron.style.bottom = startH + 'px';
                const photon = createPhoton(lineData.color);
                photon.style.animation = 'absorb-photon 1s linear forwards';
                photonCont.appendChild(photon);

                setTimeout(() => {
                    electron.style.transition = 'bottom 0.5s ease-out';
                    electron.style.bottom = endH + 'px';
                    microText.innerHTML = `吸收 <span style="color:${lineData.color}">${lineData.wl.toFixed(1)}nm</span> 光子，躍遷至較高能階。`;
                }, 450);

            } else if (state.mode === 'emission') {
                electron.style.transition = 'none'; electron.style.bottom = endH + 'px';
                setTimeout(() => {
                    electron.style.transition = 'bottom 0.5s ease-in';
                    electron.style.bottom = startH + 'px';
                    setTimeout(() => {
                        const photon = createPhoton(lineData.color);
                        photon.style.animation = 'emit-photon 1s linear forwards';
                        photonCont.appendChild(photon);
                        microText.innerHTML = `躍遷回基態，發射 <span style="color:${lineData.color}">${lineData.wl.toFixed(1)}nm</span> 光子。`;
                    }, 500);
                }, 100);
            }
        }

        function createPhoton(color) {
            const p = document.createElement('div');
            p.className = 'photon';
            p.style.color = color; p.style.backgroundColor = color;
            return p;
        }

        function wlToColor(wavelength) {
            let r, g, b;
            if (wavelength >= 380 && wavelength < 440) { r = -(wavelength - 440) / (440 - 380); g = 0; b = 1; }
            else if (wavelength >= 440 && wavelength < 490) { r = 0; g = (wavelength - 440) / (490 - 440); b = 1; }
            else if (wavelength >= 490 && wavelength < 510) { r = 0; g = 1; b = -(wavelength - 510) / (510 - 490); }
            else if (wavelength >= 510 && wavelength < 580) { r = (wavelength - 510) / (580 - 510); g = 1; b = 0; }
            else if (wavelength >= 580 && wavelength < 645) { r = 1; g = -(wavelength - 645) / (645 - 580); b = 0; }
            else if (wavelength >= 645 && wavelength <= 750) { r = 1; g = 0; b = 0; }
            else { r = 0; g = 0; b = 0; }
            return `rgb(${Math.round(r * 255)},${Math.round(g * 255)},${Math.round(b * 255)})`;
        }

        // === 事件綁定 ===
        btnCont.addEventListener('click', () => updateScene('continuous'));
        btnAbs.addEventListener('click', () => updateScene('absorption'));
        btnEmit.addEventListener('click', () => updateScene('emission'));
        
        gasSelect.addEventListener('change', (e) => {
            state.element = e.target.value;
            updateElementData(); 
            updateCheckboxes();
            resetMicroView();
            microText.innerText = "已切換元素，請重新選擇譜線進行觀察。";
        });

        init();
    </script>
</body>
</html>
