<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>鳩特物理：圓周運動與簡諧投影</title>
    <style>
        /* 應用「物質加熱曲線」的明亮風格 */
        :root {
            --primary-color: #4a90e2; /* 主藍色 (Primary) */
            --secondary-color: #f5a623; /* 橙色 (Accent) */
            --bg-color: #f4f7f6; /* 淺灰色背景 */
            --text-color: #333; /* 深色文字 */
            --panel-bg: #ffffff; /* 白色面板 */
            --nav-bg: rgba(30, 41, 59, 0.95); /* 深色導航欄 */
            --accent: #38bdf8; /* 藍色強調（用於按鈕等） */
            --control-group-bg: #f7f7ff; /* 淺藍色控制區背景 */
        }
        
        body { 
            font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif;
            margin: 0; 
            padding: 0; 
            background: var(--bg-color); 
            color: var(--text-color); 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
        }
        
        /* 導覽列 (保持深色，與您的範本一致) */
        .nav-bar { 
            padding: 10px 20px; 
            background: var(--nav-bg); 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            border-bottom: 1px solid #334155; 
            z-index: 20; 
            flex-shrink: 0;
            color: white; /* 導航欄文字改白色 */
        }
        .back-btn { 
            text-decoration: none; 
            color: var(--accent); 
            font-weight: bold; 
            border: 1px solid var(--accent); 
            padding: 5px 15px; 
            border-radius: 20px; 
            font-size: 0.9rem; 
            transition: 0.3s; 
            display: flex; 
            align-items: center; 
        }
        .back-btn:hover { background: var(--accent); color: #0f172a; }
        .page-title { margin:0; font-size:1.2rem; font-weight: 700; color: white; } /* 導航欄標題改白色 */

        /* 主畫面佈局 */
        .main-container { flex: 1; display: flex; position: relative; overflow: hidden; }
        
        /* 左側控制面板 */
        .controls { 
            width: 300px; 
            background: var(--panel-bg); /* 白色背景 */
            padding: 20px; 
            border-right: 1px solid #e2e8f0; /* 淺色分隔線 */
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
            z-index: 10; 
            overflow-y: auto; 
            box-shadow: 5px 0 15px rgba(0,0,0,0.05); /* 淺色陰影 */
            flex-shrink: 0; 
        }
        
        .control-group { 
            background: var(--control-group-bg); /* 淺藍色塊 */
            padding: 15px; 
            border-radius: 12px; 
            border: 1px solid #cbd5e1; /* 淺色邊框 */
        }
        .control-group h3 { 
            margin: 0 0 15px 0; 
            font-size: 1rem; 
            color: var(--primary-color); /* 藍色標題 */
            border-bottom: 1px solid var(--secondary-color); /* 橙色底線 */
            padding-bottom: 8px; 
            display: flex; 
            align-items: center; 
            gap: 8px;
        }
        
        label { display: flex; justify-content: space-between; align-items: center; font-size: 0.95rem; margin-bottom: 12px; cursor: pointer; }
        input[type="range"] { width: 100%; margin-top: 8px; cursor: pointer; accent-color: var(--secondary-color); } /* 橙色滑塊 */
        input[type="checkbox"] { transform: scale(1.3); cursor: pointer; accent-color: var(--primary-color); } /* 藍色勾選 */
        
        .value-display { font-family: 'Roboto Mono', monospace; color: var(--secondary-color); font-weight: bold; }
        .btn-pause { 
            width:100%; 
            margin-top:10px; 
            padding:10px; 
            background:var(--secondary-color); /* 橙色按鈕 */
            color: white; 
            border:none; 
            border-radius:8px; 
            cursor:pointer; 
            font-weight:bold; 
            font-size: 1rem; 
            transition: 0.2s; 
        }
        .btn-pause:hover { background: #e67e22; }

        /* 右側畫布容器 */
        #canvas-container { 
            flex: 1; 
            position: relative; 
            background: #e2e8f0; /* 淺灰色畫布背景 */
            overflow: hidden; 
        }
        canvas { 
            display: block; 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
        }

        /* 浮水印文字顏色調整為深色背景可見 */
        .watermark { 
            position: absolute; 
            bottom: 15px; 
            left: 20px; 
            font-family: 'Georgia', serif; 
            font-style: italic; 
            color: rgba(0,0,0,0.3); /* 深色浮水印 */
            font-size: 1.1rem; 
            pointer-events: none; 
            z-index: 5; 
        }

        /* 手機適配 */
        @media (max-width: 800px) {
            .main-container { flex-direction: column; }
            .controls { width: 100%; height: auto; max-height: 35vh; flex-direction: row; flex-wrap: wrap; border-right: none; border-top: 2px solid #cbd5e1; order: 2; padding: 10px; gap: 10px; }
            .control-group { flex: 1 1 45%; min-width: 150px; padding: 8px; font-size: 0.9rem; }
            #canvas-container { order: 1; flex: 1; min-height: 50vh; }
            .watermark { font-size: 0.8rem; bottom: 10px; left: 10px; }
            .page-title { font-size: 1rem; }
            .back-btn span { display: none; }
        }
    </style>
</head>
<body>
    <script>
        window.onerror = function(msg, url, line, col, error) {
            var div = document.createElement("div");
            div.style.cssText = "position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(200,0,0,0.9); color:white; padding:20px; border-radius:10px; z-index:9999; max-width:80%; box-shadow:0 10px 30px rgba(0,0,0,0.5); font-family:monospace;";
            div.innerHTML = "<h3>⚠️ 發生錯誤</h3><p>" + msg + "</p><p>Line: " + line + "</p>";
            document.body.appendChild(div);
            return false;
        };
    </script>

    <div class="nav-bar">
        <a href="../../index.html" class="back-btn"><span>⬅</span>&nbsp;回首頁</a>
        <h2 class="page-title">鳩特物理：圓周運動與簡諧投影</h2>
    </div>

    <div class="main-container">
        <div id="canvas-container">
            <canvas id="simCanvas"></canvas>
            <div class="watermark">Presented by Jutor</div>
        </div>

        <div class="controls">
            <div class="control-group">
                <h3>🔄 運動參數設定</h3>
                <label>
                    半徑 (R) <span id="val-R" class="value-display">120</span>
                    <input type="range" id="input-R" min="50" max="180" value="120">
                </label>
                <label>
                    角速率 (&omega;) <span id="val-W" class="value-display">1.0</span>
                    <input type="range" id="input-W" min="0.5" max="2.5" step="0.1" value="1.0">
                </label>
                <div style="font-size:0.9rem; color:#666; margin-top:5px; background: #eee; padding: 5px 8px; border-radius: 5px;">
                    速率 v = R&omega; = <span id="val-V" style="color:var(--secondary-color); font-weight:bold;">120</span>
                </div>
                <button id="btn-pause" class="btn-pause">⏯ 暫停 / 開始</button>
            </div>

            <div class="control-group">
                <h3>📐 物理量顯示 (Vectors)</h3>
                <label>
                    <span>位置/位移 (<span style="color:#2ecc71">●</span> $\vec{r}, \theta$)</span>
                    <input type="checkbox" id="check-pos" checked>
                </label>
                <label>
                    <span>速度 (<span style="color:#3498db">●</span> $\vec{v}, \theta$)</span>
                    <input type="checkbox" id="check-vel">
                </label>
                <label>
                    <span>加速度 (<span style="color:#e74c3c">●</span> $\vec{a}, \theta$)</span>
                    <input type="checkbox" id="check-acc">
                </label>
            </div>
        </div>
    </div>

    <script>
        MathJax = { tex: { inlineMath: [['$', '$']] } };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        let time = 0;
        let isPaused = false;
        let waveHistory = [];

        const params = { R: 120, omega: 1.0, cx: 0, cy: 0 };

        // 調整顏色以適應白色背景
        const colors = {
            pos: "#2ecc71",       // 綠色 (位置)
            vel: { main: "#3498db", comp: "#2980b9" }, // 藍色 (速度)
            acc: { main: "#e74c3c", comp: "#c0392b" }, // 紅色 (加速度)
            wave: "#9b59b6",      // 紫色 (波動)
            shm: "#f39c12",       // 橘色 (SHM點)
            guide: "rgba(0, 0, 0, 0.2)",
            text: "#333",
            angle: "#f5a623"      // 橙色 (角度)
        };

        const ui = {
            R: document.getElementById('input-R'),
            W: document.getElementById('input-W'),
            valR: document.getElementById('val-R'),
            valW: document.getElementById('val-W'),
            valV: document.getElementById('val-V'),
            btnPause: document.getElementById('btn-pause'),
            showPos: document.getElementById('check-pos'),
            showVel: document.getElementById('check-vel'),
            showAcc: document.getElementById('check-acc')
        };

        function init() {
            window.addEventListener('resize', resize);
            ui.R.addEventListener('input', updateParams);
            ui.W.addEventListener('input', updateParams);
            ui.btnPause.addEventListener('click', () => isPaused = !isPaused);
            
            setTimeout(() => {
                resize();
                updateParams();
                loop();
            }, 100);
        }

        function resize() {
            const container = document.getElementById('canvas-container');
            if (container) {
                width = canvas.width = container.clientWidth;
                height = canvas.height = container.clientHeight;
                
                const isMobile = width < 800;
                
                if (isMobile) {
                    params.cx = width * 0.25; 
                    params.cy = height * 0.35; 
                    const maxSafeR = Math.min(width, height) * 0.2;
                    if (parseInt(ui.R.value) > maxSafeR) {
                        ui.R.value = Math.floor(maxSafeR);
                    }
                } else {
                    params.cx = width * 0.3;
                    params.cy = height * 0.45;
                }
            }
        }

        function updateParams() {
            params.R = parseInt(ui.R.value);
            params.omega = parseFloat(ui.W.value);
            ui.valR.textContent = params.R;
            ui.valW.textContent = params.omega.toFixed(1);
            ui.valV.textContent = (params.R * params.omega).toFixed(0);
        }

        function loop() {
            requestAnimationFrame(loop);
            if (!isPaused) time += 0.02 * params.omega;
            if (!width || !height) resize();

            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = "#e2e8f0"; // 畫布背景色
            ctx.fillRect(0, 0, width, height);

            const theta = time % (2 * Math.PI); 
            const physX = params.R * Math.cos(theta);
            const physY = params.R * Math.sin(theta);
            const canvasX = physX;
            const canvasY = -physY; 

            const px = params.cx + canvasX;
            const py = params.cy + canvasY;

            drawSystemGrid(params.cx, params.cy);
            drawCircle(params.cx, params.cy, params.R);
            drawWaveSystem(canvasX, canvasY);
            drawSHMSystem(canvasX, canvasY, theta);
            drawParticle(px, py, "#000", 6); // 質點改黑色
            drawVectors(canvasX, canvasY, theta, px, py);
        }

        function drawArrow(fromX, fromY, vecX, vecY, color, label, scale = 1, isComponent = false) {
            const toX = fromX + vecX * scale;
            const toY = fromY + vecY * scale;
            const headlen = isComponent ? 8 : 12; 
            const angle = Math.atan2(toY - fromY, toX - fromX);
            const lineWidth = isComponent ? 2 : 4; 

            ctx.beginPath();
            ctx.moveTo(fromX, fromY);
            ctx.lineTo(toX, toY);
            ctx.strokeStyle = color;
            ctx.lineWidth = lineWidth;
            ctx.lineCap = 'round';
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(toX, toY);
            ctx.lineTo(toX - headlen * Math.cos(angle - Math.PI / 6), toY - headlen * Math.sin(angle - Math.PI / 6));
            ctx.lineTo(toX - headlen * Math.cos(angle + Math.PI / 6), toY - headlen * Math.sin(angle + Math.PI / 6));
            ctx.closePath();
            ctx.fillStyle = color;
            ctx.fill();

            if (label) {
                ctx.fillStyle = colors.text; // 文字顏色
                ctx.shadowColor = "rgba(255,255,255,0.8)"; // 淺色背景加白色陰影
                ctx.shadowBlur = 4;
                ctx.font = isComponent ? "bold 14px serif" : "bold 18px serif";
                ctx.textBaseline = "middle";
                
                let mainText = label;
                let subText = "";
                if(label && label.includes('_')){
                    const parts = label.split('_');
                    mainText = parts[0];
                    subText = parts[1];
                }

                const textX = toX + (vecX >= 0 ? 12 : -20);
                const textY = toY + (vecY >= 0 ? 15 : -15);
                
                ctx.fillText(mainText, textX, textY);
                if(subText){
                    ctx.font = isComponent ? "bold 10px serif" : "bold 12px serif";
                    const mainWidth = ctx.measureText(mainText).width;
                    ctx.fillText(subText, textX + mainWidth + 1, textY + 6);
                }
                ctx.shadowBlur = 0; 
            }
        }

        function drawAngle(cx, cy, startAngle, endAngle, r = 40, label = "θ", drawFill = true) {
            const isMobile = width < 800;
            const arcR = isMobile ? r - 15 : r;

            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.arc(cx, cy, arcR, startAngle, endAngle, true); 
            ctx.closePath();
            
            if(drawFill) {
                ctx.fillStyle = "rgba(245, 166, 35, 0.2)"; // 橙色透明填滿
                ctx.fill();
            }
            
            ctx.strokeStyle = colors.angle;
            ctx.lineWidth = 2;
            ctx.stroke();

            const midAngle = (startAngle + endAngle) / 2;
            const textR = arcR + 12;
            ctx.fillStyle = colors.angle;
            ctx.font = "bold 16px serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(label, cx + textR * Math.cos(midAngle), cy + textR * Math.sin(midAngle));
        }

        function drawSystemGrid(cx, cy) {
            ctx.beginPath();
            ctx.strokeStyle = "#999"; // 軸線顏色
            ctx.lineWidth = 1;
            ctx.moveTo(0, cy); ctx.lineTo(width, cy); 
            ctx.moveTo(cx, 0); ctx.lineTo(cx, height);
            ctx.stroke();
            ctx.fillStyle = colors.text;
            ctx.font = "14px sans-serif";
            ctx.fillText("O", cx + 5, cy + 15);
        }

        function drawCircle(x, y, r) {
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.strokeStyle = "#999"; // 圓周虛線顏色
            ctx.lineWidth = 2;
            ctx.setLineDash([6, 6]);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        function drawParticle(x, y, color, size) {
            ctx.beginPath();
            ctx.arc(x, y, size, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();
            ctx.strokeStyle = "rgba(0,0,0,0.5)"; 
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        function drawWaveSystem(canvasX, canvasY) {
            const isMobile = width < 800;
            const waveGap = isMobile ? 30 : 60; 
            const waveStartX = params.cx + params.R + waveGap;
            
            ctx.beginPath();
            ctx.moveTo(params.cx + canvasX, params.cy + canvasY);
            ctx.lineTo(waveStartX, params.cy + canvasY);
            ctx.strokeStyle = colors.guide;
            ctx.setLineDash([4, 4]);
            ctx.stroke();
            ctx.setLineDash([]);

            if (!isPaused) {
                waveHistory.unshift(canvasY); 
                if (waveHistory.length > width) waveHistory.pop();
            }

            ctx.beginPath();
            ctx.strokeStyle = colors.wave;
            ctx.lineWidth = 3;
            ctx.lineJoin = 'round';
            for (let i = 0; i < waveHistory.length; i++) {
                const wx = waveStartX + i * (isMobile ? 2 : 3); 
                const wy = params.cy + waveHistory[i];
                if (wx > width) break;
                if (i === 0) ctx.moveTo(wx, wy);
                else ctx.lineTo(wx, wy);
            }
            ctx.stroke();
            
            if (waveHistory.length > 0) drawParticle(waveStartX, params.cy + waveHistory[0], colors.wave, 5);
        }

        function drawSHMSystem(canvasX, canvasY, theta) {
            const isMobile = width < 800;
            const shmGap = isMobile ? 50 : 100;
            const shmY = params.cy + params.R + shmGap;
            
            if (shmY < height - 10) {
                ctx.beginPath();
                ctx.moveTo(params.cx + canvasX, params.cy + canvasY);
                ctx.lineTo(params.cx + canvasX, shmY);
                ctx.strokeStyle = colors.guide;
                ctx.setLineDash([4, 4]);
                ctx.stroke();
                ctx.setLineDash([]);

                ctx.beginPath();
                ctx.moveTo(params.cx - params.R - 20, shmY); ctx.lineTo(params.cx + params.R + 20, shmY);
                ctx.strokeStyle = "#999"; ctx.lineWidth = 2; ctx.stroke();
                
                ctx.beginPath(); ctx.moveTo(params.cx, shmY - 8); ctx.lineTo(params.cx, shmY + 8); ctx.stroke();
                
                ctx.fillStyle = "#999";
                ctx.font = "12px sans-serif";
                if (!isMobile) {
                    ctx.fillText("-R", params.cx - params.R - 30, shmY + 25);
                    ctx.fillText("+R", params.cx + params.R + 10, shmY + 25);
                }
                
                drawParticle(params.cx + canvasX, shmY, colors.shm, 8);
                
                // 動態公式顯示
                let formulaText = "";
                let formulaVal = "";
                
                if (ui.showPos.checked) {
                    const val = Math.cos(theta).toFixed(2);
                    formulaText = "x = R cos(θ)";
                    formulaVal = `= ${params.R} × ${val}`;
                } else if (ui.showVel.checked) {
                    const val = -Math.sin(theta).toFixed(2);
                    formulaText = "v_x = -v sin(θ)";
                    formulaVal = `∝ ${val}`;
                } else if (ui.showAcc.checked) {
                    const val = -Math.cos(theta).toFixed(2);
                    formulaText = "a_x = -a_c cos(θ)";
                    formulaVal = `∝ ${val}`;
                } else {
                    formulaText = "SHM";
                }

                if(formulaText) {
                    ctx.fillStyle = colors.shm;
                    ctx.font = "bold 16px serif";
                    ctx.fillText(formulaText, params.cx + params.R + (isMobile?10:30), shmY);
                    if(formulaVal) {
                        ctx.font = "12px monospace";
                        ctx.fillStyle = colors.text;
                        ctx.fillText(formulaVal, params.cx + params.R + (isMobile?10:30), shmY + 18);
                    }
                }
            }
        }

        function drawVectors(canvasX, canvasY, theta, px, py) {
            const isMobile = width < 800;
            const shmGap = isMobile ? 50 : 100;
            const shmY = params.cy + params.R + shmGap;
            const shmX = params.cx + canvasX;

            const vScale = 0.7;
            const aScale = 0.7;

            // 1. 位置/位移 (R, x)
            if (ui.showPos.checked) {
                // 1.1. 投影三角形
                ctx.beginPath();
                ctx.moveTo(params.cx, params.cy); 
                ctx.lineTo(params.cx + canvasX, params.cy); 
                ctx.lineTo(params.cx + canvasX, params.cy + canvasY); 
                ctx.strokeStyle = "rgba(46, 204, 113, 0.3)"; 
                ctx.lineWidth = 1; ctx.setLineDash([2,2]); ctx.stroke(); ctx.setLineDash([]);
                
                // 1.2. 向量
                drawArrow(params.cx, params.cy, canvasX, canvasY, colors.pos, "r");
                drawArrow(params.cx, params.cy, canvasX, 0, colors.pos, "x", 1, true);
                if (shmY < height - 10) drawArrow(params.cx, shmY, canvasX, 0, colors.pos, "x");
                
                // 1.3. θ 角: 圓心處
                drawAngle(params.cx, params.cy, 0, -theta);
            }

            // 2. 速度 (v)
            if (ui.showVel.checked) {
                const vMag = params.R * params.omega;
                const physVx = -vMag * Math.sin(theta);
                const physVy = vMag * Math.cos(theta);
                const vecVx = physVx * vScale;
                const vecVy = -physVy * vScale;

                // 2.1. 投影輔助線/矩形
                ctx.beginPath();
                ctx.moveTo(px, py); ctx.lineTo(px + vecVx, py); ctx.lineTo(px + vecVx, py + vecVy); 
                ctx.lineTo(px, py + vecVy); ctx.closePath();
                ctx.strokeStyle = "rgba(52, 152, 219, 0.2)";
                ctx.lineWidth = 1; ctx.setLineDash([2,2]); ctx.stroke(); ctx.setLineDash([]);
                
                // 2.2. 向量
                drawArrow(px, py, vecVx, 0, colors.vel.comp, "v_x", 1, true); 
                drawArrow(px + vecVx, py, 0, vecVy, colors.vel.comp, null, 1, true); 
                drawArrow(px, py, vecVx, vecVy, colors.vel.main, "v", 1); 

                // 2.3. θ 角: v 與 鉛垂線 夾角
                ctx.beginPath();
                ctx.moveTo(px, py); ctx.lineTo(px, py - 40);
                ctx.strokeStyle = colors.guide; ctx.setLineDash([2,2]); ctx.stroke(); ctx.setLineDash([]);
                
                drawAngle(px, py, -Math.PI/2, -Math.PI/2 - theta, 25);

                if (shmY < height - 10) drawArrow(shmX, shmY - 20, vecVx, 0, colors.vel.main, "v_x");
            }

            // 3. 加速度 (a)
            if (ui.showAcc.checked) {
                const aMag = params.R * params.omega * params.omega;
                const physAx = -aMag * Math.cos(theta);
                const physAy = -aMag * Math.sin(theta);
                const vecAx = physAx * aScale;
                const vecAy = -physAy * aScale;

                // 3.1. 投影輔助線/矩形
                ctx.beginPath();
                ctx.moveTo(px, py); ctx.lineTo(px + vecAx, py); ctx.lineTo(px + vecAx, py + vecAy);
                ctx.lineTo(px, py + vecAy); ctx.closePath();
                ctx.strokeStyle = "rgba(231, 76, 60, 0.2)";
                ctx.lineWidth = 1; ctx.setLineDash([2,2]); ctx.stroke(); ctx.setLineDash([]);

                // 3.2. 向量
                drawArrow(px, py, vecAx, 0, colors.acc.comp, "a_x", 1, true);
                drawArrow(px + vecAx, py, 0, vecAy, colors.acc.comp, null, 1, true);
                drawArrow(px, py, vecAx, vecAy, colors.acc.main, "a", 1);

                // 3.3. θ 角: a 與 水平線 夾角
                ctx.beginPath();
                ctx.moveTo(px, py); ctx.lineTo(px - 40, py);
                ctx.strokeStyle = colors.guide; ctx.setLineDash([2,2]); ctx.stroke(); ctx.setLineDash([]);

                drawAngle(px, py, Math.PI, Math.PI - theta, 25);

                if (shmY < height - 10) drawArrow(shmX, shmY + 20, vecAx, 0, colors.acc.comp, "a_x");
            }
        }

        window.onload = init;
    </script>
</body>
</html>
