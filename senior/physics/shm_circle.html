<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>等速圓周運動與簡諧投影</title>
    <style>
        :root { --bg: #0f172a; --text: #f1f5f9; --accent: #38bdf8; --panel: #1e293b; }
        body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
        
        /* 導覽列 */
        .nav-bar { padding: 10px 20px; background: rgba(30, 41, 59, 0.9); display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #334155; }
        .back-btn { text-decoration: none; color: var(--accent); font-weight: bold; border: 1px solid var(--accent); padding: 5px 15px; border-radius: 20px; font-size: 0.9rem; transition: 0.3s; }
        .back-btn:hover { background: var(--accent); color: #000; }

        /* 主畫面佈局 */
        .main-container { flex: 1; display: flex; position: relative; }
        
        /* 左側控制面板 */
        .controls { width: 300px; background: var(--panel); padding: 20px; border-right: 1px solid #334155; display: flex; flex-direction: column; gap: 20px; z-index: 10; overflow-y: auto; }
        
        .control-group { background: rgba(0,0,0,0.2); padding: 15px; border-radius: 10px; }
        .control-group h3 { margin: 0 0 10px 0; font-size: 1rem; color: var(--accent); border-bottom: 1px solid #475569; padding-bottom: 5px; }
        
        label { display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; margin-bottom: 8px; cursor: pointer; }
        input[type="range"] { width: 100%; margin-top: 5px; cursor: pointer; }
        input[type="checkbox"] { transform: scale(1.2); cursor: pointer; }
        
        .value-display { font-family: monospace; color: #fbbf24; }

        /* 右側畫布 */
        #canvas-container { flex: 1; position: relative; background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%); overflow: hidden; }
        canvas { display: block; width: 100%; height: 100%; }

        /* 手機適配 */
        @media (max-width: 800px) {
            .main-container { flex-direction: column; }
            .controls { width: 100%; height: 200px; flex-direction: row; flex-wrap: wrap; border-right: none; border-top: 1px solid #334155; order: 2; }
            .control-group { flex: 1; min-width: 140px; }
        }
    </style>
</head>
<body>

    <div class="nav-bar">
        <a href="../../index.html" class="back-btn">⬅ 回首頁</a>
        <h2 style="margin:0; font-size:1.2rem;">物理：圓周運動與簡諧投影</h2>
    </div>

    <div class="main-container">
        <div class="controls">
            <div class="control-group">
                <h3>🔄 運動參數</h3>
                <label>
                    半徑 (R) <span id="val-R" class="value-display">100</span>
                    <input type="range" id="input-R" min="50" max="150" value="100">
                </label>
                <label>
                    角速率 (&omega;) <span id="val-W" class="value-display">1.0</span>
                    <input type="range" id="input-W" min="0.5" max="3" step="0.1" value="1.0">
                </label>
                <div style="font-size:0.8rem; color:#94a3b8; margin-top:5px;">
                    對應速率 v = <span id="val-V">100</span>
                </div>
                <button id="btn-pause" style="width:100%; margin-top:10px; padding:8px; background:#38bdf8; border:none; border-radius:5px; cursor:pointer; font-weight:bold;">⏯ 暫停 / 繼續</button>
            </div>

            <div class="control-group">
                <h3>📐 向量分析 (Vectors)</h3>
                <label>
                    <span>位置/位移 (<span style="color:#4ade80">●</span> $\vec{r}, \vec{x}$)</span>
                    <input type="checkbox" id="check-pos" checked>
                </label>
                <label>
                    <span>速度 (<span style="color:#f472b6">●</span> $\vec{v}$)</span>
                    <input type="checkbox" id="check-vel">
                </label>
                <label>
                    <span>加速度 (<span style="color:#fbbf24">●</span> $\vec{a}$)</span>
                    <input type="checkbox" id="check-acc">
                </label>
            </div>
            
            <div class="control-group" style="font-size: 0.85rem; color: #ccc;">
                <p>說明：<br>
                1. <strong>左上</strong>：參考圓 (等速圓周)<br>
                2. <strong>右側</strong>：y軸投影 (正弦波)<br>
                3. <strong>下方</strong>：x軸投影 (簡諧運動 SHM)</p>
            </div>
        </div>

        <div id="canvas-container">
            <canvas id="simCanvas"></canvas>
        </div>
    </div>

    <script>
        MathJax = { tex: { inlineMath: [['$', '$']] } };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        // 狀態變數
        let time = 0;
        let isPaused = false;
        let waveHistory = []; // 儲存波動軌跡

        // 參數
        const params = {
            R: 100,      // 半徑
            omega: 1.0,  // 角速率
            cx: 0, cy: 0 // 圓心位置 (會在 resize 計算)
        };

        // DOM 元素
        const ui = {
            R: document.getElementById('input-R'),
            W: document.getElementById('input-W'),
            valR: document.getElementById('val-R'),
            valW: document.getElementById('val-W'),
            valV: document.getElementById('val-V'),
            btnPause: document.getElementById('btn-pause'),
            showPos: document.getElementById('check-pos'),
            showVel: document.getElementById('check-vel'),
            showAcc: document.getElementById('check-acc')
        };

        // 初始化與事件監聽
        function init() {
            window.addEventListener('resize', resize);
            resize();

            ui.R.addEventListener('input', updateParams);
            ui.W.addEventListener('input', updateParams);
            ui.btnPause.addEventListener('click', () => isPaused = !isPaused);

            loop();
        }

        function resize() {
            width = canvas.width = document.getElementById('canvas-container').clientWidth;
            height = canvas.height = document.getElementById('canvas-container').clientHeight;
            // 設定圓心位置：稍微偏左上，留空間給右邊和下面
            params.cx = width * 0.3;
            params.cy = height * 0.4;
        }

        function updateParams() {
            params.R = parseInt(ui.R.value);
            params.omega = parseFloat(ui.W.value);
            ui.valR.textContent = params.R;
            ui.valW.textContent = params.omega.toFixed(1);
            ui.valV.textContent = (params.R * params.omega).toFixed(0);
        }

        // 繪圖核心
        function loop() {
            requestAnimationFrame(loop);

            if (!isPaused) {
                time += 0.02 * params.omega; // 時間步進
            }

            // 清空畫布
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = "#0f172a";
            ctx.fillRect(0, 0, width, height);

            // 計算質點位置 (以圓心為原點)
            // 注意：Canvas Y軸向下為正，物理習慣向上為正，這裡需做轉換
            // 設定 theta = 0 在正右方 (x軸正向)
            // x = R cos(theta), y = R sin(theta) (Canvas中 y 要反向)
            const theta = time; 
            const x = params.R * Math.cos(theta);
            const y = -params.R * Math.sin(theta); // 負號是因為 Canvas Y軸向下

            const px = params.cx + x;
            const py = params.cy + y;

            // 1. 繪製參考圓
            drawCircle(params.cx, params.cy, params.R);
            
            // 2. 繪製質點
            drawParticle(px, py, "#fff");

            // 3. 繪製右側波動 (y軸投影)
            drawWaveSystem(x, y);

            // 4. 繪製下方簡諧 (x軸投影)
            drawSHMSystem(x, y);

            // 5. 繪製向量 (這是重點需求)
            drawVectors(x, y, theta);
        }

        // --- 繪圖輔助函式 ---

        function drawCircle(x, y, r) {
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.strokeStyle = "#475569";
            ctx.setLineDash([5, 5]);
            ctx.stroke();
            ctx.setLineDash([]);
            
            // 圓心與軸
            ctx.beginPath();
            ctx.fillStyle = "#64748b";
            ctx.arc(x, y, 3, 0, Math.PI*2);
            ctx.fill();
        }

        function drawParticle(x, y, color) {
            ctx.beginPath();
            ctx.arc(x, y, 6, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();
            ctx.strokeStyle = "#000";
            ctx.stroke();
        }

        function drawArrow(fromX, fromY, vecX, vecY, color, label, scale = 1) {
            const toX = fromX + vecX * scale;
            const toY = fromY + vecY * scale; // Canvas Y 座標
            
            const headlen = 10;
            const angle = Math.atan2(toY - fromY, toX - fromX);

            ctx.beginPath();
            ctx.moveTo(fromX, fromY);
            ctx.lineTo(toX, toY);
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.stroke();

            // 箭頭
            ctx.beginPath();
            ctx.moveTo(toX, toY);
            ctx.lineTo(toX - headlen * Math.cos(angle - Math.PI / 6), toY - headlen * Math.sin(angle - Math.PI / 6));
            ctx.lineTo(toX - headlen * Math.cos(angle + Math.PI / 6), toY - headlen * Math.sin(angle + Math.PI / 6));
            ctx.fillStyle = color;
            ctx.fill();

            // 標籤
            if (label) {
                ctx.fillStyle = color;
                ctx.font = "bold 14px serif";
                ctx.fillText(label, toX + 10, toY);
            }
        }

        // --- 物理系統繪製 ---

        function drawWaveSystem(x, y) {
            // 投影線
            ctx.beginPath();
            ctx.moveTo(params.cx + x, params.cy + y);
            ctx.lineTo(width, params.cy + y);
            ctx.strokeStyle = "rgba(255, 255, 255, 0.1)";
            ctx.setLineDash([2, 2]);
            ctx.stroke();
            ctx.setLineDash([]);

            // 更新波動歷史 (向右傳遞)
            if (!isPaused) {
                // 記錄的是 "相對於圓心水平線的 y 偏移量"
                waveHistory.unshift(y); 
                if (waveHistory.length > 500) waveHistory.pop();
            }

            // 繪製波形 (從圓右側 R+50 處開始)
            const waveStartX = params.cx + params.R + 50;
            ctx.beginPath();
            ctx.strokeStyle = "#38bdf8"; // 藍色波
            ctx.lineWidth = 2;
            for (let i = 0; i < waveHistory.length; i++) {
                const wx = waveStartX + i * 2; // 波速 (水平展開速度)
                const wy = params.cy + waveHistory[i];
                if (wx > width) break;
                if (i === 0) ctx.moveTo(wx, wy);
                else ctx.lineTo(wx, wy);
            }
            ctx.stroke();

            // 波源點
            if (waveHistory.length > 0) {
                drawParticle(waveStartX, params.cy + waveHistory[0], "#38bdf8");
            }
        }

        function drawSHMSystem(x, y) {
            const shmY = params.cy + params.R + 80; // 下方位置
            
            // 投影線
            ctx.beginPath();
            ctx.moveTo(params.cx + x, params.cy + y);
            ctx.lineTo(params.cx + x, shmY);
            ctx.strokeStyle = "rgba(255, 255, 255, 0.1)";
            ctx.setLineDash([2, 2]);
            ctx.stroke();
            ctx.setLineDash([]);

            // 軌道線
            ctx.beginPath();
            ctx.moveTo(params.cx - params.R - 20, shmY);
            ctx.lineTo(params.cx + params.R + 20, shmY);
            ctx.strokeStyle = "#64748b";
            ctx.stroke();

            // 平衡點標記
            ctx.beginPath();
            ctx.moveTo(params.cx, shmY - 5);
            ctx.lineTo(params.cx, shmY + 5);
            ctx.stroke();

            // SHM 質點
            drawParticle(params.cx + x, shmY, "#f472b6"); // 粉色 SHM
            ctx.fillStyle = "#94a3b8";
            ctx.font = "12px sans-serif";
            ctx.fillText("x投影 (SHM)", params.cx - 30, shmY + 25);
        }

        function drawVectors(x, y, theta) {
            const px = params.cx + x;
            const py = params.cy + y;
            const shmY = params.cy + params.R + 80;
            const shmX = params.cx + x;

            // 1. 位置向量 (r) 與 位移 (x)
            if (ui.showPos.checked) {
                const color = "#4ade80"; // 綠色
                // 圓上: r 向量 (半徑)
                drawArrow(params.cx, params.cy, x, y, color, "r");
                // 下方: x 向量 (位移)
                drawArrow(params.cx, shmY, x, 0, color, "x");
                
                // 角度標示
                ctx.beginPath();
                ctx.arc(params.cx, params.cy, 20, 0, -theta, true); // Canvas 角度逆時針為負
                ctx.strokeStyle = color;
                ctx.stroke();
            }

            // 2. 速度向量 (v)
            if (ui.showVel.checked) {
                const color = "#f472b6"; // 粉色
                const vScale = 0.5; // 縮放以免太長
                // 切線速度 v = R * omega
                // 方向：垂直於半徑 (theta + 90度)
                // vx = -R w sin(theta), vy = -R w cos(theta) (注意 Canvas 坐標系)
                
                // 物理上：x = R cos(wt), v = -R w sin(wt)
                const vMag = params.R * params.omega * vScale;
                const vx = -vMag * Math.sin(theta);
                const vy = -vMag * Math.cos(theta); 

                // 圓上: 切線速度
                drawArrow(px, py, vx, vy, color, "v");
                
                // 下方: SHM 速度 (僅 x 分量)
                // 為了不與質點重疊，畫在上方一點
                drawArrow(shmX, shmY - 15, vx, 0, color, "v_x");
            }

            // 3. 加速度向量 (a)
            if (ui.showAcc.checked) {
                const color = "#fbbf24"; // 黃色
                const aScale = 0.5;
                // 向心加速度 a = R * omega^2
                // 方向：指向圓心 (-x, -y)
                // ax = -R w^2 cos(theta)
                
                const aMag = params.R * params.omega * params.omega * aScale;
                const ax = -aMag * Math.cos(theta);
                const ay = aMag * Math.sin(theta); // Canvas Y 向下為正，y本身是負的，所以指向圓心要正

                // 圓上: 向心加速度
                drawArrow(px, py, ax, ay, color, "a_c");

                // 下方: SHM 加速度 (僅 x 分量)
                drawArrow(shmX, shmY + 15, ax, 0, color, "a");
            }
        }

        init();

    </script>
</body>
</html>
