<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鳩特老師的互動教學網站</title>
    <script src="data.js"></script> 
    
    <style>
        /* --- 全域設定 --- */
        :root {
            --bg-color: #0f172a; --card-bg: #1e293b; --text-main: #f1f5f9;
            --text-sub: #94a3b8; --accent: #38bdf8; --accent-glow: rgba(56, 189, 248, 0.3);
            --transition: all 0.3s ease;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); line-height: 1.6; }
        
        /* --- Header --- */
        header {
            padding: 1.5rem 5%; display: flex; flex-direction: column; align-items: center;
            border-bottom: 1px solid #334155; background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100;
        }
        .logo-area { display: flex; align-items: center; justify-content: center; gap: 15px; margin-bottom: 1.5rem; }
        .logo { height: 45px; width: auto; background-color: #fff; border-radius: 50%; padding: 2px; object-fit: contain; }
        h1 { font-size: 1.8rem; font-weight: 700; letter-spacing: 1px; margin: 0; background: linear-gradient(90deg, #fff, var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        /* --- Filter Buttons --- */
        .filter-nav { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .filter-btn { background: transparent; border: 1px solid #334155; color: var(--text-sub); padding: 8px 20px; border-radius: 20px; cursor: pointer; transition: var(--transition); font-size: 0.95rem; }
        .filter-btn:hover, .filter-btn.active { background: var(--accent); color: #0f172a; border-color: var(--accent); box-shadow: 0 0 15px var(--accent-glow); font-weight: bold; }
        
        /* --- Grid & Cards --- */
        .container { max-width: 1200px; margin: 2rem auto; padding: 0 5%; min-height: 60vh; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 2rem; }
        
        .card { background: var(--card-bg); border: 1px solid #334155; border-radius: 12px; overflow: hidden; transition: var(--transition); position: relative; text-decoration: none; display: flex; flex-direction: column; }
        .card.hidden { display: none; }
        .card:hover { transform: translateY(-5px); border-color: var(--accent); box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.5); }
        .card-body { padding: 1.5rem; display: flex; flex-direction: column; height: 100%; }
        .tags { margin-bottom: 10px; }
        .tag { font-size: 0.75rem; padding: 4px 8px; border-radius: 4px; margin-right: 5px; font-weight: bold; text-transform: uppercase; }
        
        .tag.math { background: rgba(56, 189, 248, 0.15); color: #38bdf8; }
        .tag.phys { background: rgba(168, 85, 247, 0.15); color: #a855f7; }
        .tag.chem { background: rgba(34, 197, 94, 0.15);  color: #22c55e; }
        .tag.lang { background: rgba(251, 146, 60, 0.15); color: #fb923c; }
        
        .card-title { color: var(--text-main); font-size: 1.25rem; margin-bottom: 0.5rem; }
        .card-desc { color: var(--text-sub); font-size: 0.9rem; margin-bottom: 1.5rem; flex-grow: 1; }
        .card-footer { margin-top: auto; display: flex; align-items: center; color: var(--accent); font-size: 0.9rem; font-weight: 600; }
        .arrow { margin-left: 5px; transition: transform 0.2s; }
        .card:hover .arrow { transform: translateX(5px); }
        footer { text-align: center; padding: 2rem; color: var(--text-sub); font-size: 0.8rem; border-top: 1px solid #334155; margin-top: 3rem; background: #0f172a; }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <img src="logo.jpg" alt="鳩特老師 Logo" class="logo">
            <h1>鳩特老師的互動教學網站</h1>
        </div>
        
        <div class="filter-nav">
            <button class="filter-btn active" onclick="filterSelection('all')">全部顯示</button>
            <button class="filter-btn" onclick="filterSelection('junior')">國中區</button>
            <button class="filter-btn" onclick="filterSelection('senior')">高中區</button>
            <button class="filter-btn" onclick="filterSelection('language')">語言學習</button>
        </div>
    </header>

    <div class="container">
        <div class="grid" id="card-container"></div>
    </div>

    <footer>
        <p>&copy; 2024 鳩特老師的互動教學網站. All rights reserved.</p>
    </footer>

    <script>
        // 自動生成卡片
        function renderCards() {
            const container = document.getElementById('card-container');
            let htmlContent = '';
            
            // 檢查是否有讀取到 data.js
            if (typeof lessonData === 'undefined') {
                container.innerHTML = '<p style="color:white;">讀取資料失敗，請確認 data.js 是否存在。</p>';
                return;
            }

            lessonData.forEach(lesson => {
                htmlContent += `
                <a href="${lesson.url}" class="card" data-category="${lesson.category}">
                    <div class="card-body">
                        <div class="tags">
                            <span class="tag ${lesson.tagClass}">${lesson.tagName}</span>
                        </div>
                        <h3 class="card-title">${lesson.title}</h3>
                        <p class="card-desc">${lesson.desc}</p>
                        <div class="card-footer">
                            開始互動 <span class="arrow">→</span>
                        </div>
                    </div>
                </a>
                `;
            });
            container.innerHTML = htmlContent;
        }

        renderCards();

        // 篩選功能
        function filterSelection(category) {
            var cards = document.getElementsByClassName("card");
            var buttons = document.getElementsByClassName("filter-btn");

            for (var i = 0; i < buttons.length; i++) {
                buttons[i].classList.remove("active");
                if (buttons[i].onclick.toString().includes(category)) buttons[i].classList.add("active");
            }
            
            for (var i = 0; i < cards.length; i++) {
                if (category == "all") {
                    cards[i].classList.remove("hidden");
                } else {
                    if (cards[i].getAttribute("data-category").includes(category)) {
                        cards[i].classList.remove("hidden");
                    } else {
                        cards[i].classList.add("hidden");
                    }
                }
            }
        }
    </script>
</body>
</html>
