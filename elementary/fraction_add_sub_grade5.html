:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;text-align:center;padding:20px}.end strong{font-size:4.5rem;color:var(--level-dark)!important}.end .primary{min-width:150px}.shake{animation:shake .3s}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
    .secondary{margin-top:10px;border:0;background:transparent;color:var(--muted);text-decoration:underline;font-weight:800;cursor:pointer}.playing #config{display:none}.playing .controls{overflow:hidden}

<body data-level="basic">
  <header class="nav"><a href="../index.html">← 回主選單</a><h1>🦔 分數的加減法（五年級）</h1></header>
  <main class="layout">
    <section class="panel work" id="work">
      <div class="startbox" id="welcome"><div class="hero">🦔</div><h2>一格一格，把分數算清楚</h2><p>填對目前這一格，下一個步驟才會解鎖。</p></div>
      <div class="workspace hidden" id="workspace"><div class="problem" id="problem"></div><div class="mixed-reminder hidden" id="mixedReminder">📌 加減法不需要把帶分數換成假分數</div><div class="steps" id="steps"></div><div class="reduction-zone" id="reductionZone"></div></div>
      <div class="watermark">Presented by Jutor</div>
      <div class="end hidden" id="end"><h2 id="endTitle">測驗完成</h2><strong id="finalScore">0</strong><p id="endText"></p><button class="primary" onclick="backToMenu()">再來一次</button></div>
    </section>
    <aside class="panel controls">
      <div id="config">
        <div class="label">難度</div>
        <div class="level-box"><div class="level-caption"><span>🌿 溫和基礎</span><span>最簡分數進階 🖤</span></div><button class="level-toggle" id="levelToggle" type="button" role="switch" aria-checked="false" aria-label="切換基礎與進階" onclick="toggleLevel()"></button></div>
        <div class="label">題型</div><div class="choice-grid three"><button class="choice active" data-kind="same" onclick="selectKind('same')">同分母加減法</button><button class="choice" data-kind="unlike" onclick="selectKind('unlike')">異分母加減法</button><button class="choice" data-kind="mixed" onclick="selectKind('mixed')">帶分數加減法</button></div>
        <div class="label">算式長度</div><div class="choice-grid"><button class="choice active" data-count="2" onclick="selectCount(2)">兩個分數</button><button class="choice" data-count="3" onclick="selectCount(3)">三個分數</button></div>
        <div class="label">學習模式</div><div class="choice-grid"><button class="choice active" data-mode="practice" onclick="selectMode('practice')">🌱 練習模式</button><button class="choice" data-mode="exam" onclick="selectMode('exam')">⏱️ 10 分鐘測驗</button></div>

      </div>
      <div class="game-controls hidden" id="gameControls">
        <div class="status"><div><small>進度</small><span id="progress">第 1 題</span></div><div><small>本題分數</small><span id="points">—</span></div><div><small>剩餘時間</small><span id="timer">不限時</span></div></div><div class="timerbar"><div id="timerFill"></div></div>
        <div class="entry-hint" id="entryHint">請填入目前亮起來的格子</div>

      </div>

  </main>
  <div class="modal hidden" id="reduceModal" role="dialog" aria-modal="true" aria-labelledby="reduceTitle"><div class="modal-card"><h2 id="reduceTitle">這個分數還能約分嗎？</h2><div class="modal-fraction" id="modalFraction"></div><p>觀察分子、分母有沒有大於 1 的公因數。</p><div class="modal-actions"><button onclick="answerReducible(true)">可以約分</button><button onclick="answerReducible(false)">不能約分</button></div></div></div>
<script>
const EXAM_SECONDS=10*60,EXAM_QUESTIONS=10;
let level='basic',kind='same',termCount=2,mode='practice',question=null,tasks=[],taskIndex=0,buffer='',mistakes=0,totalScore=0,qIndex=0,timeLeft=EXAM_SECONDS,timerId=null,running=false,locked=false,reduction=null;
const $=id=>document.getElementById(id);
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a}
function lcm(a,b){return a/gcd(a,b)*b}
function lcmAll(values){return values.reduce((a,b)=>lcm(a,b),1)}
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function playSound(type){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;window._audio=window._audio||new C();const c=window._audio;if(c.state==='suspended')c.resume();const o=c.createOscillator(),g=c.createGain(),n=c.currentTime;o.connect(g);g.connect(c.destination);if(type==='move'){o.type='triangle';o.frequency.setValueAtTime(600,n);o.frequency.exponentialRampToValueAtTime(200,n+.05);g.gain.setValueAtTime(.18,n);g.gain.exponentialRampToValueAtTime(.01,n+.05);o.start(n);o.stop(n+.05)}else if(type==='correct'){o.type='sine';o.frequency.setValueAtTime(659.25,n);o.frequency.setValueAtTime(784,n+.16);g.gain.setValueAtTime(.2,n);g.gain.exponentialRampToValueAtTime(.01,n+.55);o.start(n);o.stop(n+.55)}else{o.type='sawtooth';o.frequency.setValueAtTime(280,n);o.frequency.exponentialRampToValueAtTime(140,n+.25);g.gain.setValueAtTime(.12,n);g.gain.exponentialRampToValueAtTime(.01,n+.25);o.start(n);o.stop(n+.25)}}
function toggleLevel(){if(running)return;level=level==='basic'?'advanced':'basic';document.body.dataset.level=level;$('levelToggle').setAttribute('aria-checked',String(level==='advanced'));$('startBtn').textContent=mode==='exam'?'開始 10 分鐘測驗':'開始練習'}
function selectKind(v){if(running)return;kind=v;document.querySelectorAll('[data-kind]').forEach(b=>b.classList.toggle('active',b.dataset.kind===v))}
function selectCount(v){if(running)return;termCount=v;document.querySelectorAll('[data-count]').forEach(b=>b.classList.toggle('active',Number(b.dataset.count)===v))}
function selectMode(v){if(running)return;mode=v;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===v));$('startBtn').textContent=v==='exam'?'開始 10 分鐘測驗':'開始練習'}
function makeOps(count){if(count===2)return[Math.random()<.5?'+':'-'];return[['+','+'],['+','-'],['-','+'],['-','-']][rnd(0,3)]}
function makeFractionProblem(problemKind,count){for(let attempt=0;attempt<2000;attempt++){const ops=makeOps(count);let denoms=[];if(problemKind==='same'){const d=rnd(3,12);denoms=Array(count).fill(d)}else{denoms=Array.from({length:count},()=>rnd(2,12));if(new Set(denoms).size===1)continue}const common=lcmAll(denoms);if(common>60)continue;const nums=denoms.map(d=>rnd(1,d-1));const scaled=nums.map((n,i)=>n*(common/denoms[i]));let current=scaled[0],valid=true;for(let i=0;i<ops.length;i++){current=ops[i]==='+'?current+scaled[i+1]:current-scaled[i+1];if(current<=0){valid=false;break}}if(valid)return{kind:problemKind,ops,terms:nums.map((num,i)=>({num,den:denoms[i]})),common,scaled,answerNum:current,answerDen:common}}return makeFractionProblem(problemKind,count)}
function makeMixedProblem(count){for(let attempt=0;attempt<4000;attempt++){const ops=makeOps(count),unlike=Math.random()<.55;let denoms;if(unlike){denoms=Array.from({length:count},()=>rnd(2,12));if(new Set(denoms).size===1)continue}else denoms=Array(count).fill(rnd(3,12));const common=lcmAll(denoms);if(common>60)continue;const terms=denoms.map(d=>({whole:rnd(1,7),num:rnd(1,d-1),den:d}));const scaled=terms.map((t,i)=>t.num*(common/denoms[i]));let current={whole:terms[0].whole,num:scaled[0]},valid=true,borrowCount=0;const calc=[];for(let i=0;i<ops.length;i++){const right={whole:terms[i+1].whole,num:scaled[i+1]},op=ops[i],before={...current};let borrowed=null,carried=null,result;if(op==='+'){const whole=current.whole+right.whole,num=current.num+right.num;if(num>=common){carried={whole,num};result={whole:whole+1,num:num-common}}else result={whole,num}}else{let whole=current.whole-right.whole,num=current.num-right.num;if(num<0){borrowed={whole:current.whole-1,num:current.num+common};whole--;num+=common;borrowCount++}if(whole<0||num<=0){valid=false;break}result={whole,num}}if(result.num<=0){valid=false;break}calc.push({before,right,op,borrowed,carried,result});current=result}if(valid&&current.num>0&&(!(ops.includes('-'))||borrowCount>0||Math.random()<.35))return{kind:'mixed',ops,terms,common,scaled,unlike:new Set(denoms).size>1,calc,answerWhole:current.whole,answerNum:current.num,answerDen:common}}return makeMixedProblem(count)}
function generateProblem(){return kind==='mixed'?makeMixedProblem(termCount):makeFractionProblem(kind,termCount)}
function frac(top,bottom){return`<span class="fraction"><span class="top">${top}</span><span class="bottom">${bottom}</span></span>`}
function mixed(whole,num,den){return`<span class="mixed-number"><span>${whole}</span>${frac(num,den)}</span>`}
function expressionMarkup(p){let h=p.kind==='mixed'?mixed(p.terms[0].whole,p.terms[0].num,p.terms[0].den):frac(p.terms[0].num,p.terms[0].den);for(let i=0;i<p.ops.length;i++){const t=p.terms[i+1];h+=`<span class="operator">${p.ops[i]==='+'?'+':'−'}</span>${p.kind==='mixed'?mixed(t.whole,t.num,t.den):frac(t.num,t.den)}`}return h+'<span class="operator">＝</span><span>？</span>'}
function addTask(answer,label,group){const id=tasks.length;tasks.push({answer:Number(answer),label,group});return`<span class="blank locked" id="task-${id}" data-task="${id}" aria-label="${label}"></span>`}
function expansionMarkup(p){let h='';p.terms.forEach((t,i)=>{const den=addTask(p.common,`第 ${i+1} 個分數擴分後的分母`,'expansion'),num=addTask(p.scaled[i],`第 ${i+1} 個分數擴分後的分子`,'expansion');if(i)h+=`<span class="operator">${p.ops[i-1]==='+'?'+':'−'}</span>`;const original=p.kind==='mixed'?mixed(t.whole,t.num,t.den):frac(t.num,t.den),expanded=p.kind==='mixed'?mixed(t.whole,num,den):frac(num,den);h+=`${original}<span>＝</span>${expanded}`});return h}
function renderQuestion(){tasks=[];taskIndex=0;buffer='';reduction=null;$('reductionZone').innerHTML='';$('problem').innerHTML=expressionMarkup(question);$('mixedReminder').classList.toggle('hidden',question.kind!=='mixed');let h='';if((question.kind==='unlike')||(question.kind==='mixed'&&question.unlike)){const lcmBlank=addTask(question.common,'最小公倍數','lcm');h+=`<section class="step-card" data-group="lcm"><div class="step-title">① 先找共同分母</div><div class="equation">分母的最小公倍數是 ${lcmBlank}</div></section>`;h+=`<section class="step-card locked" data-group="expansion"><div class="step-title">② 把每個分數擴成相同分母</div><div class="equation">${expansionMarkup(question)}</div></section>`}
  if(question.kind!=='mixed'){const den=addTask(question.answerDen,'答案的分母','answer'),num=addTask(question.answerNum,'答案的分子','answer');h+=`<section class="step-card locked" data-group="answer"><div class="step-title">${question.kind==='same'?'先填分母，再算分子':'最後把分子加減起來'}</div><div class="equation">答案是 ${frac(num,den)}</div></section>`}else{question.calc.forEach((step,i)=>{const borrowGroup=`borrow-${i}`,resultGroup=`result-${i}`,carryGroup=`carry-${i}`;if(step.borrowed){const bw=addTask(step.borrowed.whole,`第 ${i+1} 步借 1 後的整數`,borrowGroup),bd=addTask(question.common,`第 ${i+1} 步借 1 後的分母`,borrowGroup),bn=addTask(step.borrowed.num,`第 ${i+1} 步借 1 後的分子`,borrowGroup);h+=`<section class="step-card borrow-card locked" data-group="${borrowGroup}"><div class="step-title">第 ${i+1} 步：分數不夠減，先向整數借 1</div><div class="equation borrow-arrow">${mixed(step.before.whole,step.before.num,question.common)}<span>→</span>${mixed(bw,bn,bd)}</div></section>`}const shown=step.carried||step.result,rw=addTask(shown.whole,`第 ${i+1} 步答案的整數`,resultGroup),rd=addTask(question.common,`第 ${i+1} 步答案的分母`,resultGroup),rn=addTask(shown.num,`第 ${i+1} 步答案的分子`,resultGroup);const left=step.borrowed?mixed(step.borrowed.whole,step.borrowed.num,question.common):mixed(step.before.whole,step.before.num,question.common);h+=`<section class="step-card locked" data-group="${resultGroup}"><div class="step-title">第 ${i+1} 步：先填整數，再填分數</div><div class="equation">${left}<span class="operator">${step.op==='+'?'+':'−'}</span>${mixed(step.right.whole,step.right.num,question.common)}<span>＝</span>${mixed(rw,rn,rd)}</div></section>`;if(step.carried){const cw=addTask(step.result.whole,`第 ${i+1} 步進 1 後的整數`,carryGroup),cd=addTask(question.common,`第 ${i+1} 步進 1 後的分母`,carryGroup),cn=addTask(step.result.num,`第 ${i+1} 步進 1 後的分子`,carryGroup);h+=`<section class="step-card carry-card locked" data-group="${carryGroup}"><div class="step-title">第 ${i+1} 步：分數滿 1，向整數進 1</div><div class="equation">${mixed(step.carried.whole,step.carried.num,question.common)}<span>→</span>${mixed(cw,cn,cd)}</div></section>`}})}$('steps').innerHTML=h;activateTask()}
function activateTask(){document.querySelectorAll('.blank.active').forEach(el=>el.classList.remove('active'));if(taskIndex>=tasks.length){finishBaseAnswer();return}const task=tasks[taskIndex],el=$(`task-${taskIndex}`);document.querySelectorAll(`[data-group="${task.group}"]`).forEach(card=>card.classList.remove('locked'));el.classList.remove('locked');el.classList.add('active');$('entryHint').textContent=`請填：${task.label}`}
function activeBlank(){if(reduction&&reduction.stage)return $(reduction.stage==='num'?'reduce-num':'reduce-den');return $(`task-${taskIndex}`)}
function inputDigit(d){if(locked||!running)return;playSound('move');if(buffer==='0')buffer=String(d);else if(buffer.length<4)buffer+=String(d);const el=activeBlank();if(el)el.textContent=buffer}
function eraseDigit(){if(locked||!running)return;playSound('move');buffer=buffer.slice(0,-1);const el=activeBlank();if(el)el.textContent=buffer}
function submitEntry(){if(locked||!running||buffer===''){wrong('先輸入數字，再按確認。');return}if(reduction&&reduction.stage){submitReductionEntry();return}const task=tasks[taskIndex],el=$(`task-${taskIndex}`);if(Number(buffer)!==task.answer){wrong(`${task.label}再算一次。`,el);return}el.textContent=buffer;el.classList.remove('active');el.classList.add('done');taskIndex++;buffer='';playSound('correct');activateTask()}
function finishBaseAnswer(){locked=true;const label=question.kind==='mixed'?mixed(question.answerWhole,question.answerNum,question.answerDen):frac(question.answerNum,question.answerDen);$('entryHint').innerHTML=`基礎版答案完成：${label}`;if(level==='advanced'){reduction={num:question.answerNum,den:question.answerDen,round:0,stage:null,nextNum:null};setTimeout(askReducible,350)}else completeQuestion()}
function askReducible(){locked=true;$('modalFraction').innerHTML=frac(reduction.num,reduction.den);$('reduceModal').classList.remove('hidden')}
function answerReducible(saysYes){const can=gcd(reduction.num,reduction.den)>1;if(saysYes!==can){wrong(saysYes?'再檢查一次：它可能已經最簡了。':'還有大於 1 的公因數喔。',$('reduceModal').querySelector('.modal-card'));return}$('reduceModal').classList.add('hidden');if(!saysYes){playSound('correct');completeQuestion();return}playSound('correct');appendReductionRow()}
function appendReductionRow(){reduction.round++;reduction.stage='num';reduction.nextNum=null;buffer='';const card=document.createElement('section');card.className='step-card reduction-card';card.id=`reduction-${reduction.round}`;card.innerHTML=`<div class="step-title">第 ${reduction.round} 次約分</div><div class="equation">${frac(reduction.num,reduction.den)}<span>＝</span>${frac('<span class="blank active" id="reduce-num"></span>','<span class="blank locked" id="reduce-den"></span>')}</div>`;$('reductionZone').appendChild(card);locked=false;$('entryHint').textContent='請填：約分後的分子'}
function submitReductionEntry(){const value=Number(buffer);if(reduction.stage==='num'){if(value<=0){wrong('約分後的分子必須大於 0。',$('reduce-num'));return}reduction.nextNum=value;$('reduce-num').textContent=buffer;$('reduce-num').classList.remove('active');$('reduce-num').classList.add('done');$('reduce-den').classList.remove('locked');$('reduce-den').classList.add('active');reduction.stage='den';buffer='';playSound('correct');$('entryHint').textContent='請填：約分後的分母';return}const oldNum=reduction.num,oldDen=reduction.den,newNum=reduction.nextNum,newDen=value;const sameFactor=newDen>0&&oldNum%newNum===0&&oldDen%newDen===0&&oldNum/newNum===oldDen/newDen&&newNum<oldNum&&newDen<oldDen;if(!sameFactor){wrong('分子、分母要同除以一個大於 1 的整數。',$(`reduction-${reduction.round}`));$('reduce-num').textContent='';$('reduce-num').className='blank active';$('reduce-den').textContent='';$('reduce-den').className='blank locked';reduction.stage='num';reduction.nextNum=null;buffer='';$('entryHint').textContent='請重新填：約分後的分子';return}$('reduce-den').textContent=buffer;$('reduce-den').classList.remove('active');$('reduce-den').classList.add('done');reduction.num=newNum;reduction.den=newDen;reduction.stage=null;buffer='';locked=true;playSound('correct');setTimeout(askReducible,350)}
function wrong(message,target){mistakes++;playSound('wrong');if(mode==='exam')$('points').textContent=`${Math.max(0,10-mistakes)} 分`;toast(message,'bad');if(target){target.classList.remove('shake');void target.offsetWidth;target.classList.add('shake')}}
function toast(message,type){const old=$('work').querySelector('.toast');if(old)old.remove();const t=document.createElement('div');t.className=`toast ${type}`;t.textContent=message;$('work').appendChild(t);setTimeout(()=>t.remove(),1250)}
function startGame(){clearInterval(timerId);running=true;locked=false;qIndex=0;totalScore=0;timeLeft=EXAM_SECONDS;document.body.classList.add('playing');$('config').classList.add('config-locked');$('startBtn').classList.add('hidden');$('welcome').classList.add('hidden');$('workspace').classList.remove('hidden');$('gameControls').classList.remove('hidden');$('end').classList.add('hidden');if(mode==='exam')timerId=setInterval(tick,1000);loadQuestion()}
function loadQuestion(){question=generateProblem();mistakes=0;locked=false;$('progress').textContent=mode==='exam'?`${qIndex+1} / ${EXAM_QUESTIONS}`:`第 ${qIndex+1} 題`;$('points').textContent=mode==='exam'?'10 分':'—';$('timer').textContent=mode==='exam'?formatTime(timeLeft):'不限時';$('timerFill').style.width=mode==='exam'?`${timeLeft/EXAM_SECONDS*100}%`:'100%';renderQuestion()}
function completeQuestion(){locked=true;playSound('correct');if(mode==='exam')totalScore+=Math.max(0,10-mistakes);toast(level==='advanced'?'最簡答案完成！':'基礎答案完成！','ok');setTimeout(()=>{qIndex++;if(mode==='exam'&&qIndex>=EXAM_QUESTIONS)finishExam(false);else loadQuestion()},750)}
function tick(){timeLeft=Math.max(0,timeLeft-1);$('timer').textContent=formatTime(timeLeft);$('timerFill').style.width=`${timeLeft/EXAM_SECONDS*100}%`;if(timeLeft===0)finishExam(true)}
function formatTime(seconds){return`${Math.floor(seconds/60)}:${String(seconds%60).padStart(2,'0')}`}
function finishExam(timedOut){clearInterval(timerId);locked=true;running=false;$('reduceModal').classList.add('hidden');$('finalScore').textContent=`${totalScore} 分`;$('endTitle').textContent=timedOut?'時間到！':'測驗完成！';$('endText').textContent=`完成 ${qIndex} 題；每次填錯或判斷錯誤扣 1 分。`;$('end').classList.remove('hidden')}
function backToMenu(){clearInterval(timerId);running=false;locked=false;document.body.classList.remove('playing');$('config').classList.remove('config-locked');$('startBtn').classList.remove('hidden');$('gameControls').classList.add('hidden');$('workspace').classList.add('hidden');$('end').classList.add('hidden');$('welcome').classList.remove('hidden');$('reduceModal').classList.add('hidden')}
</script>
