    @media(max-width:760px){.mode-grid{grid-template-columns:1fr;gap:12px}.mode-card{min-height:92px}.game-title{margin-bottom:22px}.table-grid{grid-template-columns:repeat(2,1fr)}.practice-work,.single-layout{grid-template-columns:1fr}.practice-screen,.single-screen{overflow:auto}.equation-list{grid-template-columns:repeat(2,1fr)}.single-top{padding-left:0;padding-top:42px}.keypad-panel{min-height:390px}.pk-screen{overflow:auto}.player{min-height:410px;grid-template-columns:1fr minmax(170px,230px);padding:8px}.pk-keypad .numpad{gap:5px}.pk-keypad .numpad button{min-height:34px}.nav-cluster{top:8px;left:8px}.nav-btn{min-height:37px;padding:5px 9px;font-size:.83rem}}
    @media(max-width:430px){.equation-list{grid-template-columns:1fr 1fr}.sheet{padding:14px 10px}.equation-row{min-height:56px;font-size:1.1rem}.digit-slot{width:26px;height:34px}.player{grid-template-columns:1fr 150px}.pk-question{font-size:2.25rem}.pk-keypad .numpad button{font-size:.9rem}.pk-center{font-size:.82rem}}
    .mode-grid{grid-template-columns:repeat(2,1fr)}
    .mode-practice{grid-column:1/-1}
    .equation-list{grid-template-columns:1fr}
    @media(max-width:760px){.mode-grid{grid-template-columns:1fr}.equation-list{grid-template-columns:1fr}}
    @media(max-width:760px){
      .practice-screen.practice-active{padding:68px 10px 0;overflow:hidden;align-items:stretch}
      .practice-screen.practice-active .practice-work{position:relative;display:block;width:100%;height:100%;min-height:0}

      .practice-screen.practice-active .sheet-head{position:sticky;top:-14px;z-index:2;margin-bottom:10px;padding:8px 0 10px;background:#fff}

      .practice-screen.practice-active .keypad-title{display:none}

<body>
<div id="app">
  <div class="nav-cluster">
    <a class="nav-btn" href="../index.html">← 回主選單</a>
    <button class="nav-btn hidden" id="modeBack" onclick="returnToModeMenu()">↩ 返回模式選擇</button>
  </div>

  <div class="countdown" id="countdown"><div class="countdown-label" id="countdownLabel">準備開始</div><div class="countdown-number" id="countdownNumber">3</div></div>

  <section class="screen mode-screen" id="modeScreen">
    <div class="game-title">🦔 九九乘法試煉<br><small>二年級</small></div>
    <div class="mode-grid">
      <button class="mode-card mode-practice" onclick="openPractice()">🌱 練習模式<span>選一組，從 ×1 練到 ×9</span></button>
      <button class="mode-card mode-single" onclick="startSinglePlayer()">👤 單人模式<span>每題 6 秒，前 1.5 秒答對得 5 分</span></button>
      <button class="mode-card mode-pk" onclick="showPKSetup()">⚔️ 雙人 PK<span>率先取得 300 分</span></button>
    </div>
  </section>

  <section class="screen practice-screen" id="practiceScreen">
    <div id="practicePicker">
      <h1 class="section-title">選一組乘法表</h1>
      <div class="table-grid" id="tableGrid"></div>
    </div>
    <div class="practice-work hidden" id="practiceWork">
      <div class="sheet">
        <div class="sheet-head"><h2 id="practiceTitle">2 的乘法表</h2><button class="secondary-btn" onclick="showPracticePicker()">← 選其他組</button></div>
        <div class="equation-list" id="equationList"></div>
        <div class="practice-message" id="practiceMessage"></div>
      </div>
      <div class="keypad-panel">
        <div class="keypad-title">依序填入答案</div>
        <div class="answer-display" id="practiceDisplay">—</div>
        <div class="numpad" id="practiceNumpad"></div>
      </div>
    </div>
  </section>

  <section class="screen single-screen" id="singleScreen">
    <div class="single-top"><div class="score"><span id="singleScore">0.0</span> 分 <span class="streak" id="singleStreak"></span></div><div class="progress" id="singleProgress">0 / 20</div></div>
    <div class="single-layout">
      <div class="single-card">
        <div class="question" id="singleQuestion">? × ? =</div>
        <div class="timer-line"><div class="timer-text" id="singleTimerText">6.0s</div><div class="timer-track"><div class="timer-bar" id="singleTimerBar"></div></div></div>
        <div class="feedback" id="singleFeedback">準備開始……</div>
      </div>
      <div class="keypad-panel">
        <div class="keypad-title">輸入答案</div>
        <div class="answer-display" id="singleDisplay">—</div>
        <div class="numpad" id="singleNumpad"></div>
      </div>
    </div>
    <div class="end-overlay" id="singleEnd"><h2>試煉完成！</h2><strong id="singleFinalScore">0.0</strong><p id="singleComment"></p><div class="end-actions"><button class="primary-btn" onclick="startSinglePlayer()">再玩一次</button><button class="secondary-btn" onclick="returnToModeMenu()">返回模式選擇</button></div></div>
  </section>

  <section class="screen pk-setup" id="pkSetup">
    <div class="pk-start-wrap"><button class="pk-start" onclick="startPKGame()">開始對戰 ⚔️</button></div>
    <div class="setup-half setup-top"><b>Player 1 選角色（上方）</b><div class="avatar-grid" id="avatarTop"></div></div>
    <div class="setup-half setup-bottom"><b>Player 2 選角色（下方）</b><div class="avatar-grid" id="avatarBottom"></div></div>
  </section>

  <section class="screen pk-screen" id="pkScreen">
    <div class="player top" id="playerTop">
      <div class="player-main"><div class="player-score"><span id="avatarTopDisplay">🦊</span> <span id="scoreTop">0</span> <span class="streak" id="streakTop"></span></div><div class="pk-question" id="questionTop">? × ? =</div><div class="pk-answer" id="answerTop">—</div><div class="pk-feedback" id="feedbackTop"></div><div class="pk-end" id="endTop"><div class="emoji">🏆</div><div class="title">Winner</div></div></div>
      <div class="keypad-panel pk-keypad"><div class="numpad" id="numpadTop"></div></div>
    </div>
    <div class="pk-center" id="pkStatus">搶答開始！率先 300 分獲勝</div>
    <div class="player bottom" id="playerBottom">
      <div class="player-main"><div class="player-score"><span id="avatarBottomDisplay">🐰</span> <span id="scoreBottom">0</span> <span class="streak" id="streakBottom"></span></div><div class="pk-question" id="questionBottom">? × ? =</div><div class="pk-answer" id="answerBottom">—</div><div class="pk-feedback" id="feedbackBottom"></div><div class="pk-end" id="endBottom"><div class="emoji">🏆</div><div class="title">Winner</div></div></div>
      <div class="keypad-panel pk-keypad"><div class="numpad" id="numpadBottom"></div></div>
    </div>
  </section>
</div>

<script>
const $=id=>document.getElementById(id),FACTS=Array.from({length:8},(_,i)=>i+2).flatMap(a=>Array.from({length:9},(_,j)=>({a,b:j+1,answer:a*(j+1)}))),SP_TOTAL_Q=20,SP_TIME_LIMIT=6000,SP_FULL_SCORE_TIME=1500,PK_WIN_SCORE=300;
let audioCtx=null,countdownTimer=null,practiceTimeout=null,singleTimerFrame=null,singleTimeout=null,pkTimeout=null;
function initAudio(){try{const C=window.AudioContext||window.webkitAudioContext;if(C&&!audioCtx)audioCtx=new C();if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume()}catch(e){console.log(e)}}
function playSound(type){try{if(!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain(),n=audioCtx.currentTime;o.connect(g);g.connect(audioCtx.destination);if(type==='correct'){o.type='sine';o.frequency.setValueAtTime(659.25,n);o.frequency.setValueAtTime(523.25,n+.2);g.gain.setValueAtTime(.28,n);g.gain.exponentialRampToValueAtTime(.01,n+.7);o.start(n);o.stop(n+.7)}else if(type==='wrong'){o.type='sawtooth';o.frequency.setValueAtTime(300,n);o.frequency.exponentialRampToValueAtTime(150,n+.3);g.gain.setValueAtTime(.14,n);g.gain.exponentialRampToValueAtTime(.01,n+.3);o.start(n);o.stop(n+.3)}else{o.type='triangle';o.frequency.setValueAtTime(800,n);g.gain.setValueAtTime(.18,n);g.gain.exponentialRampToValueAtTime(.01,n+.1);o.start(n);o.stop(n+.1)}}catch(e){console.log(e)}}
function shuffle(list){const a=[...list];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function clearSchedules(){if(singleTimerFrame)cancelAnimationFrame(singleTimerFrame);singleTimerFrame=null;if(countdownTimer)clearInterval(countdownTimer);countdownTimer=null;if(practiceTimeout)clearTimeout(practiceTimeout);practiceTimeout=null;if(singleTimeout)clearTimeout(singleTimeout);singleTimeout=null;if(pkTimeout)clearTimeout(pkTimeout);pkTimeout=null;$('countdown').style.display='none'}
function hideScreens(){document.querySelectorAll('.screen').forEach(s=>s.style.display='none')}
function showScreen(id,display='flex'){hideScreens();$(id).style.display=display;$('modeBack').classList.toggle('hidden',id==='modeScreen')}
function returnToModeMenu(){clearSchedules();singleProcessing=true;pkState='idle';showScreen('modeScreen')}
function runCountdown(label,done){clearInterval(countdownTimer);$('countdownLabel').textContent=label;$('countdownNumber').textContent='3';$('countdown').style.display='flex';let n=3;playSound('tick');countdownTimer=setInterval(()=>{n--;if(n>0){$('countdownNumber').textContent=n;playSound('tick')}else{clearInterval(countdownTimer);countdownTimer=null;$('countdown').style.display='none';done()}},1000)}
function makeNumpad(id,onDigit,onClear,onConfirm,needsConfirm=true){const el=$(id);el.innerHTML='';[7,8,9,4,5,6,1,2,3,0].forEach(n=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>onDigit(n);el.appendChild(b)});const clear=document.createElement('button');clear.className='clear';clear.textContent='清除';clear.onclick=onClear;el.appendChild(clear);if(needsConfirm){const ok=document.createElement('button');ok.className='confirm';ok.textContent='確認';ok.onclick=onConfirm;el.appendChild(ok)}}

let practiceBase=2,practiceFactor=1,practiceBuffer='';
function openPractice(){initAudio();clearSchedules();showScreen('practiceScreen');showPracticePicker()}
function showPracticePicker(){if(practiceTimeout)clearTimeout(practiceTimeout);practiceTimeout=null;$('practiceScreen').classList.remove('practice-active');$('practiceDisplay').className='answer-display';$('practicePicker').classList.remove('hidden');$('practiceWork').classList.add('hidden')}
function startPracticeTable(base){if(practiceTimeout)clearTimeout(practiceTimeout);practiceTimeout=null;practiceBase=base;practiceFactor=1;practiceBuffer='';$('practiceScreen').classList.add('practice-active');$('practiceDisplay').className='answer-display';$('practicePicker').classList.add('hidden');$('practiceWork').classList.remove('hidden');$('practiceTitle').textContent=`${base} 的乘法表`;$('practiceMessage').textContent='從第 1 題開始，一格一格填入答案。';renderPracticeRows();updatePracticeDisplay()}
function renderPracticeRows(){let html='';for(let factor=1;factor<=9;factor++){const answer=practiceBase*factor,slots=String(answer).length;html+=`<div class="equation-row ${factor<practiceFactor?'done':factor===practiceFactor?'active':''}" id="practiceRow${factor}"><span>${practiceBase} × ${factor} =</span><span class="digit-slots">${Array.from({length:slots},(_,i)=>`<span class="digit-slot" id="practiceSlot${factor}-${i}">${factor<practiceFactor?String(answer)[i]:''}</span>`).join('')}</span></div>`}$('equationList').innerHTML=html;renderPracticeBuffer();const active=$(`practiceRow${practiceFactor}`);if(active)requestAnimationFrame(()=>active.scrollIntoView({block:'nearest',behavior:'smooth'}))}
function renderPracticeBuffer(){if(practiceFactor>9)return;const chars=practiceBuffer.split('');chars.forEach((c,i)=>{const slot=$(`practiceSlot${practiceFactor}-${i}`);if(slot)slot.textContent=c})}
function updatePracticeDisplay(){$('practiceDisplay').textContent=practiceFactor>9?'完成！':practiceBuffer||'—'}
function practiceDigit(d){if(practiceFactor>9||practiceTimeout)return;const expected=String(practiceBase*practiceFactor);if(practiceBuffer.length>=expected.length)return;practiceBuffer+=d;renderPracticeBuffer();updatePracticeDisplay();if(practiceBuffer.length===expected.length){if(practiceBuffer===expected){playSound('correct');$('practiceMessage').textContent=`答對了！${practiceBase} × ${practiceFactor} = ${expected}`;practiceFactor++;practiceBuffer='';if(practiceFactor>9){$('practiceMessage').textContent=`🎉 ${practiceBase} 的乘法表全部完成！`;renderPracticeRows();updatePracticeDisplay()}else{renderPracticeRows();updatePracticeDisplay()}}else{playSound('wrong');$('practiceMessage').textContent='這一題再想一想。';$('practiceDisplay').classList.add('wrong');practiceTimeout=setTimeout(()=>{practiceTimeout=null;$('practiceDisplay').classList.remove('wrong');practiceBuffer='';renderPracticeRows();updatePracticeDisplay()},450)}}}
function practiceClear(){if(practiceFactor>9)return;practiceBuffer='';renderPracticeRows();updatePracticeDisplay()}

let singleQuestions=[],singleIndex=0,singleScore=0,singleStreak=0,singleBuffer='',singleStartTime=0,singleProcessing=true,singleCurrent=null;
function startSinglePlayer(){initAudio();clearSchedules();showScreen('singleScreen');$('singleEnd').style.display='none';singleQuestions=shuffle(FACTS).slice(0,SP_TOTAL_Q);singleIndex=0;singleScore=0;singleStreak=0;singleBuffer='';singleProcessing=true;$('singleScore').textContent='0.0';$('singleStreak').textContent='';$('singleProgress').textContent=`0 / ${SP_TOTAL_Q}`;$('singleQuestion').textContent='? × ? =';$('singleFeedback').textContent='準備開始……';updateSingleDisplay();runCountdown('準備挑戰！',loadSingleQuestion)}
function loadSingleQuestion(){if(singleIndex>=SP_TOTAL_Q)return showSingleEnd();singleProcessing=false;singleCurrent=singleQuestions[singleIndex];singleBuffer='';$('singleQuestion').textContent=`${singleCurrent.a} × ${singleCurrent.b} =`;$('singleProgress').textContent=`${singleIndex+1} / ${SP_TOTAL_Q}`;$('singleFeedback').textContent='';$('singleTimerBar').style.width='100%';$('singleTimerBar').style.background='#43a047';updateSingleDisplay();singleStartTime=performance.now();updateSingleTimer()}
function updateSingleTimer(){if(singleProcessing)return;const dt=performance.now()-singleStartTime,remain=Math.max(0,SP_TIME_LIMIT-dt),pct=remain/SP_TIME_LIMIT*100;$('singleTimerText').textContent=`${(remain/1000).toFixed(1)}s`;$('singleTimerBar').style.width=`${pct}%`;$('singleTimerBar').style.background=remain<=1500?'#ef5350':dt>SP_FULL_SCORE_TIME?'#f59e0b':'#43a047';if(dt>=SP_TIME_LIMIT)handleSingleTimeout();else singleTimerFrame=requestAnimationFrame(updateSingleTimer)}
function calculateSinglePoints(dt){const pts=dt<=SP_FULL_SCORE_TIME?5:5-((dt-SP_FULL_SCORE_TIME)/(SP_TIME_LIMIT-SP_FULL_SCORE_TIME))*4.9;return Math.max(.1,Math.round(pts*10)/10)}
function updateSingleDisplay(){$('singleDisplay').textContent=singleBuffer||'—'}
function singleDigit(d){if(singleProcessing||singleBuffer.length>=2)return;singleBuffer+=d;updateSingleDisplay()}
function singleClear(){if(singleProcessing)return;singleBuffer='';updateSingleDisplay()}
function handleSingleTimeout(){if(singleProcessing)return;singleProcessing=true;singleStreak=0;playSound('wrong');$('singleFeedback').textContent=`⏰ 時間到！答案是 ${singleCurrent.answer}（+0.0）`;$('singleFeedback').style.color='#ef5350';finishSingleQuestion()}
function submitSingle(){if(singleProcessing||!singleBuffer)return;singleProcessing=true;if(singleTimerFrame)cancelAnimationFrame(singleTimerFrame);const dt=performance.now()-singleStartTime;if(Number(singleBuffer)===singleCurrent.answer){const pts=calculateSinglePoints(dt);singleScore+=pts;singleStreak++;playSound('correct');$('singleDisplay').classList.add('correct');$('singleFeedback').textContent=singleStreak>=3?`🔥 ${singleStreak} 連對！（+${pts.toFixed(1)}）`:`⭕ 答對了！（+${pts.toFixed(1)}）`;$('singleFeedback').style.color='#43a047'}else{singleStreak=0;playSound('wrong');$('singleDisplay').classList.add('wrong');$('singleFeedback').textContent=`❌ 答錯了，答案是 ${singleCurrent.answer}（+0.0）`;$('singleFeedback').style.color='#ef5350'}finishSingleQuestion()}
function finishSingleQuestion(){$('singleScore').textContent=singleScore.toFixed(1);$('singleStreak').textContent=singleStreak>=3?`🔥 ${singleStreak} 連對`:'';singleIndex++;singleTimeout=setTimeout(()=>{$('singleDisplay').className='answer-display';loadSingleQuestion()},1200)}
function showSingleEnd(){singleProcessing=true;$('singleFinalScore').textContent=singleScore.toFixed(1);$('singleComment').textContent=singleScore>=95?'神反應！你是真正的九九乘法大師！🏆':singleScore>=75?'非常優秀！速度與準度兼具！😎':singleScore>=50?'及格過關！反應可以再快一點！👍':'再接再厲，把九九乘法表練熟再挑戰！💪';$('singleEnd').style.display='flex'}

const avatars=['🦊','🐰','🦁','🐯','🐹','🐨','🐼','🐵'];let avatarTop='🦊',avatarBottom='🐰',pkScores={top:0,bottom:0},pkStreaks={top:0,bottom:0},pkBuffers={top:'',bottom:''},pkPool=[],pkCurrent=null,pkProcessing=false,pkState='idle';
function renderAvatars(id,player){const el=$(id);el.innerHTML='';avatars.forEach(emoji=>{const b=document.createElement('button');b.className='avatar'+((player==='top'?avatarTop:avatarBottom)===emoji?' selected':'');b.textContent=emoji;b.onclick=()=>{if(player==='top')avatarTop=emoji;else avatarBottom=emoji;renderAvatars(id,player)};el.appendChild(b)})}
function showPKSetup(){initAudio();clearSchedules();pkState='setup';showScreen('pkSetup');renderAvatars('avatarTop','top');renderAvatars('avatarBottom','bottom')}
function startPKGame(){clearSchedules();showScreen('pkScreen');pkScores={top:0,bottom:0};pkStreaks={top:0,bottom:0};pkBuffers={top:'',bottom:''};pkPool=[];pkProcessing=true;pkState='playing';$('avatarTopDisplay').textContent=avatarTop;$('avatarBottomDisplay').textContent=avatarBottom;$('endTop').style.display='none';$('endBottom').style.display='none';updatePKUI();$('questionTop').textContent=$('questionBottom').textContent='? × ? =';$('pkStatus').textContent='準備對決……';runCountdown('準備搶答！',loadPKQuestion)}
function nextPKFact(){if(!pkPool.length)pkPool=shuffle(FACTS);return pkPool.pop()}
function loadPKQuestion(){if(pkState!=='playing')return;pkProcessing=false;pkCurrent=nextPKFact();pkBuffers={top:'',bottom:''};$('questionTop').textContent=$('questionBottom').textContent=`${pkCurrent.a} × ${pkCurrent.b} =`;$('feedbackTop').textContent=$('feedbackBottom').textContent='';$('answerTop').className=$('answerBottom').className='pk-answer';$('pkStatus').textContent='搶答開始！率先 300 分獲勝';updatePKAnswers()}
function updatePKAnswers(){$('answerTop').textContent=pkBuffers.top||'—';$('answerBottom').textContent=pkBuffers.bottom||'—'}
function pkDigit(player,d){if(pkProcessing||pkBuffers[player].length>=2)return;pkBuffers[player]+=d;updatePKAnswers()}
function pkClear(player){if(pkProcessing)return;pkBuffers[player]='';updatePKAnswers()}
function submitPK(player){if(pkProcessing||!pkBuffers[player])return;pkProcessing=true;const opponent=player==='top'?'bottom':'top',correct=Number(pkBuffers[player])===pkCurrent.answer,isCatchingUp=pkScores[opponent]-pkScores[player]>100,display=$(player==='top'?'answerTop':'answerBottom'),feedback=$(player==='top'?'feedbackTop':'feedbackBottom');if(correct){playSound('correct');display.classList.add('correct');let add=10;if(isCatchingUp){add=40;$('pkStatus').textContent='⚡ 逆轉衝刺！+40'}else{pkStreaks[player]++;if(pkStreaks[player]>=3){add=20;$('pkStatus').textContent='🔥 連對加分！'}else $('pkStatus').textContent='⭕ 答對了！'}pkScores[player]+=add;feedback.textContent=`+${add}`}else{playSound('wrong');display.classList.add('wrong');pkStreaks[player]=0;pkScores[player]=Math.max(0,pkScores[player]-10);feedback.textContent=`答案是 ${pkCurrent.answer}`;$('pkStatus').textContent='❌ 答錯了，扣 10 分！'}updatePKUI();if(pkScores[player]>=PK_WIN_SCORE)pkTimeout=setTimeout(()=>showPKEnd(player),900);else pkTimeout=setTimeout(loadPKQuestion,1000)}
function updatePKUI(){$('scoreTop').textContent=pkScores.top;$('scoreBottom').textContent=pkScores.bottom;$('streakTop').textContent=pkStreaks.top>=3?`🔥 ${pkStreaks.top}`:'';$('streakBottom').textContent=pkStreaks.bottom>=3?`🔥 ${pkStreaks.bottom}`:'';$('playerTop').classList.toggle('catchup',pkScores.bottom-pkScores.top>100);$('playerBottom').classList.toggle('catchup',pkScores.top-pkScores.bottom>100)}
function showPKEnd(winner){pkState='ended';const topWin=winner==='top';$('endTop').innerHTML=`<div class="emoji">${topWin?'🏆':'💪'}</div><div class="title">${topWin?'Winner':'Try Again'}</div>`;$('endBottom').innerHTML=`<div class="emoji">${topWin?'💪':'🏆'}</div><div class="title">${topWin?'Try Again':'Winner'}</div>`;$('endTop').style.display=$('endBottom').style.display='flex';$('pkStatus').textContent=`🏆 ${topWin?avatarTop:avatarBottom} 獲勝！返回模式選擇可再開一局`}

for(let n=2;n<=9;n++)$('tableGrid').insertAdjacentHTML('beforeend',`<button class="table-card" onclick="startPracticeTable(${n})">${n}</button>`);
makeNumpad('practiceNumpad',practiceDigit,practiceClear,()=>{},false);
makeNumpad('singleNumpad',singleDigit,singleClear,submitSingle,true);
makeNumpad('numpadTop',d=>pkDigit('top',d),()=>pkClear('top'),()=>submitPK('top'),true);
makeNumpad('numpadBottom',d=>pkDigit('bottom',d),()=>pkClear('bottom'),()=>submitPK('bottom'),true);
showScreen('modeScreen');
</script>
