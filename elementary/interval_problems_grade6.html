<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>鳩特數理｜間隔問題（六年級）</title>
  <link rel="stylesheet" href="elementary_theme.css">
  <link rel="stylesheet" href="paper_practice.css">
  <script src="ratio_questions_grade6.js" defer></script>
  <script src="ratio_input_grade6.js" defer></script>
  <script src="paper_exam_status.js" defer></script>
  <script src="interval_questions_grade6.js" defer></script>
  <script src="interval_problems_grade6.js" defer></script>
  <script src="paper_practice.js" defer></script>
</head>
<body>
<header class="nav-bar"><a href="../index.html" class="back-btn">⬅ 回主選單</a><h1 class="page-title">🦔 間隔問題（六年級）</h1><button type="button" class="mode-trigger" data-open-modes aria-haspopup="dialog" aria-controls="mode-dialog">選擇模式</button></header>
<main class="main-wrapper">
  <section class="panel" id="work-panel" aria-label="作答區">
    <div class="welcome" id="welcome"><h2>先找間隔，再算答案</h2><p>選擇題型開始分步練習。<br>點選想填的格子，用下方固定鍵盤作答。</p><button type="button" class="mode-trigger" data-open-modes aria-haspopup="dialog" aria-controls="mode-dialog">選擇模式，開始練習</button></div>
    <div class="session-bar" id="game-status" hidden><div class="stats-header"><span id="question-number"></span><span id="timer" hidden></span></div><div id="exam-overview" hidden>
      <div class="exam-jump" id="exam-jump" aria-label="測驗題號"></div>
      <div class="exam-tools"><button type="button" class="secondary-btn review-toggle" id="mark-review" aria-pressed="false">標記待檢查</button><span class="exam-status" id="answer-status" aria-live="polite"></span></div>
      <div class="exam-legend" aria-label="題號顏色說明"><span><i class="legend-dot"></i>白色：未作答</span><span><i class="legend-dot partial"></i>淡黃色：部分作答</span><span><i class="legend-dot answered"></i>淡綠色：已填完</span><span><i class="legend-dot flagged"></i>紫色：待檢查</span></div>
      <p class="exam-summary" id="exam-summary"></p>
    </div></div>
    <div id="workspace" hidden><div class="meta"><span id="mode-label"></span><span id="category-label"></span></div><p class="question" id="question-text"></p><div id="steps"></div><button type="button" class="secondary-btn" id="hint-button" aria-expanded="false" aria-controls="hint">看提示與示意圖</button><p class="hint" id="hint" hidden></p><div class="diagram" id="diagram" hidden><div id="diagram-drawing"></div><p class="diagram-caption" id="diagram-caption"></p></div></div>
    <section id="results" hidden aria-label="測驗結果"><h2 id="result-heading">測驗完成</h2><div class="score-display" id="final-score"></div><p id="result-summary"></p><button type="button" class="secondary-btn" id="retry-exam">再測一次</button><div class="review" id="review-list"></div></section>
    <div class="watermark">Presented by Jutor</div>
  </section>
</main>
<footer class="keyboard-dock" id="keyboard-dock" hidden aria-label="固定作答鍵盤">
  <div class="dock-inner">
    <div class="dock-heading"><div class="phase-note" id="phase-note" aria-live="polite"></div><button type="button" class="mode-trigger" data-open-modes aria-haspopup="dialog" aria-controls="mode-dialog">選擇模式</button></div>
    <div class="numpad" id="numpad"><button type="button" class="num-btn" data-key="1">1</button><button type="button" class="num-btn" data-key="2">2</button><button type="button" class="num-btn" data-key="3">3</button><button type="button" class="num-btn" data-key="delete" aria-label="刪除目前格子的一位">⌫</button><button type="button" class="num-btn" data-key="4">4</button><button type="button" class="num-btn" data-key="5">5</button><button type="button" class="num-btn" data-key="6">6</button><button type="button" class="num-btn" data-key="clear">清除</button><button type="button" class="num-btn" data-key="7">7</button><button type="button" class="num-btn" data-key="8">8</button><button type="button" class="num-btn" data-key="9">9</button><button type="button" class="num-btn" data-key="fraction">分數</button><button type="button" class="num-btn" data-key=".">.</button><button type="button" class="num-btn" data-key="0">0</button><button type="button" class="num-btn" data-key="space">帶分數</button><button type="button" class="num-btn" data-key="next">下一格</button></div>
    <div class="dock-actions"><p class="feedback" id="feedback" aria-live="polite"></p><p class="key-hint" id="key-hint">點選整數、分子或分母的格子，便可直接填寫或修改。</p><button type="button" class="primary-action" id="check-answer">確認這一步</button><button type="button" class="primary-action" id="next-question" hidden>下一題</button><div class="minor-actions" id="exam-actions" hidden><button type="button" class="secondary-btn" id="previous-question">上一題</button><button type="button" class="secondary-btn" id="skip-question">先跳過</button><button type="button" class="secondary-btn" id="finish-exam">交卷</button></div></div>
  </div>
</footer>
<dialog class="mode-dialog" id="mode-dialog" aria-labelledby="mode-dialog-title">
  <div class="dialog-heading"><h2 id="mode-dialog-title">選擇模式與題型</h2><button type="button" class="secondary-btn" id="close-modes">返回作答</button></div>
  <h3 class="controls-title">數字難度</h3>
  <div class="difficulty"><label><input type="radio" name="difficulty" value="basic" checked>基礎：整數</label><label><input type="radio" name="difficulty" value="advanced">進階：小數／換算</label></div>
  <h3 class="controls-title">分步練習</h3>
  <div class="menu-grid"><button type="button" class="menu-btn" data-type="index" aria-pressed="false">編號之間的距離</button><button type="button" class="menu-btn" data-type="both" aria-pressed="false">兩端都放</button><button type="button" class="menu-btn" data-type="one" aria-pressed="false">只有一端放</button><button type="button" class="menu-btn" data-type="neither" aria-pressed="false">兩端都不放</button><button type="button" class="menu-btn" data-type="loop" aria-pressed="false">封閉一圈</button><button type="button" class="menu-btn" data-type="mixed" aria-pressed="false">綜合練習</button></div>
  <h3 class="controls-title">測驗模式</h3>
  <button type="button" class="menu-btn" id="start-exam">綜合測驗（10 題）</button>
  <p class="exam-description">五類各 2 題。每題 10 分，限時 10 分鐘，交卷後查看解析。</p>
  <p id="mode-error" role="status"></p>
</dialog>
</body>
</html>
