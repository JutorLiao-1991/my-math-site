<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>鳩特數理｜三位數以內的乘法（四年級）</title>
  <style>
    :root{--pink:#ff7897;--ink:#594a4e;--bg:#faeee7;--line:#efd5dc;--ok:#43a047;--bad:#ef5350;--nav:#594a4ef2}*{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden;font-family:"Segoe UI","Microsoft JhengHei",sans-serif;color:var(--ink);background-color:var(--bg);background-image:linear-gradient(#ff8ba71a 1px,transparent 1px),linear-gradient(90deg,#ff8ba71a 1px,transparent 1px);background-size:20px 20px;touch-action:manipulation;user-select:none}.hidden{display:none!important}button{font:inherit;touch-action:manipulation}.nav{height:58px;padding:9px 18px;background:var(--nav);color:white;display:flex;align-items:center;justify-content:space-between}.nav a{color:#ff9bb1;text-decoration:none;border:1px solid #ff9bb1;padding:6px 14px;border-radius:20px;font-weight:700}.nav h1{font-size:1.15rem;margin:0}.layout{height:calc(100vh - 58px);padding:14px;display:grid;grid-template-columns:minmax(0,1.7fr) minmax(330px,.8fr);gap:14px}.panel{background:white;border-radius:15px;box-shadow:0 4px 18px #594a4e18;min-height:0}.work{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:auto;padding:18px}.problem{font-size:clamp(1.35rem,3vw,2rem);font-weight:800;background:var(--bg);border-radius:14px;padding:10px 22px;margin-bottom:15px}.vertical{display:grid;grid-template-columns:34px repeat(7,clamp(36px,5.5vw,54px));grid-auto-rows:clamp(43px,5.5vw,54px);font-family:"Courier New",monospace;font-size:clamp(1.65rem,4vw,2.5rem);font-weight:800;align-items:center}.cell{height:100%;display:flex;align-items:center;justify-content:center}.operator{font-size:2.1rem}.rule{grid-column:1/-1;border-top:4px solid var(--ink);height:4px}.rule.soft{border-top:2px solid var(--line)}.answer{border:2px dashed var(--line);border-radius:8px;margin:3px;color:var(--pink)}.answer.active{border-style:solid;border-color:var(--pink);box-shadow:0 0 0 4px #ff789722}.answer.done{border-color:transparent;color:var(--ink)}.row-label{font:700 .76rem "Segoe UI";color:#a08d93;writing-mode:vertical-rl}.hint{height:28px;margin-top:15px;font-weight:800;color:#8f7d82}.watermark{position:absolute;right:22px;bottom:14px;color:#ff789726;font:italic 1.2rem Georgia}.controls{padding:17px;display:flex;flex-direction:column;overflow:auto}.label{font-weight:800;margin:4px 0 8px}.modes,.topics{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}.topics{grid-template-columns:1fr 1fr}.choice,.primary{border:2px solid #e4d9dc;background:#f8f5f6;color:#6e6064;border-radius:10px;padding:11px 6px;font-weight:800;cursor:pointer}.choice.active,.primary{background:var(--pink);border-color:var(--pink);color:white}.primary{margin-bottom:12px}.status{background:#fff8fa;border-left:5px solid var(--pink);padding:13px;border-radius:8px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center;font-weight:800}.status small{display:block;color:#9b8b90}.timerbar{height:6px;background:#eadfe2;border-radius:5px;margin:12px 0 18px;overflow:hidden}.timerbar div{height:100%;background:var(--pink);width:100%}.numpad{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:auto}.numpad button{min-height:58px;border:2px solid var(--line);background:white;border-radius:12px;color:var(--ink);font-size:1.45rem;font-weight:800}.numpad button:active{background:var(--pink);color:white}.startbox{text-align:center;margin:auto;color:#97878c;line-height:1.7}.toast{position:absolute;top:18px;left:50%;transform:translateX(-50%);padding:9px 18px;border-radius:20px;color:#fff;font-weight:800;z-index:5}.toast.bad{background:var(--bad)}.toast.ok{background:var(--ok)}.end{position:absolute;inset:0;background:#fffffff4;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;text-align:center}.end strong{font-size:4.5rem;color:var(--pink)}
    @media(max-width:820px){body{height:auto;min-height:100vh;overflow:auto}.layout{height:auto;display:flex;flex-direction:column;padding:9px}.work{min-height:520px}.controls{min-height:410px}.nav h1{font-size:1rem}.vertical{grid-template-columns:29px repeat(7,minmax(32px,48px))}}
    @media(max-width:430px){.nav{padding:8px 10px}.nav a{padding:5px 9px;font-size:.85rem}.layout{gap:9px}.work{min-height:470px;padding:8px}.vertical{grid-template-columns:24px repeat(7,minmax(29px,42px));font-size:1.55rem}.controls{padding:12px}.choice{font-size:.88rem}.numpad button{min-height:52px}}
  </style>
</head>
<body>
<header class="nav"><a href="../index.html">← 回主選單</a><h1>✖️ 三位數以內的乘法（四年級）</h1></header>
<main class="layout"><section class="panel work" id="work"><div class="startbox" id="welcome"><h2>部分積一列一列算</h2><p>乘以十位、百位時，記得向左對齊。</p></div><div id="workspace" class="hidden"><div class="problem" id="problem"></div><div class="vertical" id="vertical"></div><div class="hint" id="hint"></div></div><div class="watermark">Presented by Jutor</div><div class="end hidden" id="end"><h2>測驗完成</h2><strong id="finalScore">0</strong><p id="endText"></p><button class="primary" onclick="restart()">再來一次</button></div></section>
<aside class="panel controls"><div class="label">學習模式</div><div class="modes"><button class="choice active" data-mode="practice" onclick="selectMode('practice')">🌱 練習模式</button><button class="choice" data-mode="exam" onclick="selectMode('exam')">⏱️ 10 分鐘測驗</button></div><div class="label">乘數位數</div><div class="topics"><button class="choice active" data-topic="mixed" onclick="selectTopic('mixed')">綜合</button><button class="choice" data-topic="one" onclick="selectTopic('one')">一位數</button><button class="choice" data-topic="two" onclick="selectTopic('two')">二位數</button><button class="choice" data-topic="three" onclick="selectTopic('three')">三位數</button></div><button class="primary" id="startBtn" onclick="startGame()">開始練習</button><div id="gameControls" class="hidden" style="display:flex;flex-direction:column;flex:1"><div class="status"><div><small>進度</small><span id="progress">第 1 題</span></div><div><small>本題分數</small><span id="points">—</span></div><div><small>剩餘時間</small><span id="timer">不限時</span></div></div><div class="timerbar"><div id="timerFill"></div></div><div class="numpad" id="numpad"></div></div></aside></main>
<script>
const EXAM_SECONDS=10*60,EXAM_QUESTIONS=10,COLS=7;let mode='practice',topic='mixed',questions=[],qIndex=0,question=null,rows=[],targets=[],targetIndex=0,mistakes=0,totalScore=0,timeLeft=EXAM_SECONDS,timerId=null,locked=false;const $=id=>document.getElementById(id);for(let i=1;i<=9;i++)$('numpad').insertAdjacentHTML('beforeend',`<button onclick="inputDigit(${i})">${i}</button>`);$('numpad').insertAdjacentHTML('beforeend','<button onclick="inputDigit(0)">0</button>');
function playSound(type){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;window._audio=window._audio||new C();const c=window._audio;if(c.state==='suspended')c.resume();const o=c.createOscillator(),g=c.createGain(),n=c.currentTime;o.connect(g);g.connect(c.destination);if(type==='move'){o.type='triangle';o.frequency.setValueAtTime(600,n);o.frequency.exponentialRampToValueAtTime(200,n+.05);g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(.2,n+.01);g.gain.exponentialRampToValueAtTime(.01,n+.05);o.start(n);o.stop(n+.05)}else if(type==='correct'){o.type='sine';o.frequency.setValueAtTime(659.25,n);o.frequency.setValueAtTime(523.25,n+.3);g.gain.setValueAtTime(.25,n);g.gain.exponentialRampToValueAtTime(.01,n+.8);o.start(n);o.stop(n+.8)}else{o.type='sawtooth';o.frequency.setValueAtTime(300,n);o.frequency.exponentialRampToValueAtTime(150,n+.3);g.gain.setValueAtTime(.13,n);g.gain.exponentialRampToValueAtTime(.01,n+.3);o.start(n);o.stop(n+.3)}}
function selectMode(v){mode=v;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===v));$('startBtn').textContent=v==='exam'?'開始 10 分鐘測驗':'開始練習'}function selectTopic(v){topic=v;document.querySelectorAll('[data-topic]').forEach(b=>b.classList.toggle('active',b.dataset.topic===v))}function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function makeProblem(kind=topic){if(kind==='mixed')kind=['one','two','three'][rnd(0,2)];let a,b;if(kind==='one'){a=rnd(1000,9999);b=rnd(2,9)}else if(kind==='two'){a=rnd(20,999);b=rnd(12,99)}else{a=rnd(20,999);b=rnd(102,999)}return{kind,a,b,answer:a*b}}
function buildRows(q){const multiplier=String(q.b).split('').reverse().map(Number),r=[];multiplier.forEach((d,shift)=>{if(d!==0)r.push({label:`× ${d}${shift?`（向左 ${shift} 格）`:''}`,value:q.a*d,shift,kind:'partial'})});if(r.length>1)r.push({label:'合計',value:q.answer,shift:0,kind:'total'});return r}
function startGame(){clearInterval(timerId);questions=Array.from({length:mode==='exam'?EXAM_QUESTIONS:1},()=>makeProblem());qIndex=0;totalScore=0;timeLeft=EXAM_SECONDS;$('welcome').classList.add('hidden');$('workspace').classList.remove('hidden');$('gameControls').classList.remove('hidden');$('startBtn').classList.add('hidden');$('end').classList.add('hidden');if(mode==='exam')timerId=setInterval(tick,1000);loadQuestion()}function restart(){startGame()}function tick(){timeLeft--;$('timer').textContent=`${Math.floor(timeLeft/60)}:${String(timeLeft%60).padStart(2,'0')}`;$('timerFill').style.width=`${timeLeft/EXAM_SECONDS*100}%`;if(timeLeft<=0)finishExam()}
function loadQuestion(){question=questions[qIndex]||makeProblem();rows=buildRows(question);targets=[];targetIndex=0;mistakes=0;locked=false;$('problem').textContent=`${question.a.toLocaleString()} × ${question.b.toLocaleString()} = ?`;$('progress').textContent=mode==='exam'?`${qIndex+1} / ${EXAM_QUESTIONS}`:`第 ${qIndex+1} 題`;$('points').textContent=mode==='exam'?'10 分':'—';$('timer').textContent=mode==='exam'?`${Math.floor(timeLeft/60)}:${String(timeLeft%60).padStart(2,'0')}`:'不限時';render();activateTarget()}
function placeStatic(value,operator=''){const s=String(value),pad=COLS-s.length;let h=`<div class="cell operator">${operator}</div>`;for(let i=0;i<COLS;i++)h+=`<div class="cell">${i<pad?'':s[i-pad]}</div>`;return h}
function render(){let h=placeStatic(question.a);h+=placeStatic(question.b,'×');h+='<div class="rule"></div>';rows.forEach((row,ri)=>{const s=String(row.value),start=COLS-row.shift-s.length;h+=`<div class="cell row-label">${row.label}</div>`;for(let c=0;c<COLS;c++){if(c>=start&&c<start+s.length){const pos=c-start,id=`r${ri}c${c}`,expected=Number(s[pos]);h+=`<div class="cell answer" id="${id}"></div>`;targets.push({id,expected,row:ri,col:c})}else h+='<div class="cell"></div>'}if(row.kind==='partial'&&rows.length>1&&ri===rows.length-2)h+='<div class="rule soft"></div>'});$('vertical').innerHTML=h;targets.sort((x,y)=>x.row-y.row||y.col-x.col);$('hint').textContent=rows.length>1?'先完成各列部分積，再算最後答案。':'由右往左完成答案。'}
function activateTarget(){if(targetIndex>=targets.length){completeQuestion();return}const t=targets[targetIndex],el=$(t.id);el.classList.add('active');const row=rows[t.row];$('hint').textContent=row.kind==='total'?'把部分積相加，完成最後答案。':row.label}
function inputDigit(d){if(locked||targetIndex>=targets.length)return;playSound('move');const t=targets[targetIndex];if(d!==t.expected){mistakes++;playSound('wrong');if(mode==='exam')$('points').textContent=`${Math.max(0,10-mistakes)} 分`;toast('這一格再算一次。','bad');return}const el=$(t.id);el.textContent=d;el.classList.remove('active');el.classList.add('done');targetIndex++;activateTarget()}
function toast(msg,type){const t=document.createElement('div');t.className=`toast ${type}`;t.textContent=msg;$('work').appendChild(t);setTimeout(()=>t.remove(),1000)}function completeQuestion(){locked=true;playSound('correct');if(mode==='exam')totalScore+=Math.max(0,10-mistakes);toast('直式完成！','ok');setTimeout(()=>{qIndex++;if(mode==='exam'&&qIndex>=EXAM_QUESTIONS)finishExam();else{if(mode==='practice')questions=[makeProblem()];loadQuestion()}},700)}function finishExam(){if(!$('end').classList.contains('hidden'))return;clearInterval(timerId);locked=true;$('finalScore').textContent=`${totalScore} 分`;$('endText').textContent=`完成 ${qIndex} 題；每次輸錯已扣 1 分。`;$('end').classList.remove('hidden')}
</script></body></html>
