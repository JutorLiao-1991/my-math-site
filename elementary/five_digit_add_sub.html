<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>鳩特數理｜五位數加減法（四年級）</title>
  <style>
    :root{--pink:#ff7897;--pink2:#ff9bb1;--ink:#594a4e;--paper:#fff;--bg:#faeee7;--line:#efd5dc;--ok:#43a047;--bad:#ef5350;--nav:#594a4ef2}
    *{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden;font-family:"Segoe UI","Microsoft JhengHei",sans-serif;color:var(--ink);background-color:var(--bg);background-image:linear-gradient(#ff8ba71a 1px,transparent 1px),linear-gradient(90deg,#ff8ba71a 1px,transparent 1px);background-size:20px 20px;touch-action:manipulation;user-select:none}.hidden{display:none!important}button{font:inherit;touch-action:manipulation}.nav{height:58px;padding:9px 18px;background:var(--nav);color:#fff;display:flex;align-items:center;justify-content:space-between}.nav a{color:var(--pink2);text-decoration:none;border:1px solid var(--pink2);padding:6px 14px;border-radius:20px;font-weight:700}.nav h1{font-size:1.15rem;margin:0}.layout{height:calc(100vh - 58px);padding:14px;display:grid;grid-template-columns:minmax(0,1.7fr) minmax(330px,.8fr);gap:14px}.panel{background:var(--paper);border-radius:15px;box-shadow:0 4px 18px #594a4e18;min-height:0}.work{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:auto;padding:18px}.problem{font-size:clamp(1.35rem,3vw,2rem);font-weight:800;background:var(--bg);border-radius:14px;padding:10px 22px;margin-bottom:20px}.vertical{display:grid;grid-template-columns:38px repeat(5,clamp(40px,6vw,58px));grid-auto-rows:clamp(46px,6vw,58px);font-family:"Courier New",monospace;font-size:clamp(1.8rem,4.3vw,2.7rem);font-weight:800;align-items:center}.cell{height:100%;display:flex;align-items:center;justify-content:center;position:relative}.operator{font-size:2.2rem}.rule{grid-column:1/-1;border-top:4px solid var(--ink);height:5px}.answer{border:2px dashed var(--line);border-radius:9px;margin:3px;color:var(--pink)}.answer.active{border-style:solid;border-color:var(--pink);box-shadow:0 0 0 4px #ff789722}.answer.done{border-color:transparent;color:var(--ink)}.original.changed{text-decoration:line-through;color:#b9a4aa}.note{position:absolute;top:-15px;font-size:.92rem;color:var(--pink);font-family:"Segoe UI",sans-serif;white-space:nowrap}.decision{margin-top:22px;text-align:center}.decision p{margin:0 0 9px;font-weight:800}.decision button,.primary{border:2px solid var(--pink);background:#fff;color:var(--pink);border-radius:12px;padding:11px 20px;margin:4px;font-weight:800;cursor:pointer}.decision button:active,.primary:active{transform:scale(.96)}.hint{height:27px;margin-top:10px;color:#8d7a80;font-weight:700}.watermark{position:absolute;right:22px;bottom:14px;color:#ff789726;font:italic 1.2rem Georgia}.controls{padding:17px;display:flex;flex-direction:column;overflow:auto}.label{font-weight:800;margin:4px 0 8px}.modes,.topics{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}.topics{grid-template-columns:repeat(3,1fr)}.choice{border:2px solid #e4d9dc;background:#f8f5f6;color:#6e6064;border-radius:10px;padding:11px 6px;font-weight:800;cursor:pointer}.choice.active{background:var(--pink);border-color:var(--pink);color:#fff}.status{background:#fff8fa;border-left:5px solid var(--pink);padding:13px;border-radius:8px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center;font-weight:800}.status small{display:block;color:#9b8b90}.timerbar{height:6px;background:#eadfe2;border-radius:5px;margin:12px 0 18px;overflow:hidden}.timerbar div{height:100%;background:var(--pink);width:100%}.numpad{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:auto}.numpad button{min-height:58px;border:2px solid var(--line);background:#fff;border-radius:12px;color:var(--ink);font-size:1.45rem;font-weight:800}.numpad button:active{background:var(--pink);color:#fff}.startbox{text-align:center;margin:auto;color:#97878c;line-height:1.7}.toast{position:absolute;top:18px;left:50%;transform:translateX(-50%);padding:9px 18px;border-radius:20px;color:#fff;font-weight:800;z-index:5}.toast.bad{background:var(--bad)}.toast.ok{background:var(--ok)}.end{position:absolute;inset:0;background:#fffffff4;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;text-align:center}.end strong{font-size:4.5rem;color:var(--pink)}
    @media(max-width:820px){body{height:auto;min-height:100vh;overflow:auto}.layout{height:auto;display:flex;flex-direction:column;padding:9px}.work{min-height:480px}.controls{min-height:410px}.nav h1{font-size:1rem}.vertical{grid-template-columns:32px repeat(5,minmax(38px,54px))}.topics{grid-template-columns:repeat(3,1fr)}}
    @media(max-width:430px){.nav{padding:8px 10px}.nav a{padding:5px 9px;font-size:.85rem}.layout{gap:9px}.work{min-height:425px;padding:10px}.vertical{grid-template-columns:28px repeat(5,minmax(34px,48px));font-size:1.75rem}.controls{padding:12px}.choice{font-size:.9rem}.numpad button{min-height:52px}}
  </style>
</head>
<body>
  <header class="nav"><a href="../index.html">← 回主選單</a><h1>🧮 五位數加減法（四年級）</h1></header>
  <main class="layout">
    <section class="panel work" id="work">
      <div class="startbox" id="welcome"><h2>把進位、借位也寫進直式</h2><p>先選練習或測驗，再選題型開始。</p></div>
      <div id="workspace" class="hidden"><div class="problem" id="problem"></div><div class="vertical" id="vertical"></div><div class="decision" id="decision"></div><div class="hint" id="hint"></div></div>
      <div class="watermark">Presented by Jutor</div>
      <div class="end hidden" id="end"><h2 id="endTitle">測驗完成</h2><strong id="finalScore">0</strong><p id="endText"></p><button class="primary" onclick="restart()">再來一次</button></div>
    </section>
    <aside class="panel controls">
      <div class="label">學習模式</div><div class="modes"><button class="choice active" data-mode="practice" onclick="selectMode('practice')">🌱 練習模式</button><button class="choice" data-mode="exam" onclick="selectMode('exam')">⏱️ 10 分鐘測驗</button></div>
      <div class="label">題型</div><div class="topics"><button class="choice active" data-topic="mixed" onclick="selectTopic('mixed')">綜合</button><button class="choice" data-topic="add" onclick="selectTopic('add')">加法</button><button class="choice" data-topic="sub" onclick="selectTopic('sub')">減法</button></div>
      <button class="primary" id="startBtn" onclick="startGame()">開始練習</button>
      <div id="gameControls" class="hidden" style="display:flex;flex-direction:column;flex:1">
        <div class="status"><div><small>進度</small><span id="progress">第 1 題</span></div><div><small>本題分數</small><span id="points">—</span></div><div><small>剩餘時間</small><span id="timer">不限時</span></div></div><div class="timerbar"><div id="timerFill"></div></div>
        <div class="numpad" id="numpad"></div>
      </div>
    </aside>
  </main>
<script>
const EXAM_SECONDS=10*60, EXAM_QUESTIONS=10;
let mode='practice',topic='mixed',questions=[],qIndex=0,question=null,working=[],carryMarks=[],carry=0,col=4,phase='digit',borrowed=false,mistakes=0,totalScore=0,timeLeft=EXAM_SECONDS,timerId=null,locked=false;
const $=id=>document.getElementById(id);
for(let i=1;i<=9;i++)$('numpad').insertAdjacentHTML('beforeend',`<button onclick="inputDigit(${i})">${i}</button>`);$('numpad').insertAdjacentHTML('beforeend','<button onclick="inputDigit(0)">0</button>');
function playSound(type){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;window._audio=window._audio||new C();const c=window._audio;if(c.state==='suspended')c.resume();const o=c.createOscillator(),g=c.createGain(),n=c.currentTime;o.connect(g);g.connect(c.destination);if(type==='move'){o.type='triangle';o.frequency.setValueAtTime(600,n);o.frequency.exponentialRampToValueAtTime(200,n+.05);g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(.2,n+.01);g.gain.exponentialRampToValueAtTime(.01,n+.05);o.start(n);o.stop(n+.05)}else if(type==='correct'){o.type='sine';o.frequency.setValueAtTime(659.25,n);o.frequency.setValueAtTime(523.25,n+.3);g.gain.setValueAtTime(.25,n);g.gain.exponentialRampToValueAtTime(.01,n+.8);o.start(n);o.stop(n+.8)}else{o.type='sawtooth';o.frequency.setValueAtTime(300,n);o.frequency.exponentialRampToValueAtTime(150,n+.3);g.gain.setValueAtTime(.13,n);g.gain.exponentialRampToValueAtTime(.01,n+.3);o.start(n);o.stop(n+.3)}}
function selectMode(v){mode=v;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===v));$('startBtn').textContent=v==='exam'?'開始 10 分鐘測驗':'開始練習'}
function selectTopic(v){topic=v;document.querySelectorAll('[data-topic]').forEach(b=>b.classList.toggle('active',b.dataset.topic===v))}
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function hasBorrow(a,b){const A=String(a).padStart(5,'0').split('').map(Number),B=String(b).padStart(5,'0').split('').map(Number);let w=[...A];for(let i=4;i>=0;i--){if(w[i]<B[i])return true}return false}
function hasCarry(a,b){const A=String(a).padStart(5,'0').split('').map(Number),B=String(b).padStart(5,'0').split('').map(Number);let carryIn=0,found=false;for(let i=4;i>=0;i--){const sum=A[i]+B[i]+carryIn;if(sum>=10)found=true;carryIn=Math.floor(sum/10)}return found}
function makeProblem(kind=topic){if(kind==='mixed')kind=Math.random()<.5?'add':'sub';if(kind==='add'){let a,b;do{a=rnd(10500,89000);b=rnd(1200,48000)}while(a+b>99999||!hasCarry(a,b));return{kind,a,b,answer:a+b}}let a,b;do{a=rnd(10000,99999);b=rnd(1000,a-1)}while(!hasBorrow(a,b));return{kind,a,b,answer:a-b}}
function startGame(){clearInterval(timerId);questions=Array.from({length:mode==='exam'?EXAM_QUESTIONS:1},()=>makeProblem());qIndex=0;totalScore=0;timeLeft=EXAM_SECONDS;$('welcome').classList.add('hidden');$('workspace').classList.remove('hidden');$('gameControls').classList.remove('hidden');$('end').classList.add('hidden');$('startBtn').classList.add('hidden');if(mode==='exam'){timerId=setInterval(tick,1000)}loadQuestion()}
function restart(){$('startBtn').classList.remove('hidden');startGame()}
function tick(){timeLeft--;$('timer').textContent=`${Math.floor(timeLeft/60)}:${String(timeLeft%60).padStart(2,'0')}`;$('timerFill').style.width=`${timeLeft/EXAM_SECONDS*100}%`;if(timeLeft<=0)finishExam()}
function digits(n){return String(n).padStart(5,'0').split('').map(Number)}
function loadQuestion(){question=questions[qIndex]||makeProblem();working=digits(question.a);carryMarks=[0,0,0,0,0];carry=0;col=4;phase='digit';borrowed=false;mistakes=0;locked=false;$('problem').textContent=`${question.a.toLocaleString()} ${question.kind==='add'?'+':'−'} ${question.b.toLocaleString()} = ?`;$('progress').textContent=mode==='exam'?`${qIndex+1} / ${EXAM_QUESTIONS}`:`第 ${qIndex+1} 題`;$('points').textContent=mode==='exam'?'10 分':'—';$('timer').textContent=mode==='exam'?`${Math.floor(timeLeft/60)}:${String(timeLeft%60).padStart(2,'0')}`:'不限時';render();prepareColumn()}
function topCellHTML(i,A){const hidden=i<5-String(question.a).length;const note=question.kind==='add'&&carryMarks[i]?'<span class="note">1</span>':working[i]!==A[i]?`<span class="note">${working[i]}</span>`:'';return`${hidden?'':A[i]}${note}`}
function render(){const A=digits(question.a),B=digits(question.b);let h='<div class="cell"></div>';for(let i=0;i<5;i++)h+=`<div class="cell original ${working[i]!==A[i]?'changed':''}" id="top-${i}">${topCellHTML(i,A)}</div>`;h+=`<div class="cell operator">${question.kind==='add'?'+':'−'}</div>`;for(let i=0;i<5;i++)h+=`<div class="cell">${i<5-String(question.b).length?'':B[i]}</div>`;h+='<div class="rule"></div><div class="cell"></div>';for(let i=0;i<5;i++)h+=`<div class="cell answer" id="ans-${i}"></div>`;$('vertical').innerHTML=h}
function updateTopRow(){const A=digits(question.a);for(let i=0;i<5;i++){const cell=$(`top-${i}`);cell.className=`cell original ${working[i]!==A[i]?'changed':''}`;cell.innerHTML=topCellHTML(i,A)}}
function prepareColumn(){if(col<0){completeQuestion();return}phase='digit';borrowed=false;$(`ans-${col}`).classList.add('active');$('decision').innerHTML=`<button onclick="pressRegroup()">${question.kind==='add'?'進 1':'借 1'}</button>`;$('hint').textContent=question.kind==='add'?'先填本欄答案；需要時再按「進 1」。':'需要時先按「借 1」，再填本欄答案。'}
function pressRegroup(){if(locked)return;playSound('move');const B=digits(question.b);if(question.kind==='add'){if(phase!=='carry'){wrong('加法要先填本欄答案，再按「進 1」。');return}if(col<=0){wrong('最高位不能再進到目前直式之外。');return}carry=1;carryMarks[col-1]=1;updateTopRow();advanceColumn();return}if(borrowed||working[col]>=B[col]){wrong('這一欄不需要借位。');return}applyBorrow(col);borrowed=true;updateTopRow();$('hint').textContent='借位完成，請填入本欄答案。'}
function applyBorrow(i){let donor=i-1;while(donor>=0&&working[donor]===0)donor--;if(donor<0)return;working[donor]--;for(let j=donor+1;j<i;j++)working[j]=9;working[i]+=10}
function inputDigit(d){if(locked)return;playSound('move');if(phase==='carry'){wrong('本欄答案已填好，還需要按「進 1」。');return}const B=digits(question.b);if(question.kind==='sub'&&!borrowed&&working[col]<B[col]){wrong('這一欄要先借 1，再填答案。');return}const sum=working[col]+B[col]+carry;const expected=question.kind==='add'?sum%10:working[col]-B[col];if(d!==expected){wrong('這一欄再算一次。');return}const cell=$(`ans-${col}`);cell.textContent=d;cell.classList.remove('active');cell.classList.add('done');if(question.kind==='add'&&sum>=10){phase='carry';$('hint').textContent='本欄答案正確，請按「進 1」。';return}if(question.kind==='add')carry=0;advanceColumn()}
function advanceColumn(){col--;prepareColumn()}
function wrong(msg){mistakes++;playSound('wrong');if(mode==='exam')$('points').textContent=`${Math.max(0,10-mistakes)} 分`;toast(msg,'bad')}
function toast(msg,type){const t=document.createElement('div');t.className=`toast ${type}`;t.textContent=msg;$('work').appendChild(t);setTimeout(()=>t.remove(),1100)}
function completeQuestion(){locked=true;playSound('correct');if(mode==='exam')totalScore+=Math.max(0,10-mistakes);toast('直式完成！','ok');setTimeout(()=>{qIndex++;if(mode==='exam'&&qIndex>=EXAM_QUESTIONS)finishExam();else{if(mode==='practice')questions=[makeProblem()];loadQuestion()}},700)}
function finishExam(){if($('end').classList.contains('hidden')===false)return;clearInterval(timerId);locked=true;$('finalScore').textContent=`${totalScore} 分`;$('endText').textContent=`完成 ${qIndex} 題；每次輸錯已扣 1 分。`;$('end').classList.remove('hidden')}
</script>
</body></html>
