<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鳩特數理 - 文昌帝君陪讀席</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --gold: #d4af37;
            --dark-wood: #2c1e1e;
            --overlay-bg: rgba(0, 0, 0, 0.85);
            --active-green: #4caf50; /* 新增：線上狀態燈號顏色 */
        }

        body {
            margin: 0; padding: 0;
            background-color: #000;
            color: #f0e68c;
            font-family: "Microsoft JhengHei", "KaiTi", serif;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            
            /* 背景圖：本地素材 */
            background-image: url('assets/temple.jpg');
            background-size: cover; background-position: center;
        }

        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--overlay-bg); z-index: -1;
        }

        .hidden { display: none !important; }

        /* --- 文昌帝君頭像 --- */
        .god-container {
            position: relative; width: 200px; height: 200px; margin: 0 auto 20px;
            transition: all 0.5s ease;
        }
        .god-image {
            width: 100%; height: 100%; border-radius: 50%;
            border: 4px solid var(--gold);
            background-image: url('assets/wenchang.jpg');
            background-size: cover; background-position: center 20%;
            box-shadow: 0 0 40px rgba(212, 175, 55, 0.5);
            position: relative; z-index: 2;
        }
        .god-halo {
            position: absolute; top: -10px; left: -10px; right: -10px; bottom: -10px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(212,175,55,0.6) 0%, rgba(0,0,0,0) 70%);
            z-index: 1; animation: pulse 4s infinite ease-in-out;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 0.8; }
            100% { transform: scale(1); opacity: 0.5; }
        }

        /* --- 輸入與設定區 --- */
        #setup-screen, #study-screen {
            text-align: center; z-index: 10; width: 90%; max-width: 500px;
            padding: 20px 0;
        }

        /* 你的標題樣式 */
        h1 { margin: 0; font-size: 2rem; text-shadow: 0 0 10px var(--gold); letter-spacing: 5px; color: var(--gold); }
        .subtitle { color: #aaa; letter-spacing: 2px; margin-bottom: 30px; display: block; }
        
        .input-group { margin: 15px 0; }
        .input-label { font-size: 1.1rem; color: #ddd; display: block; margin-bottom: 5px; }
        
        input[type="text"], input[type="number"] {
            padding: 10px; font-size: 1.2rem; text-align: center;
            background: rgba(255,255,255,0.1); border: 2px solid var(--gold);
            color: #fff; border-radius: 8px; outline: none;
            font-family: inherit; width: 60%;
        }
        input[type="number"] { width: 30%; }

        button {
            display: block; margin: 30px auto; padding: 12px 50px;
            font-size: 1.3rem; background: linear-gradient(to bottom, #d4af37, #b8860b);
            color: #000; border: none; cursor: pointer; font-weight: bold;
            border-radius: 50px; box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
            transition: transform 0.2s;
        }
        button:hover { transform: scale(1.05); background: #f1c40f; }

        /* --- 資訊面板 (排行榜 + 線上同修) --- */
        /* 修改：原本的 leaderboard-container 改為更通用的 info-panel */
        .info-panel {
            margin-top: 40px;
            background: rgba(44, 30, 30, 0.9);
            border: 2px solid #5d4037;
            border-radius: 10px;
            padding: 15px;
            width: 100%;
            box-sizing: border-box;
            max-height: 300px;
            overflow-y: auto;
        }
        
        /* 分頁切換按鈕 */
        .tabs { display: flex; justify-content: center; margin-bottom: 15px; border-bottom: 1px solid #555; }
        .tab { 
            padding: 10px 15px; cursor: pointer; color: #888; font-weight: bold; 
            border-bottom: 3px solid transparent; flex: 1; transition: all 0.3s;
        }
        .tab.active { color: var(--gold); border-bottom: 3px solid var(--gold); background: rgba(212, 175, 55, 0.1); }
        
        .list-container ul { list-style: none; padding: 0; margin: 0; }
        .list-item {
            display: flex; justify-content: space-between; padding: 10px 0;
            border-bottom: 1px dashed #555; font-size: 1rem;
        }
        .list-item:last-child { border-bottom: none; }
        
        .rank-icon { margin-right: 10px; width: 25px; text-align: center; display:inline-block;}
        .user-name { flex-grow: 1; text-align: left; color: #fff; }
        .user-stat { color: var(--gold); font-weight: bold; font-family: monospace; }

        /* 線上狀態的綠燈動畫 */
        .live-dot {
            display: inline-block; width: 10px; height: 10px; 
            background-color: var(--active-green); border-radius: 50%; 
            margin-right: 8px; box-shadow: 0 0 8px var(--active-green);
            animation: blink 2s infinite;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        /* --- 讀書畫面樣式 --- */
        .incense-wrapper {
            position: relative; width: 10px; height: 200px;
            background: #444; margin: 30px auto;
            border-radius: 6px; box-shadow: 0 0 10px #000;
        }
        .incense-stick {
            position: absolute; bottom: 0; width: 100%; height: 100%;
            background: linear-gradient(to top, #500000, #ff4500);
            border-radius: 6px; transition: height 0.5s linear;
        }
        .smoke {
            position: absolute; top: -30px; left: 50%; width: 8px; height: 8px;
            background: rgba(200,200,200,0.5); border-radius: 50%;
            filter: blur(3px); animation: smokeRise 2.5s infinite ease-out; opacity: 0;
        }
        @keyframes smokeRise {
            0% { top: -5px; opacity: 0; transform: translateX(-50%) scale(1); }
            30% { opacity: 0.6; }
            100% { top: -80px; opacity: 0; transform: translateX(-20%) scale(3); }
        }

        .timer-text { font-size: 3rem; font-weight: bold; margin-top: 10px; font-family: monospace; }
        .message { margin-top: 15px; font-size: 1.2rem; min-height: 1.5em; color: #ccc; }
        
        /* 讀書時下方顯示人數的樣式 */
        .live-status { font-size: 1rem; color: #aaa; margin-top: 25px; border-top: 1px solid #333; padding-top: 15px;}
        
        .scold { color: #ff5555; font-weight: bold; animation: shake 0.5s; }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
    </style>
</head>
<body>

    <div class="overlay"></div>

    <div id="setup-screen">
        <div class="god-container">
            <div class="god-halo"></div>
            <div class="god-image"></div>
        </div>
        <h1>鳩特數理 ‧ 文昌陪讀</h1>
        <span class="subtitle">誠心正意 ‧ 金榜題名</span>
        
        <div class="input-group">
            <label class="input-label">弟子暱稱</label>
            <input type="text" id="username-input" placeholder="請輸入名字" maxlength="10">
        </div>

        <div class="input-group">
            <label class="input-label">願專注 (分鐘)</label>
            <input type="number" id="minutes-input" value="30" min="1" max="180">
        </div>
        
        <button onclick="startStudy()">點香開始</button>

        <div class="info-panel">
            <div class="tabs">
                <div class="tab active" onclick="switchTab('online')">🔥 現正同修</div>
                <div class="tab" onclick="switchTab('leaderboard')">🏆 本週功德</div>
            </div>
            
            <div class="list-container">
                <ul id="online-list">
                    <li class="list-item" style="justify-content:center; color:#888;">載入中...</li>
                </ul>
                <ul id="leaderboard-list" class="hidden">
                    <li class="list-item" style="justify-content:center; color:#888;">載入中...</li>
                </ul>
            </div>
        </div>
    </div>

    <div id="study-screen" class="hidden">
        <div class="god-container" style="width: 120px; height: 120px; margin-bottom: 10px;">
            <div class="god-halo"></div>
            <div class="god-image"></div>
        </div>

        <div class="incense-wrapper">
            <div class="smoke"></div>
            <div class="incense-stick" id="stick"></div>
        </div>

        <div class="timer-text" id="timer-display">00:00</div>
        <div class="message" id="god-message">帝君看著你...</div>

        <div class="live-status">
            <span class="live-dot"></span> 目前共有 <span id="live-count" style="color:var(--gold); font-weight:bold;">0</span> 位道友一同用功中
        </div>

        <button onclick="stopStudy()" style="background:#444; padding:8px 30px; font-size:1rem; margin-top:30px; box-shadow:none; color:#ccc;">
            弟子知錯（提早結束）
        </button>
    </div>

    <audio id="bgm" loop>
        <source src="assets/bowl.mp3" type="audio/mpeg">
    </audio>

    <script>
        // ==========================================
        // 1. Firebase 設定區
        // ==========================================
        const firebaseConfig = {
          apiKey: "AIzaSyDgv0eKdB1qAX-8QkhLy-CPQXbgg2pFOfQ",
          authDomain: "wen-chang-clock.firebaseapp.com",
          databaseURL: "https://wen-chang-clock-default-rtdb.asia-southeast1.firebasedatabase.app",
          projectId: "wen-chang-clock",
          storageBucket: "wen-chang-clock.firebasestorage.app",
          messagingSenderId: "679908561242",
          appId: "1:679908561242:web:bddce69c9e0b0eafaca363"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // ==========================================
        // 2. 核心變數
        // ==========================================
        let timerInterval;
        let onlineUpdateInterval; // 用來更新線上清單的計時器
        let totalSeconds = 0;
        let remainingSeconds = 0;
        let isStudying = false;
        let wakeLock = null;
        let currentUser = "";
        let studyMinutes = 0;

        const stick = document.getElementById('stick');
        const timerDisplay = document.getElementById('timer-display');
        const godMessage = document.getElementById('god-message');
        const bgm = document.getElementById('bgm');
        const lbList = document.getElementById('leaderboard-list');
        const onlineList = document.getElementById('online-list');
        const liveCount = document.getElementById('live-count');

        // 你的罵人語錄 (已保留逗號修正)
        const scoldQuotes = [
            "香熄了，你的未來也快熄了。",
            "你去哪裡了？帝君很不高興。",
            "這點時間都坐不住，怎麼坐考場？",
            "別人的孩子還在讀，你切視窗？",
            "回來就好，把心收回來。",
            "剛才那段時間，不予計算功德。",
            "你把時間花在哪，你的成就就在哪。",
            "這點時間都撐不住，你這輩子就這樣了啦！",
            "連自己的期待的做不到，你未來還能被誰期待？",
            "剛剛那次我就當作你誤觸，請好好加油！", 
            "要怎麼收穫，先那麼栽"
        ];

        // ==========================================
        // 3. 週次計算 (鎖定 UTC+8 台灣時間)
        // ==========================================
        function getCurrentWeekID() {
            // 1. 取得 UTC 時間
            const now = new Date();
            const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
            
            // 2. 加上 8 小時，強制轉為台灣時間
            const twTime = new Date(utc + (3600000 * 8));

            // 3. 計算 ISO 週次 (以台灣時間判定)
            const d = new Date(twTime);
            const dayNum = d.getDay() || 7;
            d.setHours(0, 0, 0, 0);
            d.setDate(d.getDate() + 4 - dayNum);
            const year = d.getFullYear();
            const weekNo = Math.ceil((((d - new Date(year, 0, 1)) / 86400000) + 1) / 7);
            
            return `${year}_W${weekNo}`;
        }

        // 動態取得本週的路徑
        const currentWeekPath = 'weekly_merits_' + getCurrentWeekID();
        const onlinePath = 'online_users'; // 線上使用者路徑

        // ==========================================
        // 4. 程式邏輯與 Firebase 操作
        // ==========================================
        window.onload = function() {
            loadLeaderboard();
            loadOnlineUsers(); // 載入線上同修
            const savedName = localStorage.getItem('wenchang_username');
            if(savedName) document.getElementById('username-input').value = savedName;
        };

        // 切換分頁功能
        window.switchTab = function(tabName) {
            const tabs = document.querySelectorAll('.tab');
            tabs.forEach(t => t.classList.remove('active'));
            
            if(tabName === 'online') {
                tabs[0].classList.add('active');
                onlineList.classList.remove('hidden');
                lbList.classList.add('hidden');
            } else {
                tabs[1].classList.add('active');
                onlineList.classList.add('hidden');
                lbList.classList.remove('hidden');
            }
        }

        // 讀取排行榜 (本週功德)
        function loadLeaderboard() {
            const meritRef = db.ref(currentWeekPath);
            meritRef.orderByChild('totalMinutes').limitToLast(10).on('value', (snapshot) => {
                lbList.innerHTML = "";
                let data = [];
                
                if (snapshot.exists()) {
                    snapshot.forEach((childSnapshot) => {
                        data.push({
                            name: childSnapshot.key,
                            minutes: childSnapshot.val().totalMinutes
                        });
                    });
                }

                data.reverse(); // 分數高的排上面

                if(data.length === 0) {
                    lbList.innerHTML = `<li class="list-item" style="justify-content:center; color:#888;">本週尚無紀錄，快來搶頭香！</li>`;
                    return;
                }

                data.forEach((item, index) => {
                    const li = document.createElement('li');
                    li.className = 'list-item';
                    
                    let rankIcon = `${index + 1}`;
                    if(index === 0) rankIcon = '🥇';
                    if(index === 1) rankIcon = '🥈';
                    if(index === 2) rankIcon = '🥉';

                    li.innerHTML = `
                        <div><span class="rank-icon">${rankIcon}</span> <span class="user-name">${item.name}</span></div>
                        <span class="user-stat">${item.minutes} min</span>
                    `;
                    lbList.appendChild(li);
                });
            });
        }

        // 讀取線上同修 (即時名單)
        function loadOnlineUsers() {
            const onlineRef = db.ref(onlinePath);
            
            onlineRef.on('value', (snapshot) => {
                onlineList.innerHTML = "";
                let count = 0;
                
                if (snapshot.exists()) {
                    const users = snapshot.val();
                    const now = Date.now();
                    
                    Object.keys(users).forEach(key => {
                        count++;
                        const user = users[key];
                        // 計算已經讀了多久
                        const elapsedSeconds = Math.floor((now - user.startTime) / 1000);
                        const elapsedMins = Math.floor(elapsedSeconds / 60);
                        const elapsedSecsDisplay = (elapsedSeconds % 60).toString().padStart(2, '0');
                        
                        const li = document.createElement('li');
                        li.className = 'list-item';
                        // 存時間戳記，讓 JS 可以動態更新秒數
                        li.dataset.startTime = user.startTime; 
                        
                        li.innerHTML = `
                            <div>
                                <span class="live-dot"></span>
                                <span class="user-name">${key}</span>
                            </div>
                            <span class="user-stat time-display">${elapsedMins}:${elapsedSecsDisplay}</span>
                        `;
                        onlineList.appendChild(li);
                    });
                } else {
                    onlineList.innerHTML = `<li class="list-item" style="justify-content:center; color:#888;">目前無人，快搶沙發！</li>`;
                }
                
                // 更新讀書畫面的總人數
                liveCount.innerText = count;
            });

            // 前端計時器：每秒更新「已讀時間」顯示
            if (onlineUpdateInterval) clearInterval(onlineUpdateInterval);
            onlineUpdateInterval = setInterval(() => {
                const now = Date.now();
                document.querySelectorAll('#online-list .time-display').forEach(el => {
                    const parentLi = el.closest('li');
                    const start = parseInt(parentLi.dataset.startTime);
                    if(start) {
                        const diff = Math.floor((now - start) / 1000);
                        const m = Math.floor(diff / 60);
                        const s = (diff % 60).toString().padStart(2, '0');
                        el.innerText = `${m}:${s}`;
                    }
                });
            }, 1000);
        }

        // 更新功德 (寫入本週資料)
        function updateMerit(name, minutesToAdd) {
            const userRef = db.ref(currentWeekPath + '/' + name);
            userRef.child('totalMinutes').transaction((currentMinutes) => {
                return (currentMinutes || 0) + parseInt(minutesToAdd);
            }, (error) => {
                if (error) console.log('Transaction failed', error);
            });
            userRef.child('lastStudy').set(new Date().toISOString());
        }

        // 螢幕喚醒鎖 (Wake Lock)
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) { console.log(err); }
        }

        function releaseWakeLock() {
            if (wakeLock !== null) {
                wakeLock.release().then(() => { wakeLock = null; });
            }
        }

        // 開始讀書
        function startStudy() {
            const nameInput = document.getElementById('username-input');
            const minsInput = document.getElementById('minutes-input');
            
            currentUser = nameInput.value.trim();
            studyMinutes = parseInt(minsInput.value);

            if(!currentUser) return alert("請輸入弟子暱稱，帝君才知道功德要算誰的。");
            if(!studyMinutes || studyMinutes <= 0) return alert("請輸入正確時間");

            localStorage.setItem('wenchang_username', currentUser);

            totalSeconds = studyMinutes * 60;
            remainingSeconds = totalSeconds;
            isStudying = true;

            // --- ★ 寫入線上名單 ---
            const myOnlineRef = db.ref(onlinePath + '/' + currentUser);
            myOnlineRef.set({
                startTime: firebase.database.ServerValue.TIMESTAMP
            });
            // 設定斷線自動移除
            myOnlineRef.onDisconnect().remove();

            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('study-screen').classList.remove('hidden');
            
            bgm.volume = 0.6;
            bgm.play().catch(e => console.log("需使用者互動"));
            requestWakeLock();
            updateUI();
            startTimer();
        }

        function startTimer() {
            if(timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                remainingSeconds--;
                updateUI();
                if (remainingSeconds <= 0) finishStudy();
            }, 1000);
        }

        function pauseTimer() {
            clearInterval(timerInterval);
        }

        function updateUI() {
            const m = Math.floor(remainingSeconds / 60).toString().padStart(2, '0');
            const s = (remainingSeconds % 60).toString().padStart(2, '0');
            timerDisplay.innerText = `${m}:${s}`;
            const percentage = (remainingSeconds / totalSeconds) * 100;
            stick.style.height = `${percentage}%`;
        }

        // 停止/結束時的共用清理邏輯
        function cleanupStudy() {
            pauseTimer();
            isStudying = false;
            bgm.pause();
            bgm.currentTime = 0;
            releaseWakeLock();

            // --- ★ 從線上名單移除 ---
            if(currentUser) {
                db.ref(onlinePath + '/' + currentUser).remove();
            }

            document.getElementById('setup-screen').classList.remove('hidden');
            document.getElementById('study-screen').classList.add('hidden');
            document.title = "鳩特數理 - 文昌帝君陪讀席";
        }

        function stopStudy() {
            cleanupStudy();
        }

        function finishStudy() {
            cleanupStudy();
            alert(`功德圓滿！${currentUser} 獲得 ${studyMinutes} 分鐘讀書功德。`);
            updateMerit(currentUser, studyMinutes);
        }

        // 防偷懶機制
        document.addEventListener("visibilitychange", async () => {
            if (!isStudying) return;

            if (document.hidden) {
                pauseTimer();
                bgm.pause();
                stick.style.filter = "grayscale(100%)";
                document.title = "⚠️ 香熄了！帝君在瞪你...";
                releaseWakeLock(); 
            } else {
                startTimer();
                bgm.play();
                stick.style.filter = "grayscale(0%)";
                document.title = "文昌帝君陪讀中...";
                requestWakeLock();
                
                godMessage.innerText = scoldQuotes[Math.floor(Math.random() * scoldQuotes.length)];
                godMessage.classList.add('scold');
                setTimeout(() => {
                    godMessage.classList.remove('scold');
                    godMessage.innerText = "帝君看著你... 心無旁騖";
                }, 3000);
            }
        });
    </script>
</body>
</html>
