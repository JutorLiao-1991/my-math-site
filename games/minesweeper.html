<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>鳩特踩地雷</title>
<style>
:root{--cream:#efe6c8;--ink:#1d2114;--alert:#d8452f;--lime:#c9e05a;--cs:32px;--W:9;
 --num:"Bahnschrift","DIN Condensed","DIN Alternate","Arial Narrow","Roboto Condensed",Impact,sans-serif;
 --zh:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:#353b24;background-size:220px 220px;color:var(--cream);font-family:var(--zh);overscroll-behavior:none}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(130% 90% at 50% 35%,#0000 35%,#000a 100%),linear-gradient(#171a0f99,#171a0f55);pointer-events:none;z-index:0}
#app{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding:0 10px calc(28px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:8px;padding:10px 0 6px;flex-wrap:wrap}
header a{color:var(--cream);text-decoration:none;font-size:22px;padding:2px 6px}
header h1{margin:0;font-size:20px;font-weight:900;letter-spacing:.1em;flex:1;white-space:nowrap;text-shadow:0 2px 0 #0008}
header h1 small{font-size:12px;font-weight:700;opacity:.7;letter-spacing:.05em;margin-left:6px}
.btn{appearance:none;border:0;border-radius:8px;padding:9px 13px;font:800 14px/1 var(--zh);color:var(--cream);background:linear-gradient(#5d6731,#3f4720);box-shadow:inset 0 1px 0 #ffffff26,0 2px 0 #1b1f0d,0 3px 6px #0006;cursor:pointer;letter-spacing:.06em;white-space:nowrap}
.btn:active{transform:translateY(2px);box-shadow:inset 0 1px 0 #ffffff1a,0 0 0 #1b1f0d}
.btn.on,.btn.pri{background:linear-gradient(#dcc770,#a48b3c);color:#1d2114}
.btn.red{background:linear-gradient(#c8553d,#8e2f1f)}
.btn[disabled]{opacity:.45;pointer-events:none}
/* HUD */
#hud{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px auto 8px;max-width:520px}
.crate{position:relative;display:flex;align-items:center;gap:8px;min-width:112px;padding:6px 12px;border-radius:6px;border:3px solid #2f2f17;background:repeating-linear-gradient(0deg,#5c5c2f 0 12px,#4b4b25 12px 13px);box-shadow:inset 0 0 0 2px #6e6e3b,0 3px 8px #0008}
.crate::before,.crate::after{content:'';position:absolute;top:50%;width:5px;height:5px;margin-top:-2.5px;border-radius:50%;background:#2a2a14;box-shadow:inset 0 1px 0 #8a8a55}
.crate::before{left:4px}.crate::after{right:4px}
.crate small,.watch small{font:900 10px/1.1 var(--zh);letter-spacing:.25em;color:#e3d27a;opacity:.9}
.crate b{font:900 28px/1 var(--num);color:#f0dc72;letter-spacing:.06em;text-shadow:1px 1px 0 #0007;margin-left:auto}
.watch{min-width:112px;padding:5px 10px;border-radius:10px;background:#12160f;border:3px solid #6c7155;box-shadow:inset 0 0 10px #000,0 0 0 2px #262a1c,0 3px 8px #0008;text-align:right}
.watch small{display:block;text-align:left;color:#7f8a66}
.watch b{font:700 26px/1 var(--num);color:#a8f593;letter-spacing:.08em;text-shadow:0 0 7px #6fe05a99}
#helm{flex:none;width:56px;height:56px;border-radius:50%;border:0;padding:0;cursor:pointer;background:radial-gradient(circle at 35% 30%,#808b4b,#495126 72%);box-shadow:0 3px 0 #21260e,0 6px 12px #0009,inset 0 2px 0 #ffffff33;display:grid;place-items:center}
#helm:active{transform:translateY(2px);box-shadow:0 1px 0 #21260e,0 3px 6px #0009}
#helm svg{width:42px;height:42px}
#helm .st,#helm .ck{display:none}#helm.win .st{display:inline}#helm.lose .ck{display:inline}
/* 工具列 */
#tools{display:flex;align-items:center;justify-content:center;gap:8px;margin:0 auto 8px;flex-wrap:wrap}
.seg{display:inline-flex;background:#1d2113;border-radius:11px;padding:3px;box-shadow:inset 0 1px 3px #000,0 1px 0 #ffffff14}
.seg button{border:0;background:none;color:#b9b596;padding:8px 14px;border-radius:8px;font:800 14px/1 var(--zh);display:flex;align-items:center;gap:6px;cursor:pointer}
.seg button.on{background:linear-gradient(#dcc770,#a48b3c);color:#1d2114;box-shadow:0 1px 0 #0006}
.seg svg{width:18px;height:18px}
#zoom{display:none}#zoom.show{display:inline-flex}
#lvTag{font:800 13px/1 var(--zh);color:#d9cfa5;opacity:.85;letter-spacing:.08em}
/* 作戰簡報（教學） */
#brief{max-width:560px;margin:0 auto 10px;padding:12px 14px;border-radius:10px;background:linear-gradient(#2a2f1b,#20240f);border:2px solid #6b7140;box-shadow:0 4px 12px #0008;display:none}
#brief.show{display:block;animation:bin .3s ease-out}
@keyframes bin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
#brief h4{margin:0 0 6px;font-size:13px;letter-spacing:.18em;color:#e3d27a}
#brief p{margin:0 0 10px;font-size:16px;line-height:1.6}
#brief .bb{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
/* 雷區 */
#bw{position:relative;margin:0 auto;width:max-content;max-width:100%;overflow-x:auto;overflow-y:hidden;padding:11px;border-radius:10px;background:linear-gradient(145deg,#60654a,#383c29);box-shadow:inset 0 1px 0 #ffffff2e,inset 0 -2px 0 #0006,0 8px 20px #000b;-webkit-overflow-scrolling:touch}
#bw::before{content:'';position:absolute;inset:3px;border-radius:8px;pointer-events:none;background:radial-gradient(circle at 5px 5px,#262a1a 2px,#9aa07a 2.6px,#0000 3.2px) 0 0/100% 100% no-repeat,radial-gradient(circle at calc(100% - 5px) 5px,#262a1a 2px,#9aa07a 2.6px,#0000 3.2px),radial-gradient(circle at 5px calc(100% - 5px),#262a1a 2px,#9aa07a 2.6px,#0000 3.2px),radial-gradient(circle at calc(100% - 5px) calc(100% - 5px),#262a1a 2px,#9aa07a 2.6px,#0000 3.2px)}
#board{position:relative;display:grid;grid-template-columns:repeat(var(--W),var(--cs));grid-auto-rows:var(--cs);background-color:#c4ad7d;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;box-shadow:0 0 0 2px #23271a}
#board::before{content:'';position:absolute;inset:6%;z-index:0;background:var(--logo) center/contain no-repeat;opacity:.32;filter:grayscale(1) brightness(.3);pointer-events:none}
.c{position:relative;z-index:1;width:var(--cs);height:var(--cs);display:grid;place-items:center;font:900 calc(var(--cs)*.68)/1 var(--num)}
.c.h{cursor:pointer;background:
 radial-gradient(circle at 17% 17%,#283012 0 calc(var(--cs)*.04),#a6af74 calc(var(--cs)*.055),#0000 calc(var(--cs)*.07)),
 radial-gradient(circle at 83% 17%,#283012 0 calc(var(--cs)*.04),#a6af74 calc(var(--cs)*.055),#0000 calc(var(--cs)*.07)),
 radial-gradient(circle at 17% 83%,#283012 0 calc(var(--cs)*.04),#a6af74 calc(var(--cs)*.055),#0000 calc(var(--cs)*.07)),
 radial-gradient(circle at 83% 83%,#283012 0 calc(var(--cs)*.04),#a6af74 calc(var(--cs)*.055),#0000 calc(var(--cs)*.07)),
 linear-gradient(145deg,#808a4e,#5b6533 55%,#4a5327);
 box-shadow:inset 1px 1px 0 #a9b277,inset -1px -1px 0 #283012,0 0 0 .5px #283012}
.c.h.pr{filter:brightness(.82);box-shadow:inset 1px 1px 3px #151a07,inset -1px -1px 0 #7d874c}
.c.o{background:rgba(212,193,147,.74) var(--sand);box-shadow:inset 0 0 0 .5px #7d6a46aa}
.c.o.rv{animation:dig .28s ease-out both}
@keyframes dig{0%{opacity:.2;transform:scale(.55);filter:brightness(.5)}70%{transform:scale(1.06)}100%{opacity:1;transform:none;filter:none}}
.c.pk{filter:brightness(1.35)}
.n1{color:#2b5b8e}.n2{color:#3b6a23}.n3{color:#b13a22}.n4{color:#283070}.n5{color:#6e2112}.n6{color:#22706c}.n7{color:#1c1c1c}.n8{color:#5e5e5e}
.c.o[class*=" n"]{text-shadow:0 0 1px currentColor,0 1px 0 #fff6}
.c.f::after,.c.m::after,.c.wf::after{content:'';position:absolute;inset:10%;background:center/contain no-repeat}
.c.f::after{background-image:var(--flag);animation:plant .32s cubic-bezier(.3,1.7,.5,1) both}
@keyframes plant{0%{transform:translateY(-45%) scale(.6);opacity:0}100%{transform:none;opacity:1}}
.c.f.uf::after{animation:unplant .18s ease-in both}
@keyframes unplant{to{transform:translateY(-35%) scale(.7);opacity:0}}
.c.m{background:rgba(160,150,120,.85)}
.c.m::after{background-image:var(--mine);animation:mpop .3s ease-out both}
@keyframes mpop{0%{transform:scale(.3)}70%{transform:scale(1.15)}100%{transform:none}}
.c.boom{background:#c43a24!important}
.c.wf::after{background-image:var(--flag);opacity:.7}
.c.wf::before{content:'';position:absolute;inset:8%;z-index:2;background:linear-gradient(45deg,#0000 44%,#c41c0c 44% 56%,#0000 56%),linear-gradient(-45deg,#0000 44%,#c41c0c 44% 56%,#0000 56%)}
.c.tg{outline:3px dashed #ffe36a;outline-offset:-3px;animation:tgp .9s ease-in-out infinite alternate;z-index:2}
@keyframes tgp{from{outline-color:#ffe36a}to{outline-color:#ff8a3a}}
.c.hn{box-shadow:inset 0 0 0 3px #ff9d2e,0 0 12px #ffb54a;z-index:2}
.blast{position:absolute;z-index:4;pointer-events:none;border-radius:50%;background:radial-gradient(circle,#fff6c8 0,#ffb53a 28%,#e2491f 52%,#5a1d0c00 72%);animation:blast .55s ease-out forwards}
@keyframes blast{from{transform:scale(.2);opacity:1}to{transform:scale(1.6);opacity:0}}
.radar{position:absolute;z-index:4;pointer-events:none;border-radius:50%;border:2px solid #c2f7a4;box-shadow:0 0 14px #8fe76f,inset 0 0 14px #8fe76f88;background:conic-gradient(from 0deg,#8fe76f00 0 300deg,#8fe76f55 360deg);animation:radar .8s ease-out forwards}
@keyframes radar{from{transform:scale(.1) rotate(0);opacity:1}to{transform:scale(1) rotate(300deg);opacity:0}}
#mark{max-width:600px;margin:6px auto 0;text-align:right;font:900 12px/1 var(--zh);letter-spacing:.6em;color:#d9cfa5;opacity:.45}
#flash{position:fixed;inset:0;z-index:70;background:#fff6dc;pointer-events:none;opacity:0}
#toast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:75;max-width:86vw;text-align:center;background:#1d2114ee;border:2px solid #c9b46a;color:#f3eccf;font:800 20px/1.4 var(--zh);padding:12px 20px;border-radius:12px;pointer-events:none;opacity:0;transition:opacity .25s}
#toast.show{opacity:1}
/* 對話框 */
#modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:#0b0d07b8;backdrop-filter:blur(2px)}
#modal[hidden]{display:none}
.box{width:min(100%,560px);max-height:calc(100vh - 32px);overflow:auto;padding:18px;border-radius:14px;background:linear-gradient(#2e331f,#23271a);border:2px solid #5d6338;box-shadow:0 10px 30px #000c}
.box h2{margin:0 0 8px;font-size:22px;letter-spacing:.1em}
.box h3{margin:14px 0 8px;font-size:15px;color:#e3d27a;letter-spacing:.12em}
.box p{margin:6px 0;line-height:1.6;font-size:15px}
.box .note{font-size:13px;opacity:.8}
.mhead{display:flex;gap:12px;align-items:center;margin-bottom:6px}
.mhead img{width:62px;height:62px;object-fit:contain;filter:sepia(.6) hue-rotate(30deg) saturate(.8)}
.mhead small{font-size:12px;letter-spacing:.3em;color:#e3d27a}
.mhead h2{margin:2px 0 0}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opts .btn{display:flex;flex-direction:column;gap:4px;align-items:flex-start;padding:10px 14px}
.opts .btn small{font-size:11px;font-weight:700;opacity:.8;letter-spacing:0}
.mbtns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
.rules li{margin:4px 0;line-height:1.55}
/* 軍牌排行榜 */
.tags{margin:6px 0}
.tag{position:relative;display:grid;grid-template-columns:2.1em minmax(0,1fr) auto;align-items:center;gap:8px;margin:7px 2px;padding:9px 14px 9px 32px;border-radius:16px 9px 9px 16px;background:linear-gradient(170deg,#eef1f3,#aeb5bc 42%,#dfe3e6 58%,#8f979e);color:#2a2f33;font:800 16px/1.2 var(--zh);box-shadow:inset 0 1px 0 #fff,inset 0 -2px 3px #0005,0 2px 5px #0008;text-shadow:0 1px 0 #ffffffb0;opacity:0;animation:tagin .4s cubic-bezier(.2,1.3,.4,1) both;animation-delay:calc(var(--i)*70ms)}
.tag::before{content:'';position:absolute;left:11px;top:50%;width:11px;height:11px;margin-top:-5.5px;border-radius:50%;background:#23271a;box-shadow:inset 0 1px 2px #000,0 1px 0 #fff8}
.tag.g1{background:linear-gradient(170deg,#fff2bf,#caa244 42%,#f1d98a 58%,#9c7420)}
.tag.g3{background:linear-gradient(170deg,#f3d1b4,#b07446 42%,#e0ab82 58%,#7c4a25)}
.tag .no{font:900 18px/1 var(--num);letter-spacing:.04em}
.tag .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag .tm{font:900 18px/1 var(--num);white-space:nowrap}
.tag .tm small{font:700 11px var(--zh);margin-left:2px}
.tag.me{outline:3px solid var(--lime);outline-offset:1px}
.tag.me .nm::after{content:'新';margin-left:6px;padding:1px 4px;border-radius:4px;background:#5b6b2a;color:#f3f7d8;font-size:11px;text-shadow:none;vertical-align:2px}
@keyframes tagin{from{opacity:0;transform:translateX(-18px) rotate(-2deg)}to{opacity:1;transform:none}}
.rk{width:min(100%,440px);text-align:left}
.rk .pill,.pill{display:inline-block;margin:4px 0;padding:4px 10px;border-radius:999px;background:#ffffff14;font-size:13px}
.rk-f{display:flex;gap:8px;margin:6px 0}
.rk-f input{flex:1;min-width:0;padding:10px 12px;border-radius:8px;border:2px solid #6b7140;background:#151810;color:var(--cream);font:700 16px var(--zh)}
/* 結算 */
#fin{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:10px;padding:24px 16px;overflow-x:hidden;overflow-y:auto;text-align:center}
#fin[hidden]{display:none}
#fin.win{background:radial-gradient(circle at 50% 30%,#4d5a26f2,#1a1f0ef7 70%)}
#fin.lose{background:radial-gradient(circle at 50% 35%,#3a1d14f2,#0e0a08f7 70%)}
.ftitle{font:900 min(15vw,64px)/1.1 var(--zh);letter-spacing:.22em;margin-left:.22em;background:repeating-linear-gradient(90deg,currentColor 0 .47em,#0000 .47em .54em,currentColor .54em 1.22em);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:fbig .6s cubic-bezier(.2,1.4,.4,1) .35s both}
#fin.win .ftitle{color:#f3e7b0;filter:drop-shadow(0 3px 0 #2b300f) drop-shadow(0 0 16px #c9e05a66)}
#fin.lose .ftitle{color:#ff8a6a;filter:drop-shadow(0 3px 0 #3a0c04) drop-shadow(0 0 18px #ff4a2a66)}
@keyframes fbig{0%{opacity:0;transform:scale(2.4)}60%{opacity:1;transform:scale(.94)}100%{opacity:1;transform:none}}
.fsub{font-size:16px;opacity:.9;animation:fade .5s .7s both}
.fstat{font-size:15px;line-height:1.7;opacity:.95;animation:fade .5s .85s both}
.fstat b{font:900 22px var(--num);color:#f0dc72}
.newrec{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:6px;background:#c9e05a;color:#1d2114;font-weight:900;font-size:13px;animation:fbig .5s 1.1s both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px;animation:fade .5s 1s both}
.seal{width:min(34vw,150px);height:auto;animation:sealin .55s cubic-bezier(.2,1.5,.4,1) .9s both}
@keyframes sealin{0%{opacity:0;transform:scale(2.6) rotate(-24deg)}60%{opacity:1;transform:scale(.9) rotate(-6deg)}100%{opacity:.92;transform:rotate(-8deg)}}
.crack{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.crack path{fill:none;stroke:#fff;stroke-opacity:.5;stroke-width:1.8px;vector-effect:non-scaling-stroke;filter:drop-shadow(0 0 2px #fff8);stroke-dasharray:1200;stroke-dashoffset:1200;animation:crk .5s ease-out forwards}
@keyframes crk{to{stroke-dashoffset:0}}
.smoke{position:fixed;bottom:-60px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,#6b625acc,#6b625a00 70%);pointer-events:none;animation:smk linear infinite}
@keyframes smk{from{transform:translateY(0) scale(.6);opacity:0}15%{opacity:.7}to{transform:translateY(-110vh) scale(2.2);opacity:0}}
.fx-shake{animation:shake .5s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translate(-2px,1px)}20%,80%{transform:translate(4px,-2px)}30%,50%,70%{transform:translate(-7px,3px)}40%,60%{transform:translate(7px,-3px)}}
@media (max-width:520px){header h1{font-size:18px}header h1 small{display:none}.btn{padding:8px 10px;font-size:13px}.crate,.watch{min-width:96px}.crate b,.watch b{font-size:24px}}
@media (prefers-reduced-motion:reduce){.c.o.rv,.c.f::after,.c.m::after,.tag,.ftitle,.seal,.fsub,.fstat,.fbtns,.newrec{animation:none!important;opacity:1}.radar,.blast,.smoke{display:none}.crack path{animation:none;stroke-dashoffset:0}}
</style>
</head>

 </header>

  <div class="watch"><small>用時</small><b id="clock">000.0</b></div>

 <div id="tools">

 <div id="mark">鳩特數理</div>
</div>
<div id="modal" hidden><div class="box" id="mbox"></div></div>
<div id="fin" hidden></div>
<div id="toast"></div>
<div id="flash"></div>
<script type="application/json" id="lessons">

 {"t":"數字是什麼","W":5,"H":3,"mines":[[2,0],[4,2]],"open":[[0,0],[1,0],[0,1],[1,1],[2,1],[3,1],[0,2],[1,2],[2,2],[3,2]],"steps":[

  {"flag":[[2,0]],"hint":[[1,0]],"say":"看發光的這個 1：它周圍只剩右邊 1 格還沒翻開，所以那格一定是雷！長按那格插旗（也可以先切到「旗」再點）。"},

<script id="mse">var MSE=(function(){
/* 盤面：W 寬 H 高，格子編號 i=y*W+x；mine[i]=1 是雷；num[i] 周圍雷數 */
function nbrs(W,H){const N=W*H,out=new Array(N);
 for(let i=0;i<N;i++){const x=i%W,y=(i/W)|0,a=[];
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const X=x+dx,Y=y+dy;if(X>=0&&Y>=0&&X<W&&Y<H)a.push(Y*W+X)}
  out[i]=a}
 return out}
const NB={};function getNb(W,H){const k=W+'x'+H;return NB[k]||(NB[k]=nbrs(W,H))}
function rng(seed){let s=seed>>>0||1;return()=>{s^=s<<13;s>>>=0;s^=s>>>17;s^=s<<5;s>>>=0;return s/4294967296}}
function place(W,H,M,first,rand){const N=W*H,nb=getNb(W,H),ban=new Uint8Array(N);ban[first]=1;for(const j of nb[first])ban[j]=1;
 const pool=[];for(let i=0;i<N;i++)if(!ban[i])pool.push(i);
 for(let k=0;k<M;k++){const j=k+((rand()*(pool.length-k))|0);const t=pool[k];pool[k]=pool[j];pool[j]=t}
 const mine=new Uint8Array(N);for(let k=0;k<M;k++)mine[pool[k]]=1;return mine}
function numbers(W,H,mine){const nb=getNb(W,H),N=W*H,num=new Uint8Array(N);for(let i=0;i<N;i++){let c=0;for(const j of nb[i])c+=mine[j];num[i]=c}return num}
/* 打開一格（零會連鎖），回傳依擴散順序的格子清單 */
function flood(W,H,num,mine,open,start){const nb=getNb(W,H),out=[];if(open[start])return out;
 const q=[start];open[start]=1;
 for(let h=0;h<q.length;h++){const i=q[h];out.push(i);if(mine[i]||num[i])continue;for(const j of nb[i])if(!open[j]){open[j]=1;q.push(j)}}
 return out}
/* 純推理：從目前已開的格子出發，只用確定的推論。回傳是否能全部解開，以及使用的步數 */
function solve(W,H,mine,num,startOpen,M,opt){
 const N=W*H,nb=getNb(W,H),open=new Uint8Array(N),flag=new Uint8Array(N);
 let left=N-M,opened=0;
 const doOpen=i=>{const c=flood(W,H,num,mine,open,i);opened+=c.length};
 if(Array.isArray(startOpen))for(const i of startOpen)doOpen(i);else doOpen(startOpen);
 let flags=0,steps=0;
 while(opened<left){let prog=false;
  // 收集邊界限制式
  const cons=[];
  for(let i=0;i<N;i++){if(!open[i]||!num[i])continue;let r=num[i];const u=[];for(const j of nb[i]){if(flag[j])r--;else if(!open[j])u.push(j)}
   if(!u.length)continue;
   if(r===0){for(const j of u)if(!open[j]){doOpen(j);prog=true}}
   else if(r===u.length){for(const j of u)if(!flag[j]){flag[j]=1;flags++;prog=true}}
   else cons.push({u,r})}
  if(prog){steps++;continue}
  // 兩兩比較（集合規則）
  const byCell=new Map();cons.forEach((c,k)=>{for(const j of c.u){let a=byCell.get(j);if(!a)byCell.set(j,a=[]);a.push(k)}});
  const safe=new Set(),mines=new Set();
  for(let a=0;a<cons.length&&!safe.size&&!mines.size;a++){const A=cons[a],cand=new Set();for(const j of A.u)for(const k of byCell.get(j))if(k!==a)cand.add(k);
   const As=new Set(A.u);
   for(const b of cand){const B=cons[b];const BnA=B.u.filter(j=>!As.has(j)),Bs=new Set(B.u),AnB=A.u.filter(j=>!Bs.has(j));
    // B 比 A 多的雷全部落在 B\A，且 A\B 不能有雷
    if(B.r-A.r===BnA.length&&BnA.length){BnA.forEach(j=>mines.add(j));AnB.forEach(j=>safe.add(j))}
    else if(!AnB.length&&B.r===A.r&&BnA.length){BnA.forEach(j=>safe.add(j))}}}
  if(safe.size||mines.size){for(const j of mines)if(!flag[j]){flag[j]=1;flags++}for(const j of safe)if(!open[j]&&!mine[j])doOpen(j);steps++;continue}
  // 總雷數
  const rem=M-flags;let unk=0;for(let i=0;i<N;i++)if(!open[i]&&!flag[i])unk++;
  if(rem===0){for(let i=0;i<N;i++)if(!open[i]&&!flag[i])doOpen(i);steps++;continue}
  if(rem===unk){for(let i=0;i<N;i++)if(!open[i]&&!flag[i]){flag[i]=1;flags++}steps++;continue}
  return {ok:false,steps,opened,open,flag}}
 return {ok:true,steps,opened,open,flag}}
/* 產生保證不用猜的盤面：隨機佈雷後，若推理卡住，就把邊界上的雷和遠處交換（爬山法），直到能純推理解完 */
function generate(W,H,M,first,seed,budget){const rand=rng(seed||((Math.random()*4294967295)>>>0));budget=budget||8000;
 const N=W*H,nb=getNb(W,H),ban=new Uint8Array(N);ban[first]=1;for(const j of nb[first])ban[j]=1;
 let best=null,spent=0,restarts=0;
 while(spent<budget){restarts++;
  let mine=place(W,H,M,first,rand),num=numbers(W,H,mine),r=solve(W,H,mine,num,first,M);spent++;
  for(let it=0;it<250&&!r.ok&&spent<budget;it++,spent++){
   const front=[],far=[];
   for(let i=0;i<N;i++){if(r.open[i]||r.flag[i]||ban[i])continue;let adj=false;for(const j of nb[i])if(r.open[j]){adj=true;break}(adj?front:far).push(i)}
   if(!front.length)break;
   const f=front[(rand()*front.length)|0];
   let pool=far.filter(g=>mine[g]!==mine[f]);if(!pool.length)pool=front.filter(g=>g!==f&&mine[g]!==mine[f]);if(!pool.length)break;
   const g=pool[(rand()*pool.length)|0];mine[f]^=1;mine[g]^=1;
   const num2=numbers(W,H,mine),r2=solve(W,H,mine,num2,first,M);
   if(r2.ok||r2.opened>=r.opened){num=num2;r=r2}else{mine[f]^=1;mine[g]^=1}}
  if(r.ok)return {mine,num,ok:true,restarts,spent};
  if(!best||r.opened>best.opened)best={mine:mine.slice(),num,opened:r.opened}}
 return {mine:best.mine,num:best.num,ok:false,restarts,spent}}
return {getNb,rng,place,numbers,flood,solve,generate}
})();
if(typeof module!=='undefined')module.exports=MSE;
</script>

function badName(v){let t=String(v).toLowerCase().normalize('NFKC');
 t=t.replace(/[0@4]/g,c=>({'0':'o','@':'a','4':'a'}[c])).replace(/[1!|]/g,'i').replace(/3/g,'e').replace(/[5$]/g,'s').replace(/7/g,'t');
 t=t.replace(/[\s​._\-~*+=#^%&\/\\,，。．、·'"`()（）\[\]{}<>《》「」『』:：;；?？]/g,'');
 t=t.replace(/幹部|能幹|樹幹|才幹|骨幹|主幹|幹事|幹勁|幹練|苦幹|實幹|精幹|幹線|軀幹/g,'');
 if(t.includes('幹'))return true;const u=t.replace(/(.)\1+/g,'$1');
 return BADW.some(w=>t.includes(w)||u.includes(w))}
function rkDoSubmit(){const inp=$('rkName');if(!inp)return;const n=inp.value.trim().slice(0,12);if(!n){inp.focus();return toast('請先輸入代號')}
 if(badName(n)){inp.focus();return toast('代號含有不適當的字詞，請換一個')}
 LS.set('ms_name',n);const g=G,lv=g.lv,b=document.querySelector('[data-act=rksubmit]');if(b)b.disabled=true;
 rkSubmit(lv,{n,s:Math.round(g.ms)}).then(id=>rkTop(lv).then(list=>{const box=$('rkBox');if(!box)return;box.innerHTML=`<h3 style="margin:8px 0 2px;text-align:center;color:#e3d27a;letter-spacing:.15em">${LV[lv].n}榮譽榜</h3><p class="pill" style="display:block;text-align:center">已刻上軍牌！</p>${rkTags(list,id)}`;sfx('stamp');rkClink(list.length)}))
 .catch(e=>{if(b)b.disabled=false;toast(rkErr(e))})}
let RKV=OPT.lv;
function showRank(){const o=k=>`<button class="btn${RKV===k?' on':''}" data-act="rkopt" data-v="${k}">${LV[k].n}</button>`;
 modal(`<h2>榮譽榜</h2><p class="note">每個難度依完成秒數排名，取前十名。名字刻在軍牌上，所有人共用同一份榜單。</p><div class="opts">${o('b')}${o('i')}${o('e')}</div><div id="rkView"><p class="pill">讀取中…</p></div><div class="mbtns"><button class="btn" data-act="menu">返回</button></div>`);
 const lv=RKV;rkTop(lv).then(list=>{if(RKV===lv&&$('rkView')){$('rkView').innerHTML=rkTags(list);rkClink(list.length)}}).catch(e=>{if($('rkView'))$('rkView').innerHTML=`<p class="pill">${rkErr(e)}</p>`})}
/* ===== 教學 ===== */
const has=(arr,i)=>!!arr&&arr.some(([x,y])=>y*G.W+x===i);
const curStep=()=>{const l=G&&G.lesson;if(!l||l.free)return null;return LESSONS[l.li].steps[l.si]||null};
function startLesson(li){closeModal();const L=LESSONS[li];
 if(L.free)newGame('b',{W:L.W,H:L.H,M:L.M,seed:L.seed,lesson:{li,free:true}});
 else newGame('b',{W:L.W,H:L.H,mines:L.mines,open:L.open,lesson:{li,si:0}});
 brief()}
function brief(){const b=$('brief');if(!G.lesson){b.className='';return}const l=G.lesson,L=LESSONS[l.li],n=LESSONS.length;
 G.el.forEach(e=>e.classList.remove('tg','hn'));
 const st=curStep();let txt,btn='';
 if(l.free)txt=L.say;
 else if(!st){txt='完成！你已經學會這一招了。';btn=l.li+1<n?`<button class="btn pri" data-act="les" data-v="${l.li+1}">下一課</button>`:''}
 else{txt=st.say;if(st.info)btn='<button class="btn pri" data-act="lnext">下一步</button>';
  for(const [x,y] of st.hint||[])G.el[y*G.W+x].classList.add('hn');
  for(const [x,y] of (st.dig||[]).concat(st.flag||[])){const i=y*G.W+x;if(!G.open[i]&&!(G.flag[i]&&has(st.flag,i)))G.el[i].classList.add('tg')}}
 b.innerHTML=`<h4>作戰簡報 ${l.li+1}/${n}・${L.t}</h4><p>${txt}</p><div class="bb"><button class="btn" data-act="lquit">離開教學</button>${btn}</div>`;
 b.className='show'}
function stepDone(st){return(st.dig||[]).every(([x,y])=>G.open[y*G.W+x])&&(st.flag||[]).every(([x,y])=>G.flag[y*G.W+x])}
function lessonGate(i,kind,cells){const st=curStep();if(!G.lesson||G.lesson.free)return true;
 if(!st){toast('這一課完成了，按「下一課」繼續');return false}
 if(st.info){toast('先看完說明，按「下一步」');return false}
 if(kind==='dig'){if(has(st.dig,i))return true;toast(has(st.flag,i)?'這格一定是雷！長按它插旗':'先處理閃爍的格子');return false}
 if(kind==='flag'){if(has(st.flag,i))return true;toast(has(st.dig,i)?'這格是安全的，點一下挖開':'先處理閃爍的格子');return false}
 if(kind==='unflag'){toast('旗子插對了，不用拔掉');return false}
 if(kind==='chord'){if(cells.every(j=>has(st.dig,j)))return true;toast('先處理閃爍的格子');return false}
 return false}
function lessonCheck(){const st=curStep();if(!st||st.info||!stepDone(st))return brief();
 G.lesson.si++;sfx('ok');const l=G.lesson;
 if(!curStep()){const p=LS.get('ms_les',0);if(l.li+1>p)LS.set('ms_les',l.li+1);toast('這一課完成！')}
 setTimeout(()=>{if(G&&G.lesson===l)brief()},380)}
/* ===== 介面 ===== */
let tT;function toast(t){if(SIM)return;const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(tT);tT=setTimeout(()=>e.classList.remove('show'),1500)}
function modal(h){$('mbox').innerHTML=h;$('modal').hidden=false}
function closeModal(){$('modal').hidden=true}
function showMenu(){
 const o=k=>`<button class="btn${OPT.lv===k?' on':''}" data-act="lv" data-v="${k}">${LV[k].n}<small>${LV[k].W}×${LV[k].H}・${LV[k].M} 顆雷</small></button>`;
 const R=rec(),best=k=>R[k]&&R[k].best!=null?`${LV[k].n} ${(R[k].best/1000).toFixed(1)} 秒`:'';const bl=['b','i','e'].map(best).filter(Boolean).join('、');
 modal(`<div class="mhead"><img src="${BRAND.gold}" alt=""><div><small>鳩特數理</small><h2>鳩特踩地雷</h2></div></div>
 <p>翻開所有沒有地雷的格子就算任務完成。每一盤都保證只靠推理就能解開，不需要猜，第一下一定是安全的空地。</p>
 <h3>難度</h3><div class="opts">${o('b')}${o('i')}${o('e')}</div>
 <p class="note">特戰在直式手機上會自動轉成 16×30，並可以用「＋／－」縮放。${bl?'<br>個人最佳：'+bl:''}</p>
 <div class="mbtns"><button class="btn" data-act="rank">榮譽榜</button><button class="btn" data-act="tutor">新手教學</button><button class="btn" data-act="rules">操作說明</button>${G&&G.state==='play'&&!G.lesson?'<button class="btn" data-act="close">繼續</button>':''}<button class="btn pri" data-act="start">開始</button></div>`)}
function showRules(){modal(`<h2>操作說明</h2><ul class="rules">
 <li><b>挖開：</b>點一下鋼板。數字代表周圍 8 格裡有幾顆地雷。</li>
 <li><b>插旗：</b>長按格子；或把上方切到「旗」再點。再按一次可以拔旗。電腦可以按右鍵。</li>
 <li><b>快速展開：</b>點已翻開的數字，如果周圍旗子數量剛好等於數字，其餘格子會一次挖開。旗子插錯會踩雷！</li>
 <li><b>重新出任務：</b>按中間的鋼盔。</li>
 <li><b>勝利：</b>所有安全格都挖開；剩下的地雷會自動插旗。</li></ul><div class="mbtns"><button class="btn" data-act="menu">返回</button></div>`)}
function showTutor(){const p=LS.get('ms_les',0);modal(`<h2>新手教學</h2><p class="note">一課一個小雷區，跟著閃爍的格子操作。</p><div class="opts" style="flex-direction:column">${LESSONS.map((L,i)=>`<button class="btn${i<p?' on':''}" data-act="les" data-v="${i}">第 ${i+1} 課・${L.t}${i<p?'<small>已完成</small>':''}</button>`).join('')}</div><div class="mbtns"><button class="btn" data-act="menu">返回</button></div>`)}
if(!SIM){
 texture();bgmSync();
 const B=$('board');
 const press=(i,on)=>{const e=G.el[i];if(!e)return;if(!G.open[i]&&!G.flag[i])e.classList.toggle('pr',on);else if(G.open[i]&&G.num[i])for(const j of nb(G.W,G.H)[i])if(!G.open[j]&&!G.flag[j])G.el[j].classList.toggle('pr',on)};
 const cancel=()=>{if(!PD)return;clearTimeout(PD.t);press(PD.i,false);PD=null};
 B.addEventListener('contextmenu',e=>e.preventDefault());
 B.addEventListener('pointerdown',e=>{const c=e.target.closest('.c');if(!c||!G||G.state==='win'||G.state==='lose')return;ac();if(BGM.on)BGM.start();const i=+c.dataset.i;
  if(e.button===2){act(i,'flag');return}if(e.button!==0)return;cancel();
  PD={i,x:e.clientX,y:e.clientY,id:e.pointerId,long:false};press(i,true);
  PD.t=setTimeout(()=>{if(!PD)return;PD.long=true;press(PD.i,false);if(!G.open[PD.i])act(PD.i,'flag')},380)});
 B.addEventListener('pointermove',e=>{if(PD&&e.pointerId===PD.id&&Math.hypot(e.clientX-PD.x,e.clientY-PD.y)>10)cancel()});
 addEventListener('pointerup',e=>{if(!PD||e.pointerId!==PD.id)return;const p=PD;cancel();if(p.long)return;const c=document.elementFromPoint(e.clientX,e.clientY);const cc=c&&c.closest&&c.closest('.c');if(!cc||+cc.dataset.i!==p.i)return;act(p.i,'tap')});
 addEventListener('pointercancel',cancel);
 addEventListener('resize',()=>{clearTimeout(fit.t);fit.t=setTimeout(fit,120)});
 document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act,v=el.dataset.v;ac();
  if(a!=='bgm'&&a!=='snd')sfx('tap');
  if(a==='menu'){hideFin();return showMenu()}
  if(a==='close')return closeModal();
  if(a==='lv'){OPT.lv=v;LS.set('ms_opt',OPT);return showMenu()}
  if(a==='start'){closeModal();$('brief').className='';newGame(OPT.lv);if(BGM.on)BGM.start();return}
  if(a==='go'){OPT.lv=v;LS.set('ms_opt',OPT);closeModal();$('brief').className='';newGame(v);return}
  if(a==='again'){hideFin();if(G&&G.lesson)return startLesson(G.lesson.li);$('brief').className='';newGame(G?G.lv:OPT.lv);return}
  if(a==='hidefin')return hideFin();
  if(a==='mode')return setMode(v);
  if(a==='zoom'){ZOOM=Math.max(1,Math.min(2,ZOOM*(v>0?1.25:.8)));if(ZOOM<1.05)ZOOM=1;return fit()}
  if(a==='bgm'){BGM.on=!BGM.on;LS.set('ms_bgm',BGM.on);return bgmSync()}
  if(a==='snd'){MUTE=!MUTE;LS.set('ms_mute',MUTE);bgmSync();return sfx('tap')}
  if(a==='rank'){RKV=OPT.lv;return showRank()}
  if(a==='rkopt'){RKV=v;return showRank()}
  if(a==='rksubmit')return rkDoSubmit();
  if(a==='rules')return showRules();
  if(a==='tutor')return showTutor();
  if(a==='les'){hideFin();return startLesson(+v)}
  if(a==='lnext'){if(G.lesson){G.lesson.si++;lessonCheck()}return}
  if(a==='lquit'){$('brief').className='';return newGame(OPT.lv)}
 });
 $('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal()});
 addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='rkName')rkDoSubmit()});
 newGame(OPT.lv);showMenu();
}
}
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, push, query, orderByChild, limitToFirst, get, serverTimestamp, goOnline, goOffline } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
const app=initializeApp({apiKey:"AIzaSyA7TJh1sfGLUVGQgFhdvFLd9Xm5_l447Ug",authDomain:"element-uno.firebaseapp.com",databaseURL:"https://element-uno-default-rtdb.firebaseio.com",projectId:"element-uno",storageBucket:"element-uno.firebasestorage.app",messagingSenderId:"665324599764",appId:"1:665324599764:web:d151cd9014e600fcd53e41"},"ms-rank");
const db=getDatabase(app);
/* 讀寫完就斷線，避免佔用同時連線數 */
let users=0,offT=0;const once=async f=>{users++;clearTimeout(offT);goOnline(db);try{return await f()}finally{users--;clearTimeout(offT);if(!users)offT=setTimeout(()=>{if(!users)goOffline(db)},1500)}};
window.MSRank={
 async top(lv){return once(async()=>{const snap=await get(query(ref(db,"ms_rank/"+lv),orderByChild("s"),limitToFirst(10)));const out=[];snap.forEach(c=>{const v=c.val();if(v&&typeof v.s==="number")out.push({id:c.key,n:String(v.n||"").slice(0,12),s:v.s,t:v.t||0})});return out.sort((a,b)=>a.s-b.s||a.t-b.t)})},
 async submit(lv,rec){return once(async()=>{const r=await push(ref(db,"ms_rank/"+lv),{n:rec.n,s:rec.s,t:serverTimestamp()});return r.key})}
};
dispatchEvent(new Event("msrank-ready"));
</script>
</body>
