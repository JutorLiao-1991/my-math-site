<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#201913">
  <meta name="description" content="鳩特象棋：五級電腦、同機雙人對戰、13 課新手教學、一手殺與三手殺各 50 題，以及逐步戰術學習。">
  <title>鳩特象棋</title>
  <link rel="stylesheet" href="rank_medals.css">
  <link rel="stylesheet" href="xiangqi.css">
  <script src="../page_views.js" defer></script>
  <script src="xiangqi_engine.js" defer></script>
  <script src="xiangqi_puzzles.js" defer></script>
  <script src="xiangqi_lessons.js" defer></script>
  <script src="xiangqi.js" defer></script>
</head>
<body>
  <div id="app">
    <header>
      <a class="home" href="../index.html" aria-label="回教材首頁">首頁</a>
      <b>鳩特象棋</b><span class="subtitle" id="modeLabel">楚河漢界・方寸之爭</span><span class="spacer"></span>
      <button id="sound" data-act="sound" aria-pressed="true">音效開</button>
      <button id="music" data-act="music" aria-pressed="false">配樂關</button>
      <button id="guides" data-act="guides" aria-pressed="false">走法關</button>
      <button id="menu" data-act="menu">選單</button>
    </header>
    <main>
      <section id="stage" aria-label="象棋棋盤">
        <div class="player" id="opponent"><span class="player-mark black">將</span><div><b id="opponentName">青年鳩特</b><small id="opponentSide">黑方</small></div><div class="taken" id="takenTop" aria-label="上方被吃的棋子"></div><span class="turn-mark" id="topTurn"></span></div>
        <div id="boardWrap">
          <div id="board" role="group" aria-label="九路十線象棋盤">
            <svg id="boardArt" viewBox="0 0 900 1000" aria-hidden="true">
              <defs><pattern id="grain" width="26" height="1000" patternUnits="userSpaceOnUse"><path d="M4 0 Q-8 240 8 510T2 1000 M21 0Q34 420 21 1000" fill="none" stroke="#80501a" stroke-opacity=".07" stroke-width="2"/></pattern></defs>
              <rect width="900" height="1000" fill="url(#grain)"/>
              <g fill="none" stroke="#62421d" stroke-width="2.3">
                <path d="M50 50H850V950H50Z M50 150H850 M50 250H850 M50 350H850 M50 450H850 M50 550H850 M50 650H850 M50 750H850 M50 850H850"/>
                <path d="M150 50V450M250 50V450M350 50V450M450 50V450M550 50V450M650 50V450M750 50V450 M150 550V950M250 550V950M350 550V950M450 550V950M550 550V950M650 550V950M750 550V950 M350 50L550 250M550 50L350 250 M350 750L550 950M550 750L350 950"/>
                <rect x="35" y="35" width="830" height="930" stroke-width="4"/>
              </g>
              <g fill="#775127" font-family="Noto Serif TC,PMingLiU,serif" font-size="43" text-anchor="middle" letter-spacing="20"><text x="264" y="516">楚河</text><text x="664" y="516">漢界</text></g>
              <g id="stars" stroke="#775127" stroke-width="2" fill="none"></g>
            </svg>
            <div id="points"></div><div id="effects" aria-hidden="true"></div>
          </div>
          <div id="files" aria-hidden="true"></div>
        </div>
        <div class="player" id="self"><span class="player-mark red">帥</span><div><b id="selfName">你</b><small id="selfSide">紅方・先手</small></div><div class="taken" id="takenBottom" aria-label="下方被吃的棋子"></div><span class="turn-mark" id="bottomTurn"></span></div>
        <button id="evaluation" data-act="evalinfo" aria-label="形勢估計說明"><span>紅方</span><span class="evaltrack"><i id="evalFill"></i></span><b id="evalText">均勢</b><span>黑方</span></button>
      </section>
      <aside id="panel">
        <div class="panel-top"><span class="eyebrow" id="modeTag">對戰鳩特</span><span id="clock">00:00</span></div>
        <div id="status" role="status" aria-live="polite">紅方先行</div>
        <section id="study" hidden aria-label="教學與挑戰"></section>
        <div id="tipBox" hidden></div>
        <div class="game-tools"><button data-act="hint" id="hintBtn">提示一手</button><button data-act="undo" id="undoBtn">悔棋</button><button data-act="resign" id="resignBtn">認輸</button></div>
        <div class="record-head"><b>棋譜</b><button data-act="export" id="exportBtn">複製棋譜</button></div>
        <ol id="kifu" aria-label="棋譜紀錄"></ol>
        <div class="panel-foot"><span id="battleRecord">每一手，都是下一步的伏筆。</span><span class="seal-small" aria-hidden="true">鳩特</span></div>
      </aside>
    </main>
  </div>
  <div id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="box" id="box" tabindex="-1"></div></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="banner" aria-hidden="true"></div>
  <noscript>請啟用 JavaScript，才能進行鳩特象棋。</noscript>
</body>
</html>
