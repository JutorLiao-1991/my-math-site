<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="鳩特五子棋：四級電腦（含會擲骰作弊的作弊鳩特）、可選連一到連五條獲勝、9／15／19 路棋盤、連珠禁手規則與配樂。">
<title>鳩特五子棋</title>
<link rel="icon" type="image/svg+xml" href="thumbs/gomoku_logo.svg">
<style>
:root{--paper:#f4ecda;--paper2:#ebe0c7;--ink:#211c18;--ink2:#4a4038;--indigo:#2c4f86;--indigo-soft:#dbe4f2;--ver:#c23b2a;--ver-soft:#f6d9d2;--gold:#b08a3e;--wood:#e4b872;--bs:300px;
 --serif:"Noto Serif TC","Songti TC","PMingLiU",Georgia,serif;--zh:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;--num:"Avenir Next","Segoe UI","Roboto",var(--zh)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--zh);overscroll-behavior:none;
 background-image:radial-gradient(120% 80% at 50% 0%,#fffaf0 0%,#0000 60%),repeating-linear-gradient(0deg,#0000 0 3px,#8a6d3b08 3px 4px),repeating-linear-gradient(90deg,#0000 0 5px,#8a6d3b06 5px 6px)}
#app{position:relative;max-width:1080px;margin:0 auto;padding:0 12px calc(24px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:8px;padding:10px 0 6px}
header a{color:var(--ink);text-decoration:none;font-size:26px;line-height:1;padding:4px 8px}
header h1{margin:0;font:900 21px/1.2 var(--serif);letter-spacing:.18em;flex:1;white-space:nowrap;display:flex;align-items:center;gap:8px}
header h1 img{width:30px;height:30px;flex:none}
header h1 small{font:700 11px var(--zh);letter-spacing:.02em;color:var(--ver);white-space:nowrap}
.btn{appearance:none;border:1.5px solid var(--ink);border-radius:10px;padding:9px 14px;font:800 14px/1 var(--zh);color:var(--ink);background:#fffaf0;cursor:pointer;letter-spacing:.06em;white-space:nowrap;box-shadow:0 2px 0 var(--ink)}
.btn:active{transform:translateY(2px);box-shadow:0 0 0 var(--ink)}
.btn.pri{background:var(--ink);color:var(--paper)}
.btn.ver{background:var(--ver);border-color:#7d2015;color:#fff;box-shadow:0 2px 0 #7d2015}
.btn[disabled]{opacity:.4;pointer-events:none}
/* 版面：直向上下、橫放左右 */
#play{display:flex;flex-direction:column;align-items:center;gap:8px}
#boardWrap{position:relative;width:var(--bs);height:var(--bs);--bs:min(calc(100vw - 24px),700px,calc(100dvh - 350px));min-width:288px;min-height:288px;order:2}
#board{position:absolute;inset:0;width:100%;height:100%;border-radius:8px;box-shadow:0 10px 26px -10px #3b2a1499,0 0 0 2px #5b3615;touch-action:manipulation;cursor:pointer}
#opp{order:1}#me{order:3}#status{order:4}#tools{order:5}
.side{width:min(100%,700px)}
#opp,#me{display:flex;align-items:center;gap:10px;padding:7px 10px;border:1.5px solid #b9a98a;border-radius:12px;background:#fffaf0cc;transition:box-shadow .2s,border-color .2s}
.card.turn{border-color:var(--ink);box-shadow:0 0 0 2px #e4b87299,0 3px 0 var(--ink)}
.av{position:relative;flex:none;width:40px;height:40px}
.av img{width:40px;height:40px;display:block}
.av .stone{position:absolute;right:-6px;bottom:-6px;width:17px;height:17px;border-radius:50%;border:1px solid #0006;box-shadow:0 1px 2px #0005}
.stone.b{background:radial-gradient(circle at 35% 30%,#5d5953,#2a2724 45%,#0b0a09)}
.stone.w{background:radial-gradient(circle at 35% 30%,#fff,#f1ece0 55%,#cbc2ab);border-color:#8a7a5a}
.who{flex:1;min-width:0}
.who b{display:block;font:900 16px var(--serif);letter-spacing:.1em}
.who small{display:block;font-size:12px;color:var(--ink2);margin-top:1px}
.prog{display:flex;align-items:center;gap:4px;margin-top:3px}
.prog i{width:14px;height:14px;border-radius:50%;border:1.5px solid #8a7c6c;background:#0000;display:block}
.prog i.on{background:var(--ver);border-color:#7d2015}
.prog span{font:800 12px var(--num);color:var(--ink2);margin-left:4px}
.die{position:relative;flex:none;width:44px;height:44px;border-radius:10px;background:#fffaf0;border:1.5px solid #8a7c6c;display:none;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:6px;gap:0;box-shadow:0 2px 0 #8a7c6c}
.die.on{display:grid}
.die b{display:block;width:7px;height:7px;border-radius:50%;background:transparent;margin:auto}
.die b.p{background:#211c18}
.die.rolling{animation:shake .14s linear infinite}
.die.six{background:#fff3c9;border-color:var(--ver);box-shadow:0 0 0 3px #c23b2a55,0 2px 0 var(--ver)}
.die.six b.p{background:var(--ver)}
@keyframes shake{25%{transform:rotate(-12deg) translateY(-2px)}75%{transform:rotate(12deg) translateY(2px)}}
#status{width:min(100%,700px);min-height:46px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 12px;border:1.5px dashed #b9a98a;border-radius:12px;font-size:15px;line-height:1.5;color:var(--ink)}
#status.warn{border-style:solid;border-color:var(--ver);background:var(--ver-soft);color:#7d2015;font-weight:800}
#status.good{border-style:solid;border-color:var(--indigo);background:var(--indigo-soft);color:#1b3561;font-weight:800}
#tools{width:min(100%,700px);display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.tool{appearance:none;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;font:700 12px var(--zh);color:var(--ink2);cursor:pointer;border-radius:10px}
.tool i{font-style:normal;display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--ink);background:#fffaf0;font:900 18px var(--zh);color:var(--ink)}
.tool.on i{background:var(--indigo);color:#fff;border-color:#1b3561}
.tool.on{color:var(--indigo)}
.tool.off i{opacity:.5;text-decoration:line-through}
.tool[disabled]{opacity:.35;pointer-events:none}
/* 新手教學 */
#lessonBox{order:3;width:min(100%,700px);display:flex;flex-direction:column;gap:7px;padding:10px 12px;border:1.5px solid var(--ink);border-radius:14px;background:#fffaf0;box-shadow:0 3px 0 var(--ink)}
#lessonBox[hidden]{display:none}
.lsTop{display:flex;align-items:center;gap:8px}
.lsNo{font:800 12px var(--zh);color:var(--ver);letter-spacing:.06em;white-space:nowrap}
.lsDots{flex:1;display:flex;gap:4px;justify-content:flex-end}
.lsDots i{width:16px;height:5px;border-radius:3px;background:#cdbd9c;display:block}
.lsDots i.on{background:var(--indigo)}.lsDots i.cur{background:var(--ver)}
.mini{appearance:none;flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--ink);background:#fffaf0;font:900 14px var(--zh);color:var(--ink);cursor:pointer;padding:0}
.mini.on{background:var(--indigo);color:#fff;border-color:#1b3561}.mini.off{opacity:.45;text-decoration:line-through}
#lessonBox h3{margin:0;font:900 18px var(--serif);letter-spacing:.1em}
#lsText{margin:0;font-size:15px;line-height:1.7}
#lsText b{color:var(--ver)}
#lsFb{font-size:14px;line-height:1.6;padding:7px 10px;border-radius:10px;font-weight:700}
#lsFb:empty{display:none}
#lsFb.bad{background:var(--ver-soft);color:#7d2015}#lsFb.good{background:var(--indigo-soft);color:#1b3561}
#lsProg:empty{display:none}
.lsBtns{display:flex;gap:8px;justify-content:flex-end;margin-top:2px}
.lsBtns .btn{padding:11px 14px}.lsBtns .btn.pri{flex:1}
.lsBtns .btn[hidden]{display:none}
.lsList{display:grid;gap:7px;margin-top:8px}
.lsList button{appearance:none;display:flex;align-items:center;gap:10px;text-align:left;border:1.5px solid var(--ink);border-radius:12px;background:#fffaf0;padding:10px 12px;font:800 15px var(--zh);color:var(--ink);cursor:pointer;box-shadow:0 2px 0 var(--ink)}
.lsList button:active{transform:translateY(2px);box-shadow:none}
.lsList span{flex:none;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center;font:900 13px var(--num)}
.lsList em{margin-left:auto;font-style:normal;color:var(--indigo)}
#play.lesson #opp,#play.lesson #me,#play.lesson #status,#play.lesson #tools{display:none}
#play.lesson.lcards #opp{display:flex}
@media not all and (min-width:760px) and (min-aspect-ratio:5/4){#play.lesson #boardWrap{--bs:min(calc(100vw - 24px),700px,calc(100dvh - 400px))}}
@media (min-width:760px) and (min-aspect-ratio:5/4){
 #play{display:grid;grid-template-columns:auto 330px;grid-template-rows:auto auto auto auto 1fr;column-gap:22px;row-gap:10px;justify-content:center;align-items:start}
 #boardWrap{--bs:min(calc(100dvh - 110px),calc(100vw - 400px),680px);grid-column:1;grid-row:1/6}
 #opp,#me,#status,#tools,#lessonBox{grid-column:2;width:100%}
 #opp{grid-row:1}#status{grid-row:2}#me{grid-row:3}#tools{grid-row:4}
 #lessonBox{grid-row:1/5}#play.lesson.lcards #lessonBox{grid-row:2/5}
}
#banner{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none;padding:12px 22px;border-radius:14px;background:var(--ver);color:#fff;border:3px solid #7d2015;font:900 clamp(20px,6vw,32px) var(--serif);letter-spacing:.2em;white-space:nowrap;box-shadow:0 12px 30px #0006}
#banner.show{animation:ban 1.5s ease-out both}
@keyframes ban{0%{opacity:0;transform:translate(-50%,-50%) scale(.5) rotate(-6deg)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.12) rotate(2deg)}25%{transform:translate(-50%,-50%) scale(1) rotate(0)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) scale(1)}}
#mark{text-align:center;margin-top:14px;font:900 12px var(--serif);letter-spacing:.6em;color:#b9a98a}
/* 彈出視窗 */
#modal{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:14px;background:#2a1f1499;backdrop-filter:blur(3px)}
#modal[hidden]{display:none}
.mbox{width:min(540px,100%);max-height:calc(100dvh - 28px);overflow:auto;background:var(--paper);border:2px solid var(--ink);border-radius:16px;padding:18px 18px 16px;box-shadow:0 20px 40px #0006}
.mbox h2{margin:0 0 6px;font:900 24px var(--serif);letter-spacing:.2em;text-align:center}
.mbox h4{margin:14px 0 6px;font:800 14px var(--zh);color:var(--ink2);letter-spacing:.1em}
.mbox .note{color:var(--ink2);font-size:13.5px;line-height:1.65;margin:4px 0 8px}
.mbox p{line-height:1.7;font-size:14.5px;margin:6px 0}
.mbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.menuTop{display:flex;flex-direction:column;align-items:center;gap:2px;margin-bottom:4px}
.menuTop img{width:84px;height:84px;filter:drop-shadow(0 6px 8px #0004)}
.menuTop small{font:700 12px var(--serif);letter-spacing:.3em;color:var(--ver)}
.lvs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lvbtn{appearance:none;text-align:left;border:1.5px solid var(--ink);border-radius:12px;background:#fffaf0;padding:9px 11px;cursor:pointer;box-shadow:0 2px 0 var(--ink);font-family:var(--zh);color:var(--ink)}
.lvbtn b{display:block;font:900 15px var(--serif);letter-spacing:.08em}
.lvbtn span{display:block;font-size:12px;line-height:1.45;color:var(--ink2);margin-top:2px}
.lvbtn em{float:right;font-style:normal;color:var(--ver);font:800 11px var(--num)}
.lvbtn.on{background:var(--indigo-soft);border-color:var(--indigo);box-shadow:0 2px 0 var(--indigo)}
.lvbtn.cheat b::after{content:'🎲';margin-left:4px}
.lvbtn:active{transform:translateY(2px);box-shadow:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips.five{display:grid;grid-template-columns:repeat(5,1fr)}.chips.five .chip{min-width:0;padding:9px 2px}
.chip{appearance:none;flex:1 1 auto;min-width:62px;text-align:center;border:1.5px solid var(--ink);border-radius:10px;background:#fffaf0;padding:9px 8px;cursor:pointer;font:800 14px var(--zh);color:var(--ink);box-shadow:0 2px 0 var(--ink)}
.chip.on{background:var(--indigo);color:#fff;border-color:#1b3561;box-shadow:0 2px 0 #1b3561}
.chip:active{transform:translateY(2px);box-shadow:none}
.chip[disabled]{opacity:.35;pointer-events:none}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 2px;border-bottom:1px dashed #cdbd9c;font-size:14px}
.opt small{display:block;color:var(--ink2);font-size:12px}
.sw{appearance:none;width:48px;height:28px;border-radius:999px;background:#cdbd9c;position:relative;cursor:pointer;flex:none;transition:background .2s;margin:0}
.sw::after{content:'';position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s}
.sw:checked{background:var(--indigo)}.sw:checked::after{left:23px}
.sw:disabled{opacity:.4}
.rec{font-size:12px;color:var(--ink2);text-align:center;margin-top:4px}
.finish{text-align:center}
.finish img{width:96px;height:96px;animation:stamp .55s cubic-bezier(.2,1.6,.4,1) .1s both}
@keyframes stamp{from{transform:scale(2.2) rotate(-12deg);opacity:0}to{transform:scale(1) rotate(-4deg);opacity:1}}
.finish.lose img{filter:grayscale(.7)}
.ftitle{font:900 28px var(--serif);letter-spacing:.3em;margin:4px 0}
.fstat{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0 4px}
.fstat div{background:#fffaf0;border:1px solid #cdbd9c;border-radius:10px;padding:8px 4px}
.fstat b{display:block;font:900 20px var(--num)}
.fstat span{font-size:11.5px;color:var(--ink2)}
#toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translate(-50%,40px);opacity:0;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:700;transition:.25s;z-index:30;pointer-events:none;max-width:92vw;text-align:center}
#toast.show{transform:translate(-50%,0);opacity:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<script src="../page_views.js" defer></script>

<body>
<div id="app">
 <header>
  <a href="../index.html" aria-label="回首頁">‹</a>
  <h1><img src="thumbs/gomoku_logo.svg" alt="">鳩特五子棋<small id="modeLabel"></small></h1>
  <button class="btn" data-act="menu">選單</button>
 </header>
 <main id="play">
  <div id="opp" class="card side"></div>
  <section id="boardWrap">
   <canvas id="board" aria-label="五子棋棋盤"></canvas>
   <div id="banner" role="status"></div>
  </section>
  <div id="me" class="card side"></div>
  <div id="lessonBox" class="side" hidden>
   <div class="lsTop"><span class="lsNo" id="lsNo"></span><span class="lsDots" id="lsDots"></span><button class="mini" data-act="sfx" id="lsSfx" aria-label="音效">♪</button><button class="mini" data-act="music" id="lsMusic" aria-label="配樂">♬</button></div>
   <h3 id="lsTitle"></h3><p id="lsText"></p><div id="lsFb" role="status" aria-live="polite"></div><div id="lsProg"></div>
   <div class="lsBtns"><button class="btn" data-act="lshint" id="lsHint">提示</button><button class="btn" data-act="lsretry" id="lsRetry">重來</button><button class="btn pri" data-act="lsnext" id="lsNext">下一步</button></div>
  </div>
  <div id="status" role="status" aria-live="polite"></div>
  <div id="tools">
   <button class="tool" data-act="undo" id="undoBtn"><i>↶</i>悔棋</button>
   <button class="tool" data-act="hint" id="hintBtn"><i>？</i>提示</button>
   <button class="tool" data-act="sfx" id="sfxBtn"><i>♪</i>音效</button>
   <button class="tool" data-act="music" id="musicBtn"><i>♬</i>配樂</button>
   <button class="tool" data-act="rules"><i>規</i>規則</button>
  </div>
 </main>
 <div id="mark">鳩特數理</div>
</div>
<div id="modal" hidden><div class="mbox" id="mbox"></div></div>
<div id="toast" role="status"></div>
<script src="gomoku_engine.js"></script>
<script src="gomoku_audio.js"></script>
<script src="gomoku_lessons.js"></script>
<script>
'use strict';
(function () {
const E = window.GomokuEngine, AU = window.GomokuAudio;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const LEVELS = [
  { n: '幼年鳩特', d: '剛學會規則，常常漏擋，適合新手' },
  { n: '青年鳩特', d: '看得到兩三步，攻守平衡' },
  { n: '成年鳩特', d: '會算連續進攻，不輕易放過破綻' },
  { n: '作弊鳩特', d: '棋力同成年。每次下子前先擲骰，擲到六點一次下兩子！', cheat: true }
];
const NN = ['一', '兩', '三', '四', '五'];
const SIZES = [9, 15, 19];
const SKEY = 'jutor-gomoku-settings-v1', GKEY = 'jutor-gomoku-save-v1', TKEY = 'jutor-gomoku-stats-v1';
const coarse = !!(window.matchMedia && matchMedia('(pointer:coarse)').matches);
const DEF = { level: 1, N: 1, S: 15, me: 1, renju: false, confirm: coarse, warn: true, sfx: true, music: true };
function lsGet(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v === null || v === undefined ? d : v; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* 無法儲存就算了 */ } }
const cfg = Object.assign({}, DEF, lsGet(SKEY, {}));
function saveCfg() { lsSet(SKEY, cfg); }
const faceName = c => (c === 1 ? '黑' : '白');

/* ---------- 對局狀態 ---------- */
let G = null;
function newGame(o, started) {
  G = { S: o.S, N: o.N, renju: !!o.renju && o.N === 1, level: o.level, me: o.me, ai: 3 - o.me, pos: null, turns: [], over: false, winner: 0, busy: false, token: Math.random(),
        started: !!started, last: [], lines: [], hint: -1, ghost: -1, hover: -1, fb: [], warn: [], sixes: 0, hints: 0, anims: [], status: '', statusCls: '' };
  G.pos = new E.Pos(G.S, G.N, { renju: G.renju });
  $('lessonBox').hidden = true; $('play').classList.remove('lesson', 'lcards');
  woodCache = null; layout();
  return G;
}
const cheat = () => LEVELS[G.level].cheat;
const turnColor = () => (G.turns.length ? 3 - G.turns[G.turns.length - 1].c : 1);
const myTurn = () => (G.lesson ? !!G.lesson.wait && !G.lesson.busy : G.started && !G.over && !G.busy && turnColor() === G.me);

function serialize() { return { S: G.S, N: G.N, renju: G.renju, level: G.level, me: G.me, turns: G.turns.map(t => ({ c: t.c, ps: t.ps, d: t.d })), sixes: G.sixes, hints: G.hints }; }
function persist() { if (G.lesson) return; if (G.started && !G.over && G.turns.length) lsSet(GKEY, serialize()); else if (G.over) { try { localStorage.removeItem(GKEY); } catch (e) { /* ignore */ } } }
function loadSaved() {
  const s = lsGet(GKEY, null);
  if (!s || !Array.isArray(s.turns) || !s.turns.length || !SIZES.includes(s.S) || !(s.N >= 1 && s.N <= 5)) return null;
  return s;
}
function restore(s) {
  newGame({ S: s.S, N: s.N, renju: s.renju, level: s.level, me: s.me }, true);
  G.sixes = s.sixes || 0; G.hints = s.hints || 0;
  for (const t of s.turns) {
    for (const p of t.ps) { G.pos.place(p, t.c); if (G.pos.won(t.c)) { G.over = true; G.winner = t.c; } }
    G.turns.push({ c: t.c, ps: t.ps, d: t.d });
  }
  G.last = G.turns[G.turns.length - 1].ps.slice();
}

/* ---------- 畫布 ---------- */
const cv = $('board'), cx = cv.getContext('2d');
let dpr = 1, px = 300, M = 20, CELL = 20, woodCache = null, raf = 0;
function layout() {
  const r = cv.getBoundingClientRect(); if (!r.width) return;
  dpr = Math.min(3, window.devicePixelRatio || 1); px = r.width;
  cv.width = cv.height = Math.round(px * dpr); woodCache = null;
  const S = G ? G.S : cfg.S; M = px * (S <= 9 ? .075 : .055); CELL = (px - 2 * M) / (S - 1);
  draw();
}
function wood() {

  <p><b>連珠規則</b>（只在連一條時可選）：黑棋不能下三三、四四、長連（六子以上），下錯位置會被擋下並提醒；剛好連成五子永遠算贏。白棋不受限制。</p>

  <p><b>悔棋</b>：收回你和電腦各一手（作弊鳩特的兩子一起收回）。<b>提示</b>：由電腦幫你想一手，棋盤上會出現藍色圈。</p>
  <div class="mbtns"><button class="btn pri" data-act="${G && G.started ? 'back' : 'menu'}">知道了</button></div>`);
}
function startFromDraft() {
  Object.assign(cfg, draft); if (cfg.N > 1) cfg.renju = false; saveCfg(); draft = null; closeModal();
  AU.unlock(); AU.music(cfg.music);
  newGame(cfg, true); render(); draw();
  if (cfg.me === 2) aiTurn();
}
function finish() {
  AU.tension(false); persist();
  const win = G.winner === G.me, drawn = G.winner === 0;
  record(G.level, drawn ? 'd' : win ? 'w' : 'l');
  G.lines = G.winner ? G.pos.fives(G.winner) : [];
  AU.sfx(drawn ? 'draw' : win ? 'win' : (cheat() && G.turns.some(t => t.d === 6) ? 'cheatwin' : 'lose')); render(); draw();
  const game = G;
  setTimeout(() => {
    if (G !== game) return;
    const title = drawn ? '和棋' : win ? '勝利' : '敗北', cls = drawn ? 'draw' : win ? 'win' : 'lose';
    let line = drawn ? '棋盤下滿了，不分勝負。' : win ? (cheat() ? '你識破了作弊鳩特！' : `你先連成${NN[G.N - 1]}條，贏了！`) : (cheat() && G.sixes ? `作弊鳩特共擲出 ${G.sixes} 次六點，下次小心它的三子！` : '鳩特先達成目標，再接再厲。');
    modal(`<div class="finish ${cls}"><img src="thumbs/gomoku_logo.svg" alt=""><div class="ftitle">${title}</div><p>${line}</p>
      <div class="fstat"><div><b>${G.turns.length}</b><span>總手數</span></div><div><b>${G.pos.cnt[G.me - 1]}/${G.N}</b><span>你的條數</span></div><div><b>${G.pos.cnt[G.ai - 1]}/${G.N}</b><span>鳩特的條數</span></div></div>
      <div class="mbtns"><button class="btn pri" data-act="again">再戰一局</button><button class="btn" data-act="menu">換設定</button><button class="btn" data-act="close">看棋盤</button></div></div>`);
  }, 1200);
}
function undo() {
  if (!G || G.busy || G.over || !G.started) return;
  let i = G.turns.length - 1; while (i >= 0 && G.turns[i].c !== G.me) i--;
  if (i < 0) { toast('還沒有可以悔的棋'); return; }
  while (G.turns.length > i) { const t = G.turns.pop(); for (let k = 0; k < t.ps.length; k++) G.pos.unplace(); }
  G.last = G.turns.length ? G.turns[G.turns.length - 1].ps.slice() : []; G.hint = -1; G.ghost = -1; G.token = Math.random();
  AU.sfx('undo'); refreshThreats(); persist(); render(); draw();
  if (turnColor() === G.ai) aiTurn();
}
async function hint() {
  if (!myTurn()) return;
  G.busy = true; G.busyMsg = '想一想…'; G.hints++; render(); const game = G;
  const r = await ask(G.me, 2, false, 500);
  if (G !== game) return;
  G.busy = false; G.busyMsg = ''; G.hint = (r.moves && r.moves[0] !== undefined) ? r.moves[0] : -1; G.ghost = -1; render(); draw();
  if (G.hint >= 0) toast('藍色圈是建議的下一手');
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act],[data-lv],[data-n],[data-s],[data-me]'); if (!t) return;
  AU.unlock();
  if (t.dataset.lv !== undefined) { draft.level = +t.dataset.lv; menu(true); return; }
  if (t.dataset.n !== undefined) { draft.N = +t.dataset.n; if (draft.N > 1) draft.renju = false; if (draft.N >= 4 && draft.S < 19) draft.S = 19; menu(true); return; }
  if (t.dataset.s !== undefined) { draft.S = +t.dataset.s; menu(true); return; }
  if (t.dataset.me !== undefined) { draft.me = +t.dataset.me; menu(true); return; }
  switch (t.dataset.act) {
    case 'menu': draft = null; menu(); break;
    case 'start': if (G && G.started && !G.over && G.turns.length && !confirm('目前這一局還沒下完，要放棄並開新局嗎？')) break; startFromDraft(); break;
    case 'again': draft = Object.assign({}, cfg); startFromDraft(); break;
    case 'resume': { const s = loadSaved(); if (s) { draft = null; closeModal(); AU.music(cfg.music); restore(s); refreshThreats(); render(); draw(); if (!G.over && turnColor() === G.ai) aiTurn(); } break; }
    case 'back': case 'close': closeModal(); break;
    case 'rules': case 'rules2': rules(); break;
    case 'lessons': lessonList(); break;
    case 'lesson': lessonStart(+t.dataset.i); break;
    case 'lsnext': lessonNext(); break;
    case 'lsretry': lessonRetry(); break;
    case 'lshint': lessonHint(); break;
    case 'lsgo': draft = Object.assign({}, cfg, { level: 0, N: 1, S: 9, me: 1, renju: false }); menu(); break;
    case 'undo': undo(); break;
    case 'hint': hint(); break;
    case 'sfx': cfg.sfx = !cfg.sfx; saveCfg(); render(); break;
    case 'music': cfg.music = !cfg.music; saveCfg(); AU.music(cfg.music); render(); break;
  }
});
document.addEventListener('change', e => { const o = e.target.dataset && e.target.dataset.opt; if (!o) return; draft[o] = e.target.checked; });
/* 音效開關：關掉時只靜音，不影響配樂 */
const _sfx = AU.sfx; AU.sfx = (a, b) => { if (cfg.sfx) _sfx(a, b); };

/* ---------- 新手教學 ---------- */
const LESSONS = window.GomokuLessons, LKEY = 'jutor-gomoku-lessons-v1';
const lDone = () => lsGet(LKEY, {});
const fmt = t => esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
const lAlive = (game, tok) => G === game && G.lesson && G.lesson.token === tok;
function lessonList() {
  const d = lDone();
  modal(`<h2>新手教學</h2><p class="note" style="text-align:center">從零開始，一課學一件事，每課大約一分鐘。</p>
    <div class="lsList">${LESSONS.map((L, i) => `<button data-act="lesson" data-i="${i}"><span>${i + 1}</span>${esc(L.t)}${d[i] ? '<em>✓</em>' : ''}</button>`).join('')}</div>
    <div class="mbtns"><button class="btn" data-act="menu">返回</button></div>`);
}
function lessonStart(i) {
  const L = LESSONS[i]; if (!L) return;
  closeModal(); draft = null;
  newGame({ S: L.S || 9, N: L.N || 1, renju: !!L.renju, level: L.cheat ? 3 : 0, me: 1 }, true);
  G.lesson = { li: i, L, si: -1, s: null, cur: [], snap: [], wait: null, tries: 0, reveal: false, fb: '', fbc: '', canNext: false, busy: false, needRetry: false, token: Math.random(), gc: null, face: 1, six: false };
  AU.unlock(); AU.music(cfg.music); AU.tension(false);
  lessonStep(0);
}
function setBoard(stones) {
  G.pos = new E.Pos(G.S, G.N, { renju: G.renju });
  for (const [x, y, c] of stones) G.pos.place(y * G.S + x, c);
  G.over = false; G.winner = 0; G.lines = []; G.last = []; G.anims = []; G.ghost = -1; G.hint = -1; G.warn = [];
  G.fb = G.renju ? E.forbiddenCells(G.pos) : [];
}
const lput = (x, y, c) => { const ls = G.lesson; ls.cur.push([x, y, c]); ls.gc = null; if (G.renju) G.fb = E.forbiddenCells(G.pos); };
function lessonStep(si) {
  const ls = G.lesson, s = ls.L.steps[si];
  if (!s) { lessonDone(); return; }
  ls.si = si; ls.s = s; ls.tries = 0; ls.reveal = false; ls.fb = ''; ls.fbc = ''; ls.busy = false; ls.needRetry = false; ls.gc = null;
  ls.token = Math.random(); ls.face = ls.L.cheat ? 3 : 1; ls.six = false;
  if (s.b) ls.cur = s.b.map(a => a.slice());
  setBoard(ls.cur); ls.snap = ls.cur.map(a => a.slice());
  ls.wait = s.task || null; ls.canNext = !s.task && !s.demo;
  renderLesson(); draw();
  if (s.demo) lessonDemo(s);
}
function lessonNext() { const ls = G.lesson; if (!ls || !ls.canNext) return; AU.sfx('tap'); lessonStep(ls.si + 1); }
function lessonRetry() { const ls = G.lesson; if (!ls) return; ls.cur = ls.snap.map(a => a.slice()); lessonStep(ls.si); }
function lessonHint() {
  const ls = G.lesson; if (!ls || !ls.wait) return;
  if (ls.wait.goals === 'fb') { toast('點棋盤上標了 ✕ 的位置'); return; }
  ls.reveal = true; ls.fb = '星星標出了可以下的位置。'; ls.fbc = ''; renderLesson(); draw();
}
function lGoals(t) {
  const ls = G.lesson; if (ls.gc) return ls.gc;
  const g = t.goals, S = G.S; let r;
  if (Array.isArray(g)) r = g.map(([x, y]) => y * S + x);
  else if (g === 'win') r = Array.from(G.pos.winCells(1));
  else if (g === 'block') r = Array.from(G.pos.winCells(2));
  else if (g === 'fb') r = G.fb.slice();
  else { r = []; for (let p = 0; p < S * S; p++) { if (G.pos.b[p]) continue; G.pos.place(p, 1); if (G.pos.won(1) || G.pos.winCells(1).length >= 2) r.push(p); G.pos.unplace(); } }
  return (ls.gc = r);
}
async function lessonTap(p) {
  const ls = G.lesson, t = ls.wait; if (!t || ls.busy) return;
  if (G.pos.b[p]) { toast('這裡已經有棋子了'); return; }
  if (cfg.confirm && G.ghost !== p) { G.ghost = p; AU.sfx('preview'); draw(); return; }
  G.ghost = -1;
  if (lGoals(t).includes(p)) { lessonOk(p, t); return; }
  ls.tries++; AU.sfx('error');
  if (t.demoBad) {
    const game = G, tok = ls.token, S = G.S; ls.wait = null; ls.busy = true;
    lput(p % S, (p / S) | 0, 1); G.last = [p]; putStone(1, p); draw();
    await sleep(800); if (!lAlive(game, tok)) return;
    let q = -1;
    for (let c = 0; c < S * S && q < 0; c++) { if (G.pos.b[c]) continue; G.pos.place(c, 2); const n = G.pos.winCells(2).length; G.pos.unplace(); if (n >= 2) q = c; }
    if (q >= 0) { lput(q % S, (q / S) | 0, 2); G.last = [q]; putStone(2, q); AU.sfx('warn'); }
    ls.fb = t.bad; ls.fbc = 'bad'; ls.busy = false; ls.needRetry = true; renderLesson(); draw(); return;
  }
  ls.fb = t.bad || '再想想看！'; ls.fbc = 'bad';
  if (ls.tries >= 2 && t.goals !== 'fb') { ls.reveal = true; ls.fb += '（已用星星標出答案）'; }
  renderLesson(); draw();
}
async function lessonOk(p, t) {
  const ls = G.lesson, game = G, tok = ls.token, S = G.S;
  ls.wait = null; ls.busy = true; ls.reveal = false;
  if (t.noPlace) AU.sfx('tap');
  else { lput(p % S, (p / S) | 0, 1); G.last = [p]; if (putStone(1, p)) G.lines = G.pos.fives(1); }
  ls.fb = t.ok; ls.fbc = 'good'; renderLesson(); draw();
  if (G.over) { await sleep(250); if (!lAlive(game, tok)) return; AU.sfx('win'); }
  let list = t.after;
  if (list === 'blockOne') { const w = Array.from(G.pos.winCells(1)); list = w.length ? [[w[0] % S, (w[0] / S) | 0, 2]] : []; }
  for (const [x, y, c] of (list || [])) {
    await sleep(800); if (!lAlive(game, tok)) return;
    lput(x, y, c); G.last = [y * S + x]; putStone(c, y * S + x); draw();
  }
  if (!lAlive(game, tok)) return;
  ls.busy = false; ls.canNext = true; renderLesson(); draw();
  if (t.chain) { await sleep(2000); if (lAlive(game, tok)) lessonNext(); }
}
async function lessonDemo(s) {
  const ls = G.lesson, game = G, tok = ls.token, S = G.S; ls.busy = true; ls.canNext = false; renderLesson();
  await sleep(900); if (!lAlive(game, tok)) return;
  const die = $('die'); die.classList.add('rolling'); AU.sfx('dice');
  for (let i = 0; i < 10; i++) { showFace(1 + Math.floor(Math.random() * 5)); await sleep(80 + i * 16); if (!lAlive(game, tok)) return; }
  die.classList.remove('rolling'); showFace(6); ls.face = 6; ls.six = true; die.classList.add('six'); AU.sfx('six');
  await sleep(350); if (!lAlive(game, tok)) return;
  banner('作弊！一次下兩子'); AU.sfx('cheat'); await sleep(900); if (!lAlive(game, tok)) return;
  for (const [x, y, c] of s.demo.stones) { lput(x, y, c); G.last = [y * S + x]; putStone(c, y * S + x); draw(); await sleep(520); if (!lAlive(game, tok)) return; }
  G.lines = G.pos.fives(2); AU.sfx('lose'); draw();
  ls.fb = s.demo.ok; ls.fbc = 'bad'; ls.busy = false; ls.canNext = true; renderLesson(); draw();
}
function lessonDone() {
  const ls = G.lesson, i = ls.li, d = lDone(); d[i] = 1; lsSet(LKEY, d);
  AU.sfx('win'); const last = i === LESSONS.length - 1, all = LESSONS.every((_, k) => d[k]);
  modal(`<div class="finish win"><img src="thumbs/gomoku_logo.svg" alt=""><div class="ftitle">第 ${i + 1} 課完成</div>
    <p>${esc(LESSONS[i].t)}${all ? '　十課全部學完了，可以挑戰鳩特了！' : ''}</p>
    <div class="mbtns">${last ? '<button class="btn pri" data-act="lsgo">去和鳩特對戰</button>' : `<button class="btn pri" data-act="lesson" data-i="${i + 1}">下一課：${esc(LESSONS[i + 1].t)}</button>`}
    <button class="btn" data-act="lessons">課程列表</button><button class="btn" data-act="lesson" data-i="${i}">再練一次</button></div></div>`);
}
function renderLesson() {
  const ls = G.lesson, L = ls.L, s = ls.s;
  $('lessonBox').hidden = false; $('play').classList.add('lesson'); $('play').classList.toggle('lcards', !!L.cheat);
  $('modeLabel').textContent = `新手教學 ${ls.li + 1}/${LESSONS.length}`;
  if (L.cheat) { $('opp').innerHTML = cardHtml(G.ai, 'ai'); const die = $('die'); die.classList.add('on'); showFace(ls.face); die.classList.toggle('six', !!ls.six); }
  $('lsNo').textContent = `第 ${ls.li + 1} 課・${L.t}`;
  $('lsDots').innerHTML = L.steps.map((_, i) => `<i class="${i < ls.si ? 'on' : i === ls.si ? 'cur' : ''}"></i>`).join('');
  $('lsTitle').textContent = s.h; $('lsText').innerHTML = fmt(s.x);
  const fb = $('lsFb'); fb.textContent = ls.fb; fb.className = ls.fbc;
  const cnt = G.pos.cnt[0];
  $('lsProg').innerHTML = G.N > 1 ? `<div class="prog">${Array.from({ length: G.N }, (_, i) => `<i class="${i < cnt ? 'on' : ''}"></i>`).join('')}<span>你的條數 ${cnt} / ${G.N}</span></div>` : '';
  $('lsHint').hidden = !ls.wait;
  const rt = $('lsRetry'); rt.textContent = ls.needRetry ? '再試一次' : '重來'; rt.classList.toggle('ver', ls.needRetry); rt.hidden = !s.b && !ls.needRetry && !s.task && !s.demo;
  const nx = $('lsNext'); nx.disabled = !ls.canNext; nx.textContent = ls.si === L.steps.length - 1 ? '完成本課' : '下一步';
  $('lsSfx').classList.toggle('off', !cfg.sfx); $('lsMusic').classList.toggle('on', cfg.music);
}
function lessonUnder() {
  const s = G.lesson.s; if (!s || !s.lines) return;
  cx.save(); cx.lineCap = 'round'; cx.strokeStyle = 'rgba(44,79,134,.26)'; cx.lineWidth = CELL * dpr * .86;
  for (const [[x1, y1], [x2, y2]] of s.lines) { cx.beginPath(); cx.moveTo(X(x1), Y(y1)); cx.lineTo(X(x2), Y(y2)); cx.stroke(); }
  cx.restore();
}
function lessonStar(p, pul) {
  const [x, y] = pxy(p), R = CELL * dpr * (.3 + .04 * pul), r = R * .45;
  cx.fillStyle = `rgba(229,171,36,${.75 + .25 * pul})`; cx.strokeStyle = '#8a5d00'; cx.lineWidth = dpr * 1.2; cx.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r : R; cx[i ? 'lineTo' : 'moveTo'](x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  cx.closePath(); cx.fill(); cx.stroke();
}
function lessonOver(now) {
  const ls = G.lesson, s = ls.s, t = ls.wait; if (!s) return;
  const pul = .5 + .5 * Math.sin(now / 200);
  if (s.warn && t) for (const p of G.pos.winCells(2)) ring(p, `rgba(194,59,42,${.6 + .35 * pul})`, .36 + .08 * pul, 2.8);
  if (t && !G.over && (t.show || ls.reveal) && t.goals !== 'fb') for (const p of lGoals(t)) lessonStar(p, pul);
}
function lessonAnim() { const ls = G && G.lesson; return !!(ls && ls.s && ls.wait && (ls.s.warn || ls.wait.show || ls.reveal)); }

/* ---------- 開場 ---------- */
newGame(cfg, false); render(); layout(); draw();
menu();
window.addEventListener('pagehide', persist);
})();
</script>
