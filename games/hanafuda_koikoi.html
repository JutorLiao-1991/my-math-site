<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>花牌來來</title>
<style>
/* VOICE: 日式牌桌，沉穩、清楚、手機一手可玩
   IDEA: 漆器牌桌上攤開的一副花札
   PICTURE: 牌桌本身（對手、場牌、收牌區）就是主畫面
   COLOUR and TYPE: 深漆黑褐桌面、朱紅牌背、米白牌面、金色光札；系統中文字體
   LAYOUT: 直放時牌桌在上、手牌操作區在下；橫放時左右並排 */
:root{color-scheme:dark;--bg:#1d1714;--felt:#2a201b;--line:#4a3a30;--ink:#f3ece0;--mut:#bfae9c;--gold:#e0b43c;--red:#c8372d;--blue:#2d5fa8;--paper:#fbf6ea;--cw:clamp(38px,10.8vw,66px)}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%}
body{font:15px/1.45 -apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{display:grid;grid-template-rows:auto minmax(0,1fr) auto;height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{display:flex;align-items:center;gap:6px;padding:6px 8px;border-bottom:1px solid var(--line);flex-wrap:wrap}
header a.home{color:var(--ink);text-decoration:none;font-size:20px;min-width:32px;min-height:36px;display:inline-flex;align-items:center;justify-content:center}
header b{font-size:17px;letter-spacing:.05em}
.sp{flex:1}
.pill{font-size:13px;color:var(--mut)}
#score{font-weight:700;font-variant-numeric:tabular-nums}
button{font:inherit;font-size:14px;border:0;border-radius:8px;min-height:36px;padding:6px 11px;background:#3a2e27;color:var(--ink);cursor:pointer}
button:focus-visible{outline:2px solid var(--gold)}
button.pri{background:var(--gold);color:#241a10;font-weight:700}
button.red{background:var(--red);color:#fff;font-weight:700}
#board{overflow:auto;padding:8px;display:flex;flex-direction:column;gap:8px;background:radial-gradient(ellipse at 50% 45%,#3a2b22,var(--felt) 70%)}
#panel{padding:8px 8px 10px;display:flex;flex-direction:column;gap:6px;overflow:auto;max-height:46dvh;border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lbl{font-size:13px;color:var(--mut);flex:none}
.yk{font-size:13px;color:var(--gold)}
.koi{background:var(--red);color:#fff;border-radius:6px;padding:0 6px;font-size:12px}
.backs{display:flex}.backs .card{--cw:20px;margin-right:-8px;border-width:1px}
.caps{display:flex;gap:10px;flex-wrap:wrap;min-height:34px;align-items:flex-end}
.grp{display:flex;flex-direction:column;gap:2px}
.gl{font-size:11px;color:var(--mut)}
.stk{display:flex}.stk .card{--cw:24px;margin-right:-9px;border-width:1px}
.mid{position:relative;isolation:isolate;display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-block:1px dashed var(--line)}
.mid::before{content:"";position:absolute;inset:6px 0;z-index:-1;background:var(--logo-paper) center/auto min(70%,170px) no-repeat;opacity:.07;pointer-events:none}
.mid::after{content:"鳩特數理";position:absolute;right:6px;bottom:4px;z-index:-1;font:700 13px/1 "Hiragino Mincho ProN","Noto Serif TC",serif;letter-spacing:.4em;color:#f3ece0;opacity:.14;pointer-events:none}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:6px}.brand img{width:76px;height:auto}.brand small{color:var(--gold);letter-spacing:.3em;font-weight:700}.brand h2{margin:0}
.sealrow{display:flex;justify-content:center;margin-top:4px}.sealrow img{height:118px;width:auto;transform:rotate(-7deg);filter:drop-shadow(0 2px 2px #0006);animation:sealin .45s cubic-bezier(.2,1.5,.4,1) both}
@keyframes sealin{0%{opacity:0;transform:scale(2.4) rotate(-20deg)}60%{opacity:1;transform:scale(.92) rotate(-8deg)}100%{opacity:1;transform:rotate(-7deg)}}
#deckBox{display:flex;flex-direction:column;align-items:center;gap:4px;flex:none;font-size:12px;color:var(--mut)}
#flip{min-height:calc(var(--cw)*1.5)}
.field{display:flex;flex-wrap:wrap;gap:5px;align-content:flex-start;flex:1}
.hand{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;padding-top:10px}
#prompt{font-size:14px;min-height:20px;text-align:center}
#prompt small{color:var(--mut)}
#log{font-size:12px;color:var(--mut);max-height:4.6em;overflow:auto;border-top:1px solid var(--line);padding-top:4px}
#helper{font-size:12px;background:#00000033;border-radius:8px;padding:6px 8px}
.mg{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:2px;text-align:center;margin:4px 0}
.mg span{background:#ffffff10;border-radius:4px;padding:1px 0;line-height:1.25}
.mg b{display:block;font-size:13px;color:var(--ink)}
.mg .on{background:#2d5fa855}
/* 牌 */
.card{width:var(--cw);aspect-ratio:124/202;border-radius:calc(var(--cw)*.08);background:#f4ecd6;position:relative;box-shadow:0 2px 0 #0006,0 3px 6px #0005;border:0;flex:none;overflow:hidden;transition:transform .15s,box-shadow .15s;cursor:pointer}
.card img{position:absolute;inset:0;width:100%;height:100%;display:block;-webkit-user-drag:none;pointer-events:none}
.card .mo,.card .kd{display:none;position:absolute;z-index:2;font-size:max(10px,calc(var(--cw)*.18));font-weight:800;line-height:1.15;background:#fffe;color:#222;border-radius:3px;padding:0 2px}
.card .mo{top:1px;left:1px}.card .kd{bottom:1px;right:1px}
body.lab .card .mo,body.lab .card .kd{display:block}
body.lab .card.light .kd{color:#a66f00}body.lab .card.seed .kd{color:#2c7a3a}body.lab .card.ribbon .kd{color:#c8372d}
.card.back,.bkov{background:var(--logo-gold) center/74% auto no-repeat,radial-gradient(circle at 50% 45%,#6a1a14,#2b0a08 75%);border:2px solid #120403;box-shadow:inset 0 0 0 2px #2b0a08,inset 0 0 0 3px #e0b43c99,0 2px 0 #0006,0 3px 6px #0005}
.backs .card.back{background-size:80% auto,auto}
.card.sel{transform:translateY(-10px);box-shadow:0 0 0 3px #ffe66d,0 6px 10px #0008}
.card.hl{box-shadow:0 0 0 3px #5ec8ff,0 0 12px #5ec8ff;animation:pulse 1s infinite alternate}
.card.mt::after{content:"";position:absolute;top:3px;right:3px;width:8px;height:8px;border-radius:50%;background:#3ddc84;z-index:3}
.card.off{filter:brightness(.8)}
.bd{position:absolute;top:1px;right:1px;background:var(--blue);color:#fff;font-size:10px;font-weight:700;border-radius:6px;padding:0 3px;z-index:3;line-height:1.4}
body .stk .mo,body .stk .kd{display:none}
@keyframes pulse{to{box-shadow:0 0 0 3px #5ec8ff,0 0 2px #5ec8ff}}
@keyframes pop{from{transform:scale(1.25)}}
@media (prefers-reduced-motion:reduce){.card{transition:none}.card.hl,.card.new{animation:none}}
/* 視窗 */
#modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:14px;z-index:50}
#modal[hidden]{display:none}
.box{background:#2b221c;border:1px solid var(--line);border-radius:14px;padding:16px;max-width:560px;width:100%;max-height:88dvh;overflow:auto}
.box h2{margin:0 0 8px;font-size:22px}
.box h3{margin:14px 0 6px;font-size:16px;color:var(--gold)}
.box p{margin:6px 0}
.opts{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 10px}
.opts button.on{background:var(--gold);color:#241a10;font-weight:700}
input{font:inherit;font-size:16px;padding:8px;border-radius:8px;border:1px solid var(--line);background:#1d1714;color:var(--ink);width:12em}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{border-bottom:1px solid var(--line);padding:5px 4px;text-align:left;vertical-align:top}
td.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.deck12{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.deck12 div{display:flex;gap:3px;align-items:center;font-size:12px}
.deck12 .card{--cw:34px;cursor:default}.deck12{grid-template-columns:minmax(0,1fr)}
.btns{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
#fx{position:fixed;inset:0;pointer-events:none;z-index:40}
#fx .fly{position:fixed;transform-origin:0 0;will-change:transform}
#fx .fly .card{margin:0;box-shadow:0 6px 14px #0009}
.bkov{position:absolute;inset:0;z-index:6}
[hidden]{display:none!important}
.stamps{display:flex;flex-direction:column;gap:9px;min-height:140px;margin:12px 0 6px}
.stamp{display:flex;justify-content:space-between;align-items:center;gap:10px;border:3px solid #d42a22;outline:1px solid #d42a2266;outline-offset:2px;color:#ff7565;background:#d42a2218;border-radius:6px;padding:6px 12px;font:800 22px/1.2 "Hiragino Mincho ProN","Noto Serif TC","PMingLiU",serif;letter-spacing:.08em;transform:rotate(-1.5deg);animation:stamp .38s cubic-bezier(.2,1.5,.4,1) both}
.stamp:nth-child(even){transform:rotate(1.2deg)}
.stamp small{font:400 13px/1 -apple-system,"PingFang TC",sans-serif;color:var(--mut);letter-spacing:0;margin-left:8px}
.stamp .pt{font-size:20px;white-space:nowrap}
.stamp.mul{border-color:var(--gold);outline-color:#e0b43c55;color:var(--gold);background:#e0b43c14;font-size:18px}
.stamp.tot{background:#d42a22;color:#fff;font-size:26px}
.stamp.still{animation:none}
@keyframes stamp{0%{opacity:0;transform:scale(2.6) rotate(-14deg)}55%{opacity:1;transform:scale(.9) rotate(-3deg)}100%{opacity:1}}
@media (prefers-reduced-motion:reduce){.stamp{animation:none}}
#tut{position:fixed;inset:0;z-index:45;pointer-events:none}
#tutDim{position:absolute;inset:0;background:#000b}
#tutSpot{position:absolute;border-radius:10px;box-shadow:0 0 0 200vmax #000b;outline:3px solid #ffe66d;outline-offset:0;animation:tspot .8s infinite alternate}
@keyframes tspot{to{outline-color:#ffe66d44;outline-offset:3px}}
#tutArrow{position:absolute;width:0;height:0;border:12px solid transparent;border-top:16px solid #ffe66d;border-bottom-width:0;filter:drop-shadow(0 2px 3px #000);animation:tbob .55s infinite alternate}
#tutArrow.up{border-top-width:0;border-bottom:16px solid #ffe66d}
@keyframes tbob{to{transform:translateY(-6px)}}
#tutArrow:not(.up){animation-name:tbob2}@keyframes tbob2{to{transform:translateY(6px)}}
#tutBox{position:absolute;left:12px;right:12px;max-width:520px;margin:0 auto;background:#fbf6ea;color:#2a1d14;border:2px solid var(--gold);border-radius:14px;padding:12px 14px;box-shadow:0 10px 28px #000c;pointer-events:auto}
#tutBox b{font-size:17px;color:#a3241b}
#tutBox .tx{margin:6px 0 10px;font-size:15px;line-height:1.6}
#tutBox .tb{display:flex;gap:8px;align-items:center}#tutBox .tb .pill{flex:1;color:#7a6050;font-size:13px}
#tutBox button:not(.pri){background:#e8dcc4;color:#3a2a1e}
.tcards{display:flex;gap:4px;margin:8px 0}.tcards .card{--cw:42px;cursor:default}
.tutnote{color:var(--gold);font-weight:700}
@media (prefers-reduced-motion:reduce){#tutSpot,#tutArrow{animation:none}}
/* ===== 結算捲軸（沿用北海道行程的捲軸樣式） ===== */
.sc{--paper:#fffdf7;--paper2:#f3ecdc;--wood:#5a3317;--wood2:#2e1909;--mount:#e7dcc4;color:#1f1a12;margin:4px 8px 12px}
.sc-head{position:relative;display:flex;align-items:center;justify-content:center;min-height:56px;padding:10px 26px;border-radius:12px/50%;background:linear-gradient(180deg,#fff 0%,var(--paper) 30%,var(--paper2) 72%,#d6ccb5 100%);box-shadow:0 3px 6px #0006,inset 0 -2px 0 #78643c2e}
.sc-head::before,.sc-head::after,.sc-roll::before,.sc-roll::after{content:"";position:absolute;top:50%;width:14px;height:78%;transform:translateY(-50%);border-radius:7px;background:linear-gradient(180deg,#8a5a30,var(--wood) 45%,var(--wood2));box-shadow:0 1px 2px #0006}
.sc-head::before,.sc-roll::before{left:-5px}.sc-head::after,.sc-roll::after{right:-5px}
.sc-label{display:inline-block;padding:3px 12px;border:1px solid #cdbf9c;background:#fbf7ea;box-shadow:inset 0 0 0 2px #fbf7ea,inset 0 0 0 3px #e3d6b5;font:800 18px/1.3 "Hiragino Mincho ProN","Yu Mincho","Noto Serif TC",serif;letter-spacing:.06em}
.sc-body{height:0;overflow:hidden;margin:-4px 12px 0;background:var(--mount);padding:0 7px;transition:height .9s cubic-bezier(.4,.15,.3,1)}
.sc-paper{position:relative;overflow:hidden;min-height:122px;padding:10px 14px 14px;background:var(--paper);background-image:repeating-linear-gradient(0deg,#968a5a0d 0 1px,#0000 1px 4px),repeating-linear-gradient(90deg,#968a5a09 0 1px,#0000 1px 7px);box-shadow:inset 0 6px 8px -6px #0005}
.sc-roll{position:relative;height:18px;margin:0 6px;border-radius:9px/50%;background:linear-gradient(180deg,#fff,var(--paper) 35%,var(--paper2) 70%,#cfc4aa);box-shadow:0 3px 5px #0005}
.sc-roll::before,.sc-roll::after{height:22px}
.sc-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:9px 2px;border-bottom:1px dashed #d9ccae;font:700 21px/1.3 "Hiragino Mincho ProN","Yu Mincho","Noto Serif TC",serif;visibility:hidden}
.sc-row small{font:400 13px/1 -apple-system,"PingFang TC",sans-serif;color:#7a6a55;margin-left:8px}
.sc-row .pt{white-space:nowrap}
.sc-row.show{visibility:visible;animation:scin .45s cubic-bezier(.2,1.5,.4,1) both}
.sc-row.still{animation:none}
.sc-row.mul{color:#9a6a12;font-size:18px}
.sc-row.tot{border-bottom:0;padding-top:14px;color:#b8332a;font-size:26px}
.sc-row.note{visibility:visible;border:0;display:block;text-align:center;font-size:17px;line-height:1.7;padding:20px 4px}
.sc-seal{position:absolute;right:6px;bottom:4px;height:min(82px,64%);width:auto;opacity:0;transform:rotate(-9deg);mix-blend-mode:multiply;pointer-events:none}
.sc-seal.show{opacity:.92;animation:scseal .5s cubic-bezier(.2,1.5,.4,1) both}
@keyframes scin{0%{opacity:0;transform:scale(1.8)}60%{opacity:1;transform:scale(.95)}100%{opacity:1;transform:none}}
@keyframes scseal{0%{opacity:0;transform:scale(2.3) rotate(-20deg)}60%{opacity:.95;transform:scale(.92) rotate(-10deg)}100%{opacity:.92;transform:rotate(-9deg)}}
@media (prefers-reduced-motion:reduce){.sc-body{transition:none}.sc-row.show,.sc-seal.show{animation:none}}
/* ===== 和風勝敗畫面 ===== */
#fin{position:fixed;inset:0;z-index:55;display:flex;flex-direction:column;align-items:center;justify-content:safe center;overflow-y:auto;gap:10px;padding:24px 18px;text-align:center;overflow:hidden;color:#f3ece0}
#fin.win{background:radial-gradient(circle at 50% 38%,#6a1e12,#1c0b07 72%)}
#fin.lose{background:radial-gradient(circle at 50% 38%,#3c3c42,#111114 75%)}
#fin.draw{background:radial-gradient(circle at 50% 38%,#3a2b22,#1d1714 75%)}
#fin .rays{position:absolute;left:50%;top:36%;width:180vmax;height:180vmax;margin:-90vmax 0 0 -90vmax;background:repeating-conic-gradient(#e0b43c30 0 5deg,#0000 5deg 15deg);animation:fspin 40s linear infinite;pointer-events:none}
#fin .big{position:relative;flex:none;font:900 min(38vw,190px)/1 "Hiragino Mincho ProN","Yu Mincho","Noto Serif JP","Noto Serif TC",serif;color:#fff1d2;text-shadow:0 0 34px #e0b43ccc,0 7px 0 #8a1a10;animation:fbig .7s cubic-bezier(.2,1.5,.4,1) forwards}
#fin.lose .big{color:#d9d5cc;text-shadow:0 0 22px #000a;animation:fink 2.4s ease-out forwards}
#fin.draw .big{color:#e8dcc4;text-shadow:0 0 20px #e0b43c55}
#fin .fsub{position:relative;font-size:19px;font-weight:700}
#fin .fline{position:relative;font-size:15px;color:#d8ccb8;max-width:30em}
#fin .fstat{position:relative;font-size:14px;color:#bfae9c}
#fin .fseal{position:relative;height:96px;transform:rotate(-8deg);animation:sealin .5s .9s cubic-bezier(.2,1.5,.4,1) both;filter:drop-shadow(0 2px 3px #0008)}
#fin .btns{position:relative;justify-content:center;margin-top:6px}
#fin .fall{position:absolute;top:-6vh;pointer-events:none;animation:ffall linear forwards}
#fin .petal{width:14px;height:10px;background:radial-gradient(circle at 30% 30%,#ffe3ea,#f29ab4);border-radius:80% 0 80% 0}
#fin .leaf{width:18px;height:18px;background:#a8452c;clip-path:polygon(50% 0,62% 30%,95% 24%,72% 52%,90% 86%,55% 70%,50% 100%,45% 70%,10% 86%,28% 52%,5% 24%,38% 30%)}
@keyframes fspin{to{transform:rotate(360deg)}}
@keyframes fbig{0%{opacity:0;transform:scale(2.6) rotate(-10deg)}60%{opacity:1;transform:scale(.92)}100%{opacity:1;transform:none}}
@keyframes fink{0%{opacity:0;transform:scale(1.25)}40%{opacity:.35}100%{opacity:.94;transform:none}}
@keyframes ffall{to{transform:translate(var(--dx),112vh) rotate(var(--r))}}
@media (prefers-reduced-motion:reduce){#fin .rays,#fin .big,#fin .fall,#fin .fseal{animation:none}#fin .fall{display:none}}
.rk{position:relative;width:min(100%,420px);background:#00000059;border:1px solid #ffffff22;border-radius:12px;padding:10px 12px;text-align:left}
.rk h3{margin:2px 0 8px;font-size:16px;color:var(--gold);text-align:center}
.rk-f{display:flex;gap:8px;margin-bottom:8px}.rk-f input{flex:1;min-width:0;width:auto}
.rk-t{width:100%;border-collapse:collapse;font-size:14px}.rk-t th,.rk-t td{padding:5px 6px;border-bottom:1px solid #ffffff1a;text-align:left}
.rk-t th{color:#bfae9c;font-weight:400;font-size:12px}.rk-t .n{text-align:right;font-variant-numeric:tabular-nums}
.rk-t tr.me td{background:#e0b43c33;color:#ffe6a0}
.box .rk-t th,.box .rk-t td{border-bottom-color:var(--line)}
#toast{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%);background:var(--red);color:#fff;font-size:24px;font-weight:800;padding:12px 22px;border-radius:12px;z-index:60;pointer-events:none;opacity:0;transition:opacity .25s}
#toast.show{opacity:1}
@media (orientation:landscape) and (min-width:700px){
 #app{grid-template-columns:minmax(0,1fr) minmax(300px,36%);grid-template-rows:auto minmax(0,1fr)}
 header{grid-column:1/3}
 #board{--cw:clamp(44px,5.6vw,78px)}
 #panel{max-height:none;border-top:0;border-left:1px solid var(--line)}
 #panel .card{--cw:clamp(44px,4.6vw,70px)}
 #log{max-height:none;flex:1}
}
</style>
</head>
<body>
<div id="app">
 <header>
  <a class="home" href="../index.html" aria-label="回教材首頁">←</a><b>花牌來來</b><span class="pill" id="rinfo"></span><span class="sp"></span>
  <span id="score"></span>
  <button id="bBgm" data-act="bgm">配樂</button><button id="bSnd" data-act="snd">音效</button><button id="bLab" data-act="lab">標示</button><button id="bHelp" data-act="helper">機率</button><button data-act="rules">役表</button><button data-act="menu">選單</button>
 </header>
 <section id="board">
  <div class="row"><span class="lbl" id="oppName">電腦</span><div class="backs" id="oppHand"></div><span class="yk" id="oppYaku"></span></div>
  <div class="caps" id="oppCaps"></div>
  <div class="mid">
   <div id="deckBox"><div class="card back" style="width:calc(var(--cw)*.85)"></div><span id="deckN"></span><div id="flip"></div></div>
   <div class="field" id="field"></div>
  </div>
  <div class="caps" id="myCaps"></div>
  <div id="helper" hidden></div>
 </section>
 <section id="panel">
  <div id="prompt"></div>
  <div class="hand" id="hand"></div>
  <div class="row"><span class="lbl">你</span><span class="yk" id="myYaku"></span></div>
  <div id="log"></div>
 </section>
</div>
<div id="modal" hidden><div class="box" id="mbox"></div></div>
<div id="toast"></div>
<div id="fx"></div>
<div id="tut" hidden><div id="tutDim"></div><div id="tutSpot"></div><div id="tutArrow"></div><div id="tutBox"></div></div>
<script>
{
const SIM = typeof document === 'undefined';
/* ===== 牌組 ===== */
const MN=['','松','梅','櫻','藤','菖蒲','牡丹','萩','芒','菊','紅葉','柳','桐'];
const PL=['','🌲','🌺','🌸','🍇','⚜️','🏵️','🌿','🌾','🌼','🍁','🍃','🌳'];
const P=['plain'];
const SPEC={
1:[['light','crane','🦢','松上鶴'],['ribbon','aka',0,'松赤短'],P,P],
2:[['seed','bird','🐤','梅上鶯'],['ribbon','aka',0,'梅赤短'],P,P],
3:[['light','curtain','🎪','櫻幕'],['ribbon','aka',0,'櫻赤短'],P,P],
4:[['seed','cuckoo','🐦','藤杜鵑'],['ribbon','red',0,'藤短冊'],P,P],
5:[['seed','bridge','🌉','菖蒲八橋'],['ribbon','red',0,'菖蒲短冊'],P,P],
6:[['seed','butterfly','🦋','牡丹蝶'],['ribbon','ao',0,'牡丹青短'],P,P],
7:[['seed','boar','🐗','萩豬'],['ribbon','red',0,'萩短冊'],P,P],
8:[['light','moon','🌕','芒月'],['seed','geese','🦆','芒雁'],P,P],
9:[['seed','cup','🍶','菊盃'],['ribbon','ao',0,'菊青短'],P,P],
10:[['seed','deer','🦌','紅葉鹿'],['ribbon','ao',0,'紅葉青短'],P,P],
11:[['light','rain','☂️','柳雨'],['seed','swallow','🕊️','柳燕'],['ribbon','red',0,'柳短冊'],P],
12:[['light','phoenix','🦚','桐鳳凰'],P,P,P]};
const CARDS=[];
for(let m=1;m<=12;m++)SPEC[m].forEach(([k,t,ic,nm])=>CARDS.push({id:CARDS.length,m,k,t:t||'plain',ic:ic||PL[m],nm:nm||MN[m]+'素札'}));
const byT=t=>CARDS.filter(c=>c.t===t).map(c=>c.id), ID=t=>byT(t)[0];
const LIGHTS=CARDS.filter(c=>c.k==='light').map(c=>c.id);
const RAIN=ID('rain'),CUP=ID('cup'),CURTAIN=ID('curtain'),MOON=ID('moon');
const ISC=[ID('boar'),ID('deer'),ID('butterfly')],AKA=byT('aka'),AO=byT('ao');
const KD={light:'光',seed:'種',ribbon:'短',plain:'素'};
const DIFFN=['幼年鳩特','青年鳩特','成年鳩特'];
const NAME=['你','電腦'];
const nm=i=>CARDS[i].nm, mon=i=>CARDS[i].m;

/* ===== 役 ===== */
function calc(caps){
 const has=i=>caps.includes(i),cnt=a=>a.filter(has).length,k=x=>caps.filter(i=>CARDS[i].k===x).length;
 const L=[],nL=k('light'),nS=k('seed'),nR=k('ribbon'),nP=k('plain')+(has(CUP)?1:0),rain=has(RAIN);
 if(nL===5)L.push(['五光',10]);else if(nL===4)L.push(rain?['雨四光',7]:['四光',8]);else if(nL===3&&!rain)L.push(['三光',5]);
 if(cnt(ISC)===3)L.push(['豬鹿蝶',5]);
 if(has(CUP)&&has(CURTAIN))L.push(['花見酒',5]);
 if(has(CUP)&&has(MOON))L.push(['月見酒',5]);
 const a=cnt(AKA)===3,b=cnt(AO)===3;
 if(a&&b)L.push(['赤短青短',10]);else{if(a)L.push(['赤短',5]);if(b)L.push(['青短',5]);}
 if(nS>=5)L.push(['種',nS-4]);
 if(nR>=5)L.push(['短',nR-4]);
 if(nP>=10)L.push(['素',nP-9]);
 return{list:L,total:L.reduce((s,x)=>s+x[1],0)};
}

/* ===== 亂數（可重現） ===== */
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const quad=a=>{const c={};return a.some(i=>(c[mon(i)]=(c[mon(i)]||0)+1)===4)};

/* ===== 電腦 AI ===== */
const BASE={light:20,seed:9,ribbon:6,plain:1};
const SETS=[LIGHTS.filter(i=>i!==RAIN),ISC,AKA,AO,[CUP,CURTAIN],[CUP,MOON]];
function val(i){const c=CARDS[i];let v=BASE[c.k];if(ISC.includes(i))v+=5;if(i===CUP)v+=8;if(c.t==='aka'||c.t==='ao')v+=4;if(i===RAIN)v-=6;return v}
function gain(caps,ids){
 if(!ids.length)return 0;
 let v=(calc(caps.concat(ids)).total-calc(caps).total)*25;
 for(const i of ids){v+=val(i);for(const S of SETS)if(S.includes(i))v+=4*S.filter(j=>caps.includes(j)).length}
 if(caps.filter(i=>CARDS[i].k==='plain').length>=6)v+=2*ids.filter(i=>CARDS[i].k==='plain').length;
 return v;
}
function seenBy(p){return new Set([...G.hands[p],...G.field,...G.caps[0],...G.caps[1]])}
function unseenM(p,m){const s=seenBy(p);return CARDS.filter(c=>c.m===m&&!s.has(c.id)).length}
function options(p,cards){
 const o=[];
 for(const h of cards){const ms=G.field.filter(f=>mon(f)===mon(h));
  if(!ms.length)o.push({h,t:null,take:[],left:[]});
  else if(ms.length===2)ms.forEach((m,j)=>o.push({h,t:m,take:[h,m],left:[ms[1-j]]}));
  else o.push({h,t:ms[0],take:[h,...ms],left:[]});}
 return o;
}
function evalOpt(p,op){
 const o=1-p;let s=op.take.length?gain(G.caps[p],op.take):-val(op.h)*.6-3;
 if(D(p)===2){
  s+=.5*gain(G.caps[o],op.take.filter(i=>i!==op.h));
  if(!op.take.length){
   const u=unseenM(p,mon(op.h)),mine=G.hands[p].some(i=>i!==op.h&&mon(i)===mon(op.h));
   s-=gain(G.caps[o],[op.h])*(u===0?.1:mine?.5:1);if(mine)s+=val(op.h)*.4;
  }
  for(const l of op.left)s-=.4*gain(G.caps[o],[l]);
 }
 return s+Math.random()*.01;
}
const D=p=>G.diffs?G.diffs[p]:G.diff;
const pick=a=>a[Math.floor(Math.random()*a.length)];
function best(p,ops){
 if(D(p)===0){const c=ops.filter(o=>o.take.length);return c.length&&Math.random()<.5?pick(c):pick(ops)}
 let b=ops[0],bs=-1e9;for(const o of ops){const s=evalOpt(p,o);if(s>bs){bs=s;b=o}}return b;
}
const aiPlay=p=>best(p,options(p,G.hands[p]));
const aiTarget=(p,c)=>best(p,options(p,[c])).t;
function threat(o,p){
 const c=G.caps[o],mine=G.caps[p],has=i=>c.includes(i);
 const near=(S,req)=>{const h=S.filter(has).length;return h===req-1&&h+S.filter(i=>!has(i)&&!mine.includes(i)).length>=req};
 if(near(SETS[0],3)||near(ISC,3)||near(AKA,3)||near(AO,3)||near(SETS[4],2)||near(SETS[5],2))return true;
 const k=x=>c.filter(i=>CARDS[i].k===x).length;
 return k('seed')>=4||k('ribbon')>=4||k('plain')>=8;
}
function aiKoi(p,s){
 const o=1-p,n=G.hands[p].length;
 if(D(p)===0)return false;
 if(D(p)===1)return s<=4&&n>=4;
 return G.koi[o]===0&&s<6&&n>=3&&!threat(o,p);
}

/* ===== 遊戲流程 ===== */
let G=null,SEL=null,HELP=false;
const wait=(f,ms)=>{if(SIM)return f();const g=G;setTimeout(()=>{if(G===g)f()},ms)};
function log(t){G.log.unshift(t);if(G.log.length>40)G.log.pop()}
function newGame(diff,rounds,seed,isAI,diffs){
 TUT.off();
 NAME[1]=DIFFN[diff];
 G={diff,diffs,rounds,seed,round:0,totals:[0,0],isAI:isAI||[false,true],hist:[]};
 G.dealer=rng(seed)()<.5?0:1;
 startRound();
}
function startRound(){
 G.round++;const r=rng(G.seed*31+G.round*7919);
 do{const d=[...Array(48).keys()];for(let i=47;i>0;i--){const j=Math.floor(r()*(i+1));[d[i],d[j]]=[d[j],d[i]]}
  G.hands=[d.slice(0,8),d.slice(8,16)];G.field=d.slice(16,24);G.deck=d.slice(24);
 }while([G.field,...G.hands].some(quad));
 Object.assign(G,{caps:[[],[]],koi:[0,0],last:[0,0],turn:G.dealer,flip:null,pending:null,log:[],fresh:[]});SEL=null;
 log(`第 ${G.round} 局開始，${NAME[G.dealer]}是莊家（先出牌）`);
 G.phase='deal';G.dealing=true;render();wait(beginTurn,DEAL_MS);
}
function beginTurn(){
 const p=G.turn;
 if(!G.hands[0].length&&!G.hands[1].length)return endRound(-1);
 G.phase='play';render();
 if(G.isAI[p])wait(()=>gate('ai',()=>{const o=G.tut?TUT.aiMove():aiPlay(p);playCard(p,o.h,o.t)}),850);
 else gate('turn0',()=>{});
}
function capture(p,c,t,verb){
 const ms=G.field.filter(f=>mon(f)===mon(c));
 if(!ms.length){sfx('tap');G.field.push(c);G.fresh=[c];log(`${NAME[p]}${verb}${nm(c)}，沒有配對，留在場上`);return}
 sfx('slap');
 const take=ms.length===2?[ms.includes(t)?t:ms[0]]:ms;
 G.field=G.field.filter(f=>!take.includes(f));G.caps[p].push(c,...take);G.fresh=[c,...take];
 log(`${NAME[p]}${verb}${nm(c)}，吃下${take.map(nm).join('、')}`);
}
function playCard(p,h,t){
 G.hands[p]=G.hands[p].filter(i=>i!==h);SEL=null;G.phase='busy';if(G.isAI[p])G.fromOpp=h;
 capture(p,h,t,'打出');render();wait(()=>drawStep(p),700);
}
function drawStep(p){
 const c=G.deck.shift();G.flip=c;sfx('flip');const ms=G.field.filter(f=>mon(f)===mon(c));
 if(ms.length===2&&!G.isAI[p]){G.phase='drawChoose';G.pending=c;render();gate('choose',()=>{});return}
 const t=ms.length===2?aiTarget(p,c):null;
 render();wait(()=>gate('flip'+p,()=>{capture(p,c,t,'翻出');G.flip=null;render();wait(()=>afterTurn(p),550)}),650);
}
function afterTurn(p){gate('after'+p,()=>afterTurnCore(p))}
function afterTurnCore(p){
 const s=calc(G.caps[p]).total;
 if(s>G.last[p]){
  sfx('yaku');
  if(!G.hands[p].length)return endRound(p);
  if(G.isAI[p]){
   if(!aiKoi(p,s))return endRound(p);
   G.koi[p]++;G.last[p]=s;log(`${NAME[p]}喊「來來」！目前 ${s} 文，繼續拚`);toast(`${NAME[p]}：來來！`);if(!say('こいこい'))sfx('koi');
  }else{G.phase='decide';render();showDecide(s);return}
 }
 G.turn=1-p;beginTurn();
}
function endRound(w){
 G.phase='end';let base=0,mul=1,notes=[],list=[];
 if(w>=0){const r=calc(G.caps[w]);base=r.total;list=r.list;
  if(base>=7){mul*=2;notes.push('7 文以上 ×2')}
  if(G.koi[1-w]>0){mul*=2;notes.push('對手喊過來來 ×2')}
  say('しょうぶ');G.totals[w]+=base*mul;G.dealer=w;log(`${NAME[w]}勝負！得 ${base*mul} 文`);
 }else log('流局：雙方都沒結算，本局不計分');
 G.hist.push({w,pts:base*mul});
 if(SIM){if(G.round<G.rounds)startRound();return}
 render();if(w===0)sfx('win');showRoundEnd(w,list,base,mul,notes);
}

/* ===== 音效（網頁音訊即時合成） ===== */
let AC=null,MUTE=false;
try{MUTE=localStorage.getItem('hf_mute')==='1'}catch(e){}
function ac(){if(SIM)return null;if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}if(AC.state==='suspended')AC.resume();return AC}
function noise(dur,freq,q,gain,shape,t0=0){
 const a=ac();if(!a||MUTE)return;
 const n=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
 for(let i=0;i<n;i++){const t=i/n;d[i]=(Math.random()*2-1)*(shape==='swish'?Math.sin(Math.PI*t)**2:(1-t)**4)}
 const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();
 s.buffer=b;f.type='bandpass';f.frequency.value=freq;f.Q.value=q;g.gain.value=gain;
 s.connect(f);f.connect(g);g.connect(a.destination);s.start(a.currentTime+t0);
}
function tone(fr,dur,gain,t0=0,type='sine'){
 const a=ac();if(!a||MUTE)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+t0;
 o.type=type;o.frequency.value=fr;g.gain.setValueAtTime(gain,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
 o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.05);
}
const SFX={
 slap(){noise(.08,2400,.7,1.6);noise(.05,900,1,1.2);tone(120,.09,.6,0,'triangle')},
 deal(){noise(.06,2600,.9,.35)},
 stamp(){noise(.12,600,.8,1.4);tone(85,.14,.7,0,'triangle');noise(.04,2500,1,.5)},
 tap(){noise(.05,3200,1,.7);tone(220,.04,.2,0,'triangle')},
 flip(){noise(.22,1800,.6,.55,'swish')},
 yaku(){tone(988,.5,.22);tone(1319,.7,.18,.12)},
 koi(){tone(523,.14,.25,0,'square');tone(659,.14,.25,.13,'square');tone(784,.35,.25,.26,'square')},
 win(){[523,659,784,1047].forEach((f,k)=>tone(f,.45,.2,k*.11))}
};
const sfx=n=>{if(!SIM)SFX[n]()};
/* ===== 和風勝敗畫面：勝＝太鼓與上行旋律、櫻花；負＝尺八下行與鈴聲、落葉 ===== */
function drum(t,v){const a=AC,o=a.createOscillator(),g=a.createGain(),s=a.currentTime+t;o.frequency.setValueAtTime(120,s);o.frequency.exponentialRampToValueAtTime(46,s+.3);g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.001,s+.6);o.connect(g);g.connect(a.destination);o.start(s);o.stop(s+.65);noise(.1,700,.7,v*.6,null,t)}
SFX.fanfare=()=>{const a=ac();if(!a||MUTE)return;[0,.22,.44,.58,.72].forEach((t,i)=>drum(t,i<3?.75:.6));
 [293.66,311.13,392,440,466.16,587.33].forEach((f,i)=>tone(f,.55,.18,1+i*.13,'triangle'));[587.33,880,1174.66].forEach(f=>tone(f,1.8,.11,1.85,'triangle'));drum(1.85,.8)};
SFX.lament=()=>{const a=ac();if(!a||MUTE)return;const s=a.currentTime+.15,o=a.createOscillator(),g=a.createGain(),v=a.createOscillator(),vg=a.createGain();
 o.frequency.setValueAtTime(466,s);o.frequency.linearRampToValueAtTime(440,s+.5);o.frequency.linearRampToValueAtTime(311,s+1.7);v.frequency.value=5;vg.gain.value=6;v.connect(vg);vg.connect(o.frequency);
 g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(.2,s+.35);g.gain.setValueAtTime(.17,s+1.4);g.gain.linearRampToValueAtTime(0,s+2);o.connect(g);g.connect(a.destination);[o,v].forEach(x=>{x.start(s);x.stop(s+2.1)});
 noise(1.8,900,1.2,.05,'swish',.15);[1,2.76,5.4].forEach((m,i)=>tone(660*m,2.8-i*.6,.12/(i+1),2.2,'sine'))};
SFX.even=()=>{[392,440,392].forEach((f,i)=>tone(f,.6,.14,i*.3,'triangle'))};
function recGet(k){try{return JSON.parse(localStorage.getItem(k)||'{}')}catch(e){return{}}}
function recAdd(k,who,res){const R=recGet(k),r=R[who]||{w:0,l:0,d:0,s:0};r[res]++;r.s=res==='w'?Math.max(1,r.s+1):0;R[who]=r;try{localStorage.setItem(k,JSON.stringify(R))}catch(e){}return r}
function recLine(who,r){return `對${who}：${r.w} 勝 ${r.l} 敗${r.d?` ${r.d} 和`:''}${r.s>=2?`・目前 ${r.s} 連勝`:''}`}
function showFinale(kind,o){
 let f=$('fin');if(!f){f=document.createElement('div');f.id='fin';document.body.appendChild(f)}
 f.className=kind;f.hidden=false;closeModal();
 f.innerHTML=`${kind==='win'?'<div class="rays"></div>':''}<div class="big">${kind==='win'?'勝':kind==='lose'?'負':'和'}</div><div class="fsub">${o.sub||''}</div>${o.line?`<div class="fline">${o.line}</div>`:''}${o.stat?`<div class="fstat">${o.stat}</div>`:''}${kind==='win'?`<img class="fseal" src="${BRAND.seal}" alt="鳩特數理朱印">`:''}${o.extra||''}<div class="btns">${o.btns||''}</div>`;
 if(!RMF){const n=kind==='win'?34:kind==='lose'?16:0;for(let i=0;i<n;i++){const e=document.createElement('i');e.className='fall '+(kind==='win'?'petal':'leaf');
  e.style.cssText=`left:${Math.random()*100}vw;--dx:${(Math.random()*30-15).toFixed(1)}vw;--r:${Math.random()*720-360|0}deg;animation-duration:${(kind==='win'?4:7)+Math.random()*4}s;animation-delay:${Math.random()*(kind==='win'?2.5:4)}s`;f.appendChild(e)}}
 sfx(kind==='win'?'fanfare':kind==='lose'?'lament':'even');
}
const RMF=!SIM&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function hideFinale(){const f=$('fin');if(f)f.hidden=true}

/* ===== 配樂：程式即時合成的原創和風音樂（都節音階：古箏、尺八、太鼓） ===== */
let BGM_ON=true;try{BGM_ON=localStorage.getItem('hf_bgm')!=='0'}catch(e){}
const RHY=['x.x.x...x.x.x...','x..xx...x..x....','x.xxx...x...x...','x...x.x.x.x.x...','x..x..x.x.......','xx..x...x.xx....'];
const BGM={
 timer:null,out:null,
 init(){
  const a=ac();if(!a)return false;if(this.out)return true;const sr=a.sampleRate;
  const out=a.createGain();out.gain.value=0;
  const rev=a.createConvolver(),L=Math.floor(sr*2.4),ir=a.createBuffer(2,L,sr);
  for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<L;i++)d[i]=(Math.random()*2-1)*(1-i/L)**3}
  rev.buffer=ir;const wet=a.createGain();wet.gain.value=.4;
  out.connect(a.destination);out.connect(rev);rev.connect(wet);wet.connect(a.destination);this.out=out;
  this.noise=a.createBuffer(1,sr*2,sr);{const d=this.noise.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
  const deg=[0,1,5,7,8];this.freqs=[];for(let o=0;o<3;o++)deg.forEach(s=>this.freqs.push(146.83*2**(o+s/12)));
  this.bufs=this.freqs.map(f=>{const len=Math.floor(sr*2.4),b=a.createBuffer(1,len,sr),y=b.getChannelData(0),N=Math.round(sr/f);
   for(let i=0;i<=N;i++)y[i]=(Math.random()*2-1)*.7;
   for(let i=N+1;i<len;i++)y[i]=.4975*(y[i-N]+y[i-N-1]);return b});
  return true;
 },
 pluck(i,t,v,bend){
  const a=AC,s=a.createBufferSource(),g=a.createGain();s.buffer=this.bufs[i];
  if(bend){s.playbackRate.setValueAtTime(1,t+.28);s.playbackRate.linearRampToValueAtTime(1.06,t+.45)}
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+2.3);
  s.connect(g);g.connect(this.out);s.start(t);s.stop(t+2.4);

function rkReady(ms=6000){return new Promise((res,rej)=>{if(window.HFRank)return res(window.HFRank);const t=setTimeout(()=>rej(new Error('offline')),ms);addEventListener('hfrank-ready',()=>{clearTimeout(t);res(window.HFRank)},{once:true})})}
const rkTimeout=(pr,ms=8000)=>Promise.race([pr,new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),ms))]);
async function rkTop(cat){const H=await rkReady();return rkTimeout(H.top(cat))}

 }).catch(e=>{el.innerHTML=`<p class="pill">${rkErr(e)}</p>`});

function showRules(){
 const rows=[['五光','五張光札',10],['四光','四張光札（不含雨）',8],['雨四光','四張光札（含柳雨）',7],['三光','三張光札（不含雨）',5],['豬鹿蝶','萩豬＋紅葉鹿＋牡丹蝶',5],['花見酒','櫻幕＋菊盃',5],['月見酒','芒月＋菊盃',5],['赤短','三張赤短（松梅櫻）',5],['青短','三張青短（牡丹菊紅葉）',5],['赤短青短','赤短與青短同時成立',10],['種','種札 5 張，每多 1 張＋1','1～'],['短','短冊 5 張，每多 1 張＋1','1～'],['素','素札 10 張，每多 1 張＋1（菊盃也算素札）','1～']];

 modal(`<h2>規則與役表</h2>

function act(a,el){
 if(['menu','start','tutorial','rematch','rank'].includes(a))hideFinale();
 if(a==='opt'){OPT[el.dataset.k]=+el.dataset.v;return showMenu()}
 if(a==='start'){const v=parseInt($('seedIn').value,10),man=Number.isFinite(v)&&v>0;closeModal();newGame(OPT.diff,OPT.rounds,man?v%1000000:1+Math.floor(Math.random()*999999));G.seedManual=man;return}

 if(a==='skip')return STAMP.skip&&STAMP.skip();
 if(a==='rules')return showRules();
 if(a==='menu')return showMenu();

 if(a==='close'){closeModal();if(!G)showMenu();return}
 if(a==='helper'){HELP=!HELP;return G.phase==='deal'?null:render()}

}
function onHand(id){

  const c=G.pending;G.pending=null;G.phase='busy';capture(0,c,id,'翻出');G.flip=null;render();wait(()=>afterTurn(0),550);
 }

else{
 {const r=document.documentElement.style;r.setProperty('--logo-gold',`url(${BRAND.gold})`);r.setProperty('--logo-paper',`url(${BRAND.paper})`)}
 try{if(localStorage.getItem('hf_lab')==='1')document.body.classList.add('lab')}catch(e){}

 });

}
