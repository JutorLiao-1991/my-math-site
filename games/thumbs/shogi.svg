<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="鳩特將棋示意圖">
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e9c47e"/><stop offset="1" stop-color="#cf9f55"/></linearGradient>
    <linearGradient id="pc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbe8bf"/><stop offset="1" stop-color="#e2bd78"/></linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="1.6" stdDeviation="1.4" flood-opacity=".45"/></filter>
    <symbol id="koma" viewBox="0 0 30 34"><path d="M15 1.5 26 6.5 28.5 32.5H1.5L4 6.5z" fill="url(#pc)" stroke="#6b4a1f" stroke-width="1.3" stroke-linejoin="round"/></symbol>
  </defs>
  <rect width="120" height="120" rx="18" fill="url(#wood)"/>
  <g stroke="#5a3d17" stroke-width="1.2" opacity=".7">
    <path d="M10 10v100M37 10v100M64 10v100M91 10v100M10 10h100M10 37h100M10 64h100M10 91h100"/>
  </g>
  <circle cx="37" cy="64" r="2.2" fill="#5a3d17"/><circle cx="91" cy="37" r="2.2" fill="#5a3d17"/>
  <g font-family="'Hiragino Mincho ProN','Yu Mincho','Noto Serif TC',serif" font-weight="900" text-anchor="middle" filter="url(#sh)">
    <!-- 對手的棋子（倒過來） -->
    <g transform="rotate(180 50.5 23.5)"><use href="#koma" x="38" y="9" width="25" height="28"/><text x="50.5" y="31" font-size="14" fill="#1b1b1b">歩</text></g>
    <g transform="rotate(180 77.5 23.5)"><use href="#koma" x="65" y="9" width="25" height="28"/><text x="77.5" y="31" font-size="14" fill="#1b1b1b">玉</text></g>
    <!-- 自己的棋子 -->
    <use href="#koma" x="65" y="36" width="25" height="28"/><text x="77.5" y="58" font-size="14" fill="#c21f17">龍</text>
    <use href="#koma" x="38" y="90" width="25" height="28"/><text x="50.5" y="112" font-size="14" fill="#1b1b1b">王</text>
    <use href="#koma" x="11" y="63" width="25" height="28"/><text x="23.5" y="85" font-size="14" fill="#1b1b1b">金</text>
  </g>
  <!-- 移動提示 -->
  <path d="M77.5 63v-2" stroke="#2f7ef7" stroke-width="2"/>
  <circle cx="50.5" cy="50.5" r="4" fill="#2f7ef7" opacity=".85"/>
</svg>
