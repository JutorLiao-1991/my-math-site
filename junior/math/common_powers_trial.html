<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>鳩特數理｜常見次方表（國一）</title>
  <style>
    :root{--ink:#263238;--blue:#4a90e2;--blue-dark:#2563a8;--cyan:#0891b2;--green:#43a047;--orange:#f59e0b;--red:#ef5350;--paper:#fff;--line:#d9e2ec;--bg:#f4f7f6;--p1:#fff0eb;--p2:#eaf6ff}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"Segoe UI","Microsoft JhengHei",sans-serif;color:var(--ink);background:#263238;touch-action:manipulation;user-select:none}button,a{font:inherit;touch-action:manipulation}.hidden{display:none!important}sup{font-size:.58em;vertical-align:super}#app{position:relative;width:100%;height:100%;background:var(--bg);overflow:hidden}.screen{position:absolute;inset:0;display:none}.nav-cluster{position:absolute;top:14px;left:14px;z-index:1600;display:flex;gap:8px}.nav-btn{display:flex;align-items:center;justify-content:center;min-height:42px;padding:7px 13px;border:2px solid #cbd5e1;border-radius:12px;background:#fff;color:#475569;text-decoration:none;font-weight:800;box-shadow:0 3px 0 #b8c5d3;cursor:pointer}.nav-btn:active{transform:translateY(3px);box-shadow:none}.mode-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:72px 18px 22px;background-color:#eaf3fb;background-image:radial-gradient(#aec4d7 14%,transparent 15%);background-size:22px 22px}.game-title{font-size:clamp(2.4rem,7vw,4.5rem);line-height:1.13;text-align:center;font-weight:900;color:#245e92;text-shadow:3px 3px #fff,6px 6px #b8d2e8;margin-bottom:30px}.game-title small{font-size:.42em}.mode-grid{width:min(900px,94vw);display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.mode-card{min-height:130px;border:0;border-radius:22px;color:#fff;font-size:clamp(1.25rem,3vw,1.9rem);font-weight:900;cursor:pointer;box-shadow:0 8px 0 #0003;transition:.12s}.mode-card span{display:block;font-size:.55em;margin-top:7px;opacity:.92}.mode-card:active{transform:translateY(8px);box-shadow:none}.mode-practice{grid-column:1/-1;background:var(--green)}.mode-single{background:var(--blue)}.mode-pk{background:var(--cyan)}.practice-screen{flex-direction:column;align-items:center;padding:76px 18px 22px;overflow:auto;background:var(--bg)}.section-title{text-align:center;margin:0 0 20px;font-size:clamp(1.8rem,5vw,3rem);color:#245e92}.base-grid{width:min(880px,96vw);display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.base-card{min-height:125px;border:0;border-radius:20px;background:#fff;color:#245e92;font-size:clamp(2rem,7vw,3.6rem);font-weight:900;box-shadow:0 7px 0 #bed0df,0 10px 24px #506b801d;cursor:pointer}.base-card small{display:block;font-size:.28em;color:#64748b}.base-card:active{transform:translateY(7px);box-shadow:none}.practice-work{width:min(1060px,100%);display:grid;grid-template-columns:minmax(360px,1fr) minmax(260px,340px);gap:18px;align-items:start}.sheet,.keypad-panel,.single-card{background:#fff;border-radius:20px;box-shadow:0 7px 22px #506b8020}.sheet{padding:18px 24px}.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}.sheet-head h2{margin:0;font-size:1.6rem}.secondary-btn{border:2px solid #cbd5e1;background:#fff;color:#475569;border-radius:10px;padding:8px 12px;font-weight:800;cursor:pointer}.equation-list{display:grid;grid-template-columns:1fr;gap:7px}.equation-row{min-height:55px;border:2px solid #e2e8f0;border-radius:12px;padding:7px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:1.28rem;font-weight:900;background:#f8fafc}.equation-row.active{border-color:var(--blue);box-shadow:0 0 0 4px #4a90e222}.equation-row.done{background:#e8f5e9;border-color:#81c784;color:#1b5e20}.digit-slots{display:flex;gap:4px}.digit-slot{width:29px;height:37px;border:2px dashed #b5c4d3;border-radius:7px;display:flex;align-items:center;justify-content:center;background:#fff;color:#245e92}.equation-row.active .digit-slot{border-style:solid;border-color:var(--blue)}.practice-message{min-height:31px;margin-top:9px;text-align:center;font-weight:900;color:#64748b}.keypad-panel{padding:16px;display:flex;flex-direction:column;justify-content:center}.keypad-title{text-align:center;font-size:1.05rem;font-weight:900;color:#64748b;margin-bottom:10px}.answer-display{width:100%;min-height:72px;border:3px solid #b9c8d7;border-radius:15px;background:#f8fafc;display:flex;align-items:center;justify-content:center;font:900 2.35rem "Courier New",monospace;color:#245e92;margin-bottom:13px}.answer-display.correct,.pk-answer.correct{background:#e8f5e9;border-color:#43a047;color:#1b5e20}.answer-display.wrong,.pk-answer.wrong{background:#ffebee;border-color:#ef5350;color:#b71c1c}.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.numpad button{min-height:55px;border:2px solid #cbd5e1;border-radius:12px;background:#fff;color:#263238;font-size:1.35rem;font-weight:900;box-shadow:0 3px 0 #cbd5e1;cursor:pointer}.numpad button:active{transform:translateY(3px);box-shadow:none}.numpad .clear{grid-column:2/4;color:#b45309;background:#fff7ed}.numpad .confirm{grid-column:1/4;background:#263238;border-color:#263238;color:#fff;box-shadow:0 4px 0 #111827}.single-screen{flex-direction:column;padding:72px 18px 18px;background-color:#eaf3fb;background-image:radial-gradient(#bed0df 14%,transparent 15%);background-size:22px 22px}.single-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;padding-left:220px}.score{font-size:1.5rem;font-weight:900;color:#245e92}.progress{font-weight:900;background:#fff;border-radius:18px;padding:7px 15px}.single-layout{flex:1;min-height:0;width:min(980px,100%);margin:auto;display:grid;grid-template-columns:minmax(320px,1fr) minmax(260px,340px);gap:18px}.single-card{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}.question{font-size:clamp(3.6rem,9vw,7rem);font-weight:900;line-height:1.1;text-align:center}.timer-line{display:flex;align-items:center;width:min(440px,90%);gap:12px;margin-top:22px}.timer-text{width:62px;text-align:right;font:800 1.3rem monospace}.timer-track{flex:1;height:15px;border-radius:9px;background:#d8e0e8;overflow:hidden}.timer-bar{height:100%;width:100%;background:var(--green)}.feedback{min-height:34px;margin-top:12px;font-size:1.15rem;font-weight:900;text-align:center}.streak{color:var(--orange);margin-left:10px}.countdown{display:none;position:absolute;inset:0;z-index:2000;background:#111827f5;color:#fff;align-items:center;justify-content:center;flex-direction:column}.countdown-label{font-size:2rem;font-weight:900}.countdown-number{font-size:9rem;font-weight:900;color:#facc15}.end-overlay{display:none;position:absolute;inset:0;z-index:1200;background:#ffffffee;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:24px}.end-overlay strong{font-size:5rem;color:var(--orange)}.end-actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}.primary-btn{border:0;border-radius:14px;padding:13px 24px;background:var(--blue);color:#fff;font-weight:900;cursor:pointer}.pk-setup{flex-direction:column;background:#fff}.setup-half{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:15px}.setup-top{background:var(--p1);transform:rotate(180deg);border-bottom:3px solid #78909c}.setup-bottom{background:var(--p2);border-top:3px solid #78909c}.avatar-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.avatar{width:58px;height:58px;border:3px solid transparent;border-radius:50%;background:#fff;font-size:2.2rem;box-shadow:0 3px 8px #0002;cursor:pointer}.avatar.selected{border-color:#facc15;box-shadow:0 0 15px #facc15}.pk-start-wrap{position:absolute;z-index:30;top:50%;left:50%;transform:translate(-50%,-50%)}.pk-start{border:3px solid #fff;border-radius:28px;padding:13px 30px;background:#e91e63;color:#fff;font-size:1.25rem;font-weight:900;box-shadow:0 6px 0 #880e4f;cursor:pointer}.pk-screen{flex-direction:column}.player{position:relative;flex:1;min-height:0;display:grid;grid-template-columns:minmax(230px,1fr) minmax(210px,310px);gap:12px;padding:12px 18px;align-items:center}.player.top{background:var(--p1);transform:rotate(180deg);border-bottom:2px solid #455a64}.player.bottom{background:var(--p2);border-top:2px solid #455a64}.player-main{text-align:center}.player-score{font-size:1.4rem;font-weight:900}.pk-question{font-size:clamp(2.6rem,7vh,4.4rem);font-weight:900;margin:8px 0}.pk-answer{min-height:58px;width:min(260px,84%);margin:0 auto;border:3px solid #b9c8d7;border-radius:13px;background:#fff;display:flex;align-items:center;justify-content:center;font:900 2.15rem monospace}.pk-feedback{height:26px;margin-top:6px;font-weight:900}.pk-keypad .numpad button{min-height:38px;font-size:1.05rem}.pk-center{height:48px;flex-shrink:0;background:#263238;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:900;padding:0 10px}.pk-end{display:none;position:absolute;inset:0;background:#fffffff0;align-items:center;justify-content:center;flex-direction:column;z-index:20;text-align:center}.pk-end .emoji{font-size:4rem}.pk-end .title{font-size:2rem;font-weight:900}.catchup{color:#e53935}
    @media(max-width:760px){.mode-grid{grid-template-columns:1fr}.mode-practice{grid-column:1}.mode-card{min-height:90px}.game-title{margin-bottom:20px}.base-grid{grid-template-columns:repeat(2,1fr)}.practice-work,.single-layout{grid-template-columns:1fr}.practice-screen,.single-screen{overflow:auto}.single-top{padding-left:0;padding-top:42px}.keypad-panel{min-height:380px}.pk-screen{overflow:auto}.player{min-height:410px;grid-template-columns:1fr minmax(170px,230px);padding:8px}.pk-keypad .numpad{gap:5px}.pk-keypad .numpad button{min-height:34px}.nav-cluster{top:8px;left:8px}.nav-btn{min-height:37px;padding:5px 9px;font-size:.83rem}}
    @media(max-width:430px){.sheet{padding:14px 10px}.equation-row{font-size:1.08rem}.digit-slot{width:25px;height:33px}.player{grid-template-columns:1fr 150px}.pk-question{font-size:2.2rem}.pk-keypad .numpad button{font-size:.9rem}.pk-center{font-size:.82rem}}
  </style>
</head>
<body>
<div id="app">
  <div class="nav-cluster">
    <a class="nav-btn" href="../../index.html">← 回主選單</a>
    <button class="nav-btn hidden" id="modeBack" onclick="returnToModeMenu()">↩ 返回模式選擇</button>
  </div>
  <div class="countdown" id="countdown"><div class="countdown-label" id="countdownLabel">準備開始</div><div class="countdown-number" id="countdownNumber">3</div></div>

  <section class="screen mode-screen" id="modeScreen">
    <div class="game-title">🦔 常見次方表<br><small>國一</small></div>
    <div class="mode-grid">
      <button class="mode-card mode-practice" onclick="openPractice()">🌱 練習模式<span>依底數熟練常見次方</span></button>
      <button class="mode-card mode-single" onclick="startSinglePlayer()">👤 單人模式<span>20 題限時快問快答</span></button>
      <button class="mode-card mode-pk" onclick="showPKSetup()">⚔️ 雙人 PK<span>率先取得 300 分</span></button>
    </div>
  </section>

  <section class="screen practice-screen" id="practiceScreen">
    <div id="practicePicker"><h1 class="section-title">選擇底數</h1><div class="base-grid" id="baseGrid"></div></div>
    <div class="practice-work hidden" id="practiceWork">
      <div class="sheet">
        <div class="sheet-head"><h2 id="practiceTitle">2 的次方表</h2><button class="secondary-btn" onclick="showPracticePicker()">← 選其他底數</button></div>
        <div class="equation-list" id="equationList"></div><div class="practice-message" id="practiceMessage"></div>
      </div>
      <div class="keypad-panel"><div class="keypad-title">依序填入答案</div><div class="answer-display" id="practiceDisplay">—</div><div class="numpad" id="practiceNumpad"></div></div>
    </div>
  </section>

  <section class="screen single-screen" id="singleScreen">
    <div class="single-top"><div class="score"><span id="singleScore">0.0</span> 分 <span class="streak" id="singleStreak"></span></div><div class="progress" id="singleProgress">0 / 20</div></div>
    <div class="single-layout">
      <div class="single-card"><div class="question" id="singleQuestion">? =</div><div class="timer-line"><div class="timer-text" id="singleTimerText">5.0s</div><div class="timer-track"><div class="timer-bar" id="singleTimerBar"></div></div></div><div class="feedback" id="singleFeedback">準備開始……</div></div>
      <div class="keypad-panel"><div class="keypad-title">輸入答案</div><div class="answer-display" id="singleDisplay">—</div><div class="numpad" id="singleNumpad"></div></div>
    </div>
    <div class="end-overlay" id="singleEnd"><h2>試煉完成！</h2><strong id="singleFinalScore">0.0</strong><p id="singleComment"></p><div class="end-actions"><button class="primary-btn" onclick="startSinglePlayer()">再玩一次</button><button class="secondary-btn" onclick="returnToModeMenu()">返回模式選擇</button></div></div>
  </section>

  <section class="screen pk-setup" id="pkSetup">
    <div class="pk-start-wrap"><button class="pk-start" onclick="startPKGame()">開始對戰 ⚔️</button></div>
    <div class="setup-half setup-top"><b>Player 1 選角色（上方）</b><div class="avatar-grid" id="avatarTop"></div></div>
    <div class="setup-half setup-bottom"><b>Player 2 選角色（下方）</b><div class="avatar-grid" id="avatarBottom"></div></div>
  </section>

  <section class="screen pk-screen" id="pkScreen">
    <div class="player top" id="playerTop"><div class="player-main"><div class="player-score"><span id="avatarTopDisplay">🦊</span> <span id="scoreTop">0</span> <span class="streak" id="streakTop"></span></div><div class="pk-question" id="questionTop">? =</div><div class="pk-answer" id="answerTop">—</div><div class="pk-feedback" id="feedbackTop"></div><div class="pk-end" id="endTop"><div class="emoji">🏆</div><div class="title">Winner</div></div></div><div class="keypad-panel pk-keypad"><div class="numpad" id="numpadTop"></div></div></div>
    <div class="pk-center" id="pkStatus">搶答開始！率先 300 分獲勝</div>
    <div class="player bottom" id="playerBottom"><div class="player-main"><div class="player-score"><span id="avatarBottomDisplay">🐰</span> <span id="scoreBottom">0</span> <span class="streak" id="streakBottom"></span></div><div class="pk-question" id="questionBottom">? =</div><div class="pk-answer" id="answerBottom">—</div><div class="pk-feedback" id="feedbackBottom"></div><div class="pk-end" id="endBottom"><div class="emoji">🏆</div><div class="title">Winner</div></div></div><div class="keypad-panel pk-keypad"><div class="numpad" id="numpadBottom"></div></div></div>
  </section>
</div>

<script>
const $=id=>document.getElementById(id),POWER_RANGES={2:10,3:6,4:4,5:4,6:3,7:3,8:3,9:3,10:4},FACTS=Object.entries(POWER_RANGES).flatMap(([base,max])=>Array.from({length:max+1},(_,exponent)=>({base:Number(base),exponent,answer:Number(base)**exponent}))),SP_TOTAL_Q=20,SP_TIME_LIMIT=5000,PK_WIN_SCORE=300;
let audioCtx=null,countdownTimer=null,practiceTimeout=null,singleTimerFrame=null,singleTimeout=null,pkTimeout=null;
function initAudio(){try{const C=window.AudioContext||window.webkitAudioContext;if(C&&!audioCtx)audioCtx=new C();if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume()}catch(e){console.log(e)}}
function playSound(type){try{if(!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain(),n=audioCtx.currentTime;o.connect(g);g.connect(audioCtx.destination);if(type==='correct'){o.type='sine';o.frequency.setValueAtTime(659.25,n);o.frequency.setValueAtTime(523.25,n+.2);g.gain.setValueAtTime(.28,n);g.gain.exponentialRampToValueAtTime(.01,n+.7);o.start(n);o.stop(n+.7)}else if(type==='wrong'){o.type='sawtooth';o.frequency.setValueAtTime(300,n);o.frequency.exponentialRampToValueAtTime(150,n+.3);g.gain.setValueAtTime(.14,n);g.gain.exponentialRampToValueAtTime(.01,n+.3);o.start(n);o.stop(n+.3)}else{o.type='triangle';o.frequency.setValueAtTime(800,n);g.gain.setValueAtTime(.18,n);g.gain.exponentialRampToValueAtTime(.01,n+.1);o.start(n);o.stop(n+.1)}}catch(e){console.log(e)}}
function shuffle(list){const a=[...list];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function powerHTML(fact){return`${fact.base}<sup>${fact.exponent}</sup> =`}
function clearSchedules(){if(singleTimerFrame)cancelAnimationFrame(singleTimerFrame);singleTimerFrame=null;if(countdownTimer)clearInterval(countdownTimer);countdownTimer=null;if(practiceTimeout)clearTimeout(practiceTimeout);practiceTimeout=null;if(singleTimeout)clearTimeout(singleTimeout);singleTimeout=null;if(pkTimeout)clearTimeout(pkTimeout);pkTimeout=null;$('countdown').style.display='none'}
function hideScreens(){document.querySelectorAll('.screen').forEach(s=>s.style.display='none')}
function showScreen(id){hideScreens();$(id).style.display='flex';$('modeBack').classList.toggle('hidden',id==='modeScreen')}
function returnToModeMenu(){clearSchedules();singleProcessing=true;pkState='idle';showScreen('modeScreen')}
function runCountdown(label,done){clearInterval(countdownTimer);$('countdownLabel').textContent=label;$('countdownNumber').textContent='3';$('countdown').style.display='flex';let n=3;playSound('tick');countdownTimer=setInterval(()=>{n--;if(n>0){$('countdownNumber').textContent=n;playSound('tick')}else{clearInterval(countdownTimer);countdownTimer=null;$('countdown').style.display='none';done()}},1000)}
function makeNumpad(id,onDigit,onClear,onConfirm,needsConfirm=true){const el=$(id);el.innerHTML='';[7,8,9,4,5,6,1,2,3,0].forEach(n=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>onDigit(n);el.appendChild(b)});const clear=document.createElement('button');clear.className='clear';clear.textContent='清除';clear.onclick=onClear;el.appendChild(clear);if(needsConfirm){const ok=document.createElement('button');ok.className='confirm';ok.textContent='確認';ok.onclick=onConfirm;el.appendChild(ok)}}

let practiceBase=2,practiceExponent=0,practiceBuffer='';
function openPractice(){initAudio();clearSchedules();showScreen('practiceScreen');showPracticePicker()}
function showPracticePicker(){if(practiceTimeout)clearTimeout(practiceTimeout);practiceTimeout=null;$('practiceDisplay').className='answer-display';$('practicePicker').classList.remove('hidden');$('practiceWork').classList.add('hidden')}
function startPracticeTable(base){if(practiceTimeout)clearTimeout(practiceTimeout);practiceTimeout=null;practiceBase=base;practiceExponent=0;practiceBuffer='';$('practiceDisplay').className='answer-display';$('practicePicker').classList.add('hidden');$('practiceWork').classList.remove('hidden');$('practiceTitle').textContent=`${base} 的次方表`;$('practiceMessage').textContent='從 0 次方開始，一格一格填入答案。';renderPracticeRows();updatePracticeDisplay()}
function renderPracticeRows(){let html='',max=POWER_RANGES[practiceBase];for(let exponent=0;exponent<=max;exponent++){const answer=practiceBase**exponent,slots=String(answer).length;html+=`<div class="equation-row ${exponent<practiceExponent?'done':exponent===practiceExponent?'active':''}" id="practiceRow${exponent}"><span>${practiceBase}<sup>${exponent}</sup> =</span><span class="digit-slots">${Array.from({length:slots},(_,i)=>`<span class="digit-slot" id="practiceSlot${exponent}-${i}">${exponent<practiceExponent?String(answer)[i]:''}</span>`).join('')}</span></div>`}$('equationList').innerHTML=html;renderPracticeBuffer()}
function renderPracticeBuffer(){if(practiceExponent>POWER_RANGES[practiceBase])return;practiceBuffer.split('').forEach((c,i)=>{const slot=$(`practiceSlot${practiceExponent}-${i}`);if(slot)slot.textContent=c})}
function updatePracticeDisplay(){$('practiceDisplay').textContent=practiceExponent>POWER_RANGES[practiceBase]?'完成！':practiceBuffer||'—'}
function practiceDigit(d){if(practiceExponent>POWER_RANGES[practiceBase]||practiceTimeout)return;const expected=String(practiceBase**practiceExponent);if(practiceBuffer.length>=expected.length)return;practiceBuffer+=d;renderPracticeBuffer();updatePracticeDisplay();if(practiceBuffer.length===expected.length){if(practiceBuffer===expected){playSound('correct');$('practiceMessage').textContent=`答對了！${practiceBase} 的 ${practiceExponent} 次方是 ${expected}`;practiceExponent++;practiceBuffer='';if(practiceExponent>POWER_RANGES[practiceBase])$('practiceMessage').textContent=`🎉 ${practiceBase} 的常見次方全部完成！`;renderPracticeRows();updatePracticeDisplay()}else{playSound('wrong');$('practiceMessage').textContent='這一題再想一想。';$('practiceDisplay').classList.add('wrong');practiceTimeout=setTimeout(()=>{practiceTimeout=null;$('practiceDisplay').classList.remove('wrong');practiceBuffer='';renderPracticeRows();updatePracticeDisplay()},450)}}}
function practiceClear(){if(practiceExponent>POWER_RANGES[practiceBase])return;practiceBuffer='';renderPracticeRows();updatePracticeDisplay()}

let singleQuestions=[],singleIndex=0,singleScore=0,singleStreak=0,singleBuffer='',singleStartTime=0,singleProcessing=true,singleCurrent=null;
function startSinglePlayer(){initAudio();clearSchedules();showScreen('singleScreen');$('singleEnd').style.display='none';singleQuestions=shuffle(FACTS).slice(0,SP_TOTAL_Q);singleIndex=0;singleScore=0;singleStreak=0;singleBuffer='';singleProcessing=true;$('singleScore').textContent='0.0';$('singleStreak').textContent='';$('singleProgress').textContent=`0 / ${SP_TOTAL_Q}`;$('singleQuestion').textContent='?';$('singleFeedback').textContent='準備開始……';updateSingleDisplay();runCountdown('準備挑戰！',loadSingleQuestion)}
function loadSingleQuestion(){if(singleIndex>=SP_TOTAL_Q)return showSingleEnd();singleProcessing=false;singleCurrent=singleQuestions[singleIndex];singleBuffer='';$('singleQuestion').innerHTML=powerHTML(singleCurrent);$('singleProgress').textContent=`${singleIndex+1} / ${SP_TOTAL_Q}`;$('singleFeedback').textContent='';$('singleTimerBar').style.width='100%';$('singleTimerBar').style.background=varColor('green');updateSingleDisplay();singleStartTime=performance.now();updateSingleTimer()}
function varColor(name){return getComputedStyle(document.documentElement).getPropertyValue(`--${name}`).trim()}
function updateSingleTimer(){if(singleProcessing)return;const dt=performance.now()-singleStartTime,remain=Math.max(0,SP_TIME_LIMIT-dt),pct=remain/SP_TIME_LIMIT*100;$('singleTimerText').textContent=`${(remain/1000).toFixed(1)}s`;$('singleTimerBar').style.width=`${pct}%`;$('singleTimerBar').style.background=pct<25?varColor('red'):pct<50?varColor('orange'):varColor('green');if(dt>=SP_TIME_LIMIT)handleSingleTimeout();else singleTimerFrame=requestAnimationFrame(updateSingleTimer)}
function updateSingleDisplay(){$('singleDisplay').textContent=singleBuffer||'—'}
function singleDigit(d){if(singleProcessing||singleBuffer.length>=5)return;singleBuffer+=d;updateSingleDisplay()}
function singleClear(){if(singleProcessing)return;singleBuffer='';updateSingleDisplay()}
function handleSingleTimeout(){if(singleProcessing)return;singleProcessing=true;singleStreak=0;playSound('wrong');$('singleFeedback').textContent=`⏰ 時間到！答案是 ${singleCurrent.answer}（+0.0）`;$('singleFeedback').style.color=varColor('red');finishSingleQuestion()}
function submitSingle(){if(singleProcessing||!singleBuffer)return;singleProcessing=true;if(singleTimerFrame)cancelAnimationFrame(singleTimerFrame);const dt=performance.now()-singleStartTime;if(Number(singleBuffer)===singleCurrent.answer){let pts=dt<=1500?5:5-((dt-1500)/3500)*4.9;pts=Math.max(.1,Math.round(pts*10)/10);singleScore+=pts;singleStreak++;playSound('correct');$('singleDisplay').classList.add('correct');$('singleFeedback').textContent=singleStreak>=3?`🔥 ${singleStreak} 連對！（+${pts.toFixed(1)}）`:`⭕ 答對了！（+${pts.toFixed(1)}）`;$('singleFeedback').style.color=varColor('green')}else{singleStreak=0;playSound('wrong');$('singleDisplay').classList.add('wrong');$('singleFeedback').textContent=`❌ 答錯了，答案是 ${singleCurrent.answer}（+0.0）`;$('singleFeedback').style.color=varColor('red')}finishSingleQuestion()}
function finishSingleQuestion(){$('singleScore').textContent=singleScore.toFixed(1);$('singleStreak').textContent=singleStreak>=3?`🔥 ${singleStreak} 連對`:'';singleIndex++;singleTimeout=setTimeout(()=>{$('singleDisplay').className='answer-display';loadSingleQuestion()},1200)}
function showSingleEnd(){singleProcessing=true;$('singleFinalScore').textContent=singleScore.toFixed(1);$('singleComment').textContent=singleScore>=95?'神反應！你是真正的次方大師！🏆':singleScore>=75?'非常優秀！速度與準度兼具！😎':singleScore>=50?'及格過關！反應可以再快一點！👍':'再接再厲，把常見次方練熟再挑戰！💪';$('singleEnd').style.display='flex'}

const avatars=['🦊','🐰','🦁','🐯','🐹','🐨','🐼','🐵'];let avatarTop='🦊',avatarBottom='🐰',pkScores={top:0,bottom:0},pkStreaks={top:0,bottom:0},pkBuffers={top:'',bottom:''},pkPool=[],pkCurrent=null,pkProcessing=false,pkState='idle';
function renderAvatars(id,player){const el=$(id);el.innerHTML='';avatars.forEach(emoji=>{const b=document.createElement('button');b.className='avatar'+((player==='top'?avatarTop:avatarBottom)===emoji?' selected':'');b.textContent=emoji;b.onclick=()=>{if(player==='top')avatarTop=emoji;else avatarBottom=emoji;renderAvatars(id,player)};el.appendChild(b)})}
function showPKSetup(){initAudio();clearSchedules();pkState='setup';showScreen('pkSetup');renderAvatars('avatarTop','top');renderAvatars('avatarBottom','bottom')}
function startPKGame(){clearSchedules();showScreen('pkScreen');pkScores={top:0,bottom:0};pkStreaks={top:0,bottom:0};pkBuffers={top:'',bottom:''};pkPool=[];pkProcessing=true;pkState='playing';$('avatarTopDisplay').textContent=avatarTop;$('avatarBottomDisplay').textContent=avatarBottom;$('endTop').style.display='none';$('endBottom').style.display='none';updatePKUI();$('questionTop').textContent=$('questionBottom').textContent='?';$('pkStatus').textContent='準備對決……';runCountdown('準備搶答！',loadPKQuestion)}
function nextPKFact(){if(!pkPool.length)pkPool=shuffle(FACTS);return pkPool.pop()}
function loadPKQuestion(){if(pkState!=='playing')return;pkProcessing=false;pkCurrent=nextPKFact();pkBuffers={top:'',bottom:''};$('questionTop').innerHTML=$('questionBottom').innerHTML=powerHTML(pkCurrent);$('feedbackTop').textContent=$('feedbackBottom').textContent='';$('answerTop').className=$('answerBottom').className='pk-answer';$('pkStatus').textContent='搶答開始！率先 300 分獲勝';updatePKAnswers()}
function updatePKAnswers(){$('answerTop').textContent=pkBuffers.top||'—';$('answerBottom').textContent=pkBuffers.bottom||'—'}
function pkDigit(player,d){if(pkProcessing||pkBuffers[player].length>=5)return;pkBuffers[player]+=d;updatePKAnswers()}
function pkClear(player){if(pkProcessing)return;pkBuffers[player]='';updatePKAnswers()}
function submitPK(player){if(pkProcessing||!pkBuffers[player])return;pkProcessing=true;const opponent=player==='top'?'bottom':'top',correct=Number(pkBuffers[player])===pkCurrent.answer,isCatchingUp=pkScores[opponent]-pkScores[player]>100,display=$(player==='top'?'answerTop':'answerBottom'),feedback=$(player==='top'?'feedbackTop':'feedbackBottom');if(correct){playSound('correct');display.classList.add('correct');let add=10;if(isCatchingUp){add=40;$('pkStatus').textContent='⚡ 逆轉衝刺！+40'}else{pkStreaks[player]++;if(pkStreaks[player]>=3){add=20;$('pkStatus').textContent='🔥 連對加分！'}else $('pkStatus').textContent='⭕ 答對了！'}pkScores[player]+=add;feedback.textContent=`+${add}`}else{playSound('wrong');display.classList.add('wrong');pkStreaks[player]=0;pkScores[player]=Math.max(0,pkScores[player]-10);feedback.textContent=`答案是 ${pkCurrent.answer}`;$('pkStatus').textContent='❌ 答錯了，扣 10 分！'}updatePKUI();if(pkScores[player]>=PK_WIN_SCORE)pkTimeout=setTimeout(()=>showPKEnd(player),900);else pkTimeout=setTimeout(loadPKQuestion,1000)}
function updatePKUI(){$('scoreTop').textContent=pkScores.top;$('scoreBottom').textContent=pkScores.bottom;$('streakTop').textContent=pkStreaks.top>=3?`🔥 ${pkStreaks.top}`:'';$('streakBottom').textContent=pkStreaks.bottom>=3?`🔥 ${pkStreaks.bottom}`:'';$('playerTop').classList.toggle('catchup',pkScores.bottom-pkScores.top>100);$('playerBottom').classList.toggle('catchup',pkScores.top-pkScores.bottom>100)}
function showPKEnd(winner){pkState='ended';const topWin=winner==='top';$('endTop').innerHTML=`<div class="emoji">${topWin?'🏆':'💪'}</div><div class="title">${topWin?'Winner':'Try Again'}</div>`;$('endBottom').innerHTML=`<div class="emoji">${topWin?'💪':'🏆'}</div><div class="title">${topWin?'Try Again':'Winner'}</div>`;$('endTop').style.display=$('endBottom').style.display='flex';$('pkStatus').textContent=`🏆 ${topWin?avatarTop:avatarBottom} 獲勝！返回模式選擇可再開一局`}

Object.entries(POWER_RANGES).forEach(([base,max])=>$('baseGrid').insertAdjacentHTML('beforeend',`<button class="base-card" onclick="startPracticeTable(${base})">${base}<small>0～${max} 次方</small></button>`));
makeNumpad('practiceNumpad',practiceDigit,practiceClear,()=>{},false);
makeNumpad('singleNumpad',singleDigit,singleClear,submitSingle,true);
makeNumpad('numpadTop',d=>pkDigit('top',d),()=>pkClear('top'),()=>submitPK('top'),true);
makeNumpad('numpadBottom',d=>pkDigit('bottom',d),()=>pkClear('bottom'),()=>submitPK('bottom'),true);
showScreen('modeScreen');
</script>
