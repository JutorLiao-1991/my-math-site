<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鳩特數理：全等三角形作圖探究 (完美重構版)</title>
    
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] },
            svg: { fontCache: 'global' },
            startup: { typeset: false }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    
    <style>
        :root {
            --primary-color: #4a90e2; --secondary-color: #f5a623; --bg-color: #f4f7f6;
            --text-color: #333; --panel-bg: #ffffff; --nav-bg: rgba(30, 41, 59, 0.95);
            --accent: #38bdf8; --border-color: #e1e4e8; --highlight: #e74c3c;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 0;
            background-color: var(--bg-color); color: var(--text-color);
            display: flex; flex-direction: column; height: 100vh; overflow: hidden;
        }

        .nav-bar {
            padding: 10px 20px; background: var(--nav-bg); display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid #334155; color: white; flex-shrink: 0; z-index: 100;
        }
        .back-btn {
            text-decoration: none; color: var(--accent); font-weight: bold;
            border: 1px solid var(--accent); padding: 5px 15px; border-radius: 20px;
            font-size: 0.9rem; transition: 0.3s; display: flex; align-items: center; cursor: pointer;
        }
        .back-btn:hover { background: var(--accent); color: #0f172a; }
        .page-title { margin:0; font-size:1.2rem; font-weight: 700; letter-spacing: 1px;}

        .main-wrapper { flex: 1; display: flex; padding: 15px; gap: 15px; overflow: hidden; position: relative; }
        .panel {
            background: var(--panel-bg); border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            display: flex; flex-direction: column; position: relative; overflow: hidden;
        }

        #graph-panel { flex: 2; position: relative; display: flex; justify-content: center; align-items: center; background: #fff;}
        canvas { width: 100%; height: 100%; object-fit: contain; }

        #controls-panel { flex: 1; min-width: 380px; max-width: 450px; border: 1px solid var(--border-color); }
        .controls-content { padding: 20px; overflow-y: auto; flex: 1; display: flex; flex-direction: column;}

        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .menu-btn {
            padding: 12px 8px; background-color: #f1f1f1; border: 1px solid #ddd; border-radius: 6px; cursor: pointer;
            font-weight: bold; color: #666; transition: all 0.2s; font-size: 0.95rem;
        }
        .menu-btn:hover { background-color: #e2e8f0; }
        .menu-btn.active { background-color: var(--primary-color); color: white; border-color: var(--primary-color); }

        .step-container { background: #eef6fc; border-left: 5px solid var(--primary-color); border-radius: 4px; padding: 15px; margin-bottom: 20px; flex: 1; }
        .step-title { font-size: 1.1rem; font-weight: bold; color: var(--primary-color); margin-bottom: 10px; border-bottom: 1px dashed #ccc; padding-bottom: 5px;}
        .step-desc { font-size: 1.05rem; line-height: 1.6; color: #444; min-height: 80px;}
        .critical-text { color: var(--highlight); font-weight: 900; font-size: 1.1em; text-decoration: underline;}

        .action-group { display: flex; gap: 8px; margin-top: auto; flex-wrap: wrap; }
        .action-btn {
            flex: 1 1 30%; padding: 10px; font-size: 0.95rem; font-weight: bold; border-radius: 8px;
            cursor: pointer; transition: 0.2s; border: none; color: white; text-align: center;
        }
        .btn-next { background-color: var(--primary-color); box-shadow: 0 4px 0 #3174c6; }
        .btn-next:active { transform: translateY(4px); box-shadow: none; }
        .btn-next:disabled { background-color: #ccc; box-shadow: 0 4px 0 #aaa; cursor: not-allowed; transform: none;}
        .btn-play { background-color: var(--secondary-color); box-shadow: 0 4px 0 #d68f1c; }
        .btn-play:active { transform: translateY(4px); box-shadow: none; }
        .btn-reset { background-color: #e74c3c; box-shadow: 0 4px 0 #c0392b; flex: 1 1 100%; margin-bottom: 5px;}
        .btn-reset:active { transform: translateY(4px); box-shadow: none; }
        .btn-prev { background-color: #95a5a6; box-shadow: 0 4px 0 #7f8c8d; }
        .btn-prev:active { transform: translateY(4px); box-shadow: none; }
        .btn-prev:disabled { background-color: #ccc; box-shadow: 0 4px 0 #aaa; cursor: not-allowed; transform: none;}
        .btn-replay { background-color: #16a085; box-shadow: 0 4px 0 #12876f; }
        .btn-replay:active { transform: translateY(4px); box-shadow: none; }
        .btn-replay:disabled { background-color: #ccc; box-shadow: 0 4px 0 #aaa; cursor: not-allowed; transform: none;}

        .watermark { position: absolute; bottom: 20px; right: 25px; font-family: serif; font-style: italic; color: rgba(0,0,0,0.1); font-size: 1.5rem; pointer-events: none; user-select: none; z-index: 50; }
        
        @media (max-width: 800px) {
            .main-wrapper { flex-direction: column; overflow-y: auto; }
            #graph-panel { min-height: 400px; flex: none; }
            #controls-panel { border: none; box-shadow: none; background: transparent; max-width: none; }
        }
    </style>
</head>
<body>

    <div class="nav-bar">
        <a href="../../index.html" class="back-btn"><span>⬅</span>&nbsp;回主選單</a>
        <h2 class="page-title">鳩特數理：全等三角形作圖探究</h2>
    </div>

    <div class="main-wrapper">
        <div class="panel" id="graph-panel">
            <canvas id="geometryCanvas"></canvas>
            <div class="watermark">Presented by Jutor</div>
        </div>

        <div class="panel" id="controls-panel">
            <div class="controls-content">
                <div class="menu-grid">
                    <button class="menu-btn active" onclick="selectTopic('SSS')" id="btn-SSS">SSS 全等作圖</button>
                    <button class="menu-btn" onclick="selectTopic('SAS')" id="btn-SAS">SAS 全等作圖</button>
                    <button class="menu-btn" onclick="selectTopic('ASA')" id="btn-ASA">ASA 全等作圖</button>
                    <button class="menu-btn" onclick="selectTopic('AAS')" id="btn-AAS">AAS 全等作圖</button>
                    <button class="menu-btn" style="grid-column: span 2;" onclick="selectTopic('RHS')" id="btn-RHS">RHS 全等作圖</button>
                </div>
                <div class="step-container">
                    <div class="step-title" id="step-title">載入中...</div>
                    <div class="step-desc" id="step-desc">請稍候。</div>
                </div>
                <div class="action-group">
                    <button class="action-btn btn-reset" onclick="resetAnimation()" id="btn-reset">重新作圖</button>
                    <button class="action-btn btn-prev" onclick="prevStep()" id="btn-prev">上一步</button>
                    <button class="action-btn btn-replay" onclick="replayStep()" id="btn-replay">再看一次</button>
                    <button class="action-btn btn-play" onclick="toggleAutoPlay()" id="btn-play">連續播放</button>
                    <button class="action-btn btn-next" onclick="nextStep()" id="btn-next">下一步</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('geometryCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let currentTopic = 'SSS';
        let currentStep = 0; let isAnimating = false; let autoPlay = false; let animProgress = 0; let animationFrameId;

        const geo = {};

        const stepsData = {
            'SSS': [
                { title: "步驟 0：已知條件", desc: "給定三個線段 $a, b, c$。目標：作一 $\\triangle ABC$，使其三邊長等於此三線段。" },
                { title: "步驟 1：複製底邊", desc: "畫一射線，量取已知線段 $c$ 的長度，在射線上畫弧交於點 $B$，得出 $\\overline{AB} = c$。" },
                { title: "步驟 2：畫出 a 邊的軌跡", desc: "量取已知線段 $a$ 的長度，以 $B$ 為圓心畫弧。" },
                { title: "步驟 3：畫出 b 邊的軌跡", desc: "量取已知線段 $b$ 的長度，以 $A$ 為圓心畫弧，確保與前一道弧交於 $C$ 點。" },
                { title: "步驟 4：完成 SSS 作圖", desc: "連接 $\\overline{AC}$ 與 $\\overline{BC}$，$\\triangle ABC$ 即為所求。" }
            ],
            'SAS': [
                { title: "步驟 0：已知條件", desc: "給定線段 $b, c$ 以及它們的夾角 $\\angle A$。" },
                { title: "步驟 1：複製底邊", desc: "畫一射線，量取已知線段 $c$ 的長度，複製得 $\\overline{AB} = c$。" },
                { title: "步驟 2：複製夾角 $\\angle A$", desc: "以 $A$ 為頂點，進行完整的角度複製作圖，畫出包含等角的射線。" },
                { title: "步驟 3：量取另一邊長", desc: "量取已知線段 $b$ 的長度，以 $A$ 為圓心，在剛才的射線上畫弧交於 $C$ 點。" },
                { title: "步驟 4：完成 SAS 作圖", desc: "連接 $\\overline{BC}$，$\\triangle ABC$ 即為所求。" }
            ],
            'ASA': [
                { title: "步驟 0：已知條件", desc: "給定兩個角 $\\angle A, \\angle B$ 以及它們的夾邊 $c$。" },
                { title: "步驟 1：複製夾邊", desc: "畫一射線，量取已知線段 $c$ 的長度，複製得 $\\overline{AB} = c$。" },
                { title: "步驟 2：複製 $\\angle A$", desc: "以 $A$ 為頂點，進行完整尺規作圖複製已知角 $\\angle A$，畫出第一條射線。" },
                { title: "步驟 3：複製 $\\angle B$", desc: "以 $B$ 為頂點，在同側複製已知角 $\\angle B$，畫出第二條射線。" },
                { title: "步驟 4：完成 ASA 作圖", desc: "兩射線自然交於 $C$ 點，$\\triangle ABC$ 即為所求。" }
            ],
            'AAS': [
                { title: "步驟 0：已知條件", desc: "給定兩個角 $\\angle A, \\angle B$ 以及一對應邊 $a$。<br><span class='critical-text'>注意：尺規無法直接平移角度，我們須先求出 $\\angle C$。</span>" },
                { title: "步驟 1：利用平角求 $\\angle C$", desc: "畫一平角表示 $180^\\circ$，依序扣除 $\\angle A$ 與 $\\angle B$，剩餘的扇形即為第三角 $\\angle C$。此時作圖條件已轉化為 ASA。" },
                { title: "步驟 2：複製已知邊", desc: "畫一射線，量取已知線段 $a$ 的長度，複製得 $\\overline{BC} = a$。" },
                { title: "步驟 3：於端點作 $\\angle B$", desc: "以 $B$ 為頂點，複製已知角 $\\angle B$ 畫出射線。" },
                { title: "步驟 4：於端點作 $\\angle C$", desc: "以 $C$ 為頂點，複製剛求得的 $\\angle C$ 畫出交會射線。" },
                { title: "步驟 5：完成 AAS 作圖", desc: "兩射線交會出 $A$ 點，$\\triangle ABC$ 即為所求。" }
            ],
            'RHS': [
                { title: "步驟 0：已知條件", desc: "給定一直角三角形的斜邊 $c$ 與一股 $a$。" },
                { title: "步驟 1：製作直角", desc: "畫一射線並取點 $B$，利用「中垂線作圖」的原理，畫出過 $B$ 點的精準垂線以確保 $\\angle B = 90^\\circ$。" },
                { title: "步驟 2：複製股長", desc: "量取已知線段 $a$ 的長度，以 $B$ 為圓心，在垂線上畫弧交於 $C$ 點。" },
                { title: "步驟 3：利用斜邊交會", desc: "量取已知斜邊 $c$ 的長度，以 $C$ 點為圓心往底邊畫弧，確保弧線與底線形成交叉，交點即為 $A$。" },
                { title: "步驟 4：完成 RHS 作圖", desc: "連接 $\\overline{AC}$，$\\triangle ABC$ 即為所求。" }
            ]
        };

        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            canvas.width = rect.width * dpr; canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr); width = rect.width; height = rect.height;
            setupGeometry();
            if(!isAnimating) drawStaticState(currentStep);
        }
        window.addEventListener('resize', resizeCanvas);

        // --- 核心幾何設定引擎 ---
        function setupGeometry() {
            geo.gBox = { x: 20, y: 20, w: width - 40, h: 120 };
            geo.gCenterY = geo.gBox.y + geo.gBox.h / 2;
            geo.baseY = height * 0.75; geo.baseX = width * 0.25;
            geo.rayLen = width * 0.55;

            if (currentTopic === 'SSS') {
                geo.given = {
                    c: { p1: {x: width*0.1, y: geo.gCenterY}, p2: {x: width*0.35, y: geo.gCenterY}, len: width*0.25 },
                    a: { p1: {x: width*0.45, y: geo.gCenterY}, p2: {x: width*0.65, y: geo.gCenterY}, len: width*0.2 },
                    b: { p1: {x: width*0.75, y: geo.gCenterY}, p2: {x: width*0.9, y: geo.gCenterY}, len: width*0.15 }
                };
                geo.A = { x: geo.baseX, y: geo.baseY }; geo.B = { x: geo.baseX + geo.given.c.len, y: geo.baseY };
                let c = geo.given.c.len, a = geo.given.a.len, b = geo.given.b.len;
                let angleA = Math.acos((b*b + c*c - a*a) / (2*b*c));
                geo.C = { x: geo.A.x + b * Math.cos(-angleA), y: geo.A.y + b * Math.sin(-angleA) };
            } 
            else if (currentTopic === 'SAS') {
                geo.given = {
                    c: { p1: {x: width*0.1, y: geo.gCenterY}, p2: {x: width*0.35, y: geo.gCenterY}, len: width*0.25 },
                    angA: { O: {x: width*0.45, y: geo.gCenterY+20}, a1: 0, a2: -Math.PI/4, r: 40 },
                    b: { p1: {x: width*0.7, y: geo.gCenterY}, p2: {x: width*0.9, y: geo.gCenterY}, len: width*0.2 }
                };
                geo.A = { x: geo.baseX, y: geo.baseY }; geo.B = { x: geo.A.x + geo.given.c.len, y: geo.baseY };
                geo.C = { x: geo.A.x + geo.given.b.len * Math.cos(-Math.PI/4), y: geo.A.y + geo.given.b.len * Math.sin(-Math.PI/4) };
            }
            else if (currentTopic === 'ASA') {
                geo.given = {
                    angA: { O: {x: width*0.15, y: geo.gCenterY+20}, a1: 0, a2: -Math.PI/4, r: 40 },
                    c: { p1: {x: width*0.35, y: geo.gCenterY}, p2: {x: width*0.6, y: geo.gCenterY}, len: width*0.25 },
                    angB: { O: {x: width*0.75, y: geo.gCenterY+20}, a1: Math.PI, a2: Math.PI - Math.PI/3, r: 40 }
                };
                geo.A = { x: geo.baseX, y: geo.baseY }; geo.B = { x: geo.A.x + geo.given.c.len, y: geo.baseY };
                let aA = Math.PI/4, aB = Math.PI/3; let c = geo.given.c.len;
                let b = c * Math.sin(aB) / Math.sin(Math.PI - aA - aB);
                geo.C = { x: geo.A.x + b * Math.cos(-aA), y: geo.A.y + b * Math.sin(-aA) };
            }
            else if (currentTopic === 'AAS') {
                geo.given = {
                    angA: { O: {x: width*0.15, y: geo.gCenterY+20}, a1: 0, a2: -Math.PI/5, r: 40 },
                    angB: { O: {x: width*0.4, y: geo.gCenterY+20}, a1: 0, a2: -Math.PI/3, r: 40 },
                    a: { p1: {x: width*0.65, y: geo.gCenterY}, p2: {x: width*0.9, y: geo.gCenterY}, len: width*0.25 }
                };
                geo.aux = { start: {x: width*0.5, y: height*0.4}, end: {x: width*0.9, y: height*0.4}, O: {x: width*0.7, y: height*0.4} };
                let aA = Math.PI/5, aB = Math.PI/3, aC = Math.PI - aA - aB;
                geo.B = { x: geo.baseX, y: geo.baseY }; geo.C = { x: geo.B.x + geo.given.a.len, y: geo.baseY };
                let c = geo.given.a.len * Math.sin(aC) / Math.sin(aA);
                geo.A = { x: geo.B.x + c * Math.cos(-aB), y: geo.B.y + c * Math.sin(-aB) };
            }
            else if (currentTopic === 'RHS') {
                geo.given = {
                    a: { p1: {x: width*0.2, y: geo.gCenterY}, p2: {x: width*0.4, y: geo.gCenterY}, len: width*0.2 },
                    c: { p1: {x: width*0.6, y: geo.gCenterY}, p2: {x: width*0.9, y: geo.gCenterY}, len: width*0.32 }
                };
                geo.B = { x: geo.baseX, y: geo.baseY }; 
                geo.C = { x: geo.B.x, y: geo.B.y - geo.given.a.len };
                let b = Math.sqrt(Math.pow(geo.given.c.len, 2) - Math.pow(geo.given.a.len, 2));
                geo.A = { x: geo.B.x + b, y: geo.B.y };
            }
        }

        function selectTopic(topic) {
            currentTopic = topic;
            document.querySelectorAll('.menu-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${topic}`).classList.add('active');
            resizeCanvas(); resetAnimation();
            setTimeout(() => { if(window.MathJax && window.MathJax.typesetPromise) window.MathJax.typesetPromise([document.getElementById('step-desc')]).catch(()=>{}); }, 150);
        }

        // --- 繪圖底層工具 ---
        function drawPoint(x, y, label, color = '#333', offsetX = -5, offsetY = -10) {
            ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI * 2); ctx.fillStyle = color; ctx.fill();
            if(label) { ctx.font = "italic bold 18px 'Times New Roman', serif"; ctx.fillStyle = color; ctx.fillText(label, x + offsetX, y + offsetY); }
        }
        function drawLine(p1, p2, color = '#333', lw = 2, dash=[]) {
            ctx.beginPath(); ctx.setLineDash(dash); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y);
            ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.stroke(); ctx.setLineDash([]);
        }
        function drawArc(center, radius, sAng, eAng, color = '#aaa', lw = 2, ccw = false) {
            ctx.beginPath(); ctx.arc(center.x, center.y, radius, sAng, eAng, ccw);
            ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.stroke();
        }
        function drawGivenBox() {
            ctx.fillStyle = '#f8fafc'; ctx.fillRect(geo.gBox.x, geo.gBox.y, geo.gBox.w, geo.gBox.h);
            ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 2; ctx.setLineDash([5, 5]);
            ctx.strokeRect(geo.gBox.x, geo.gBox.y, geo.gBox.w, geo.gBox.h); ctx.setLineDash([]);
            ctx.font = "bold 14px sans-serif"; ctx.fillStyle = '#64748b'; ctx.fillText("已知條件區", geo.gBox.x + 10, geo.gBox.y + 20);
        }
        function drawCompass(needleX, needleY, radius, pencilAngle, alpha = 1) {
            ctx.save(); ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
            let legLen = Math.max(radius * 0.85, 150); let halfR = radius / 2; let h = Math.sqrt(legLen * legLen - halfR * halfR);
            let pX = needleX + radius * Math.cos(pencilAngle); let pY = needleY + radius * Math.sin(pencilAngle);
            let midX = (needleX + pX) / 2; let midY = (needleY + pY) / 2;
            let dx = pX - needleX; let dy = pY - needleY; let len = Math.sqrt(dx*dx + dy*dy);
            let nx = -dy / len; let ny = dx / len; if (ny > 0) { nx = -nx; ny = -ny; } 
            let hX = midX + h * nx; let hY = midY + h * ny;

            ctx.beginPath(); ctx.moveTo(needleX, needleY); ctx.lineTo(hX, hY); ctx.lineWidth=4; ctx.strokeStyle='#555'; ctx.stroke(); 
            ctx.beginPath(); ctx.moveTo(pX, pY); ctx.lineTo(hX, hY); ctx.lineWidth=4; ctx.strokeStyle='#888'; ctx.stroke(); 
            ctx.beginPath(); ctx.arc(hX, hY, 6, 0, Math.PI*2); ctx.fillStyle='#f39c12'; ctx.fill(); ctx.stroke(); 
            ctx.beginPath(); ctx.arc(needleX, needleY, 2, 0, Math.PI*2); ctx.fillStyle='#333'; ctx.fill();
            ctx.restore();
        }
        function drawGivenSegment(segData, label) { drawLine(segData.p1, segData.p2, '#333', 3); ctx.font = "italic 16px 'Times New Roman', serif"; ctx.fillStyle = '#333'; ctx.fillText(label, (segData.p1.x+segData.p2.x)/2, segData.p1.y - 10); }
        function drawGivenAngle(angData, label) {
            let p1 = {x: angData.O.x + 40*Math.cos(angData.a1), y: angData.O.y + 40*Math.sin(angData.a1)};
            let p2 = {x: angData.O.x + 40*Math.cos(angData.a2), y: angData.O.y + 40*Math.sin(angData.a2)};
            drawLine(angData.O, p1, '#333', 3); drawLine(angData.O, p2, '#333', 3);
            drawArc(angData.O, 20, Math.min(angData.a1, angData.a2), Math.max(angData.a1, angData.a2), '#333', 2);
            ctx.font = "italic 16px 'Times New Roman', serif"; ctx.fillStyle = '#333';
            ctx.fillText(label, angData.O.x + 25*Math.cos((angData.a1+angData.a2)/2) - 5, angData.O.y + 25*Math.sin((angData.a1+angData.a2)/2) - 5);
        }

        // --- 分鏡序列引擎 ---
        function execPhase(phases, progress) {
            let totalWeights = phases.reduce((a,b)=>a+b, 0); let curr = progress * totalWeights; let accum = 0;
            for(let i=0; i<phases.length; i++) { if(curr <= accum + phases[i]) return { idx: i, p: (curr - accum) / phases[i] }; accum += phases[i]; }
            return { idx: phases.length - 1, p: 1 };
        }

        // --- 共用動畫模組 ---
        function playSegmentCopy(gP1, gP2, tP1, tAng, radius, label, isFirstStep, progress) {
            let p = progress; let subP = p;
            if (isFirstStep) {
                if (p < 0.2) { drawLine(tP1, {x: tP1.x + geo.rayLen * (p/0.2), y: tP1.y}, '#888', 2); drawPoint(tP1.x, tP1.y, label); return; }
                else { drawLine(tP1, {x: tP1.x + geo.rayLen, y: tP1.y}, '#888', 2); drawPoint(tP1.x, tP1.y, label); subP = (p - 0.2) / 0.8; }
            }
            let phases = [1, 2, 2, 2]; let s = execPhase(phases, subP); let idx = s.idx, sub = s.p;
            if (idx >= 1) drawArc(gP1, radius, -0.3, 0.3, '#e74c3c', 2);
            if (idx >= 3) drawArc(tP1, radius, tAng-0.3, tAng+0.3, '#3498db', 2);

            let cX, cY, cAng, alpha = 1;
            if (idx === 0) { cX = tP1.x + (gP1.x - tP1.x)*sub; cY = tP1.y + (gP1.y - tP1.y)*sub; cAng = 0; alpha = sub; }
            else if (idx === 1) { cX = gP1.x; cY = gP1.y; cAng = -0.3 + 0.6*sub; drawArc(gP1, radius, -0.3, cAng, '#e74c3c', 2); }
            else if (idx === 2) { cX = gP1.x + (tP1.x - gP1.x)*sub; cY = gP1.y + (tP1.y - gP1.y)*sub; cAng = tAng * sub; }
            else if (idx === 3) { cX = tP1.x; cY = tP1.y; cAng = tAng - 0.3 + 0.6*sub; drawArc(tP1, radius, tAng-0.3, cAng, '#3498db', 2); }
            if (alpha > 0) drawCompass(cX, cY, radius, cAng, alpha);
        }

        function playAngleCopy(gO, gA1, gA2, tO, tBaseA, tEndA, r1, p) {
            let r2 = Math.hypot(r1*Math.cos(gA2)-r1*Math.cos(gA1), r1*Math.sin(gA2)-r1*Math.sin(gA1));
            let phases = [1, 2, 2, 2, 2, 2, 2, 2, 2]; let s = execPhase(phases, p); let idx = s.idx, sub = s.p;

            let gP1 = {x: gO.x + r1*Math.cos(gA1), y: gO.y + r1*Math.sin(gA1)}; let gP2 = {x: gO.x + r1*Math.cos(gA2), y: gO.y + r1*Math.sin(gA2)};
            let tP1 = {x: tO.x + r1*Math.cos(tBaseA), y: tO.y + r1*Math.sin(tBaseA)}; let finalP = {x: tO.x + r1*Math.cos(tEndA), y: tO.y + r1*Math.sin(tEndA)};
            let chAngG = Math.atan2(gP2.y-gP1.y, gP2.x-gP1.x); let chAngT = Math.atan2(finalP.y-tP1.y, finalP.x-tP1.x);

            if (idx >= 2) drawArc(gO, r1, Math.min(gA1, gA2)-0.2, Math.max(gA1, gA2)+0.2, '#3498db', 2);
            if (idx >= 4) drawArc(tO, r1, Math.min(tBaseA, tEndA)-0.2, Math.max(tBaseA, tEndA)+0.2, '#e67e22', 2);
            if (idx >= 6) drawArc(gP1, r2, chAngG-0.3, chAngG+0.3, '#e74c3c', 2);
            if (idx >= 8) drawArc(tP1, r2, chAngT-0.3, chAngT+0.3, '#2ecc71', 2);
            if (idx === 8 && sub > 0) drawLine(tO, {x: tO.x + (geo.rayLen)*Math.cos(tEndA)*sub, y: tO.y + (geo.rayLen)*Math.sin(tEndA)*sub}, '#888', 2);

            let cX, cY, cAng, cR = r1, alpha = 1;
            if (idx === 0) { cX = geo.baseX + (gO.x - geo.baseX)*sub; cY = geo.baseY + (gO.y - geo.baseY)*sub; cAng = gA1; alpha = sub; }
            else if (idx === 1) { cX = gO.x; cY = gO.y; cAng = gA1 + (gA2 - gA1) * sub; drawArc(gO, r1, gA1, cAng, '#3498db', 2, (gA2 < gA1)); }
            else if (idx === 2) { cX = gO.x + (tO.x - gO.x)*sub; cY = gO.y + (tO.y - gO.y)*sub; cAng = tBaseA; }
            else if (idx === 3) { cX = tO.x; cY = tO.y; let ext = tBaseA + (tEndA - tBaseA)*1.2; cAng = tBaseA + (ext - tBaseA) * sub; drawArc(tO, r1, tBaseA, cAng, '#e67e22', 2, (ext < tBaseA)); }
            else if (idx === 4) { cX = tO.x + (gP1.x - tO.x)*sub; cY = tO.y + (gP1.y - tO.y)*sub; cR = r1 + (r2 - r1)*sub; cAng = chAngG; }
            else if (idx === 5) { cX = gP1.x; cY = gP1.y; cR = r2; cAng = (chAngG - 0.3) + 0.6 * sub; drawArc(gP1, r2, chAngG-0.3, cAng, '#e74c3c', 2); }
            else if (idx === 6) { cX = gP1.x + (tP1.x - gP1.x)*sub; cY = gP1.y + (tP1.y - gP1.y)*sub; cR = r2; cAng = chAngT; }
            else if (idx === 7) { cX = tP1.x; cY = tP1.y; cR = r2; cAng = (chAngT - 0.3) + 0.6 * sub; drawArc(tP1, r2, chAngT-0.3, cAng, '#2ecc71', 2); }
            else if (idx === 8) { alpha = 1 - sub; cX = tP1.x; cY = tP1.y; cR = r2; cAng = chAngT + 0.3; }

            if (alpha > 0) drawCompass(cX, cY, cR, cAng, alpha);
        }

        // --- UI 控制 ---
        function updateUI() {
            let data = stepsData[currentTopic][currentStep];
            document.getElementById('step-title').innerHTML = data.title; document.getElementById('step-desc').innerHTML = data.desc;
            if(window.MathJax && window.MathJax.typesetPromise) window.MathJax.typesetPromise([document.getElementById('step-desc')]).catch(()=>{});
            document.getElementById('btn-next').disabled = (currentStep >= stepsData[currentTopic].length - 1);
            document.getElementById('btn-prev').disabled = (currentStep === 0);
            document.getElementById('btn-replay').disabled = (currentStep === 0);
        }
        function resetAnimation() { cancelAnimationFrame(animationFrameId); isAnimating = false; autoPlay = false; currentStep = 0; animProgress = 0; document.getElementById('btn-play').innerText = "連續播放"; updateUI(); drawStaticState(0); }
        function toggleAutoPlay() { autoPlay = !autoPlay; document.getElementById('btn-play').innerText = autoPlay ? "暫停" : "連續播放"; if (autoPlay && !isAnimating) { if(currentStep >= stepsData[currentTopic].length - 1) resetAnimation(); nextStep(); } }
        function nextStep() { if (isAnimating || currentStep >= stepsData[currentTopic].length - 1) return; currentStep++; animProgress = 0; isAnimating = true; updateUI(); animate(); }
        function prevStep() { if (isAnimating) cancelAnimationFrame(animationFrameId); isAnimating = false; if (autoPlay) toggleAutoPlay(); if (currentStep > 0) currentStep--; animProgress = 0; updateUI(); drawStaticState(currentStep); }
        function replayStep() { if (isAnimating) cancelAnimationFrame(animationFrameId); if (autoPlay) toggleAutoPlay(); if (currentStep === 0) return; animProgress = 0; isAnimating = true; updateUI(); animate(); }

        // --- 靜態圖層 ---
        function drawStaticState(step) {
            ctx.clearRect(0, 0, width, height); drawGivenBox();

            if (currentTopic === 'SSS') {
                drawGivenSegment(geo.given.c, 'c'); drawGivenSegment(geo.given.a, 'a'); drawGivenSegment(geo.given.b, 'b');
                if (step >= 1) { drawLine(geo.A, {x: geo.A.x + geo.rayLen, y: geo.baseY}, '#888', 2); drawPoint(geo.A.x, geo.A.y, 'A'); drawArc(geo.A, geo.given.c.len, -0.3, 0.3, '#3498db', 2); drawPoint(geo.B.x, geo.B.y, 'B'); }
                if (step >= 2) { let aB = Math.atan2(geo.C.y-geo.B.y, geo.C.x-geo.B.x); drawArc(geo.B, geo.given.a.len, aB-0.3, aB+0.3, '#e67e22', 2); }
                if (step >= 3) { let aA = Math.atan2(geo.C.y-geo.A.y, geo.C.x-geo.A.x); drawArc(geo.A, geo.given.b.len, aA-0.3, aA+0.3, '#2ecc71', 2); drawPoint(geo.C.x, geo.C.y, 'C', '#8e44ad', -5, -15); }
                if (step >= 4) { drawLine(geo.A, geo.C, '#c0392b', 3); drawLine(geo.B, geo.C, '#c0392b', 3); drawLine(geo.A, geo.B, '#c0392b', 3); }
            }
            else if (currentTopic === 'SAS') {
                drawGivenSegment(geo.given.c, 'c'); drawGivenAngle(geo.given.angA, 'A'); drawGivenSegment(geo.given.b, 'b');
                if (step >= 1) { drawLine(geo.A, {x: geo.A.x + geo.rayLen, y: geo.baseY}, '#888', 2); drawPoint(geo.A.x, geo.A.y, 'A'); drawArc(geo.A, geo.given.c.len, -0.3, 0.3, '#3498db', 2); drawPoint(geo.B.x, geo.B.y, 'B'); }
                if (step >= 2) { drawArc(geo.A, geo.given.angA.r, -Math.PI/4 - 0.2, 0.2, '#e67e22', 2); drawLine(geo.A, {x: geo.A.x + geo.rayLen*Math.cos(-Math.PI/4), y: geo.A.y + geo.rayLen*Math.sin(-Math.PI/4)}, '#888', 2); }
                if (step >= 3) { drawArc(geo.A, geo.given.b.len, -Math.PI/4 - 0.3, -Math.PI/4 + 0.3, '#2ecc71', 2); drawPoint(geo.C.x, geo.C.y, 'C', '#8e44ad', -5, -15); }
                if (step >= 4) { drawLine(geo.A, geo.C, '#c0392b', 3); drawLine(geo.B, geo.C, '#c0392b', 3); drawLine(geo.A, geo.B, '#c0392b', 3); }
            }
            else if (currentTopic === 'ASA') {
                drawGivenAngle(geo.given.angA, 'A'); drawGivenSegment(geo.given.c, 'c'); drawGivenAngle(geo.given.angB, 'B');
                if (step >= 1) { drawLine(geo.A, {x: geo.A.x + geo.rayLen, y: geo.baseY}, '#888', 2); drawPoint(geo.A.x, geo.A.y, 'A'); drawArc(geo.A, geo.given.c.len, -0.3, 0.3, '#3498db', 2); drawPoint(geo.B.x, geo.B.y, 'B'); }
                if (step >= 2) { drawArc(geo.A, geo.given.angA.r, -Math.PI/4 - 0.2, 0.2, '#e67e22', 2); drawLine(geo.A, {x: geo.A.x + geo.rayLen*Math.cos(-Math.PI/4), y: geo.A.y + geo.rayLen*Math.sin(-Math.PI/4)}, '#888', 2); }
                if (step >= 3) { let tEnd = Math.PI - Math.PI/3; drawArc(geo.B, geo.given.angB.r, Math.PI, tEnd, '#e67e22', 2, true); drawLine(geo.B, {x: geo.B.x + geo.rayLen*Math.cos(tEnd), y: geo.B.y + geo.rayLen*Math.sin(tEnd)}, '#888', 2); }
                if (step >= 4) { drawPoint(geo.C.x, geo.C.y, 'C', '#8e44ad', -5, -15); drawLine(geo.A, geo.C, '#c0392b', 3); drawLine(geo.B, geo.C, '#c0392b', 3); drawLine(geo.A, geo.B, '#c0392b', 3); }
            }
            else if (currentTopic === 'AAS') {
                drawGivenAngle(geo.given.angA, 'A'); drawGivenAngle(geo.given.angB, 'B'); drawGivenSegment(geo.given.a, 'a');
                if (step >= 1) {
                    let O = geo.aux.O; drawLine(geo.aux.start, geo.aux.end, '#888', 2); drawPoint(O.x, O.y, '');
                    drawArc(O, 40, -Math.PI, 0, '#ccc', 2); // 上半平角
                    let aA = Math.PI/5, aB = Math.PI/3; let eA = -Math.PI + aA; let eB = eA + aB;
                    drawLine(O, {x: O.x + 50*Math.cos(eA), y: O.y + 50*Math.sin(eA)}, '#3498db', 2);
                    drawLine(O, {x: O.x + 50*Math.cos(eB), y: O.y + 50*Math.sin(eB)}, '#2ecc71', 2);
                    ctx.fillStyle='#3498db'; ctx.fillText('A', O.x + 50*Math.cos(-Math.PI + aA/2), O.y + 50*Math.sin(-Math.PI + aA/2));
                    ctx.fillStyle='#2ecc71'; ctx.fillText('B', O.x + 50*Math.cos(eA + aB/2), O.y + 50*Math.sin(eA + aB/2));
                    ctx.fillStyle='#e74c3c'; ctx.fillText('C', O.x + 50*Math.cos(eB + (Math.PI-aA-aB)/2), O.y + 50*Math.sin(eB + (Math.PI-aA-aB)/2));
                }
                if (step >= 2) { drawLine(geo.B, {x: geo.B.x + geo.rayLen, y: geo.baseY}, '#888', 2); drawPoint(geo.B.x, geo.B.y, 'B'); drawArc(geo.B, geo.given.a.len, -0.3, 0.3, '#3498db', 2); drawPoint(geo.C.x, geo.C.y, 'C'); }
                if (step >= 3) { let tEnd = -Math.PI/3; drawArc(geo.B, geo.given.angB.r, 0, tEnd, '#e67e22', 2, true); drawLine(geo.B, {x: geo.B.x + geo.rayLen*Math.cos(tEnd), y: geo.B.y + geo.rayLen*Math.sin(tEnd)}, '#888', 2); }
                if (step >= 4) { let tEnd = Math.PI + Math.PI - Math.PI/5 - Math.PI/3; drawArc(geo.C, geo.given.angA.r, Math.PI, tEnd, '#e67e22', 2); drawLine(geo.C, {x: geo.C.x + geo.rayLen*Math.cos(tEnd), y: geo.C.y + geo.rayLen*Math.sin(tEnd)}, '#888', 2); }
                if (step >= 5) { drawPoint(geo.A.x, geo.A.y, 'A', '#8e44ad', -5, -15); drawLine(geo.A, geo.C, '#c0392b', 3); drawLine(geo.B, geo.C, '#c0392b', 3); drawLine(geo.A, geo.B, '#c0392b', 3); }
            }
            else if (currentTopic === 'RHS') {
                drawGivenSegment(geo.given.a, 'a (股)'); drawGivenSegment(geo.given.c, 'c (斜邊)');
                if (step >= 1) { 
                    drawLine({x: geo.B.x-40, y: geo.B.y}, {x: geo.B.x + geo.rayLen, y: geo.B.y}, '#888', 2); drawPoint(geo.B.x, geo.B.y, 'B'); 
                    drawArc(geo.B, 50, Math.PI-0.3, Math.PI+0.3, '#3498db', 1); drawArc(geo.B, 50, -0.3, 0.3, '#3498db', 1); // 左右弧
                    drawArc({x:geo.B.x-50, y:geo.B.y}, 70, -Math.PI/2-0.4, -Math.PI/2+0.4, '#e67e22', 1); drawArc({x:geo.B.x+50, y:geo.B.y}, 70, -Math.PI/2-0.4, -Math.PI/2+0.4, '#e67e22', 1); // 上方交會
                    drawLine(geo.B, {x: geo.B.x, y: geo.B.y - width*0.3}, '#888', 2); ctx.strokeRect(geo.B.x, geo.B.y-15, 15, 15);
                }
                if (step >= 2) { drawArc(geo.B, geo.given.a.len, -Math.PI/2 - 0.3, -Math.PI/2 + 0.3, '#2ecc71', 2); drawPoint(geo.C.x, geo.C.y, 'C', '#8e44ad', 10, -5); }
                if (step >= 3) { let tAng = Math.atan2(geo.A.y-geo.C.y, geo.A.x-geo.C.x); drawArc(geo.C, geo.given.c.len, tAng-0.3, tAng+0.3, '#e74c3c', 2); drawPoint(geo.A.x, geo.A.y, 'A'); }
                if (step >= 4) { drawLine(geo.A, geo.C, '#c0392b', 3); drawLine(geo.B, geo.C, '#c0392b', 3); drawLine(geo.A, geo.B, '#c0392b', 3); }
            }
        }

        // --- 動畫圖層 ---
        function animate() {
            animProgress += 0.005; if (animProgress > 1) animProgress = 1; 
            ctx.clearRect(0, 0, width, height); drawStaticState(currentStep - 1);

            if (currentTopic === 'SSS') {
                if (currentStep === 1) playSegmentCopy(geo.given.c.p1, geo.given.c.p2, geo.A, 0, geo.given.c.len, 'A', true, animProgress);
                else if (currentStep === 2) { let aB = Math.atan2(geo.C.y-geo.B.y, geo.C.x-geo.B.x); playSegmentCopy(geo.given.a.p1, geo.given.a.p2, geo.B, aB, geo.given.a.len, null, false, animProgress); }
                else if (currentStep === 3) { let aA = Math.atan2(geo.C.y-geo.A.y, geo.C.x-geo.A.x); playSegmentCopy(geo.given.b.p1, geo.given.b.p2, geo.A, aA, geo.given.b.len, null, false, animProgress); }
            }
            else if (currentTopic === 'SAS') {
                if (currentStep === 1) playSegmentCopy(geo.given.c.p1, geo.given.c.p2, geo.A, 0, geo.given.c.len, 'A', true, animProgress);
                else if (currentStep === 2) playAngleCopy(geo.given.angA.O, geo.given.angA.a1, geo.given.angA.a2, geo.A, 0, -Math.PI/4, geo.given.angA.r, animProgress);
                else if (currentStep === 3) playSegmentCopy(geo.given.b.p1, geo.given.b.p2, geo.A, -Math.PI/4, geo.given.b.len, null, false, animProgress);
            }
            else if (currentTopic === 'ASA') {
                if (currentStep === 1) playSegmentCopy(geo.given.c.p1, geo.given.c.p2, geo.A, 0, geo.given.c.len, 'A', true, animProgress);
                else if (currentStep === 2) playAngleCopy(geo.given.angA.O, geo.given.angA.a1, geo.given.angA.a2, geo.A, 0, -Math.PI/4, geo.given.angA.r, animProgress);
                else if (currentStep === 3) playAngleCopy(geo.given.angB.O, geo.given.angB.a1, geo.given.angB.a2, geo.B, Math.PI, Math.PI - Math.PI/3, geo.given.angB.r, animProgress);
            }
            else if (currentTopic === 'AAS') {
                if (currentStep === 1) {
                    let s = execPhase([1, 2, 2, 2], animProgress); let idx = s.idx, sub = s.p;
                    let O = geo.aux.O; drawLine(geo.aux.start, geo.aux.end, '#888', 2); drawPoint(O.x, O.y, '');
                    if(idx >= 0) drawArc(O, 40, -Math.PI, -Math.PI + Math.PI*sub, '#ccc', 2);
                    let aA = Math.PI/5, aB = Math.PI/3; let eA = -Math.PI + aA; let eB = eA + aB;
                    if(idx >= 1) { drawLine(O, {x: O.x + 50*Math.cos(eA)*sub, y: O.y + 50*Math.sin(eA)*sub}, '#3498db', 2); }
                    if(idx >= 2) { drawLine(O, {x: O.x + 50*Math.cos(eA), y: O.y + 50*Math.sin(eA)}, '#3498db', 2); drawLine(O, {x: O.x + 50*Math.cos(eB)*sub, y: O.y + 50*Math.sin(eB)*sub}, '#2ecc71', 2); ctx.fillStyle='#3498db'; ctx.fillText('A', O.x + 50*Math.cos(-Math.PI + aA/2), O.y + 50*Math.sin(-Math.PI + aA/2)); }
                    if(idx >= 3) { drawLine(O, {x: O.x + 50*Math.cos(eB), y: O.y + 50*Math.sin(eB)}, '#2ecc71', 2); ctx.fillStyle='#2ecc71'; ctx.fillText('B', O.x + 50*Math.cos(eA + aB/2), O.y + 50*Math.sin(eA + aB/2)); ctx.fillStyle='#e74c3c'; ctx.fillText('C', O.x + 50*Math.cos(eB + (Math.PI-aA-aB)/2)*sub, O.y + 50*Math.sin(eB + (Math.PI-aA-aB)/2)*sub); }
                }
                else if (currentStep === 2) playSegmentCopy(geo.given.a.p1, geo.given.a.p2, geo.B, 0, geo.given.a.len, 'B', true, animProgress);
                else if (currentStep === 3) playAngleCopy(geo.given.angB.O, geo.given.angB.a1, geo.given.angB.a2, geo.B, 0, -Math.PI/3, geo.given.angB.r, animProgress);
                else if (currentStep === 4) { let tEnd = Math.PI + Math.PI - Math.PI/5 - Math.PI/3; playAngleCopy(geo.aux.O, Math.PI, tEnd, geo.C, Math.PI, tEnd, 40, animProgress); }
            }
            else if (currentTopic === 'RHS') {
                if (currentStep === 1) {
                    let s = execPhase([1, 2, 2, 2, 2], animProgress); let idx = s.idx, sub = s.p;
                    if(idx === 0) { drawLine({x: geo.B.x-40, y: geo.B.y}, {x: geo.B.x + geo.rayLen*sub, y: geo.B.y}, '#888', 2); drawPoint(geo.B.x, geo.B.y, 'B'); }
                    else { drawLine({x: geo.B.x-40, y: geo.B.y}, {x: geo.B.x + geo.rayLen, y: geo.B.y}, '#888', 2); drawPoint(geo.B.x, geo.B.y, 'B'); }
                    if(idx >= 1) { drawArc(geo.B, 50, Math.PI-0.3*sub, Math.PI+0.3*sub, '#3498db', 1); drawArc(geo.B, 50, -0.3*sub, 0.3*sub, '#3498db', 1); drawCompass(geo.B.x, geo.B.y, 50, Math.PI, idx===1?1:0); }
                    if(idx >= 2) { drawArc(geo.B, 50, Math.PI-0.3, Math.PI+0.3, '#3498db', 1); drawArc(geo.B, 50, -0.3, 0.3, '#3498db', 1); drawArc({x:geo.B.x-50, y:geo.B.y}, 70, -Math.PI/2-0.4*sub, -Math.PI/2+0.4*sub, '#e67e22', 1); drawCompass(geo.B.x-50, geo.B.y, 70, -Math.PI/2, idx===2?1:0); }
                    if(idx >= 3) { drawArc({x:geo.B.x-50, y:geo.B.y}, 70, -Math.PI/2-0.4, -Math.PI/2+0.4, '#e67e22', 1); drawArc({x:geo.B.x+50, y:geo.B.y}, 70, -Math.PI/2-0.4*sub, -Math.PI/2+0.4*sub, '#e67e22', 1); drawCompass(geo.B.x+50, geo.B.y, 70, -Math.PI/2, idx===3?1:0); }
                    if(idx === 4) { drawArc({x:geo.B.x+50, y:geo.B.y}, 70, -Math.PI/2-0.4, -Math.PI/2+0.4, '#e67e22', 1); drawLine(geo.B, {x: geo.B.x, y: geo.B.y - width*0.3*sub}, '#888', 2); }
                }
                else if (currentStep === 2) playSegmentCopy(geo.given.a.p1, geo.given.a.p2, geo.B, -Math.PI/2, geo.given.a.len, null, false, animProgress);
                else if (currentStep === 3) { let tAng = Math.atan2(geo.A.y-geo.C.y, geo.A.x-geo.C.x); playSegmentCopy(geo.given.c.p1, geo.given.c.p2, geo.C, tAng, geo.given.c.len, null, false, animProgress); }
            }

            if (animProgress < 1) animationFrameId = requestAnimationFrame(animate);
            else { isAnimating = false; drawStaticState(currentStep); updateUI(); if (autoPlay && currentStep < stepsData[currentTopic].length - 1) setTimeout(() => nextStep(), 800); else if (autoPlay) toggleAutoPlay(); }
        }
        
        setTimeout(() => { selectTopic('SSS'); }, 100);
    </script>
</body>
