<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>英語單字與句型測驗 - 鳩特數理</title>
    <script src="database.js"></script> 
    <style>
        :root { --primary: #2c3e50; --accent: #3498db; --success: #27ae60; --error: #e74c3c; --exam: #e67e22; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #f4f6f9; display: flex; justify-content: center; min-height: 100vh; margin: 0; padding-top: 20px; -webkit-tap-highlight-color: transparent; }
        .container { background: white; padding: 1.5rem; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); width: 95%; max-width: 600px; text-align: center; box-sizing: border-box; }
        
        select, input, button { font-size: 1.1rem; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #ddd; width: 100%; box-sizing: border-box; -webkit-appearance: none; }
        
        /* 品牌 Logo 樣式 */
        .brand-logo {
            display: inline-block;
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--primary);
            border: 2px solid var(--primary);
            padding: 5px 15px;
            border-radius: 50px;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .btn-primary { background: var(--accent); color: white; border: none; font-weight: bold; cursor: pointer; }
        .btn-exam { background: var(--exam); color: white; border: none; font-weight: bold; cursor: pointer; }
        .btn-giveup { background: #95a5a6; color: white; border: none; font-size: 0.9rem; margin-top: 10px; display: none; }
        .btn-retry { background: #16a085; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; }
        
        button:active { transform: scale(0.98); }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .hidden { display: none; }
        
        .listening-icon { font-size: 3.5rem; cursor: pointer; color: var(--accent); margin: 15px 0; transition: transform 0.2s; }
        .listening-icon:active { transform: scale(0.9); }
        
        .cloze-sentence { font-size: 1.3rem; color: #2c3e50; font-weight: bold; margin: 15px 0; line-height: 1.6; min-height: 3rem; word-break: break-word;}
        .blank-space { color: var(--accent); border-bottom: 3px solid var(--accent); padding: 0 5px; display: inline-block; min-width: 50px; text-align: center;}

        .feedback { margin-top: 15px; font-weight: bold; min-height: 1.5em; font-size: 1.2rem; white-space: pre-wrap; }
        .text-correct { color: var(--success); } .text-wrong { color: var(--error); }
        .text-partial { color: #f39c12; }
        
        .option-btn { background: #ecf0f1; color: #333; margin-top: 10px; text-align: left; transition: 0.2s; border: 2px solid transparent;}
        .correct-ans { background: #d5f5e3 !important; border-color: var(--success); }
        .wrong-ans { background: #fadbd8 !important; border-color: var(--error); opacity: 0.7; }
        
        .score-board { display: flex; justify-content: space-around; background: #eee; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 0.9rem; font-weight: bold; color: #555; }
        .sentence-mode .cloze-sentence { color: #e67e22; }
        
        .practice-settings { display: flex; align-items: center; gap: 5px; margin-top: 10px; background: #f0f3f5; padding: 10px; border-radius: 8px; flex-wrap: wrap;}
        .practice-settings label { font-size: 0.9rem; color: #555; font-weight: bold; margin-right: 5px;}
        .practice-settings select { margin: 0; padding: 8px; font-size: 1rem; flex: 1; min-width: 120px; }
    </style>
</head>
<body>

<div class="container">
    <div id="setup-screen">
        <div class="brand-logo">鳩特數理</div>
        <h1 style="color: var(--primary); margin-top: 5px;">英語單字與句型測驗</h1>
        
        <select id="gradeSelect" onchange="updateVersions()"><option value="">-- 1. 選擇年級 --</option></select>
        <select id="versionSelect" onchange="updateRanges()"><option value="">-- 2. 選擇版本 --</option></select>
        <select id="rangeSelect"><option value="">-- 3. 選擇範圍 --</option></select>
        
        <div class="practice-settings">
            <div style="flex: 100%; display: flex; align-items: center; margin-bottom: 5px;">
                <label>練習內容:</label>
                <select id="practiceType">
                    <option value="mixed">混合 (單字+句型)</option>
                    <option value="word">只練單字</option>
                    <option value="sentence">只練句型</option>
                </select>
            </div>
            <div style="flex: 100%; display: flex; align-items: center;">
                <label>練習題數:</label>
                <select id="practiceCount">
                    <option value="5">5 題 (快速)</option>
                    <option value="10">10 題</option>
                    <option value="15">15 題</option>
                    <option value="20">20 題</option>
                    <option value="25">25 題</option>
                    <option value="all">全部題目</option>
                </select>
            </div>
        </div>

        <div style="margin-top: 10px; display: flex; gap: 10px; flex-direction: column;">
            <button class="btn-primary" onclick="startQuiz('practice')">💪 開始練習</button>
            <button class="btn-exam" onclick="startQuiz('exam')">📝 考試模式 (混和20題)</button>
        </div>
        
        <div style="margin-top: 20px;">
            <button onclick="playSound('correct')" style="background:none; border:1px dashed #ccc; color:#888; font-size:0.8rem; width:auto; padding:5px 15px;">🔊 按此測試音效</button>
        </div>

        <p style="font-size: 0.8rem; color: #999; margin-top: 10px;">System: <span id="dataVer">Checking...</span></p>
    </div>

    <div id="quiz-screen" class="hidden">
        <div style="background:#eee; height:8px; border-radius:4px; margin-bottom:10px;"><div id="progressBar" style="width:0%; height:100%; background:var(--success); border-radius:4px; transition:0.3s;"></div></div>
        
        <div class="score-board">
            <span>題數: <span id="progressText"></span></span>
            <span id="scoreDisplay" class="hidden">得分: <span id="currentScore">0</span></span>
        </div>
        
        <div id="step-spelling">
            <div class="listening-icon" onclick="playCurrentWord()" title="點擊重聽">🔊</div>
            <div id="questionDisplay" class="cloze-sentence"></div>
            
            <input type="text" id="spellingInput" placeholder="輸入答案" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" style="text-align:center; font-size:1.3rem; letter-spacing: 0.5px;">
            
            <button id="submitBtn" class="btn-primary" onclick="checkSpelling()">送出 (Enter)</button>
            <button id="giveUpBtn" class="btn-giveup" onclick="giveUpSpelling()">🏳️ 我認輸，看答案</button>
        </div>

        <div id="step-meaning" class="hidden">
            <h2 style="color:var(--accent); font-size: 1.2rem;">完全正確！請選中文意思</h2>
            <h3 id="fullSentenceDisplay" style="color: var(--primary); font-weight:normal; margin-bottom:15px; font-size:1.1rem;"></h3>
            <div id="options-container"></div>
        </div>

        <div id="step-next" class="hidden">
            <button class="btn-primary" id="nextBtn" onclick="nextQuestion()">下一題 ➔</button>
        </div>
        <div id="feedback" class="feedback"></div>
    </div>

    <div id="result-screen" class="hidden">
        <h2>測驗結束</h2>
        <div id="examResult" class="hidden">
            <p style="color:#666;">本次得分</p>
            <h1 id="finalScore" style="color:var(--exam); font-size:4rem; margin: 10px 0;"></h1>
            <p style="font-size:0.9rem; color:#888;">(單字3分 / 句型5分)</p>
        </div>
        <div id="practiceResult" class="hidden">
            <h1 style="color:var(--success);">練習完成！</h1>
            <p>熟能生巧，繼續加油！</p>
        </div>
        <button class="btn-primary" onclick="location.reload()">回首頁</button>
    </div>
</div>

<script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;
        if (type === 'correct') {
            const osc1 = audioCtx.createOscillator(); const gain1 = audioCtx.createGain();
            osc1.connect(gain1); gain1.connect(audioCtx.destination);
            osc1.type = 'sine'; osc1.frequency.setValueAtTime(1046, now); gain1.gain.setValueAtTime(0, now); gain1.gain.linearRampToValueAtTime(0.3, now+0.02); gain1.gain.exponentialRampToValueAtTime(0.001, now+0.5); osc1.start(now); osc1.stop(now+0.5);
            const osc2 = audioCtx.createOscillator(); const gain2 = audioCtx.createGain();
            osc2.connect(gain2); gain2.connect(audioCtx.destination);
            osc2.type = 'sine'; osc2.frequency.setValueAtTime(784, now+0.4); gain2.gain.setValueAtTime(0, now+0.4); gain2.gain.linearRampToValueAtTime(0.3, now+0.42); gain2.gain.exponentialRampToValueAtTime(0.001, now+1.2); osc2.start(now+0.4); osc2.stop(now+1.2);
        } else {
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now); osc.frequency.linearRampToValueAtTime(100, now+0.3); gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0.001, now+0.3); osc.start(now); osc.stop(now+0.3);
        }
    }

    function levenshtein(a, b) {
        const matrix = [];
        for (let i = 0; i <= b.length; i++) matrix[i] = [i];
        for (let j = 0; j <= a.length; j++) matrix[0][j] = j;
        for (let i = 1; i <= b.length; i++) {
            for (let j = 1; j <= a.length; j++) {
                if (b.charAt(i - 1) == a.charAt(j - 1)) matrix[i][j] = matrix[i - 1][j - 1];
                else matrix[i][j] = Math.min(matrix[i - 1][j - 1] + 1, Math.min(matrix[i][j - 1] + 1, matrix[i - 1][j] + 1));
            }
        }
        return matrix[b.length][a.length];
    }

    if (typeof jutorDB === 'undefined') {
        document.getElementById('dataVer').textContent = "Error: database.js not found";
        document.getElementById('dataVer').style.color = "red";
    } else {
        document.getElementById('dataVer').textContent = "Ready";
        document.getElementById('dataVer').style.color = "green";
    }

    let currentList = [], currentIndex = 0, currentWordObj = null, quizMode = 'practice', score = 0, spellingAttempts = 0, isSentenceMode = false;
    let isSubmitted = false;

    window.onload = function() {
        if (typeof jutorDB === 'undefined') return;
        const gradeSelect = document.getElementById('gradeSelect');
        Object.keys(jutorDB).forEach(g => gradeSelect.add(new Option(g, g)));
        document.getElementById('spellingInput').addEventListener('keypress', (e) => { if(e.key==='Enter') checkSpelling(); });
    };

    function updateVersions() {
        const grade = document.getElementById('gradeSelect').value;
        const vSelect = document.getElementById('versionSelect');
        vSelect.innerHTML = '<option value="">-- 2. 選擇版本 --</option>';
        document.getElementById('rangeSelect').innerHTML = '<option value="">-- 3. 選擇範圍 --</option>';
        if (grade && jutorDB[grade]) Object.keys(jutorDB[grade]).forEach(v => vSelect.add(new Option(v, v)));
    }

    function updateRanges() {
        const grade = document.getElementById('gradeSelect').value;
        const ver = document.getElementById('versionSelect').value;
        const rSelect = document.getElementById('rangeSelect');
        rSelect.innerHTML = '<option value="">-- 3. 選擇範圍 --</option>';
        if (grade && ver && jutorDB[grade][ver]) Object.keys(jutorDB[grade][ver]).forEach(r => rSelect.add(new Option(r, r)));
    }

    function startQuiz(mode) {
        const g = document.getElementById('gradeSelect').value;
        const v = document.getElementById('versionSelect').value;
        const r = document.getElementById('rangeSelect').value;
        const pType = document.getElementById('practiceType').value;
        const pCount = document.getElementById('practiceCount').value;

        if (!g || !v || !r) return alert("請完整選擇年級、版本與範圍！");

        quizMode = mode;
        let wordList = [...jutorDB[g][v][r]];
        let sentenceListName = r + " (句型)";
        let sentenceList = jutorDB[g][v][sentenceListName] ? [...jutorDB[g][v][sentenceListName]] : [];

        if (mode === 'exam') {
            wordList.sort(() => Math.random() - 0.5);
            sentenceList.sort(() => Math.random() - 0.5);
            let finalSentences = sentenceList.length > 0 ? sentenceList.slice(0, 5) : [];
            let finalWords = wordList.slice(0, 20 - finalSentences.length);
            currentList = [...finalSentences, ...finalWords];
            currentList.sort(() => Math.random() - 0.5);
            document.getElementById('scoreDisplay').classList.remove('hidden');
            document.getElementById('currentScore').textContent = '0';
        } else {
            if (pType === 'word') currentList = wordList;
            else if (pType === 'sentence') {
                if (sentenceList.length === 0) return alert("此範圍目前沒有句型資料喔！");
                currentList = sentenceList;
            } else currentList = [...sentenceList, ...wordList];
            
            currentList.sort(() => Math.random() - 0.5);
            let limit = (pCount === 'all') ? currentList.length : parseInt(pCount);
            if (currentList.length < limit) { /* 不做動作，接受 */ }
            currentList = currentList.slice(0, limit);
            document.getElementById('scoreDisplay').classList.add('hidden');
        }

        if (currentList.length === 0) return alert("此範圍尚無資料！");
        
        currentIndex = 0; score = 0;
        document.getElementById('setup-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');
        loadQuestion();
    }

    function loadQuestion() {
        currentWordObj = currentList[currentIndex];
        spellingAttempts = 0;
        isSubmitted = false; 
        isSentenceMode = currentWordObj.en.includes(' ');

        document.getElementById('step-spelling').classList.remove('hidden');
        document.getElementById('step-meaning').classList.add('hidden');
        document.getElementById('step-next').classList.add('hidden');
        document.getElementById('feedback').textContent = '';
        document.getElementById('spellingInput').value = '';
        document.getElementById('spellingInput').disabled = false; 
        document.getElementById('submitBtn').disabled = false;     
        
        const giveUpBtn = document.getElementById('giveUpBtn');
        giveUpBtn.style.display = 'none';
        giveUpBtn.textContent = "🏳️ 我認輸，看答案";
        giveUpBtn.className = "btn-giveup";
        giveUpBtn.onclick = giveUpSpelling;
        
        document.getElementById('progressText').textContent = `${currentIndex + 1} / ${currentList.length}`;
        document.getElementById('progressBar').style.width = ((currentIndex / currentList.length) * 100) + '%';

        const displayArea = document.getElementById('questionDisplay');
        const container = document.getElementById('quiz-screen');

        if (isSentenceMode) {
            container.classList.add('sentence-mode');
            displayArea.innerHTML = `<span style="font-size:1.5rem;">${currentWordObj.ch}</span>`;
            document.getElementById('spellingInput').placeholder = "請輸入完整英文句子";
        } else {
            container.classList.remove('sentence-mode');
            if (currentWordObj.sentence) {
                const regex = new RegExp(currentWordObj.en, "gi");
                const cloze = currentWordObj.sentence.replace(regex, '<span class="blank-space">_______</span>');
                displayArea.innerHTML = cloze;
            } else {
                displayArea.innerHTML = '<span class="blank-space">_______</span>';
            }
            document.getElementById('spellingInput').placeholder = "輸入單字";
        }

        document.getElementById('spellingInput').focus();
        setTimeout(playCurrentWord, 500);
    }

    function playCurrentWord() {
        let textToRead = isSentenceMode ? currentWordObj.ch : (currentWordObj.sentence || currentWordObj.en);
        let lang = isSentenceMode ? "zh-TW" : "en-US";
        const u = new SpeechSynthesisUtterance(textToRead);
        u.lang = lang; u.rate = 0.8;
        window.speechSynthesis.speak(u);
        document.getElementById('spellingInput').focus();
    }

    function checkSpelling() {
        if (isSubmitted) return; 
        const input = document.getElementById('spellingInput').value.trim();
        const feedback = document.getElementById('feedback');
        const correctAns = currentWordObj.en.trim();
        if (quizMode === 'exam') isSubmitted = true; 

        if (isSentenceMode) {
            let dist = levenshtein(input.toLowerCase(), correctAns.toLowerCase());
            let maxPoints = 5;
            let earnedPoints = Math.max(0, maxPoints - dist);
            if (Math.abs(input.length - correctAns.length) > 5) earnedPoints = Math.max(0, earnedPoints - 2);

            if (dist === 0 || input === correctAns) {
                isSubmitted = true; 
                playSound('correct');
                feedback.textContent = "Perfect! 完全正確！";
                feedback.className = "feedback text-correct";
                if (quizMode === 'exam') score += 5;
                showNextButton();
            } else {
                playSound('wrong');
                if (quizMode === 'exam') {
                    score += earnedPoints;
                    document.getElementById('currentScore').textContent = score;
                    feedback.textContent = `不完全正確。\n你的答案：${input}\n正確答案：${correctAns}\n(誤差 ${dist} 處，得 ${earnedPoints} 分)`;
                    feedback.className = "feedback text-partial";
                    showNextButton();
                } else {
                    if (quizMode !== 'exam') isSubmitted = false; 
                    feedback.textContent = `有 ${dist} 處不同，再試一次！`;
                    feedback.className = "feedback text-wrong";
                    document.getElementById('giveUpBtn').style.display = 'inline-block';
                }
            }
            if (quizMode === 'exam') document.getElementById('currentScore').textContent = score;
        } else {
            if (input.toLowerCase() === correctAns.toLowerCase()) {
                isSubmitted = true; 
                playSound('correct');
                feedback.textContent = "Bingo! 答對了！";
                feedback.className = "feedback text-correct";
                if (quizMode === 'exam') {
                    score += 3;
                    document.getElementById('currentScore').textContent = score;
                }
                setTimeout(() => {
                    document.getElementById('step-spelling').classList.add('hidden');
                    document.getElementById('step-meaning').classList.remove('hidden');
                    if (currentWordObj.sentence) {
                        const regex = new RegExp(currentWordObj.en, "gi");
                        const fullSentence = currentWordObj.sentence.replace(regex, `<u style="color:var(--accent);">${currentWordObj.en}</u>`);
                        document.getElementById('fullSentenceDisplay').innerHTML = fullSentence;
                    } else {
                        document.getElementById('fullSentenceDisplay').textContent = currentWordObj.en;
                    }
                    generateOptions();
                    feedback.textContent = ""; 
                }, 800);
            } else {
                playSound('wrong'); 
                if (quizMode === 'exam') {
                    feedback.textContent = `答錯了。\n正確答案是：${correctAns}`;
                    feedback.className = "feedback text-wrong";
                    showNextButton();
                } else {
                    if (quizMode !== 'exam') isSubmitted = false; 
                    spellingAttempts++;
                    if (spellingAttempts >= 3) document.getElementById('giveUpBtn').style.display = 'inline-block';
                    feedback.textContent = "拼錯囉，請再試一次！";
                    feedback.className = "feedback text-wrong";
                    playCurrentWord();
                    document.getElementById('spellingInput').value = '';
                    document.getElementById('spellingInput').focus();
                }
            }
        }
    }

    function showNextButton() {
        document.getElementById('step-spelling').classList.add('hidden');
        document.getElementById('step-next').classList.remove('hidden');
        document.getElementById('nextBtn').focus();
    }

    function giveUpSpelling() {
        const input = document.getElementById('spellingInput');
        const feedback = document.getElementById('feedback');
        const btn = document.getElementById('giveUpBtn');
        input.value = currentWordObj.en;
        input.disabled = true; 
        document.getElementById('submitBtn').disabled = true;
        feedback.textContent = "正確答案是： " + currentWordObj.en;
        feedback.className = "feedback text-partial";
        btn.textContent = "👌 我懂了 (重新測驗)";
        btn.className = "btn-retry"; 
        btn.onclick = resetCurrentQuestion; 
    }

    function resetCurrentQuestion() {
        document.getElementById('spellingInput').value = '';
        document.getElementById('spellingInput').disabled = false;
        document.getElementById('submitBtn').disabled = false;
        document.getElementById('feedback').textContent = '';
        const btn = document.getElementById('giveUpBtn');
        btn.style.display = 'none'; 
        btn.textContent = "🏳️ 我認輸，看答案";
        btn.className = "btn-giveup";
        btn.onclick = giveUpSpelling;
        spellingAttempts = 0;
        isSubmitted = false;
        document.getElementById('spellingInput').focus();
        playCurrentWord();
    }

    function generateOptions() {
        const container = document.getElementById('options-container');
        container.innerHTML = '';
        let pool = currentList.filter(w => w.en !== currentWordObj.en && !w.en.includes(' ')); 
        if(pool.length < 4) pool = currentList.filter(w => w.en !== currentWordObj.en);
        pool.sort(() => Math.random() - 0.5);
        let options = pool.slice(0, 4); 
        options.push(currentWordObj); 
        options.sort(() => Math.random() - 0.5);
        options.forEach(opt => {
            let btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.textContent = opt.ch; 
            btn.onclick = () => checkMeaning(btn, opt);
            container.appendChild(btn);
        });
    }

    function checkMeaning(btn, opt) {
        document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
        if (opt.en === currentWordObj.en) {
            btn.classList.add('correct-ans');
            document.getElementById('feedback').textContent = "意思正確！";
            document.getElementById('feedback').className = "feedback text-correct";
            playSound('correct');
            if (quizMode === 'exam') {
                score += 2; 
                document.getElementById('currentScore').textContent = score;
            }
        } else {
            btn.classList.add('wrong-ans');
            document.querySelectorAll('.option-btn').forEach(b => {
                if (b.textContent === currentWordObj.ch) b.classList.add('correct-ans');
            });
            document.getElementById('feedback').textContent = "選錯了...";
            document.getElementById('feedback').className = "feedback text-wrong";
            playSound('wrong');
        }
        document.getElementById('step-next').classList.remove('hidden');
        document.getElementById('nextBtn').focus();
    }

    function nextQuestion() {
        currentIndex++;
        if (currentIndex < currentList.length) loadQuestion();
        else showResult();
    }

    function showResult() {
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');
        if (quizMode === 'exam') {
            document.getElementById('examResult').classList.remove('hidden');
            document.getElementById('practiceResult').classList.add('hidden');
            document.getElementById('finalScore').textContent = score;
        } else {
            document.getElementById('examResult').classList.add('hidden');
            document.getElementById('practiceResult').classList.remove('hidden');
        }
    }
</script>
</body>
</html>
