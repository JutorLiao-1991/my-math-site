<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>英語單字聽寫測驗 (雙模式版) - 鳩特數理</title>
    <script src="database.js"></script> 
    <style>
        :root { --primary: #2c3e50; --accent: #3498db; --success: #27ae60; --error: #e74c3c; --exam: #e67e22; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #f4f6f9; display: flex; justify-content: center; min-height: 100vh; margin: 0; padding-top: 20px; -webkit-tap-highlight-color: transparent; }
        .container { background: white; padding: 1.5rem; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); width: 95%; max-width: 600px; text-align: center; box-sizing: border-box; }
        
        select, input, button { font-size: 1.1rem; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #ddd; width: 100%; box-sizing: border-box; -webkit-appearance: none; }
        
        /* 按鈕樣式 */
        .btn-primary { background: var(--accent); color: white; border: none; font-weight: bold; cursor: pointer; }
        .btn-exam { background: var(--exam); color: white; border: none; font-weight: bold; cursor: pointer; }
        .btn-giveup { background: #95a5a6; color: white; border: none; font-size: 0.9rem; margin-top: 10px; display: none; }
        
        button:active { transform: scale(0.98); }
        .hidden { display: none; }
        
        /* 聽力區塊 */
        .listening-icon { font-size: 3.5rem; cursor: pointer; color: var(--accent); margin: 15px 0; transition: transform 0.2s; }
        .listening-icon:active { transform: scale(0.9); }
        
        /* 克漏字句子的樣式 */
        .cloze-sentence { font-size: 1.3rem; color: #2c3e50; font-weight: bold; margin: 15px 0; line-height: 1.6; min-height: 3rem; word-break: break-word;}
        .blank-space { color: var(--accent); border-bottom: 3px solid var(--accent); padding: 0 5px; display: inline-block; min-width: 50px; text-align: center;}

        .feedback { margin-top: 15px; font-weight: bold; min-height: 1.5em; font-size: 1.2rem; }
        .text-correct { color: var(--success); } .text-wrong { color: var(--error); }
        
        .option-btn { background: #ecf0f1; color: #333; margin-top: 10px; text-align: left; transition: 0.2s; border: 2px solid transparent;}
        .correct-ans { background: #d5f5e3 !important; border-color: var(--success); }
        .wrong-ans { background: #fadbd8 !important; border-color: var(--error); opacity: 0.7; }
        
        /* 分數顯示 */
        .score-board { display: flex; justify-content: space-around; background: #eee; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 0.9rem; font-weight: bold; color: #555; }
    </style>
</head>
<body>

<div class="container">
    <div id="setup-screen">
        <h1 style="color: var(--primary);">鳩特數理‧英語單字聽寫測驗</h1>
        
        <select id="gradeSelect" onchange="updateVersions()"><option value="">-- 1. 選擇年級 --</option></select>
        <select id="versionSelect" onchange="updateRanges()"><option value="">-- 2. 選擇版本 --</option></select>
        <select id="rangeSelect"><option value="">-- 3. 選擇範圍 --</option></select>
        
        <div style="margin-top: 20px; display: flex; gap: 10px; flex-direction: column;">
            <button class="btn-primary" onclick="startQuiz('practice')">💪 練習模式 (無限嘗試)</button>
            <button class="btn-exam" onclick="startQuiz('exam')">📝 考試模式 (20題測驗)</button>
        </div>
        
        <div style="margin-top: 20px;">
            <button onclick="playSound('correct')" style="background:none; border:1px dashed #ccc; color:#888; font-size:0.8rem; width:auto; padding:5px 15px;">🔊 按此測試音效 (叮-咚)</button>
        </div>

        <p style="font-size: 0.8rem; color: #999; margin-top: 10px;">System: <span id="dataVer">Checking...</span></p>
    </div>

    <div id="quiz-screen" class="hidden">
        <div style="background:#eee; height:8px; border-radius:4px; margin-bottom:10px;"><div id="progressBar" style="width:0%; height:100%; background:var(--success); border-radius:4px; transition:0.3s;"></div></div>
        
        <div class="score-board">
            <span>題數: <span id="progressText"></span></span>
            <span id="scoreDisplay" class="hidden">得分: <span id="currentScore">0</span></span>
        </div>
        
        <div id="step-spelling">
            <div class="listening-icon" onclick="playCurrentWord()" title="點擊重聽">🔊</div>
            
            <div id="questionDisplay" class="cloze-sentence"></div>

            <input type="text" id="spellingInput" placeholder="輸入單字" autocomplete="off" style="text-align:center; font-size:1.5rem; letter-spacing: 1px;">
            
            <button class="btn-primary" onclick="checkSpelling()">送出 (Enter)</button>
            <button id="giveUpBtn" class="btn-giveup" onclick="giveUpSpelling()">🏳️ 我認輸，看答案</button>
        </div>

        <div id="step-meaning" class="hidden">
            <h2 style="color:var(--accent); font-size: 1.2rem;">拼字正確！請選中文意思</h2>
            <h3 id="fullSentenceDisplay" style="color: var(--primary); font-weight:normal; margin-bottom:15px; font-size:1.1rem;"></h3>
            <div id="options-container"></div>
        </div>

        <div id="step-next" class="hidden">
            <button class="btn-primary" id="nextBtn" onclick="nextQuestion()">下一題 ➔</button>
        </div>
        <div id="feedback" class="feedback"></div>
    </div>

    <div id="result-screen" class="hidden">
        <h2>測驗結束</h2>
        <div id="examResult" class="hidden">
            <p style="color:#666;">本次得分</p>
            <h1 id="finalScore" style="color:var(--exam); font-size:4rem; margin: 10px 0;"></h1>
            <p style="font-size:0.9rem; color:#888;">(拼字3分 / 釋義2分 / 滿分100)</p>
        </div>
        <div id="practiceResult" class="hidden">
            <h1 style="color:var(--success);">練習完成！</h1>
            <p>熟能生巧，繼續加油！</p>
        </div>
        <button class="btn-primary" onclick="location.reload()">回首頁</button>
    </div>
</div>

<script>
    // --- 1. 雙音階叮咚音效生成 ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;

        if (type === 'correct') {
            // 第一聲：叮 (高音 E6 1318Hz)
            const osc1 = audioCtx.createOscillator();
            const gain1 = audioCtx.createGain();
            osc1.connect(gain1);
            gain1.connect(audioCtx.destination);
            
            osc1.type = 'sine';
            osc1.frequency.setValueAtTime(1046, now); // C6
            
            // 聲音包絡 (Fade out)
            gain1.gain.setValueAtTime(0, now);
            gain1.gain.linearRampToValueAtTime(0.3, now + 0.02);
            gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
            
            osc1.start(now);
            osc1.stop(now + 0.5);

            // 第二聲：咚 (低音 A5 880Hz, 延遲 0.4秒播放)
            const osc2 = audioCtx.createOscillator();
            const gain2 = audioCtx.createGain();
            osc2.connect(gain2);
            gain2.connect(audioCtx.destination);
            
            osc2.type = 'sine';
            osc2.frequency.setValueAtTime(784, now + 0.4); // G5 (大三度下行)
            
            // 聲音包絡 (Longer fade out)
            gain2.gain.setValueAtTime(0, now + 0.4);
            gain2.gain.linearRampToValueAtTime(0.3, now + 0.42);
            gain2.gain.exponentialRampToValueAtTime(0.001, now + 1.2);
            
            osc2.start(now + 0.4);
            osc2.stop(now + 1.2);

        } else {
            // 答錯音效 (低沉鋸齒波)
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.linearRampToValueAtTime(100, now + 0.3);
            
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.linearRampToValueAtTime(0.001, now + 0.3);
            
            osc.start(now);
            osc.stop(now + 0.3);
        }
    }

    // --- 2. 資料庫讀取檢查 ---
    if (typeof jutorDB === 'undefined') {
        document.getElementById('dataVer').textContent = "Error: database.js not found";
        document.getElementById('dataVer').style.color = "red";
    } else {
        document.getElementById('dataVer').textContent = "Ready";
        document.getElementById('dataVer').style.color = "green";
    }

    // --- 3. 全域變數 ---
    let currentList = [];
    let currentIndex = 0;
    let currentWordObj = null;
    let quizMode = 'practice'; // 'practice' or 'exam'
    let score = 0;
    let spellingAttempts = 0;
    
    // 初始化選單
    window.onload = function() {
        if (typeof jutorDB === 'undefined') return;
        const gradeSelect = document.getElementById('gradeSelect');
        Object.keys(jutorDB).forEach(g => gradeSelect.add(new Option(g, g)));
        
        document.getElementById('spellingInput').addEventListener('keypress', (e) => { 
            if(e.key==='Enter') checkSpelling(); 
        });
    };

    function updateVersions() {
        const grade = document.getElementById('gradeSelect').value;
        const vSelect = document.getElementById('versionSelect');
        vSelect.innerHTML = '<option value="">-- 2. 選擇版本 --</option>';
        document.getElementById('rangeSelect').innerHTML = '<option value="">-- 3. 選擇範圍 --</option>';
        if (grade && jutorDB[grade]) Object.keys(jutorDB[grade]).forEach(v => vSelect.add(new Option(v, v)));
    }

    function updateRanges() {
        const grade = document.getElementById('gradeSelect').value;
        const ver = document.getElementById('versionSelect').value;
        const rSelect = document.getElementById('rangeSelect');
        rSelect.innerHTML = '<option value="">-- 3. 選擇範圍 --</option>';
        if (grade && ver && jutorDB[grade][ver]) Object.keys(jutorDB[grade][ver]).forEach(r => rSelect.add(new Option(r, r)));
    }

    // --- 4. 測驗核心邏輯 ---
    function startQuiz(mode) {
        const g = document.getElementById('gradeSelect').value;
        const v = document.getElementById('versionSelect').value;
        const r = document.getElementById('rangeSelect').value;

        if (!g || !v || !r) return alert("請完整選擇年級、版本與範圍！");

        quizMode = mode;
        let fullList = [...jutorDB[g][v][r]];
        
        // 洗牌
        for (let i = fullList.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [fullList[i], fullList[j]] = [fullList[j], fullList[i]];
        }

        if (mode === 'exam') {
            currentList = fullList.slice(0, 20);
        } else {
            currentList = fullList;
        }

        if (currentList.length === 0) return alert("此範圍尚無資料！");
        
        currentIndex = 0;
        score = 0;
        
        document.getElementById('setup-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');
        
        if (mode === 'exam') {
            document.getElementById('scoreDisplay').classList.remove('hidden');
            document.getElementById('currentScore').textContent = '0';
        } else {
            document.getElementById('scoreDisplay').classList.add('hidden');
        }

        loadQuestion();
    }

    function loadQuestion() {
        currentWordObj = currentList[currentIndex];
        spellingAttempts = 0;

        document.getElementById('step-spelling').classList.remove('hidden');
        document.getElementById('step-meaning').classList.add('hidden');
        document.getElementById('step-next').classList.add('hidden');
        document.getElementById('feedback').textContent = '';
        document.getElementById('spellingInput').value = '';
        document.getElementById('giveUpBtn').style.display = 'none';
        
        document.getElementById('progressText').textContent = `${currentIndex + 1} / ${currentList.length}`;
        document.getElementById('progressBar').style.width = ((currentIndex / currentList.length) * 100) + '%';

        const displayArea = document.getElementById('questionDisplay');
        if (currentWordObj.sentence) {
            const regex = new RegExp(currentWordObj.en, "gi");
            const cloze = currentWordObj.sentence.replace(regex, '<span class="blank-space">_______</span>');
            displayArea.innerHTML = cloze;
        } else {
            displayArea.innerHTML = '<span class="blank-space">_______</span>';
        }

        document.getElementById('spellingInput').focus();
        setTimeout(playCurrentWord, 500);
    }

    function playCurrentWord() {
        const textToRead = currentWordObj.sentence || currentWordObj.en;
        const u = new SpeechSynthesisUtterance(textToRead);
        u.lang = 'en-US'; 
        u.rate = 0.8;
        window.speechSynthesis.speak(u);
        document.getElementById('spellingInput').focus();
    }

    function checkSpelling() {
        const input = document.getElementById('spellingInput').value.trim();
        const feedback = document.getElementById('feedback');

        if (input.toLowerCase() === currentWordObj.en.toLowerCase()) {
            // 答對 - 播放叮咚聲
            playSound('correct');
            feedback.textContent = "Bingo! 答對了！";
            feedback.className = "feedback text-correct";

            if (quizMode === 'exam') {
                score += 3; 
                document.getElementById('currentScore').textContent = score;
            }

            setTimeout(() => {
                document.getElementById('step-spelling').classList.add('hidden');
                document.getElementById('step-meaning').classList.remove('hidden');
                
                if (currentWordObj.sentence) {
                    const regex = new RegExp(currentWordObj.en, "gi");
                    const fullSentence = currentWordObj.sentence.replace(regex, `<u style="color:var(--accent);">${currentWordObj.en}</u>`);
                    document.getElementById('fullSentenceDisplay').innerHTML = fullSentence;
                } else {
                    document.getElementById('fullSentenceDisplay').textContent = currentWordObj.en;
                }

                generateOptions();
                feedback.textContent = ""; 
            }, 800); // 稍微延遲讓音效播完

        } else {
            playSound('wrong'); 
            spellingAttempts++;
            
            if (quizMode === 'practice') {
                if (spellingAttempts >= 3) {
                    document.getElementById('giveUpBtn').style.display = 'inline-block';
                    feedback.textContent = "加油！再試試看，或選擇放棄。";
                } else {
                    feedback.textContent = "拼錯囉，再聽一次！";
                }
            } else {
                feedback.textContent = "拼錯囉，請再試一次！";
            }
            
            feedback.className = "feedback text-wrong";
            playCurrentWord();
            document.getElementById('spellingInput').value = '';
            document.getElementById('spellingInput').focus();
        }
    }

    function giveUpSpelling() {
        document.getElementById('spellingInput').value = currentWordObj.en;
        document.getElementById('feedback').textContent = "答案是 " + currentWordObj.en + "，請記住它！";
        setTimeout(checkSpelling, 1500); 
    }

    function generateOptions() {
        const container = document.getElementById('options-container');
        container.innerHTML = '';
        
        let pool = currentList.filter(w => w.en !== currentWordObj.en); 
        pool.sort(() => Math.random() - 0.5);
        let options = pool.slice(0, 4); 
        options.push(currentWordObj); 
        options.sort(() => Math.random() - 0.5);

        options.forEach(opt => {
            let btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.textContent = opt.ch; 
            btn.onclick = () => checkMeaning(btn, opt);
            container.appendChild(btn);
        });
    }

    function checkMeaning(btn, opt) {
        document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
        
        if (opt.en === currentWordObj.en) {
            btn.classList.add('correct-ans');
            document.getElementById('feedback').textContent = "意思正確！";
            document.getElementById('feedback').className = "feedback text-correct";
            playSound('correct');

            if (quizMode === 'exam') {
                score += 2; 
                document.getElementById('currentScore').textContent = score;
            }
        } else {
            btn.classList.add('wrong-ans');
            document.querySelectorAll('.option-btn').forEach(b => {
                if (b.textContent === currentWordObj.ch) b.classList.add('correct-ans');
            });
            document.getElementById('feedback').textContent = "選錯了...";
            document.getElementById('feedback').className = "feedback text-wrong";
            playSound('wrong');
        }
        
        document.getElementById('step-next').classList.remove('hidden');
        document.getElementById('nextBtn').focus();
    }

    function nextQuestion() {
        currentIndex++;
        if (currentIndex < currentList.length) {
            loadQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');
        
        if (quizMode === 'exam') {
            document.getElementById('examResult').classList.remove('hidden');
            document.getElementById('practiceResult').classList.add('hidden');
            document.getElementById('finalScore').textContent = score;
        } else {
            document.getElementById('examResult').classList.add('hidden');
            document.getElementById('practiceResult').classList.remove('hidden');
        }
    }
</script>
</body>
</html>
