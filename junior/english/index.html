<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>鳩特國中英文練習區</title>
  <style>
    :root { --navy:#0f172a; --panel:#1e293b; --muted:#94a3b8; --blue:#38bdf8; --purple:#c084fc; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; color:#f8fafc; background:radial-gradient(circle at 50% 0,#1e3a5f 0,var(--navy) 48%); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei",sans-serif; }
    header, main { width:min(980px,92%); margin:auto; }
    header { padding:42px 0 24px; }
    .back { color:#bae6fd; text-decoration:none; font-weight:700; }
    h1 { font-size:clamp(2rem,6vw,3.4rem); margin:30px 0 8px; }
    .lead { color:#cbd5e1; font-size:1.08rem; line-height:1.8; max-width:720px; }
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:24px; padding:24px 0 54px; }
    .card { display:flex; flex-direction:column; min-height:310px; padding:30px; color:inherit; text-decoration:none; background:rgba(30,41,59,.92); border:1px solid #334155; border-radius:24px; box-shadow:0 18px 45px rgba(0,0,0,.25); transition:.2s ease; }
    .card:hover { transform:translateY(-5px); border-color:#64748b; }
    .icon { font-size:3rem; }
    h2 { margin:20px 0 10px; font-size:1.65rem; }
    .card p { color:#cbd5e1; line-height:1.7; }
    .tags { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
    .tag { padding:6px 10px; border-radius:99px; background:#0f172a; color:var(--muted); font-size:.86rem; }
    .go { margin-top:auto; font-weight:800; }
    .words .go { color:var(--blue); }
    .grammar .go { color:var(--purple); }
    @media (max-width:700px) { .grid { grid-template-columns:1fr; } .card { min-height:280px; } }
  </style>
</head>
<body>
  <header>
    <a class="back" href="../../index.html">← 返回鳩特互動教室</a>
    <h1>鳩特國中英文練習區</h1>
    <p class="lead">依照目前課程範圍，選擇單字與句型練習，或進入基礎文法挑戰。兩區共用相同的年級與教材邏輯。</p>
  </header>
  <main class="grid">
    <a class="card words" href="vol_test.html">
      <div class="icon">🔤</div>
      <h2>單字與句型</h2>
      <p>從拼字、中文意思到完整句型，依「國一上～國三下」、版本與單元選擇範圍。</p>
      <div class="tags"><span class="tag">練習模式</span><span class="tag">考試模式</span><span class="tag">聽力與拼字</span></div>
      <div class="go">開始練習 →</div>
    </a>
    <a class="card grammar" href="basic_grammar.html">
      <div class="icon">📝</div>
      <h2>基礎文法</h2>
      <p>練習文法觀念與題目解析，也可以進行單人計時或雙人 PK。</p>
      <div class="tags"><span class="tag">觀念練習</span><span class="tag">單人計時</span><span class="tag">雙人 PK</span></div>
      <div class="go">開始挑戰 →</div>
    </a>
  </main>
</body>
</html>
