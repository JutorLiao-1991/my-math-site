<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>鳩特數理 - 雲端後台 (智慧合併版)</title>
    <script src="database.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; padding: 20px; background: #2c3e50; color: #ecf0f1; max-width: 800px; margin: 0 auto; }
        h1 { text-align: center; color: #f1c40f; }
        .panel { background: #34495e; padding: 20px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .panel h3 { margin-top: 0; color: #3498db; border-bottom: 1px solid #555; padding-bottom: 10px; }
        textarea { width: 100%; height: 150px; background: #2c3e50; color: #2ecc71; border: 1px solid #7f8c8d; padding: 10px; font-family: monospace; border-radius: 5px; box-sizing: border-box;}
        input, select { padding: 10px; border-radius: 5px; border: none; margin-right: 5px; margin-bottom: 5px; }
        button { padding: 10px 20px; background: #3498db; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 1rem; transition: 0.3s; }
        button:hover { background: #2980b9; }
        
        .config-area input { width: 45%; background: #ecf0f1; color: #333; }
        .save-btn { background: #e74c3c; width: 100%; font-size: 1.2rem; font-weight: bold; margin-top: 10px; }
        .save-btn:hover { background: #c0392b; }
        .status-msg { margin-top: 10px; text-align: center; font-weight: bold; min-height: 1.5em; }
        
        /* 預覽區塊樣式 */
        .log-msg { color: #f39c12; font-size: 0.9rem; margin-bottom: 5px; }
    </style>
</head>
<body>

<h1>鳩特數理單字系統 - 雲端後台 V2</h1>

<div class="panel">
    <h3>⚙️ 系統連線設定</h3>
    <div class="config-area">
        <input type="text" id="repoOwner" placeholder="GitHub 帳號">
        <input type="text" id="repoName" placeholder="倉庫名稱">
        <input type="text" id="filePath" placeholder="檔案路徑" value="junior/english/database.js">
        <input type="password" id="githubToken" placeholder="GitHub Token">
        <button onclick="saveConfig()">儲存設定</button>
    </div>
</div>

<div class="panel">
    <h3>📝 匯入/新增資料 (自動合併)</h3>
    <div>
        <select id="grade"><option value="國一">國一</option><option value="國二">國二</option><option value="國三">國三</option></select>
        <select id="version"><option value="翰林版">翰林版</option><option value="康軒版">康軒版</option><option value="南一版">南一版</option></select>
        <input type="text" id="rangeName" placeholder="輸入範圍 (如: Book 1 Unit 2)" style="width: 200px;">
    </div>
    <p style="color: #bdc3c7; font-size: 0.9rem;">貼上 JSON (無論是單字還是句型，都會自動合併到該範圍)：</p>
    <textarea id="jsonInput" placeholder='[ { "en": "...", "ch": "..." } ]'></textarea>
    <br><br>
    <button onclick="smartMergeData()">⬇️ 智慧合併到暫存區</button>
    <div id="mergeLog" class="log-msg"></div>
</div>

<div class="panel">
    <h3>☁️ 確認並上傳</h3>
    <p>目前的資料庫結構預覽：</p>
    <pre id="previewArea" style="background:#222; padding:10px; overflow:auto; max-height:200px; border-radius:5px; font-size: 0.8rem;"></pre>
    
    <button class="save-btn" onclick="uploadToGitHub()">🚀 一鍵更新到網站</button>
    <div id="status" class="status-msg"></div>
</div>

<script>
    // 讀取本地暫存的資料庫 (如果有的話)，否則讀取 database.js 的
    let db = (typeof jutorDB !== 'undefined') ? jutorDB : {};

    // 頁面載入時，自動填入 localStorage 的設定
    window.onload = function() {
        if(localStorage.getItem('gh_owner')) document.getElementById('repoOwner').value = localStorage.getItem('gh_owner');
        if(localStorage.getItem('gh_repo')) document.getElementById('repoName').value = localStorage.getItem('gh_repo');
        if(localStorage.getItem('gh_token')) document.getElementById('githubToken').value = localStorage.getItem('gh_token');
        if(localStorage.getItem('gh_path')) document.getElementById('filePath').value = localStorage.getItem('gh_path');
        renderPreview();
    }

    function saveConfig() {
        localStorage.setItem('gh_owner', document.getElementById('repoOwner').value.trim());
        localStorage.setItem('gh_repo', document.getElementById('repoName').value.trim());
        localStorage.setItem('gh_token', document.getElementById('githubToken').value.trim());
        localStorage.setItem('gh_path', document.getElementById('filePath').value.trim());
        alert("設定已儲存！");
    }

    // ★★★ 核心功能：智慧合併 (Smart Merge) ★★★
    function smartMergeData() {
        const grade = document.getElementById('grade').value;
        const version = document.getElementById('version').value;
        const range = document.getElementById('rangeName').value.trim();
        const jsonText = document.getElementById('jsonInput').value.trim();
        const logDiv = document.getElementById('mergeLog');

        if (!range || !jsonText) return alert("請完整填寫範圍與 JSON 資料！");

        try {
            const newData = JSON.parse(jsonText);
            
            // 1. 確保路徑存在
            if (!db[grade]) db[grade] = {};
            if (!db[grade][version]) db[grade][version] = {};
            
            // 2. 取得該範圍「原本的資料列表」，如果是新的就給空陣列
            let existingList = db[grade][version][range] || [];
            
            let addedCount = 0;
            let updatedCount = 0;

            // 3. 逐一比對新資料
            newData.forEach(newItem => {
                // 比對邏輯：檢查英文 (en) 是否一樣 (忽略大小寫)
                const index = existingList.findIndex(oldItem => 
                    oldItem.en.trim().toLowerCase() === newItem.en.trim().toLowerCase()
                );

                if (index !== -1) {
                    // 如果存在 -> 更新 (覆蓋舊的)
                    existingList[index] = newItem;
                    updatedCount++;
                } else {
                    // 如果不存在 -> 新增
                    existingList.push(newItem);
                    addedCount++;
                }
            });

            // 4. 存回資料庫
            db[grade][version][range] = existingList;
            
            // 5. 顯示結果
            document.getElementById('jsonInput').value = ''; // 清空輸入框
            renderPreview();
            
            logDiv.textContent = `✅ 成功合併！新增了 ${addedCount} 筆，更新了 ${updatedCount} 筆資料到 [${range}]。請記得按下方紅色按鈕上傳。`;
            // 3秒後清除訊息
            setTimeout(() => { logDiv.textContent = ''; }, 5000);

        } catch (e) {
            alert("JSON 格式錯誤！請檢查代碼是否完整。");
            console.error(e);
        }
    }

    function renderPreview() {
        document.getElementById('previewArea').textContent = JSON.stringify(db, null, 2);
    }

    // 上傳功能維持不變
    async function uploadToGitHub() {
        const owner = document.getElementById('repoOwner').value.trim();
        const repo = document.getElementById('repoName').value.trim();
        const token = document.getElementById('githubToken').value.trim();
        const path = document.getElementById('filePath').value.trim();
        const statusDiv = document.getElementById('status');

        if (!owner || !repo || !token || !path) return alert("請先完成上方的系統連線設定！");

        statusDiv.textContent = "正在連線到 GitHub...";
        statusDiv.style.color = "#f39c12";

        const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
        const newContent = "var jutorDB = " + JSON.stringify(db, null, 2) + ";";
        const base64Content = btoa(unescape(encodeURIComponent(newContent)));

        try {
            const getRes = await fetch(apiUrl, {
                headers: { 
                    'Authorization': `token ${token}`,
                    'Accept': 'application/vnd.github.v3+json'
                }
            });
            
            let sha = null;
            if (getRes.ok) {
                const getData = await getRes.json();
                sha = getData.sha;
            }

            const putRes = await fetch(apiUrl, {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${token}`,
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    message: "Update database via Jutor Admin V2", 
                    content: base64Content,
                    sha: sha 
                })
            });

            if (putRes.ok) {
                statusDiv.textContent = "✅ 上傳成功！資料已安全儲存。";
                statusDiv.style.color = "#2ecc71";
            } else {
                const errData = await putRes.json();
                throw new Error(errData.message);
            }

        } catch (error) {
            console.error(error);
            statusDiv.textContent = "❌ 上傳失敗：" + error.message;
            statusDiv.style.color = "#e74c3c";
            alert("上傳失敗，請檢查設定區的 Token 或路徑是否正確。");
        }
    }
</script>

</body>
</html>
