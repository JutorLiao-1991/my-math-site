<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>鳩特元素 UNO v5</title>
    <style>
        /* --- V5 小抄樣式大改版 --- */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); align-items: center; justify-content: center; flex-direction: column; }
        .modal.show { display: flex; }
        
        /* 讓小抄寬度適應手機，並支援橫向捲動以免太擠 */
        .modal-content { background: #222; padding: 15px; border-radius: 15px; position: relative; width: 95%; max-width: 600px; max-height: 90%; overflow: auto; border: 1px solid #555; }
        
        .close-btn { position: absolute; top: 5px; right: 10px; font-size: 24px; cursor: pointer; color: #fff; z-index: 10; }

        /* CSS Grid: 定義 9 個欄位 (1欄週期標示 + 8欄主族元素) */
        .periodic-grid { 
            display: grid; 
            grid-template-columns: 25px repeat(8, 1fr); /* 第一欄窄一點放數字 */
            gap: 4px; 
            margin-top: 20px; 
            width: 100%;
            min-width: 320px; /* 確保在極小螢幕有捲軸 */
        }

        /* 格子通用樣式 */
        .pg-cell { 
            aspect-ratio: 1; /* 保持正方形 */
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            border-radius: 4px; font-weight: bold; color: #fff; position: relative;
            font-size: 0.9rem;
        }

        /* 標頭與座標 */
        .pg-header-row { font-size: 0.7rem; color: #aaa; background: transparent; height: 20px; align-items: end; padding-bottom: 2px; }
        .pg-period-num { font-size: 0.9rem; color: #f1c40f; background: transparent; font-weight: bold; }
        
        /* 元素顏色 (對應卡牌) */
        .pg-pink { background: #ffeef0; color: #333; border: 2px solid #e91e63; }
        .pg-yellow { background: #fff8e1; color: #333; border: 2px solid #ffc107; }
        .pg-green { background: #e8f5e9; color: #333; border: 2px solid #4caf50; }
        .pg-purple { background: #f3e5f5; color: #333; border: 2px solid #9c27b0; }
        .pg-blue { background: #e3f2fd; color: #333; border: 2px solid #2196f3; }
        
        /* 空白佔位符 (透明) */
        .pg-empty { background: transparent; border: none; }


        /* --- 舊有樣式保留 --- */
        body { font-family: 'Segoe UI', sans-serif; background: #2c3e50; color: white; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 10px; height: 100vh; overflow: hidden; }
        .screen { display: none; width: 100%; height: 100%; flex-direction: column; align-items: center; justify-content: center; }
        .screen.active { display: flex; }
        input { padding: 10px; font-size: 1.2rem; border-radius: 5px; border: none; margin: 10px; text-align: center; width: 200px; }
        .big-btn { padding: 15px 30px; font-size: 1.2rem; background: #27ae60; color: white; border: none; border-radius: 50px; cursor: pointer; margin: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        #player-list { width: 90%; max-width: 400px; background: rgba(0,0,0,0.3); border-radius: 10px; padding: 10px; margin: 20px 0; }
        .player-row { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .player-row.me { color: #f1c40f; font-weight: bold; }
        .player-row.host { color: #e74c3c; }
        #top-info { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 5px; background: rgba(0,0,0,0.2); border-radius: 8px; font-size: 0.9rem; }
        #game-board { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; width: 100%; }
        .table-slot { width: 120px; height: 160px; border: 2px dashed rgba(255,255,255,0.3); border-radius: 12px; display: flex; justify-content: center; align-items: center; margin-bottom: 10px; }
        #hand-area { background: rgba(0,0,0,0.3); width: 100%; height: 160px; padding: 10px; overflow-x: auto; white-space: nowrap; display: flex; align-items: center; gap: 10px; }
        .card { width: 90px; height: 130px; background: white; border-radius: 8px; display: inline-flex; flex-direction: column; justify-content: center; align-items: center; position: relative; box-shadow: 0 2px 5px rgba(0,0,0,0.3); color: #333; user-select: none; transition: transform 0.2s; }
        .card:active { transform: scale(0.95); }
        .atomic { position: absolute; top: 4px; left: 6px; font-size: 10px; }
        .symbol { font-size: 36px; font-weight: 800; }
        .name { font-size: 14px; margin-top: 2px; font-weight: 600; }
        .card.pink { background: #ffeef0; border: 3px solid #e91e63; }
        .card.yellow { background: #fff8e1; border: 3px solid #ffc107; }
        .card.green { background: #e8f5e9; border: 3px solid #4caf50; }
        .card.purple { background: #f3e5f5; border: 3px solid #9c27b0; }
        .action-badge { position: absolute; bottom: 5px; right: 5px; background: #e74c3c; color: white; padding: 2px 6px; border-radius: 10px; font-size: 10px; font-weight: bold;}
        .helper-btn { padding: 8px 15px; font-size: 0.9rem; background: #34495e; color: white; border: 1px solid rgba(255,255,255,0.3); border-radius: 20px; cursor: pointer; }
        .winner-text { font-size: 2em; color: #f1c40f; margin: 20px; text-shadow: 0 0 10px #f39c12; }
    </style>
</head>
<body>

    <div id="screen-login" class="screen active">
        <h1>元素 UNO v5</h1>
        <p>請輸入暱稱加入房間</p>
        <input type="text" id="username" placeholder="你的名字" maxlength="8">
        <button class="big-btn" onclick="joinGame()">加入遊戲</button>
    </div>

    <div id="screen-lobby" class="screen">
        <h2>等候室</h2>
        <div id="room-code-display">房號: Class 101</div>
        <div id="player-list"></div>
        <p id="lobby-msg">等待房主開始...</p>
        <button id="btn-start" class="big-btn" style="display:none;" onclick="startGame()">開始遊戲</button>
    </div>

    <div id="screen-game" class="screen">
        <div id="top-info">
            <button class="helper-btn" onclick="toggleCheatSheet(true)">📊 週期表小抄</button>
            <div id="my-name-display">我: ???</div>
        </div>
        
        <div id="turn-msg">等待出牌...</div>

        <div id="game-board">
            <div id="table-slot" class="table-slot"></div>
            <button id="btn-draw" class="big-btn" style="padding: 10px 20px; font-size: 1rem; background: #e67e22; opacity: 0.5; pointer-events: none;" onclick="drawCardAction()">抽牌 (跳過)</button>
        </div>

        <div id="hand-area"></div>
    </div>

    <div id="screen-gameover" class="screen" style="background: rgba(0,0,0,0.85);">
        <h1>🎉 遊戲結束 🎉</h1>
        <div class="winner-text" id="winner-name">---</div>
        <p>獲得勝利！</p>
        <button class="big-btn" onclick="backToLobby()">回到大廳</button>
    </div>

    <div id="modal-cheatsheet" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="toggleCheatSheet(false)">&times;</span>
            <h3 style="margin:5px 0 15px 0; color:white; font-size:1.1rem;">元素週期表 (顏色=族)</h3>
            
            <div class="periodic-grid">
                <div class="pg-cell pg-header-row">週</div>
                <div class="pg-cell pg-header-row">1A</div>
                <div class="pg-cell pg-header-row">2A</div>
                <div class="pg-cell pg-header-row">3A</div>
                <div class="pg-cell pg-header-row">4A</div>
                <div class="pg-cell pg-header-row">5A</div>
                <div class="pg-cell pg-header-row">6A</div>
                <div class="pg-cell pg-header-row">7A</div>
                <div class="pg-cell pg-header-row">8A</div>

                <div class="pg-cell pg-period-num">1</div>
                <div class="pg-cell pg-pink">H</div>
                <div class="pg-cell pg-empty"></div>
                <div class="pg-cell pg-empty"></div>
                <div class="pg-cell pg-empty"></div>
                <div class="pg-cell pg-empty"></div>
                <div class="pg-cell pg-empty"></div>
                <div class="pg-cell pg-empty"></div>
                <div class="pg-cell pg-purple">He</div>

                <div class="pg-cell pg-period-num">2</div>
                <div class="pg-cell pg-pink">Li</div>
                <div class="pg-cell pg-yellow">Be</div>
                <div class="pg-cell pg-empty" style="font-size:0.6rem; color:#555">B</div>
                <div class="pg-cell pg-empty" style="font-size:0.6rem; color:#555">C</div>
                <div class="pg-cell pg-empty" style="font-size:0.6rem; color:#555">N</div>
                <div class="pg-cell pg-empty" style="font-size:0.6rem; color:#555">O</div>
                <div class="pg-cell pg-green">F</div>
                <div class="pg-cell pg-purple">Ne</div>

                <div class="pg-cell pg-period-num">3</div>
                <div class="pg-cell pg-pink">Na</div>
                <div class="pg-cell pg-yellow">Mg</div>
                <div class="pg-cell pg-empty" style="font-size:0.6rem; color:#555">Al</div>
                <div class="pg-cell pg-empty" style="font-size:0.6rem; color:#555">Si</div>
                <div class="pg-cell pg-empty" style="font-size:0.6rem; color:#555">P</div>
                <div class="pg-cell pg-empty" style="font-size:0.6rem; color:#555">S</div>
                <div class="pg-cell pg-green">Cl</div>
                <div class="pg-cell pg-purple">Ar</div>

                <div class="pg-cell pg-period-num">4</div>
                <div class="pg-cell pg-pink">K</div>
                <div class="pg-cell pg-yellow">Ca</div>
                <div class="pg-cell pg-empty"></div>
                <div class="pg-cell pg-empty"></div>
                <div class="pg-cell pg-empty"></div>
                <div class="pg-cell pg-empty"></div>
                <div class="pg-cell pg-green">Br</div>
                <div class="pg-cell pg-purple">Kr</div>
            </div>
            <p style="font-size:0.8rem; color:#aaa; margin-top:15px; text-align: left;">
                * 僅列出遊戲用牌<br>
                * 紫色(8A)為 Skip 功能牌
            </p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        // V5: 引入 onDisconnect 用於斷線處理
        import { getDatabase, ref, set, onValue, update, remove, onDisconnect } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA7TJh1sfGLUVGQgFhdvFLd9Xm5_l447Ug",
            authDomain: "element-uno.firebaseapp.com",
            databaseURL: "https://element-uno-default-rtdb.firebaseio.com",
            projectId: "element-uno",
            storageBucket: "element-uno.firebasestorage.app",
            messagingSenderId: "665324599764",
            appId: "1:665324599764:web:d151cd9014e600fcd53e41"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        const ROOM_ID = "class_room_101";
        const roomRef = ref(db, `rooms/${ROOM_ID}`);

        // V5 重要更新：不再從 localStorage 讀取舊 ID，每次重新整理都視為新玩家
        // 這樣可以解決「刷新後狀態卡住」的問題
        let myId = 'user_' + Math.random().toString(36).substr(2, 9);
        let myName = "";
        let myHand = [];
        let playerOrder = [];
        let currentTopCard = null;
        let isMyTurn = false;

        // 卡片資料
        const allCards = [
            { id: "H", s: "H", n: "氫", at: 1, p: 1, c: "pink", group: "1A" },
            { id: "Li", s: "Li", n: "鋰", at: 3, p: 2, c: "pink", group: "1A" },
            { id: "Na", s: "Na", n: "鈉", at: 11, p: 3, c: "pink", group: "1A" },
            { id: "K", s: "K", n: "鉀", at: 19, p: 4, c: "pink", group: "1A" },
            { id: "Be", s: "Be", n: "鈹", at: 4, p: 2, c: "yellow", group: "2A" },
            { id: "Mg", s: "Mg", n: "鎂", at: 12, p: 3, c: "yellow", group: "2A" },
            { id: "Ca", s: "Ca", n: "鈣", at: 20, p: 4, c: "yellow" },
            { id: "F", s: "F", n: "氟", at: 9, p: 2, c: "green", group: "7A" },
            { id: "Cl", s: "Cl", n: "氯", at: 17, p: 3, c: "green", group: "7A" },
            { id: "Br", s: "Br", n: "溴", at: 35, p: 4, c: "green", group: "7A" },
            { id: "He", s: "He", n: "氦", at: 2, p: 1, c: "purple", group: "8A", action: "skip" },
            { id: "Ne", s: "Ne", n: "氖", at: 10, p: 2, c: "purple", group: "8A", action: "skip" },
            { id: "Ar", s: "Ar", n: "氬", at: 18, p: 3, c: "purple", group: "8A", action: "skip" },
            { id: "Kr", s: "Kr", n: "氪", at: 36, p: 4, c: "purple", group: "8A", action: "skip" }
        ];

        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
            toggleCheatSheet(false);
        }

        window.toggleCheatSheet = function(show) {
            const modal = document.getElementById('modal-cheatsheet');
            if(show) modal.classList.add('show');
            else modal.classList.remove('show');
        }

        window.joinGame = function() {
            myName = document.getElementById('username').value;
            if(!myName) return alert("請輸入名字！");

            const myRef = ref(db, `rooms/${ROOM_ID}/players/${myId}`);
            
            // 1. 寫入玩家資料
            update(myRef, { name: myName });

            // V5 重要更新：設定「斷線後自動刪除」
            // 當這個瀏覽器分頁關閉或刷新時，Firebase 會自動把這個人從資料庫踢掉
            onDisconnect(myRef).remove();

            document.getElementById('my-name-display').innerText = `我: ${myName}`;
            switchScreen('screen-lobby');
        };

        onValue(roomRef, (snapshot) => {
            const data = snapshot.val();
            if(!data) return;

            const playersMap = data.players || {};
            // 如果我不在名單裡（例如被踢了，或刷新頁面後ID變了），強制回到登入頁
            // 但如果剛登入還沒寫入完成，則忽略
            if (document.getElementById('screen-login').classList.contains('active') === false) {
                 if (!playersMap[myId]) {
                     alert('你已斷線，請重新登入');
                     location.reload();
                     return;
                 }
            }

            const playerList = Object.keys(playersMap).map(key => ({ id: key, ...playersMap[key] }));
            
            if (data.status === 'playing') {
                if(!document.getElementById('screen-game').classList.contains('active')){
                    switchScreen('screen-game');
                    if(myHand.length === 0) dealCardsToSelf(7);
                }
                updateGameUI(data, playerList);
            } else if (data.status === 'finished') {
                document.getElementById('winner-name').innerText = data.winnerName || "???";
                switchScreen('screen-gameover');
                myHand = [];
            } else {
                updateLobbyUI(playerList);
                if(document.getElementById('screen-game').classList.contains('active') || document.getElementById('screen-gameover').classList.contains('active')) {
                     switchScreen('screen-lobby');
                }
            }
        });

        function updateLobbyUI(playerList) {
            const listDiv = document.getElementById('player-list');
            listDiv.innerHTML = playerList.map(p => 
                `<div class="player-row ${p.id === myId ? 'me' : ''}">
                    <span>${p.name}</span> ${p.id === playerList[0].id ? '<span class="host">★房主</span>' : ''}
                </div>`
            ).join('');

            // V5 邏輯：如果你是名單上的第一位，你就是房主
            if (playerList.length > 0 && playerList[0].id === myId) {
                document.getElementById('btn-start').style.display = 'block';
                document.getElementById('lobby-msg').innerText = "你是房主，等人齊了就按開始";
            } else {
                document.getElementById('btn-start').style.display = 'none';
                document.getElementById('lobby-msg').innerText = "等待房主開始遊戲...";
            }
        }

        window.startGame = function() {
            onValue(ref(db, `rooms/${ROOM_ID}/players`), (snap) => {
                const pMap = snap.val();
                const pIds = Object.keys(pMap);
                let startCard;
                do { startCard = allCards[Math.floor(Math.random() * allCards.length)]; } while (startCard.action);

                update(roomRef, {
                    status: 'playing',
                    order: pIds,
                    currentTurnIndex: 0,
                    topCard: startCard,
                    msg: "遊戲開始！",
                    winnerName: null
                });
            }, { onlyOnce: true });
        };

        function dealCardsToSelf(num) {
            myHand = [];
            for(let i=0; i<num; i++) {
                myHand.push(allCards[Math.floor(Math.random() * allCards.length)]);
            }
            renderHand();
        }

        function updateGameUI(data, playerList) {
            currentTopCard = data.topCard;
            playerOrder = data.order || [];
            document.getElementById('table-slot').innerHTML = createCardHTML(currentTopCard);

            // 防呆：如果有人斷線，playerOrder 裡可能有舊 ID，需要過濾
            const validPlayerOrder = playerOrder.filter(id => playerList.find(p => p.id === id));
            
            // 找出現在輪到誰的 ID
            // 注意：這裡如果有人斷線，Index 可能會錯位，簡易版暫時依賴 Firebase 的 Index
            // 進階版應該要動態計算 active player
            const currentPlayerId = playerOrder[data.currentTurnIndex];
            const currentPlayer = playerList.find(p => p.id === currentPlayerId);
            
            const msgDiv = document.getElementById('turn-msg');
            const drawBtn = document.getElementById('btn-draw');

            isMyTurn = (currentPlayerId === myId);

            if (isMyTurn) {
                msgDiv.innerText = data.msg.includes("跳過") ? data.msg + " -> 輪到你了！" : "👉 輪到你了！請出牌";
                msgDiv.classList.add('active-turn');
                drawBtn.style.opacity = "1"; drawBtn.style.pointerEvents = "auto";
                if(navigator.vibrate) navigator.vibrate(200);
            } else {
                msgDiv.innerText = `⏳ 輪到 ${currentPlayer ? currentPlayer.name : "..."} (${data.msg})`;
                msgDiv.classList.remove('active-turn');
                drawBtn.style.opacity = "0.5"; drawBtn.style.pointerEvents = "none";
            }
        }

        window.tryPlayCard = function(cardId) {
            if (!isMyTurn) return;

            const cardIndex = myHand.findIndex(c => c.id === cardId);
            const selectedCard = myHand[cardIndex];

            if (selectedCard.c !== currentTopCard.c && selectedCard.p !== currentTopCard.p) {
                alert(`不能出這張！\n需要符合顏色或週期`);
                return;
            }

            myHand.splice(cardIndex, 1);
            renderHand();

            if (myHand.length === 0) {
                update(roomRef, {
                    status: 'finished',
                    winnerName: myName,
                    msg: `${myName} 贏得了勝利！`
                });
                return;
            }

            onValue(ref(db, `rooms/${ROOM_ID}/currentTurnIndex`), (snap) => {
                let currentIndex = snap.val() || 0;
                let jump = 1;
                let msgAction = "";

                if (selectedCard.action === 'skip') {
                    jump = 2;
                    msgAction = "(下家被跳過!)";
                }

                let nextIndex = (currentIndex + jump) % playerOrder.length;
                
                update(roomRef, {
                    topCard: selectedCard,
                    currentTurnIndex: nextIndex,
                    msg: `${myName} 出了 ${selectedCard.n} ${msgAction}`
                });
            }, { onlyOnce: true });
        };

        window.drawCardAction = function() {
            const newCard = allCards[Math.floor(Math.random() * allCards.length)];
            myHand.push(newCard);
            renderHand();

            onValue(ref(db, `rooms/${ROOM_ID}/currentTurnIndex`), (snap) => {
                const currentIndex = snap.val() || 0;
                const nextIndex = (currentIndex + 1) % playerOrder.length;
                update(roomRef, {
                    currentTurnIndex: nextIndex,
                    msg: `${myName} 抽了一張牌`
                });
            }, { onlyOnce: true });
        };

        window.backToLobby = function() {
             onValue(ref(db, `rooms/${ROOM_ID}/players`), (snap) => {
                 const pMap = snap.val();
                 const pIds = Object.keys(pMap);
                 if(pIds.length > 0 && pIds[0] === myId) {
                     update(roomRef, { status: 'waiting', msg: '等待新賽局' });
                 } else {
                      switchScreen('screen-lobby');
                 }
             }, { onlyOnce: true });
        }

        function createCardHTML(card, isClickable = false) {
             let actionBadge = card.action ? `<span class="action-badge">${card.action.toUpperCase()}</span>` : '';
             return `
            <div class="card ${card.c}" ${isClickable ? `onclick="window.tryPlayCard('${card.id}')"` : ''}>
                <span class="atomic">${card.at}</span>
                <span class="symbol">${card.s}</span>
                <span class="name">${card.name || card.n}</span>
                ${actionBadge}
            </div>`;
        }

        function renderHand() {
            document.getElementById('hand-area').innerHTML = myHand.map(card => createCardHTML(card, true)).join('');
        }

        document.querySelector('h1').ondblclick = function() {
            if(confirm('房主專用：重置房間？')) { remove(roomRef); location.reload(); }
        }
    </script>
</body>
</html>
