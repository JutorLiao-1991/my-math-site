<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>鳩特數理：元素大對決</title>
<style>
  :root { 
    --p1-color: #FF7043; --p1-bg: #FBE9E7;
    --p2-color: #42A5F5; --p2-bg: #E3F2FD;
    --bg-pattern: radial-gradient(#ccc 15%, transparent 16%) 0 0;
  }

  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden;
    font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif;
    background-color: #333;
    touch-action: none; user-select: none; -webkit-user-select: none;
  }

  /* === 倒數計時遮罩 === */
  #countdown-overlay {
      display: none;
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.9); z-index: 2000;
      flex-direction: column; justify-content: center; align-items: center;
      color: white;
  }
  .countdown-number { font-size: 10em; font-weight: 900; color: #FFD700; animation: popIn 0.5s infinite alternate; }
  .countdown-text { font-size: 2.5em; margin-bottom: 20px; font-weight: bold;}

  /* === 全局容器 === */
  #main-wrapper { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; }

  /* ==================== 1. 設定畫面 (選角 + 選難度) ==================== */
  #setup-screen {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: #fff; z-index: 1000; display: flex; flex-direction: column;
  }
  .setup-half {
    flex: 1; display: flex; flex-direction: column;
    justify-content: center; align-items: center; padding: 10px;
    background-size: 20px 20px; position: relative;
  }
  .setup-top { background-color: var(--p1-bg); background-image: var(--bg-pattern); transform: rotate(180deg); border-bottom: 4px solid #aaa; }
  .setup-bottom { background-color: var(--p2-bg); background-image: var(--bg-pattern); border-top: 4px solid #aaa; }
  
  .choose-title { font-size: 1.2em; font-weight: bold; margin-bottom: 10px; background: rgba(255,255,255,0.8); padding: 5px 15px; border-radius: 20px; }
  
  /* 頭像 Grid */
  .avatar-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .avatar-option {
    font-size: 2.5em; width: 60px; height: 60px;
    display: flex; justify-content: center; align-items: center;
    background: white; border-radius: 50%; border: 3px solid transparent;
    transition: transform 0.1s; box-shadow: 0 3px 5px rgba(0,0,0,0.1);
  }
  .avatar-option.selected { border-color: #FFD700; background-color: #FFF8E1; transform: scale(1.1); box-shadow: 0 0 15px #FFD700; }

  /* 難度選擇區塊 (覆蓋在中間) */
  #difficulty-selector {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: white; padding: 20px; border-radius: 20px;
    box-shadow: 0 0 30px rgba(0,0,0,0.5); z-index: 1500;
    text-align: center; width: 80%; max-width: 300px;
    border: 5px solid #333;
  }
  #difficulty-selector h2 { margin: 0 0 15px 0; color: #333; }
  
  .diff-btn {
    display: block; width: 100%; padding: 15px; margin-bottom: 10px;
    border: none; border-radius: 10px; font-size: 1.2em; font-weight: bold;
    cursor: pointer; transition: 0.2s; color: white;
  }
  .diff-basic { background: #4CAF50; box-shadow: 0 4px 0 #2E7D32; }
  .diff-basic:active { transform: translateY(4px); box-shadow: none; }
  
  .diff-scholar { background: #9C27B0; box-shadow: 0 4px 0 #6A1B9A; }
  .diff-scholar:active { transform: translateY(4px); box-shadow: none; }

  /* ==================== 2. 遊戲主畫面 ==================== */
  #game-container { display: none; flex-direction: column; height: 100%; width: 100%; }
  .player-area {
    flex: 1; position: relative; display: flex; flex-direction: column;
    justify-content: center; align-items: center; padding: 10px;
    background-size: 20px 20px; transition: all 0.3s;
  }

  /* 分數與連對 */
  .score-board {
    position: absolute; top: 15px; left: 15px; font-size: 1.6em; font-weight: 800;
    background: #fff; padding: 5px 15px; border-radius: 30px;
    box-shadow: 0 4px 0 rgba(0,0,0,0.1); display: flex; align-items: center; gap: 8px; z-index: 10;
  }
  .streak-container {
    font-size: 0.8em; margin-left: 5px; display: flex; align-items: center; 
    color: #FF9800; opacity: 0; transition: opacity 0.3s;
  }
  .streak-container.active { opacity: 1; }
  .streak-icon { margin-right: 2px; animation: burn 0.5s infinite alternate; }
  @keyframes burn { from {transform: scale(1);} to {transform: scale(1.2);} }

  /* --- 新增：逆轉提示訊息樣式 --- */
  .catchup-msg {
    display: none; /* 預設隱藏 */
    background: #FF5252; color: white;
    padding: 8px 20px; border-radius: 25px;
    font-weight: 900; font-size: 1.1rem;
    margin-top: 15px;
    box-shadow: 0 0 10px rgba(255, 82, 82, 0.6);
    animation: pulse-msg 0.8s infinite alternate;
  }
  @keyframes pulse-msg { from { transform: scale(1); } to { transform: scale(1.05); } }

  /* 題目顯示 (超大字) */
  .status-display-area {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%;
  }
  .question-text {
      font-size: 5em; font-weight: 900; color: #333; 
      text-shadow: 3px 3px 0px rgba(255,255,255,0.5);
      animation: popInQ 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      text-align: center;
  }
  @keyframes popInQ { from {transform: scale(0); opacity: 0;} to {transform: scale(1); opacity: 1;} }

  #player-top { background-color: var(--p1-bg); background-image: var(--bg-pattern); transform: rotate(180deg); border-bottom: 2px solid #555; color: #D84315; }
  #player-top .score-board { color: #D84315; border: 3px solid #FFAB91; }

  #player-bottom { background-color: var(--p2-bg); background-image: var(--bg-pattern); border-top: 2px solid #555; color: #0277BD; }
  #player-bottom .score-board { color: #0277BD; border: 3px solid #81D4FA; }

  /* 選項面板 */
  .options-panel {
    display: flex; width: 98%; flex-wrap: wrap; justify-content: center; gap: 8px; padding: 5px; margin-bottom: 10px;
  }
  
  .opt-btn {
    background: #fff; border: 3px solid #eee; border-radius: 12px;
    width: 48%; height: 65px; 
    font-size: 1.8em; font-weight: bold; color: #444;
    cursor: pointer; box-shadow: 0 5px 0 #ddd;
    transition: all 0.1s; font-family: 'Arial', sans-serif;
    display: flex; justify-content: center; align-items: center;
  }
  .opt-btn:active { transform: translateY(5px); box-shadow: 0 0 0 #ddd; }
  
  .correct { background-color: #C8E6C9 !important; border-color: #4CAF50 !important; color: #1B5E20 !important; box-shadow: 0 5px 0 #81C784 !important;}
  .wrong { background-color: #FFCDD2 !important; border-color: #E57373 !important; color: #B71C1C !important; box-shadow: 0 5px 0 #E57373 !important;}

  /* 遊戲結束 */
  .game-over-overlay {
    display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(255,255,255,0.95); z-index: 50; flex-direction: column;
    justify-content: center; align-items: center; text-align: center; animation: popIn 0.5s ease;
  }
  .end-title { font-size: 3em; font-weight: 900; margin-bottom: 10px; text-transform: uppercase; }
  .end-emoji { font-size: 6em; margin-bottom: 20px; display: block; }
  .winner-text { color: #FFD700; text-shadow: 2px 2px 0 #E65100; }
  .loser-text { color: #78909C; }

  /* --- 中控台 (Control Center) --- */
  #control-center {
    height: 50px; background-color: #333; 
    display: flex; justify-content: space-between; align-items: center; 
    z-index: 100; color: white; padding: 0 10px; 
    box-shadow: 0 0 15px rgba(0,0,0,0.5); flex-shrink: 0;
  }
  
  #status-text { 
    font-size: 1.1em; font-weight: bold; text-align: center; color: #fff; flex: 1;
  }

  .control-btn {
    background: #555; color: white; border: 1px solid #777;
    padding: 5px 12px; border-radius: 20px; text-decoration: none;
    font-size: 0.85rem; font-weight: bold; white-space: nowrap;
    cursor: pointer; display: flex; align-items: center; gap: 5px;
  }
  
  #main-game-btn {
      background: #FFEB3B; color: #333; border: none; box-shadow: 0 2px 0 #FBC02D; display: none; 
  }

</style>
</head>
<body>

  <div id="countdown-overlay">
      <div class="countdown-text" id="cd-text">Ready</div>
      <div class="countdown-number" id="cd-num">3</div>
  </div>

  <div id="main-wrapper">

    <div id="setup-screen">
      <div id="difficulty-selector">
        <h2>請選擇難度</h2>
        <button class="diff-btn diff-basic" onclick="startGame(true)">國中基礎版</button>
        <button class="diff-btn diff-scholar" onclick="startGame(false)">學霸挑戰版</button>
      </div>

      <div class="setup-half setup-top">
        <div class="choose-title">Player 1 角色</div>
        <div class="avatar-grid" id="grid-top"></div>
      </div>
      <div class="setup-half setup-bottom">
        <div class="choose-title">Player 2 角色</div>
        <div class="avatar-grid" id="grid-bottom"></div>
      </div>
    </div>

    <div id="game-container">
      
      <div id="player-top" class="player-area">
        <div class="score-board">
            <span id="p1-avatar-display">🦊</span>&nbsp;<span id="score-top">0</span>
            <div id="streak-top" class="streak-container"><span class="streak-icon">🔥</span><span id="streak-num-top">0</span></div>
        </div>
        <div id="end-top" class="game-over-overlay">
            <div class="end-emoji">🏆</div><div class="end-title">Winner</div>
        </div>
        
        <div id="status-top" class="status-display-area">
            <div class="question-text" id="q-text-top">H</div>
            <div class="catchup-msg" id="catchup-top">別放棄！你現在一題40分！</div>
        </div>
        <div id="opts-top" class="options-panel"></div>
      </div>

      <div id="control-center">
        <a href="../../index.html" class="control-btn">⬅ 回首頁</a>
        <div id="status-text">準備對戰</div>
        <button id="main-game-btn" class="control-btn" onclick="resetGame()">再來一局 🔄</button>
      </div>

      <div id="player-bottom" class="player-area">
        <div class="score-board">
            <span id="p2-avatar-display">🐰</span>&nbsp;<span id="score-bottom">0</span>
            <div id="streak-bottom" class="streak-container"><span class="streak-icon">🔥</span><span id="streak-num-bottom">0</span></div>
        </div>
        <div id="end-bottom" class="game-over-overlay">
            <div class="end-emoji">🏆</div><div class="end-title">Winner</div>
        </div>

        <div id="status-bottom" class="status-display-area">
            <div class="question-text" id="q-text-bottom">H</div>
            <div class="catchup-msg" id="catchup-bottom">別放棄！你現在一題40分！</div>
        </div>
        <div id="opts-bottom" class="options-panel"></div>
      </div>
    </div>

  </div>

  <script>
    document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
    document.addEventListener('dblclick', function (e) { e.preventDefault(); }, { passive: false });

    // === 資料庫 ===
    const allElements = [
        { s: 'H', z: '氫', isBasic: true }, { s: 'He', z: '氦', isBasic: true },
        { s: 'Li', z: '鋰', isBasic: true }, { s: 'Be', z: '鈹', isBasic: true },
        { s: 'B', z: '硼', isBasic: true }, { s: 'C', z: '碳', isBasic: true },
        { s: 'N', z: '氮', isBasic: true }, { s: 'O', z: '氧', isBasic: true },
        { s: 'F', z: '氟', isBasic: true }, { s: 'Ne', z: '氖', isBasic: true },
        { s: 'Na', z: '鈉', isBasic: true }, { s: 'Mg', z: '鎂', isBasic: true },
        { s: 'Al', z: '鋁', isBasic: true }, { s: 'Si', z: '矽', isBasic: true },
        { s: 'P', z: '磷', isBasic: true }, { s: 'S', z: '硫', isBasic: true },
        { s: 'Cl', z: '氯', isBasic: true }, { s: 'Ar', z: '氬', isBasic: true },
        { s: 'K', z: '鉀', isBasic: true }, { s: 'Ca', z: '鈣', isBasic: true },
        { s: 'Fe', z: '鐵', isBasic: true }, { s: 'Cu', z: '銅', isBasic: true },
        { s: 'Zn', z: '鋅', isBasic: true }, { s: 'Ag', z: '銀', isBasic: true },
        { s: 'Au', z: '金', isBasic: true }, { s: 'Hg', z: '汞', isBasic: true },
        { s: 'Br', z: '溴', isBasic: true }, { s: 'I', z: '碘', isBasic: true },
        { s: 'Ti', z: '鈦', isBasic: false }, { s: 'Cr', z: '鉻', isBasic: false },
        { s: 'Mn', z: '錳', isBasic: false }, { s: 'Ni', z: '鎳', isBasic: false },
        { s: 'As', z: '砷', isBasic: false }, { s: 'Kr', z: '氪', isBasic: false },
        { s: 'Rb', z: '銣', isBasic: false }, { s: 'Sr', z: '鍶', isBasic: false },
        { s: 'Cd', z: '鎘', isBasic: false }, { s: 'Sn', z: '錫', isBasic: false },
        { s: 'Xe', z: '氙', isBasic: false }, { s: 'Cs', z: '銫', isBasic: false },
        { s: 'Ba', z: '鋇', isBasic: false }, { s: 'W', z: '鎢', isBasic: false },
        { s: 'Pt', z: '鉑', isBasic: false }, { s: 'Pb', z: '鉛', isBasic: false },
        { s: 'At', z: '砈', isBasic: false }, { s: 'Rn', z: '氡', isBasic: false },
        { s: 'Fr', z: '鍅', isBasic: false }, { s: 'Ra', z: '鐳', isBasic: false },
        { s: 'U', z: '鈾', isBasic: false }
    ];

    // 變數
    const emojiOptions = ['🦊', '🐰', '🦁', '🐯', '🐹', '🐨', '🐼', '🐵'];
    let p1Avatar = '🦊'; let p2Avatar = '🐰'; 
    let activeElements = []; 
    let currentQ = null;
    let gameState = 'idle'; 
    let scores = { top: 0, bottom: 0 };
    let streaks = { top: 0, bottom: 0 };
    let isProcessingAnswer = false; 
    const WIN_SCORE = 300; 

    // DOM
    const optsTop = document.getElementById('opts-top');
    const optsBottom = document.getElementById('opts-bottom');
    const qTextTop = document.getElementById('q-text-top');
    const qTextBottom = document.getElementById('q-text-bottom');
    const statusText = document.getElementById('status-text');
    const mainGameBtn = document.getElementById('main-game-btn');
    const cdOverlay = document.getElementById('countdown-overlay');
    const cdText = document.getElementById('cd-text');
    const cdNum = document.getElementById('cd-num');
    
    // 逆轉提示
    const catchupTop = document.getElementById('catchup-top');
    const catchupBottom = document.getElementById('catchup-bottom');

    // 初始化選角
    function initSetup() {
      renderGrid('grid-top', 'top');
      renderGrid('grid-bottom', 'bottom');
    }

    function renderGrid(elementId, player) {
      const container = document.getElementById(elementId);
      emojiOptions.forEach(emoji => {
          const div = document.createElement('div');
          div.className = 'avatar-option'; div.innerText = emoji;
          if(player === 'top' && emoji === p1Avatar) div.classList.add('selected');
          if(player === 'bottom' && emoji === p2Avatar) div.classList.add('selected');

          div.onclick = () => {
              const siblings = container.children;
              for(let sib of siblings) sib.classList.remove('selected');
              div.classList.add('selected');
              if(player === 'top') p1Avatar = emoji; else p2Avatar = emoji;
          };
          container.appendChild(div);
      });
    }

    // === 開始遊戲 ===
    function startGame(isBasicMode) {
        if (isBasicMode) {
            activeElements = allElements.filter(el => el.isBasic);
            statusText.innerText = "難度：國中基礎";
        } else {
            activeElements = allElements; 
            statusText.innerText = "難度：學霸挑戰";
        }

        document.getElementById('setup-screen').style.display = 'none';
        document.getElementById('game-container').style.display = 'flex';
        document.getElementById('p1-avatar-display').innerText = p1Avatar;
        document.getElementById('p2-avatar-display').innerText = p2Avatar;

        runCountdown(3, "準備背誦！", startQuestionLoop);
    }

    function runCountdown(seconds, label, callback) {
        cdOverlay.style.display = 'flex';
        cdText.innerText = label;
        let count = seconds;
        cdNum.innerText = count;

        const timer = setInterval(() => {
            count--;
            if (count > 0) {
                cdNum.innerText = count;
            } else {
                clearInterval(timer);
                cdOverlay.style.display = 'none';
                if(callback) callback();
            }
        }, 1000);
    }

    // === 出題 ===
    function startQuestionLoop() {
        if(gameState === 'ended') return;

        const target = activeElements[Math.floor(Math.random() * activeElements.length)];
        // 0=看符號選中文, 1=看中文選符號
        const type = Math.random() > 0.5 ? 0 : 1;
        
        let questionDisplay = (type === 0) ? target.s : target.z; 
        let answerText = (type === 0) ? target.z : target.s;      
        
        let options = [target];
        while (options.length < 4) {
            const wrong = activeElements[Math.floor(Math.random() * activeElements.length)];
            if (!options.includes(wrong)) {
                options.push(wrong);
            }
        }
        options.sort(() => Math.random() - 0.5); 

        currentQ = {
            target: target,
            type: type,
            ansText: answerText,
            options: options
        };

        gameState = 'answering';
        isProcessingAnswer = false;
        
        qTextTop.innerText = questionDisplay;
        qTextBottom.innerText = questionDisplay;
        
        generateOptions(optsTop, 'top');
        generateOptions(optsBottom, 'bottom');
    }

    function generateOptions(container, player) {
        container.innerHTML = '';
        currentQ.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'opt-btn';
            btn.innerText = (currentQ.type === 0) ? opt.z : opt.s;
            btn.onclick = () => checkAnswer(player, opt, btn);
            container.appendChild(btn);
        });
    }

    // === 判斷答案 (包含逆轉邏輯) ===
    function checkAnswer(player, selectedOpt, btn) {
        if (isProcessingAnswer) return;
        isProcessingAnswer = true;

        const isCorrect = (selectedOpt === currentQ.target);
        
        // 計算分差，判斷是否落後超過 100
        const opponent = player === 'top' ? 'bottom' : 'top';
        const gap = scores[opponent] - scores[player];
        const isCatchingUp = gap > 100;

        if (isCorrect) {
            btn.classList.add('correct');
            
            // 計分邏輯
            let addScore = 10; 
            
            if (isCatchingUp) {
                // 落後超過 100 分，強制 40 分
                addScore = 40;
                statusText.innerText = "⚡ 逆轉衝刺！ +40";
            } else {
                // 正常狀況
                streaks[player]++;
                if (streaks[player] >= 3) {
                    addScore = 20; 
                    statusText.innerText = `🔥 ${player==='top'?p1Avatar:p2Avatar} 連對加分！`;
                } else {
                    statusText.innerText = "⭕ 答對了！";
                }
            }
            
            scores[player] += addScore;

        } else {
            btn.classList.add('wrong');
            streaks[player] = 0; 
            scores[player] = Math.max(0, scores[player] - 10); 
            statusText.innerText = "❌ 答錯了...";
            
            const siblings = btn.parentElement.children;
            for(let child of siblings) {
                if(child.innerText === currentQ.ansText) child.classList.add('correct');
            }
        }

        updateUI();

        if (scores[player] >= WIN_SCORE) {
            setTimeout(() => showGameOver(player), 1000);
        } else {
            setTimeout(() => {
                startQuestionLoop();
            }, 1000); 
        }
    }

    // 更新 UI (包含逆轉提示)
    function updateUI() {
        document.getElementById('score-top').innerText = scores.top;
        document.getElementById('score-bottom').innerText = scores.bottom;
        updateStreak('top');
        updateStreak('bottom');
        
        // 逆轉提示顯示邏輯
        // Top 落後 > 100 -> 顯示 top 提示
        if (scores.bottom - scores.top > 100) {
            catchupTop.style.display = 'block';
        } else {
            catchupTop.style.display = 'none';
        }
        
        // Bottom 落後 > 100 -> 顯示 bottom 提示
        if (scores.top - scores.bottom > 100) {
            catchupBottom.style.display = 'block';
        } else {
            catchupBottom.style.display = 'none';
        }
    }

    function updateStreak(player) {
        const div = document.getElementById(`streak-${player}`);
        const num = document.getElementById(`streak-num-${player}`);
        const count = streaks[player];
        num.innerText = count;
        if(count >= 3) div.classList.add('active');
        else div.classList.remove('active');
    }

    function showGameOver(winner) {
        gameState = 'ended';
        const endTop = document.getElementById('end-top');
        const endBottom = document.getElementById('end-bottom');
        
        if(winner === 'top') {
            setupEndScreen(endTop, true); setupEndScreen(endBottom, false);
            statusText.innerText = `🏆 ${p1Avatar} 獲勝！`;
        } else {
            setupEndScreen(endBottom, true); setupEndScreen(endTop, false);
            statusText.innerText = `🏆 ${p2Avatar} 獲勝！`;
        }

        endTop.style.display = 'flex'; endBottom.style.display = 'flex';
        mainGameBtn.style.display = 'block'; 
    }

    function setupEndScreen(element, isWinner) {
        const title = element.querySelector('.end-title');
        const emoji = element.querySelector('.end-emoji');
        if(isWinner) {
            title.innerText = "Winner"; title.className = "end-title winner-text"; emoji.innerText = "🏆"; 
        } else {
            title.innerText = "Try Again"; title.className = "end-title loser-text"; emoji.innerText = "💪";
        }
    }

    function resetGame() {
        scores = { top: 0, bottom: 0 };
        streaks = { top: 0, bottom: 0 };
        updateUI();
        document.getElementById('end-top').style.display = 'none';
        document.getElementById('end-bottom').style.display = 'none';
        mainGameBtn.style.display = 'none';
        
        document.getElementById('game-container').style.display = 'none';
        document.getElementById('setup-screen').style.display = 'flex';
    }

    initSetup();
  </script>
