<!DOCTYPE html>
<html lang="zh-TW">
<head>

    <style>
        body {
            margin: 0; padding: 0;
            font-family: 'Segoe UI', sans-serif;
            background-color: #f8fafc;
            color: #334155;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        h1 { font-size: 3rem; margin-bottom: 20px; color: #e11d48; }

            font-size: 1.2rem;
            border: none;
            border-radius: 50px;

            transition: 0.3s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .btn-back:hover {
            background: #334155;
            transform: translateY(-2px);
