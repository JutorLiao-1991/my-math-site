<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>鳩特數理：元素PK競技場</title>
<style>
  :root { 
    --p1-color: #FF7043; --p1-bg: #FBE9E7;
    --p2-color: #42A5F5; --p2-bg: #E3F2FD;
    --bg-pattern: radial-gradient(#ccc 15%, transparent 16%) 0 0;
  }

  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden;
    font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif;
    background-color: #333;
    touch-action: none; /* 禁止手勢縮放 */
    user-select: none; -webkit-user-select: none;
  }

  /* === 懸浮回首頁按鈕 === */
  .home-btn-fixed {
      position: fixed; top: 15px; left: 15px; z-index: 2000;
      text-decoration: none; color: #333; background: rgba(255, 255, 255, 0.9);
      padding: 10px 15px; border-radius: 30px; font-weight: bold;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3); font-size: 1.2rem; border: 2px solid #fff;
  }

  /* === 難度選擇遮罩 === */
  #difficulty-screen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.9); z-index: 2000;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      color: white; gap: 30px;
  }
  .diff-title { font-size: 2rem; font-weight: bold; margin-bottom: 20px; }
  .diff-btn {
      padding: 20px 40px; font-size: 1.5rem; border: none; border-radius: 50px;
      font-weight: bold; cursor: pointer; transition: transform 0.2s;
      width: 80%; max-width: 300px; color: white;
      box-shadow: 0 0 15px rgba(255,255,255,0.2);
  }
  .diff-btn:active { transform: scale(0.95); }
  .btn-basic { background: linear-gradient(45deg, #4CAF50, #8BC34A); }
  .btn-scholar { background: linear-gradient(45deg, #FF5252, #FF1744); }

  /* === 倒數計時遮罩 === */
  #countdown-overlay {
      display: none;
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8); z-index: 1500;
      flex-direction: column; justify-content: center; align-items: center;
      color: white;
  }
  .countdown-number { font-size: 10em; font-weight: 900; color: #FFD700; animation: popIn 0.5s infinite alternate; text-shadow: 0 0 20px rgba(255, 215, 0, 0.5); }
  .countdown-text { font-size: 2.5em; margin-bottom: 20px; font-weight: bold;}

  /* === 全局容器 === */
  #main-wrapper { position: relative; width: 100%; height: 100%; }

  /* ==================== 1. 角色選擇 ==================== */
  #setup-screen {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: #fff; z-index: 999; display: none; /* 初始隱藏，選完難度才顯示 */
    flex-direction: column;
  }
  .setup-half {
    flex: 1; display: flex; flex-direction: column;
    justify-content: center; align-items: center; padding: 20px;
    background-size: 20px 20px; position: relative;
  }
  .setup-top { background-color: var(--p1-bg); background-image: var(--bg-pattern); transform: rotate(180deg); border-bottom: 4px solid #aaa; }
  .setup-bottom { background-color: var(--p2-bg); background-image: var(--bg-pattern); border-top: 4px solid #aaa; }
  
  .choose-title { font-size: 1.5em; font-weight: bold; margin-bottom: 15px; background: rgba(255,255,255,0.8); padding: 5px 20px; border-radius: 20px; }
  
  /* 2x4 Grid */
  .avatar-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
  .avatar-option {
    font-size: 3em; width: 70px; height: 70px;
    display: flex; justify-content: center; align-items: center;
    background: white; border-radius: 50%; border: 4px solid transparent;
    transition: transform 0.1s; box-shadow: 0 3px 5px rgba(0,0,0,0.1);
  }
  .avatar-option:active { transform: scale(0.9); }
  .avatar-option.selected { border-color: #FFD700; background-color: #FFF8E1; transform: scale(1.1); box-shadow: 0 0 15px #FFD700; }

  #start-game-btn {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1000;
    padding: 15px 50px; font-size: 1.8em; font-weight: 900; color: white;
    background: linear-gradient(45deg, #2196F3, #21CBF3);
    border: 5px solid #fff; border-radius: 50px; box-shadow: 0 0 25px rgba(0,0,0,0.3);
    animation: pulse 1.5s infinite; cursor: pointer;
  }
  @keyframes pulse { 0% {transform: translate(-50%, -50%) scale(1);} 50% {transform: translate(-50%, -50%) scale(1.05);} }

  /* ==================== 2. 遊戲主畫面 ==================== */
  #game-container { display: none; flex-direction: column; height: 100%; width: 100%; }
  .player-area {
    flex: 1; position: relative; display: flex; flex-direction: column;
    justify-content: center; align-items: center; padding: 10px;
    background-size: 20px 20px; transition: all 0.3s;
  }

  /* 分數板與連對顯示 */
  .score-board {
    position: absolute; top: 20px; left: 20px; font-size: 1.8em; font-weight: 800;
    background: #fff; padding: 8px 20px; border-radius: 30px;
    box-shadow: 0 4px 0 rgba(0,0,0,0.1); display: flex; align-items: center; gap: 10px;
  }
  .streak-container {
    font-size: 0.8em; margin-left: 10px; display: flex; align-items: center; 
    color: #FF9800; opacity: 0; transition: opacity 0.3s;
  }
  .streak-container.active { opacity: 1; }
  .streak-icon { margin-right: 5px; animation: burn 0.5s infinite alternate; }
  @keyframes burn { from {transform: scale(1);} to {transform: scale(1.2);} }

  /* 題目顯示區域 */
  .status-display-area {
      flex: 1; display: flex; align-items: center; justify-content: center; width: 100%;
  }
  .question-text {
      font-size: 5em; font-weight: 900; color: #333; 
      text-shadow: 3px 3px 0px rgba(255,255,255,0.5);
      font-family: 'Segoe UI', sans-serif;
      animation: popInQ 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  @keyframes popInQ { from {transform: scale(0); opacity: 0;} to {transform: scale(1); opacity: 1;} }

  #player-top { background-color: var(--p1-bg); background-image: var(--bg-pattern); transform: rotate(180deg); border-bottom: 5px solid #555; color: #D84315; }
  #player-top .score-board { color: #D84315; border: 3px solid #FFAB91; }

  #player-bottom { background-color: var(--p2-bg); background-image: var(--bg-pattern); border-top: 5px solid #555; color: #0277BD; }
  #player-bottom .score-board { color: #0277BD; border: 3px solid #81D4FA; }

  /* 選項面板 */
  .options-panel {
    display: flex; width: 98%; flex-wrap: wrap; justify-content: center; gap: 15px; padding: 10px;
  }
  
  .opt-btn {
    background: #fff; border: 4px solid #eee; border-radius: 20px;
    min-width: 40%; height: 80px; flex: 1;
    font-size: 2em; font-weight: bold; color: #444;
    cursor: pointer; box-shadow: 0 6px 0 #ddd;
    transition: all 0.1s; font-family: 'Segoe UI', sans-serif;
    display: flex; justify-content: center; align-items: center;
  }
  .opt-btn:active { transform: translateY(6px); box-shadow: 0 0 0 #ddd; }
  
  .correct { background-color: #C8E6C9 !important; border-color: #4CAF50 !important; color: #1B5E20 !important; box-shadow: 0 6px 0 #81C784 !important;}
  .wrong { background-color: #FFCDD2 !important; border-color: #E57373 !important; color: #B71C1C !important; box-shadow: 0 6px 0 #E57373 !important;}

  /* 遊戲結束 */
  .game-over-overlay {
    display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(255,255,255,0.95); z-index: 50; flex-direction: column;
    justify-content: center; align-items: center; text-align: center; animation: popIn 0.5s ease;
  }
  .end-title { font-size: 3em; font-weight: 900; margin-bottom: 10px; text-transform: uppercase; }
  .end-emoji { font-size: 6em; margin-bottom: 20px; display: block; }
  .winner-text { color: #FFD700; text-shadow: 2px 2px 0 #E65100; -webkit-text-stroke: 2px #E65100; }
  .loser-text { color: #78909C; }

  /* 中控台 */
  #control-center {
    height: 80px; background-color: #444; display: flex;
    justify-content: center; align-items: center; z-index: 100;
    color: white; padding: 0 20px; box-shadow: 0 0 15px rgba(0,0,0,0.5);
  }
  #status-text { font-size: 1.5em; font-weight: bold; text-align: center; color: #fff; }
  
  /* 重新開始按鈕 */
  #main-game-btn {
      background: #FFEB3B; color: #333; border: none; padding: 10px 30px;
      border-radius: 50px; font-size: 1.2em; font-weight: bold; box-shadow: 0 4px 0 #FBC02D;
      display: none; 
  }

</style>
</head>
<body>

  <a href="javascript:history.back()" class="home-btn-fixed">⬅ 回週期表</a>

  <div id="difficulty-screen">
      <div class="diff-title">請選擇挑戰難度</div>
      <button class="diff-btn btn-basic" onclick="chooseDifficulty('basic')">國中基礎版</button>
      <button class="diff-btn btn-scholar" onclick="chooseDifficulty('scholar')">學霸挑戰版</button>
  </div>

  <div id="countdown-overlay">
      <div class="countdown-text" id="cd-text">Ready</div>
      <div class="countdown-number" id="cd-num">5</div>
  </div>

  <div id="main-wrapper">

    <div id="setup-screen">
      <div class="setup-half setup-top">
        <div class="choose-title">Player 1 (上方) 請選角色</div>
        <div class="avatar-grid" id="grid-top"></div>
      </div>
      <button id="start-game-btn" onclick="initGameFlow()">開始 PK ▶</button>
      <div class="setup-half setup-bottom">
        <div class="choose-title">Player 2 (下方) 請選角色</div>
        <div class="avatar-grid" id="grid-bottom"></div>
      </div>
    </div>

    <div id="game-container">
      
      <div id="player-top" class="player-area">
        <div class="score-board">
            <span id="p1-avatar-display">🦊</span>&nbsp;<span id="score-top">0</span>
            <div id="streak-top" class="streak-container"><span class="streak-icon">🔥</span><span id="streak-num-top">0</span></div>
        </div>
        <div id="end-top" class="game-over-overlay">
            <div class="end-emoji">🏆</div><div class="end-title">Winner</div>
        </div>
        
        <div id="status-top" class="status-display-area">
            <div class="question-text" id="q-text-top"></div>
        </div>
        <div id="opts-top" class="options-panel"></div>
      </div>

      <div id="control-center">
        <div id="status-text">準備開始...</div>
        <button id="main-game-btn" onclick="restartGame()">重新開始 🔄</button>
      </div>

      <div id="player-bottom" class="player-area">
        <div class="score-board">
            <span id="p2-avatar-display">🐰</span>&nbsp;<span id="score-bottom">0</span>
            <div id="streak-bottom" class="streak-container"><span class="streak-icon">🔥</span><span id="streak-num-bottom">0</span></div>
        </div>
        <div id="end-bottom" class="game-over-overlay">
            <div class="end-emoji">🏆</div><div class="end-title">Winner</div>
        </div>

        <div id="status-bottom" class="status-display-area">
            <div class="question-text" id="q-text-bottom"></div>
        </div>
        <div id="opts-bottom" class="options-panel"></div>
      </div>
    </div>

  </div>

  <script>
    // === 防縮放 ===
    document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
    document.addEventListener('dblclick', function (e) { e.preventDefault(); }, { passive: false });

    // === 變數 ===
    const emojiOptions = ['👨‍🔬', '👩‍🔬', '🧪', '🧬', '⚛️', '🔥', '🔬', '🔭'];
    let p1Avatar = '👨‍🔬'; 
    let p2Avatar = '👩‍🔬'; 

    // === 完整元素資料庫 ===
    const allElements = [
        { n: 1, s: 'H', z: '氫', isBasic: true },
        { n: 2, s: 'He', z: '氦', isBasic: true },
        { n: 3, s: 'Li', z: '鋰', isBasic: true },
        { n: 4, s: 'Be', z: '鈹', isBasic: true },
        { n: 5, s: 'B', z: '硼', isBasic: true },
        { n: 6, s: 'C', z: '碳', isBasic: true },
        { n: 7, s: 'N', z: '氮', isBasic: true },
        { n: 8, s: 'O', z: '氧', isBasic: true },
        { n: 9, s: 'F', z: '氟', isBasic: true },
        { n: 10, s: 'Ne', z: '氖', isBasic: true },
        { n: 11, s: 'Na', z: '鈉', isBasic: true },
        { n: 12, s: 'Mg', z: '鎂', isBasic: true },
        { n: 13, s: 'Al', z: '鋁', isBasic: true },
        { n: 14, s: 'Si', z: '矽', isBasic: true },
        { n: 15, s: 'P', z: '磷', isBasic: true },
        { n: 16, s: 'S', z: '硫', isBasic: true },
        { n: 17, s: 'Cl', z: '氯', isBasic: true },
        { n: 18, s: 'Ar', z: '氬', isBasic: true },
        { n: 19, s: 'K', z: '鉀', isBasic: true },
        { n: 20, s: 'Ca', z: '鈣', isBasic: true },
        { n: 22, s: 'Ti', z: '鈦', isBasic: false },
        { n: 24, s: 'Cr', z: '鉻', isBasic: false },
        { n: 25, s: 'Mn', z: '錳', isBasic: false },
        { n: 26, s: 'Fe', z: '鐵', isBasic: true },
        { n: 28, s: 'Ni', z: '鎳', isBasic: false },
        { n: 29, s: 'Cu', z: '銅', isBasic: true },
        { n: 30, s: 'Zn', z: '鋅', isBasic: true },
        { n: 33, s: 'As', z: '砷', isBasic: false },
        { n: 35, s: 'Br', z: '溴', isBasic: true },
        { n: 36, s: 'Kr', z: '氪', isBasic: false },
        { n: 37, s: 'Rb', z: '銣', isBasic: false },
        { n: 38, s: 'Sr', z: '鍶', isBasic: false },
        { n: 47, s: 'Ag', z: '銀', isBasic: true },
        { n: 48, s: 'Cd', z: '鎘', isBasic: false },
        { n: 50, s: 'Sn', z: '錫', isBasic: false },
        { n: 53, s: 'I', z: '碘', isBasic: true },
        { n: 54, s: 'Xe', z: '氙', isBasic: false },
        { n: 55, s: 'Cs', z: '銫', isBasic: false },
        { n: 56, s: 'Ba', z: '鋇', isBasic: false },
        { n: 74, s: 'W', z: '鎢', isBasic: false },
        { n: 78, s: 'Pt', z: '鉑', isBasic: false },
        { n: 79, s: 'Au', z: '金', isBasic: true },
        { n: 80, s: 'Hg', z: '汞', isBasic: true },
        { n: 82, s: 'Pb', z: '鉛', isBasic: false },
        { n: 85, s: 'At', z: '砈', isBasic: false },
        { n: 86, s: 'Rn', z: '氡', isBasic: false },
        { n: 87, s: 'Fr', z: '鍅', isBasic: false },
        { n: 88, s: 'Ra', z: '鐳', isBasic: false },
        { n: 92, s: 'U', z: '鈾', isBasic: false }
    ];

    let synth = window.speechSynthesis;
    let currentQ = null;
    let gameState = 'idle'; 
    let scores = { top: 0, bottom: 0 };
    let streaks = { top: 0, bottom: 0 }; 
    let isProcessingAnswer = false; 
    const WIN_SCORE = 200; 
    let currentPool = []; // 根據難度過濾後的題庫

    // DOM 元素
    const optsTop = document.getElementById('opts-top');
    const optsBottom = document.getElementById('opts-bottom');
    const qTextTop = document.getElementById('q-text-top');
    const qTextBottom = document.getElementById('q-text-bottom');
    const statusText = document.getElementById('status-text');
    const mainGameBtn = document.getElementById('main-game-btn');
    const cdOverlay = document.getElementById('countdown-overlay');
    const cdText = document.getElementById('cd-text');
    const cdNum = document.getElementById('cd-num');
    const difficultyScreen = document.getElementById('difficulty-screen');
    const setupScreen = document.getElementById('setup-screen');

    // === 1. 難度選擇 ===
    function chooseDifficulty(level) {
        if(level === 'basic') {
            currentPool = allElements.filter(el => el.isBasic);
        } else {
            currentPool = allElements; // 學霸版包含全部
        }
        
        difficultyScreen.style.display = 'none';
        setupScreen.style.display = 'flex'; // 顯示角色選擇
        initSetup();
    }

    function initSetup() {
      renderGrid('grid-top', 'top');
      renderGrid('grid-bottom', 'bottom');
    }

    function renderGrid(elementId, player) {
      const container = document.getElementById(elementId);
      container.innerHTML = '';
      emojiOptions.forEach(emoji => {
          const div = document.createElement('div');
          div.className = 'avatar-option'; div.innerText = emoji;
          if(player === 'top' && emoji === p1Avatar) div.classList.add('selected');
          if(player === 'bottom' && emoji === p2Avatar) div.classList.add('selected');
          div.onclick = () => {
              const siblings = container.children;
              for(let sib of siblings) sib.classList.remove('selected');
              div.classList.add('selected');
              if(player === 'top') p1Avatar = emoji; else p2Avatar = emoji;
          };
          container.appendChild(div);
      });
    }

    // === 2. 遊戲核心 ===

    function initGameFlow() {
      document.getElementById('setup-screen').style.display = 'none';
      document.getElementById('game-container').style.display = 'flex';
      document.getElementById('p1-avatar-display').innerText = p1Avatar;
      document.getElementById('p2-avatar-display').innerText = p2Avatar;
      
      // 喚醒音效引擎 (只為了倒數)
      const wakeUp = new SpeechSynthesisUtterance(" ");
      wakeUp.volume = 0; 
      synth.speak(wakeUp);

      runCountdown(3, "Ready?", startQuestionLoop);
    }

    function runCountdown(seconds, label, callback) {
        cdOverlay.style.display = 'flex';
        cdText.innerText = label;
        let count = seconds;
        cdNum.innerText = count;
        
        // 倒數配音
        speakCountdown(count);

        const timer = setInterval(() => {
            count--;
            if (count > 0) {
                cdNum.innerText = count;
                speakCountdown(count);
            } else {
                clearInterval(timer);
                cdOverlay.style.display = 'none';
                if(callback) callback();
            }
        }, 1000);
    }

    function speakCountdown(num) {
        if(synth.speaking) synth.cancel();
        const u = new SpeechSynthesisUtterance(String(num));
        u.lang = 'en-US';
        u.rate = 1.2;
        synth.speak(u);
    }

    function startQuestionLoop() {
        if(gameState === 'ended') return;

        // 從 currentPool (過濾後的題庫) 中隨機選一題
        const targetEl = currentPool[Math.floor(Math.random() * currentPool.length)];
        
        // 隨機決定題型：Type 1 (看符號選中文) 或 Type 2 (看中文選符號)
        const qType = Math.random() > 0.5 ? 1 : 2;

        // 產生混淆選項 (從 currentPool 隨機抓 3 個不一樣的)
        let options = [];
        options.push(qType === 1 ? targetEl.z : targetEl.s); // 正確答案

        while(options.length < 4) {
            const randomEl = currentPool[Math.floor(Math.random() * currentPool.length)];
            const wrongAns = qType === 1 ? randomEl.z : randomEl.s;
            // 避免重複
            if(!options.includes(wrongAns) && wrongAns !== (qType === 1 ? targetEl.z : targetEl.s)) {
                options.push(wrongAns);
            }
        }

        currentQ = {
            q: qType === 1 ? targetEl.s : targetEl.z, // 題目文字
            a: qType === 1 ? targetEl.z : targetEl.s, // 正確答案
            o: options, // 選項陣列
            type: qType
        };
        
        gameState = 'answering';
        isProcessingAnswer = false; 
        statusText.innerText = "請作答！";

        // 顯示題目
        qTextTop.innerText = currentQ.q;
        qTextBottom.innerText = currentQ.q;
        
        // **不唸出題目**，直接顯示選項
        showOptionsForBoth();
    }

    function showOptionsForBoth() {
        generateOptions(optsTop, 'top');
        generateOptions(optsBottom, 'bottom');
    }

    function generateOptions(container, player) {
        container.innerHTML = '';
        let shuffledOpts = [...currentQ.o].sort(() => Math.random() - 0.5);

        shuffledOpts.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'opt-btn'; btn.innerText = opt;
            btn.onclick = () => checkAnswer(player, opt, btn);
            container.appendChild(btn);
        });
    }

    function checkAnswer(player, selected, btnElement) {
        if (isProcessingAnswer) return; 
        isProcessingAnswer = true; 

        const isCorrect = (selected === currentQ.a);

        if(isCorrect) {
            btnElement.classList.add('correct');
            streaks[player]++;
            
            // 連對加分機制
            let points = 10;
            if(streaks[player] >= 3) {
                points = 20;
                statusText.innerText = `🔥 ${player === 'top' ? p1Avatar : p2Avatar} 連對加分！`;
            } else {
                statusText.innerText = `⭕️ 答對了！`;
            }
            scores[player] += points;

            // 播放答對音效 (簡短)
            const u = new SpeechSynthesisUtterance("Ping"); 
            u.volume = 0.5; u.rate = 2.0; synth.speak(u);

        } else {
            btnElement.classList.add('wrong');
            streaks[player] = 0;
            scores[player] = Math.max(0, scores[player] - 10); 
            statusText.innerText = `❌ 答錯了...`;
            
            // 顯示正確答案
            const siblings = btnElement.parentElement.children;
            for(let child of siblings) {
                if(child.innerText === currentQ.a) child.classList.add('correct');
            }
            
            const u = new SpeechSynthesisUtterance("Oh");
            u.volume = 0.5; u.rate = 1.5; synth.speak(u);
        }

        updateUI();

        if(scores[player] >= WIN_SCORE) {
            setTimeout(() => showGameOver(player), 1000);
        } else {
            setTimeout(() => {
                runCountdown(2, "Next", startQuestionLoop);
            }, 1500);
        }
    }

    function updateUI() {
        document.getElementById('score-top').innerText = scores.top;
        document.getElementById('score-bottom').innerText = scores.bottom;

        updateStreakDisplay('top');
        updateStreakDisplay('bottom');
    }

    function updateStreakDisplay(player) {
        const streakContainer = document.getElementById(`streak-${player}`);
        const streakNum = document.getElementById(`streak-num-${player}`);
        const count = streaks[player];
        streakNum.innerText = count;
        
        if(count >= 2) {
            streakContainer.classList.add('active');
        } else {
            streakContainer.classList.remove('active');
        }
    }

    function showGameOver(winner) {
        gameState = 'ended';
        const endTop = document.getElementById('end-top');
        const endBottom = document.getElementById('end-bottom');
        
        if(winner === 'top') {
            setupEndScreen(endTop, true); setupEndScreen(endBottom, false);
            statusText.innerText = `🏆 ${p1Avatar} 獲勝！`;
        } else {
            setupEndScreen(endBottom, true); setupEndScreen(endTop, false);
            statusText.innerText = `🏆 ${p2Avatar} 獲勝！`;
        }

        endTop.style.display = 'flex'; endBottom.style.display = 'flex';
        mainGameBtn.style.display = 'block'; 
        
        const u = new SpeechSynthesisUtterance("Game Over");
        synth.speak(u);
    }

    function setupEndScreen(element, isWinner) {
        const title = element.querySelector('.end-title');
        const emoji = element.querySelector('.end-emoji');
        if(isWinner) {
            title.innerText = "Winner"; title.className = "end-title winner-text"; emoji.innerText = "🏆"; 
        } else {
            title.innerText = "Try Again"; title.className = "end-title loser-text"; emoji.innerText = "💪";
        }
    }
    
    function restartGame() {
        // 重置狀態
        scores = { top: 0, bottom: 0 };
        streaks = { top: 0, bottom: 0 };
        updateUI();

        document.getElementById('end-top').style.display = 'none';
        document.getElementById('end-bottom').style.display = 'none';
        mainGameBtn.style.display = 'none';
        
        // 重新回到難度選擇 (讓玩家可以換難度)
        document.getElementById('game-container').style.display = 'none';
        document.getElementById('difficulty-screen').style.display = 'flex';
    }

    // 初始化時不執行 initSetup，等選完難度再執行
  </script>
</body>
</html>
